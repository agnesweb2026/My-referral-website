<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Request Withdrawal</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070707;
color:#fff;
}

.container{
max-width:520px;
margin:auto;
padding:20px 15px 40px;
}

.top{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px;
}

.back{
width:44px;
height:44px;
border:0;
border-radius:12px;
background:#202020;
color:white;
font-size:25px;
}

h1{
font-size:24px;
margin:0;
}

.balance{
background:#171717;
border:1px solid #333;
border-radius:18px;
padding:22px;
margin-bottom:18px;
}

.balance small{
color:#aaa;
}

.amount{
font-size:34px;
font-weight:bold;
margin-top:8px;
}

.card{
background:#121212;
border:1px solid #292929;
border-radius:18px;
padding:20px;
}

label{
display:block;
color:#bbb;
font-size:14px;
margin-bottom:8px;
}

input{
width:100%;
padding:15px;
margin-bottom:16px;
border-radius:12px;
border:1px solid #333;
background:#080808;
color:#fff;
font-size:17px;
}

.submit{
width:100%;
padding:16px;
border:0;
border-radius:13px;
background:#22c55e;
color:#000;
font-weight:bold;
font-size:17px;
}

.message{
display:none;
padding:13px;
border-radius:12px;
margin:15px 0;
text-align:center;
}

.success{
display:block;
background:#10351e;
color:#62ff98;
}

.error{
display:block;
background:#351313;
color:#ff7777;
}

.history-title{
font-size:20px;
font-weight:bold;
margin:20px 0 12px;
}

.request{
background:#181818;
border:1px solid #292929;
border-radius:15px;
padding:15px;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:7px;
}

.pending{color:#facc15}
.approved{color:#4ade80}
.rejected{color:#f87171}

.empty{
color:#888;
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<button class="back" onclick="goBack()">‹</button>
<h1>Request Withdrawal</h1>
</div>

<div class="balance">
<small>Available Balance</small>
<div class="amount" id="availableBalance">
KSh 0
</div>
</div>

<div id="message" class="message"></div>

<div class="card">

<label>MPESA Phone Number</label>

<input
id="phone"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="07XXXXXXXX"
>

<label>Amount (KSh)</label>

<input
id="amount"
type="number"
min="1"
placeholder="Enter amount"
>

<button
class="submit"
id="submitButton"
onclick="requestWithdrawal()"
>
REQUEST WITHDRAWAL
</button>

</div>

<div class="history-title">
Withdrawal History
</div>

<div id="history"></div>

</div>

<script>

const EMPLOYEE_KEY="employeeSession";
const WITHDRAWAL_KEY="withdrawalRequests";

let currentEmployee=null;
let availableBalance=0;


/* EMPLOYEE */

function getCurrentEmployee(){

try{

const saved=
localStorage.getItem(EMPLOYEE_KEY);

if(!saved)return null;

return JSON.parse(saved);

}catch(e){

return null;

}

}


/* REQUESTS */

function getWithdrawalRequests(){

try{

const saved=
localStorage.getItem(WITHDRAWAL_KEY);

if(!saved)return [];

const data=
JSON.parse(saved);

return Array.isArray(data)?data:[];

}catch(e){

return [];

}

}


/* SAVE */

function saveWithdrawalRequests(requests){

localStorage.setItem(
WITHDRAWAL_KEY,
JSON.stringify(requests)
);

}


/* EARNINGS */

function getEmployeeEarnings(employee){

const employeeId=
employee.referral ||
employee.id ||
employee.username;

const key=
"employeePayments_"+employeeId;

try{

const saved=
localStorage.getItem(key);

if(!saved)return 0;

const payments=
JSON.parse(saved);

if(!Array.isArray(payments))return 0;

return payments.reduce(
(total,item)=>
total+Number(item.commission||0),
0
);

}catch(e){

return 0;

}

}


/* BALANCE */

function calculateBalance(){

if(!currentEmployee){

availableBalance=0;
return;

}

const earnings=
getEmployeeEarnings(currentEmployee);

const employeeId=
currentEmployee.id ||
currentEmployee.referral ||
currentEmployee.username;

const requests=
getWithdrawalRequests();

let withdrawn=0;

requests.forEach(request=>{

if(
String(request.employeeId)===
String(employeeId)&&
request.status==="APPROVED"
){

withdrawn+=
Number(request.amount||0);

}

});

availableBalance=
Math.max(
0,
earnings-withdrawn
);

}


/* DISPLAY */

function displayBalance(){

document.getElementById(
"availableBalance"
).textContent=
"KSh "+
availableBalance.toLocaleString();

}


/* MESSAGE */

function showMessage(text,type){

const box=
document.getElementById("message");

box.className=
"message "+type;

box.textContent=text;

box.style.display="block";

setTimeout(()=>{

box.style.display="none";

},4000);

}


/* REQUEST */

function requestWithdrawal(){

if(!currentEmployee){

showMessage(
"Employee session not found.",
"error"
);

return;

}

const phone=
document.getElementById("phone")
.value.trim();

const amount=
Number(
document.getElementById("amount")
.value
);

if(!/^07\d{8}$/.test(phone)){

showMessage(
"Enter a valid MPESA number.",
"error"
);

return;

}

if(!amount||amount<=0){

showMessage(
"Enter a valid withdrawal amount.",
"error"
);

return;

}

if(amount>availableBalance){

showMessage(
"Insufficient available balance.",
"error"
);

return;

}

const requests=
getWithdrawalRequests();

const employeeId=
currentEmployee.id ||
currentEmployee.referral ||
currentEmployee.username;

const pending=
requests.find(request=>

String(request.employeeId)===
String(employeeId)&&
request.status==="PENDING"

);

if(pending){

showMessage(
"You already have a pending withdrawal request.",
"error"
);

return;

}

const request={

id:"WD-"+Date.now(),

employeeName:
currentEmployee.name||
currentEmployee.employeeName||
currentEmployee.username||
"Employee",

employeeId:employeeId,

username:
currentEmployee.username||"",

referral:
currentEmployee.referral||"",

amount:amount,

phone:phone,

status:"PENDING",

createdAt:
new Date().toISOString(),

approvedAt:null,

rejectedAt:null

};

requests.unshift(request);

saveWithdrawalRequests(requests);

document.getElementById("phone").value="";
document.getElementById("amount").value="";

showMessage(
"Withdrawal request submitted successfully.",
"success"
);

loadPage();

}


/* HISTORY */

function loadHistory(){

const history=
document.getElementById("history");

const requests=
getWithdrawalRequests();

if(!currentEmployee){

history.innerHTML=
'<div class="empty">Employee session not found.</div>';

return;

}

const employeeId=
currentEmployee.id||
currentEmployee.referral||
currentEmployee.username;

const mine=
requests.filter(request=>

String(request.employeeId)===
String(employeeId)

);

if(mine.length===0){

history.innerHTML=
'<div class="empty">No withdrawal requests yet.</div>';

return;

}

history.innerHTML=
mine.map(request=>{

const date=
request.createdAt
?new Date(request.createdAt).toLocaleString()
:"";

const status=
String(request.status||"").toUpperCase();

const statusClass=
status==="APPROVED"
?"approved"
:status==="REJECTED"
?"rejected"
:"pending";

return`

<div class="request">

<div class="row">

<strong>
KSh ${Number(
request.amount||0
).toLocaleString()}
</strong>

<span class="${statusClass}">
${status}
</span>

</div>

<div>
MPESA: ${request.phone||"-"}
</div>

<small>${date}</small>

</div>

`;

}).join("");

}


/* LOAD */

function loadPage(){

currentEmployee=
getCurrentEmployee();

if(!currentEmployee){

document.getElementById(
"submitButton"
).disabled=true;

loadHistory();

return;

}

calculateBalance();
displayBalance();
loadHistory();

}


/* BACK */

function goBack(){

window.location.href=
"employee-dashboard.html";

}


/* START */

loadPage();

setInterval(loadPage,3000);

</script>

</body>
</html>
