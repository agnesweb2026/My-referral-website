<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Request Withdrawal</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#080c12;
  color:#fff;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:18px 15px 40px;
}

.topbar{
  background:#101720;
  border-bottom:1px solid #263341;
  padding:15px;
  margin-bottom:18px;
}

.topbar-inner{
  max-width:520px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.back-btn{
  border:1px solid #354250;
  background:#151d26;
  color:#fff;

  padding:9px 12px;
  border-radius:9px;

  font-size:12px;
}

.card{
  background:#111820;
  border:1px solid #263341;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.employee-name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.employee-id{
  color:#8995a3;
  font-size:12px;
}

.balance-box{
  margin-top:16px;
  padding:16px;

  background:#0c131b;
  border:1px solid #263341;
  border-radius:12px;
}

.balance-label{
  color:#8995a3;
  font-size:12px;
  margin-bottom:6px;
}

.balance{
  color:#36d675;
  font-size:27px;
  font-weight:bold;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#aeb8c4;
  font-size:13px;
  margin-bottom:7px;
}

.field input{
  width:100%;

  padding:14px;

  background:#080e14;
  color:#fff;

  border:1px solid #334150;
  border-radius:10px;

  outline:none;

  font-size:15px;
}

.field input:focus{
  border-color:#16a34a;
}

.submit-btn{
  width:100%;
  padding:14px;

  border:0;
  border-radius:10px;

  background:#16a34a;
  color:#fff;

  font-size:15px;
  font-weight:bold;
}

.message{
  min-height:20px;
  text-align:center;
  margin-top:10px;
  font-size:12px;
}

.note{
  color:#7f8b98;
  font-size:11px;
  line-height:1.5;
  margin-top:10px;
}

.history-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:13px;
}

.history-item{
  background:#0c131b;
  border:1px solid #263341;
  border-radius:11px;
  padding:13px;
  margin-bottom:9px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.amount{
  color:#36d675;
  font-weight:bold;
  font-size:16px;
}

.date{
  color:#74808d;
  font-size:10px;
  margin-top:4px;
}

.status{
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
}

.status.pending{
  color:#f5b942;
  background:rgba(245,185,66,.12);
}

.status.approved{
  color:#36d675;
  background:rgba(54,214,117,.12);
}

.status.rejected{
  color:#ff6464;
  background:rgba(255,100,100,.12);
}

.empty{
  text-align:center;
  color:#7f8b98;
  font-size:12px;
  padding:25px 5px;
}

.hidden{
  display:none;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="topbar-inner">

    <div class="title">
      Request Withdrawal
    </div>

    <button
      class="back-btn"
      onclick="goBack()"
    >
      ← Dashboard
    </button>

  </div>

</div>


<div class="container">

  <div class="card">

    <div
      class="employee-name"
      id="employeeName"
    >
      Employee
    </div>

    <div
      class="employee-id"
      id="employeeId"
    >
      Employee ID
    </div>

    <div class="balance-box">

      <div class="balance-label">
        Available Balance
      </div>

      <div
        class="balance"
        id="availableBalance"
      >
        KSh 0
      </div>

    </div>

  </div>
    <div class="card">

    <div class="field">

      <label>
        M-PESA Number
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="07XXXXXXXX"
      >

    </div>


    <div class="field">

      <label>
        Amount (KSh)
      </label>

      <input
        id="amount"
        type="number"
        inputmode="decimal"
        min="1"
        placeholder="Enter amount"
      >

    </div>


    <button
      class="submit-btn"
      onclick="submitWithdrawal()"
    >
      SUBMIT WITHDRAWAL REQUEST
    </button>


    <div
      id="message"
      class="message"
    ></div>


    <div class="note">
      Your balance is only reduced after
      the administrator approves your
      withdrawal request.
    </div>

  </div>


  <div class="card">

    <div class="history-title">
      Withdrawal History
    </div>

    <div id="history">

      <div class="empty">
        No withdrawal requests yet.
      </div>

    </div>

  </div>

</div>


<script>

const EMPLOYEE_KEY =
  "employeeSession";

const WITHDRAWAL_KEY =
  "withdrawalRequests";


/* =========================
   GET EMPLOYEE
========================= */

function getEmployee(){

  try{

    const saved =
      localStorage.getItem(
        EMPLOYEE_KEY
      );

    if(!saved){
      return null;
    }

    return JSON.parse(saved);

  }catch(error){

    return null;

  }

}


/* =========================
   GET REQUESTS
========================= */

function getRequests(){

  try{

    const saved =
      localStorage.getItem(
        WITHDRAWAL_KEY
      );

    if(!saved){
      return [];
    }

    const requests =
      JSON.parse(saved);

    return Array.isArray(requests)
      ? requests
      : [];

  }catch(error){

    return [];

  }

}


/* =========================
   SAVE REQUESTS
========================= */

function saveRequests(
  requests
){

  localStorage.setItem(
    WITHDRAWAL_KEY,
    JSON.stringify(requests)
  );

}


/* =========================
   GET EMPLOYEE EARNINGS
========================= */

function getEarnings(
  employee
){

  const key =
    "employeePayments_" +
    employee.referral;


  try{

    const payments =
      JSON.parse(
        localStorage.getItem(
          key
        ) || "[]"
      );


    if(!Array.isArray(payments)){
      return 0;
    }


    return payments.reduce(
      function(total,item){

        return (
          total +
          Number(
            item.commission || 0
          )
        );

      },
      0
    );

  }catch(error){

    return 0;

  }

}


/* =========================
   APPROVED WITHDRAWN
========================= */

function getApprovedWithdrawals(
  employee
){

  const requests =
    getRequests();


  return requests.reduce(
    function(total,request){

      if(
        String(
          request.employeeId
        ) ===
        String(
          employee.id
        ) &&
        String(
          request.status || ""
        ).toUpperCase() ===
        "APPROVED"
      ){

        return (
          total +
          Number(
            request.amount || 0
          )
        );

      }

      return total;

    },
    0
  );

}
  /* =========================
   AVAILABLE BALANCE
========================= */

function getAvailableBalance(
  employee
){

  const earnings =
    getEarnings(
      employee
    );


  const withdrawn =
    getApprovedWithdrawals(
      employee
    );


  return Math.max(
    0,
    earnings - withdrawn
  );

}


/* =========================
   LOAD PAGE
========================= */

function loadPage(){

  const employee =
    getEmployee();


  if(!employee){

    window.location.href =
      "employee-login.html";

    return;

  }


  document
    .getElementById(
      "employeeName"
    )
    .textContent =
      employee.name ||
      employee.employeeName ||
      "Employee";


  document
    .getElementById(
      "employeeId"
    )
    .textContent =
      employee.id ||
      employee.employeeId ||
      "-";


  const available =
    getAvailableBalance(
      employee
    );


  document
    .getElementById(
      "availableBalance"
    )
    .textContent =
      "KSh " +
      available.toLocaleString();


  loadHistory();

}


/* =========================
   SUBMIT WITHDRAWAL
========================= */

function submitWithdrawal(){

  const employee =
    getEmployee();


  if(!employee){

    window.location.href =
      "employee-login.html";

    return;

  }


  const phone =
    document
      .getElementById(
        "phone"
      )
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById(
          "amount"
        )
        .value
    );


  const message =
    document
      .getElementById(
        "message"
      );


  message.textContent = "";
  message.style.color =
    "#ff6464";


  /* PHONE */

  if(
    !/^07\d{8}$/.test(phone)
  ){

    message.textContent =
      "Enter a valid M-PESA number.";

    return;

  }


  /* AMOUNT */

  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    message.textContent =
      "Enter a valid amount.";

    return;

  }


  /* BALANCE */

  const available =
    getAvailableBalance(
      employee
    );


  if(amount > available){

    message.textContent =
      "Insufficient available balance.";

    return;

  }


  /* CHECK PENDING */

  const requests =
    getRequests();


  const pending =
    requests.some(
      function(request){

        return (
          String(
            request.employeeId
          ) ===
          String(
            employee.id
          ) &&

          String(
            request.status ||
            "PENDING"
          ).toUpperCase() ===
          "PENDING"
        );

      }
    );


  if(pending){

    message.textContent =
      "You already have a pending request.";

    return;

  }


  /* CREATE */

  const request = {

    id:
      "WD-" +
      Date.now(),

    employeeName:
      employee.name ||
      employee.employeeName,

    employeeId:
      employee.id ||
      employee.employeeId,

    username:
      employee.username || "",

    referral:
      employee.referral ||
      employee.id,

    amount:
      amount,

    phone:
      phone,

    status:
      "PENDING",

    createdAt:
      new Date().toISOString()

  };


  requests.push(
    request
  );


  saveRequests(
    requests
  );


  document
    .getElementById(
      "phone"
    )
    .value = "";


  document
    .getElementById(
      "amount"
    )
    .value = "";


  message.style.color =
    "#36d675";


  message.textContent =
    "Withdrawal request submitted successfully.";


  loadPage();

}


/* =========================
   HISTORY
========================= */

function loadHistory(){

  const employee =
    getEmployee();


  if(!employee){
    return;
  }


  const requests =
    getRequests();


  const mine =
    requests.filter(
      function(request){

        return (
          String(
            request.employeeId
          ) ===
          String(
            employee.id
          )
        );

      }
    );


  const history =
    document.getElementById(
      "history"
    );


  if(!mine.length){

    history.innerHTML = `
      <div class="empty">
        No withdrawal requests yet.
      </div>
    `;

    return;

  }


  mine.sort(
    function(a,b){

      return (
        new Date(
          b.createdAt || 0
        ) -
        new Date(
          a.createdAt || 0
        )
      );

    }
  );


  history.innerHTML =
    mine.map(
      function(request){

        const status =
          String(
            request.status ||
            "PENDING"
          ).toLowerCase();


        const date =
          request.createdAt
            ? new Date(
                request.createdAt
              ).toLocaleString()
            : "-";


        return `

          <div class="history-item">

            <div class="history-top">

              <div>

                <div class="amount">
                  KSh ${
                    Number(
                      request.amount || 0
                    ).toLocaleString()
                  }
                </div>

                <div class="date">
                  ${date}
                </div>

              </div>


              <div class="status ${status}">
                ${status.toUpperCase()}
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

      }
  /* =========================
   BACK TO DASHBOARD
========================= */

function goBack(){

  window.location.href =
    "employee-dashboard.html";

}


/* =========================
   URL EMPLOYEE CONNECTION
========================= */

function checkEmployeeFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const employeeCode =
    params.get(
      "employee"
    );


  if(!employeeCode){
    return;
  }


  const employee =
    getEmployee();


  /*
   If employees.html already created
   the employeeSession, keep it.
  */

  if(
    employee &&
    (
      employee.id === employeeCode ||
      employee.referral === employeeCode
    )
  ){

    return;

  }

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkEmployeeFromURL();

    loadPage();

  }
);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  function(){

    const employee =
      getEmployee();


    if(employee){

      loadPage();

    }

  },
  3000
);

</script>

</body>
</html>
