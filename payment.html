<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose Access</title>

  <!-- IntaSend Checkout SDK -->
  <script src="https://unpkg.com/intasend-checkout-sdk"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px 15px;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 20px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .ref {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0 25px;
    }

    .package {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 17px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .package.selected {
      border-color: #1877f2;
      background: #eef5ff;
    }

    .till {
      margin-top: 18px;
      padding: 13px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .selected-info {
      margin-top: 18px;
      font-size: 16px;
    }

    .pay {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Choose Access</h1>

    <div class="ref">
      Referral Code:
      <strong id="refCode">GB3HLT</strong>
    </div>

    <p>Select your preferred access package:</p>

    <button class="package" data-amount="80" data-minutes="10">
      KSh 80 — 10 Minutes
    </button>

    <button class="package" data-amount="135" data-minutes="25">
      KSh 135 — 25 Minutes
    </button>

    <button class="package" data-amount="200" data-minutes="40">
      KSh 200 — 40 Minutes
    </button>

    <button class="package" data-amount="250" data-minutes="55">
      KSh 250 — 55 Minutes
    </button>

    <button class="package" data-amount="300" data-minutes="65">
      KSh 300 — 65 Minutes
    </button>

    <div class="till">
      Pay with Till: 1605854
    </div>

    <div class="selected-info" id="selectedInfo">
      No package selected
    </div>

    <button
      type="button"
      class="pay intaSendPayButton"
      id="payButton"
      data-currency="KES"
      data-method="M-PESA">
      Pay with M-PESA
    </button>

  </div>

  <script>

    /* =========================
       REFERRAL CODE
    ========================= */

    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");

    if (ref) {
      document.getElementById("refCode").textContent = ref;
    }


    /* =========================
       PACKAGE SELECTION
    ========================= */

    const packages = document.querySelectorAll(".package");
    const selectedInfo = document.getElementById("selectedInfo");
    const payButton = document.getElementById("payButton");

    let selectedAmount = null;
    let selectedMinutes = null;

    packages.forEach((button) => {

      button.addEventListener("click", function () {

        packages.forEach((item) => {
          item.classList.remove("selected");
        });

        this.classList.add("selected");

        selectedAmount = this.dataset.amount;
        selectedMinutes = this.dataset.minutes;

        selectedInfo.textContent =
          "Selected: KSh " +
          selectedAmount +
          " for " +
          selectedMinutes +
          " minutes";

        /*
          Give IntaSend the selected payment information.
        */

        payButton.setAttribute("data-amount", selectedAmount);
        payButton.setAttribute("data-currency", "KES");
        payButton.setAttribute("data-method", "M-PESA");

        payButton.setAttribute(
          "data-api_ref",
          "access-" + selectedMinutes + "min-" + Date.now()
        );

        payButton.style.display = "block";
      });

    });


    /* =========================
       INTASEND
    ========================= */

    const intasend = new window.IntaSend({

      publicAPIKey:
        "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

      live: true

    });


    intasend

      .on("COMPLETE", function (results) {

        console.log("Payment successful:", results);

        alert("Payment successful!");

      })

      .on("FAILED", function (results) {

        console.log("Payment failed:", results);

        alert("Payment failed. Please try again.");

      })

      .on("IN-PROGRESS", function (results) {

        console.log("M-PESA payment in progress:", results);

      });

  </script>

</body>
</html>
