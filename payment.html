<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>M-PESA PAYMENT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:#000;

}

body{min-height:100vh}

button,input{font-family:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.top-bar{

}

.top-title{

}

.online-count{
  display:flex;

.online-dot{

  background:#00e676;

.page{
  position:fixed;

/* PACKAGES - ORIGINAL DESIGN */

#packagesScreen{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px 12px 30px;
  background:
    radial-gradient(
      circle at top,
      #222 0%,
      #090909 48%,
      #000 100%
    );
}

.payment-heading{
  text-align:center;
  font-size:23px;
  font-weight:900;
  margin:5px 0 7px;
}

.payment-subheading{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-bottom:15px;
}

.package-grid{
  width:100%;
  max-width:720px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.package{
  position:relative;
  min-height:125px;
  padding:14px 10px;
  border:1px solid #333;
  border-radius:15px;
  background:
    linear-gradient(
      145deg,
      #1b1b1b,
      #090909
    );
  color:#fff;
  text-align:center;
  transition:transform .15s ease,
              border-color .15s ease;
}

.package:active{
  transform:scale(.97);
}

.package.selected{
  border-color:#00e676;
  box-shadow:
    0 0 0 1px #00e676,
    0 0 20px rgba(0,230,118,.15);
}

.package .minutes{
  font-size:22px;
  font-weight:900;
}

.package .price{
  margin-top:8px;
  font-size:18px;
  font-weight:800;
  color:#00e676;
}

.package .currency{
  color:#aaa;
  font-size:11px;
}

.package .access-label{
  margin-top:7px;
  font-size:11px;
  color:#aaa;
}

.hot-badge{
  position:absolute;
  top:-7px;
  right:8px;
  padding:4px 8px;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-size:9px;
  font-weight:900;
}
  /* PAYMENT BOX - ORIGINAL */

.payment-box{
  width:100%;
  max-width:520px;
  margin:15px auto 0;
  padding:14px;
  border:1px solid #303030;
  border-radius:15px;
  background:#101010;
}

.payment-recipient{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px;
  border-radius:10px;
  background:#1a1a1a;
  margin-bottom:10px;
}

.recipient-value{
  font-size:15px;
  font-weight:800;
}

.copy-btn{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  background:#333;
  color:#fff;
  font-size:11px;
}

.phone-input{
  width:100%;
  padding:13px;
  border:1px solid #3a3a3a;
  border-radius:10px;
  outline:none;
  background:#080808;
  color:#fff;
  font-size:14px;
}

.phone-input:focus{
  border-color:#00e676;
}

.pay-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#00c853;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.pay-btn:active{
  transform:scale(.98);
}

.status-message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  font-size:12px;
  color:#aaa;
}

/* LIVE */

#liveScreen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

.live-layout{
  position:absolute;
  inset:0;

  display:grid;

  grid-template-columns:
    15% minmax(0,70%) 15%;

  grid-template-rows:
    minmax(0,1fr) auto;

  width:100%;
  height:100%;

  background:#000;
  overflow:hidden;
}

.chat-side{
  min-width:0;
  min-height:0;
  background:#090909;
  overflow:hidden;

  display:flex;
  flex-direction:column;
}

.chat-side.left{
  grid-column:1;
  grid-row:1 / 3;
  border-right:1px solid #292929;
}

.chat-side.right{
  grid-column:3;
  grid-row:1 / 3;
  border-left:1px solid #292929;
}

.chat-title{
  flex:0 0 30px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:#ddd;
  font-size:9px;
  font-weight:900;
  border-bottom:1px solid #222;
}

.chat-messages{
  flex:1;
  min-height:0;
  padding:5px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:5px;
}

.side-message{
  width:100%;
  padding:6px 7px;
  border-radius:10px;
  background:#181818;
  color:#eee;
  font-size:9px;
  line-height:1.25;
  animation:messageIn .35s ease;
}

.side-message b{
  color:#00e676;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
 /* BIG VIDEO */

.live-video-area{
  grid-column:2;
  grid-row:1;

  position:relative;

  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  background:#000;
  overflow:hidden;
}

#liveVideo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.live-badge{
  position:absolute;
  top:10px;
  left:10px;
  z-index:20;

  display:flex;
  align-items:center;
  gap:5px;

  padding:5px 9px;
  border-radius:7px;

  background:#f00;
  color:#fff;

  font-size:10px;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}

.live-badge-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
}

.video-overlay{
  position:absolute;
  inset:0;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:13px;

  background:rgba(0,0,0,.78);
  text-align:center;
}

.video-overlay-title{
  font-size:20px;
  font-weight:900;
}

.video-overlay-sub{
  color:#bbb;
  font-size:12px;
}

.reload-live-btn{
  padding:12px 18px;
  border:0;
  border-radius:10px;

  background:#e91e63;
  color:#fff;

  font-size:13px;
  font-weight:900;
}

/* CENTER CHAT */

.center-chat{
  grid-column:2;
  grid-row:2;

  width:100%;
  min-width:0;
  height:116px;

  display:flex;
  flex-direction:column;

  background:#080808;
  border-top:1px solid #292929;

  overflow:hidden;
}

.center-chat-header{
  height:25px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111;
  color:#ddd;

  font-size:10px;
  font-weight:900;

  border-bottom:1px solid #222;
}

.center-chat-messages{
  flex:1;
  min-height:0;

  display:flex;
  align-items:center;
  gap:7px;

  padding:5px 8px;

  overflow:hidden;
  white-space:nowrap;

  background:#090909;
}

.center-chat-messages .side-message{
  flex:0 0 auto;
  width:auto;
  max-width:180px;

  padding:6px 9px;
  border-radius:15px;

  background:#1c1c1c;
  color:#fff;

  font-size:10px;

  animation:centerMessageMove .4s ease;
}

@keyframes centerMessageMove{
  from{
    opacity:0;
    transform:translateX(30px) scale(.92);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
  }
}
 .center-chat-actions{
  height:34px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:5px;
  padding:3px 5px;

  background:#101010;
  border-top:1px solid #222;
}

.center-chat-actions button{
  border:0;
  border-radius:18px;

  padding:5px 8px;

  background:#222;
  color:#fff;

  font-size:14px;
  line-height:1;
}

.center-chat-actions button:active{
  transform:scale(.88);
}

.center-chat-actions .follow-btn{
  background:#e91e63;
  font-size:10px;
  font-weight:900;
  padding:6px 11px;
}

.center-message-box{
  height:38px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:5px;
  padding:4px 6px;

  background:#070707;
}

.center-message-box input{
  flex:1;
  min-width:0;

  height:29px;

  border:1px solid #3b3b3b;
  border-radius:16px;

  padding:0 11px;

  outline:none;

  background:#181818;
  color:#fff;

  font-size:11px;
}

.center-message-box input::placeholder{
  color:#888;
}

.center-message-box input:focus{
  border-color:#00e676;
}

.center-message-box button{
  height:29px;

  border:0;
  border-radius:16px;

  padding:0 11px;

  background:#00c853;
  color:#fff;

  font-size:10px;
  font-weight:900;
}

.center-reaction{
  position:absolute;

  bottom:85px;
  left:50%;

  z-index:80;

  font-size:25px;

  pointer-events:none;

  animation:reactionFloat 1.8s ease forwards;
}

@keyframes reactionFloat{
  0%{
    opacity:0;
    transform:translate(-50%,20px) scale(.6);
  }

  15%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translate(-50%,-100px) scale(1.3);
  }
}

.center-user-message{
  position:absolute;

  left:50%;
  bottom:82px;

  transform:translateX(-50%);

  z-index:75;

  max-width:70%;

  padding:7px 11px;

  border-radius:14px;

  background:#222;
  color:#fff;

  font-size:11px;

  animation:userMessageShow .3s ease;
}

.center-user-message b{
  color:#00e676;
}

@keyframes userMessageShow{
  from{
    opacity:0;
    transform:translate(-50%,10px);
  }

  to{
    opacity:1;
    transform:translate(-50%,0);
  }
}
  #failedScreen{
  position:absolute;
  inset:0;
  z-index:500;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:10px;

  background:#050505;

  text-align:center;
}

.failed-title{
  color:#ff1744;
  font-size:28px;
  font-weight:900;
}

.failed-sub{
  color:#aaa;
  font-size:12px;
}
</style>

<script>

const LIVE_VIDEO_URL =
  "IMG_20261001_112122_071.mp4";

const STK_PUSH_URL =
  "/api/stk-push";

const PAYMENT_STATUS_URL =
  "/api/payment-status";

let selectedMinutes = 30;
let selectedPrice = 95;

let paymentBusy = false;
let paymentPollTimer = null;

let chatTimer = null;
let liveTimer = null;

let liveStarted = false;
let videoReconnectUsed = false;

const packagesScreen =
  document.getElementById("packagesScreen");

const liveScreen =
  document.getElementById("liveScreen");

const failedScreen =
  document.getElementById("failedScreen");

const liveVideo =
  document.getElementById("liveVideo");

const videoOverlay =
  document.getElementById("videoOverlay");

const videoOverlayTitle =
  document.getElementById("videoOverlayTitle");

const videoOverlaySub =
  document.getElementById("videoOverlaySub");

const reloadLiveBtn =
  document.getElementById("reloadLiveBtn");

const paymentStatus =
  document.getElementById("paymentStatus");

const phoneInput =
  document.getElementById("phoneInput");

const leftChatMessages =
  document.getElementById("leftChatMessages");

const rightChatMessages =
  document.getElementById("rightChatMessages");

const centerChatMessages =
  document.getElementById("centerChatMessages");

function selectPackage(button){

  document
    .querySelectorAll(".package")
    .forEach(function(item){
      item.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedMinutes =
    Number(button.dataset.minutes);

  selectedPrice =
    Number(button.dataset.price);

  paymentStatus.textContent = "";
}
 function copyRecipient(){

  navigator.clipboard
    .writeText("M-PESA")
    .then(function(){

      paymentStatus.textContent =
        "Copied";

      setTimeout(function(){
        paymentStatus.textContent = "";
      },1500);

    })
    .catch(function(){

      paymentStatus.textContent =
        "M-PESA";

    });
}

async function startPayment(){

  if(paymentBusy){
    return;
  }

  const phone =
    phoneInput.value.trim();

  if(!phone){

    paymentStatus.textContent =
      "Enter M-PESA phone number";

    return;
  }

  paymentBusy = true;

  paymentStatus.textContent =
    "Connecting to M-PESA...";

  try{

    const response =
      await fetch(
        STK_PUSH_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            phone:phone,

            amount:selectedPrice,

            reference:
              "LIVE-" +
              selectedMinutes +
              "-" +
              Date.now()

          })
        }
      );

    const data =
      await response.json()
      .catch(function(){
        return {};
      });

    if(!response.ok){

      throw new Error(
        data.message ||
        "Payment request failed"
      );
    }

    paymentStatus.textContent =
      "Check your phone and enter your M-PESA PIN.";

    const transactionId =
      data.transaction_request_id ||
      data.transactionRequestId ||
      data.checkout_request_id ||
      data.checkoutRequestID ||
      data.id;

    if(!transactionId){

      paymentStatus.textContent =
        "Payment request sent. Waiting for confirmation...";

      paymentBusy = false;
      return;
    }

    checkPaymentStatus(transactionId);

  }catch(error){

    paymentStatus.textContent =
      "No payment is done";

    paymentBusy = false;
  }
}

function checkPaymentStatus(transactionId){

  let attempts = 0;
  const maxAttempts = 30;

  clearInterval(paymentPollTimer);

  paymentPollTimer =
    setInterval(async function(){

      attempts++;

      try{

        const response =
          await fetch(
            PAYMENT_STATUS_URL,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({

                transaction_request_id:
                  transactionId

              })
            }
          );

        const data =
          await response.json()
          .catch(function(){
            return {};
          });

        const status =
          String(
            data.status ||
            data.result ||
            data.payment_status ||
            ""
          ).toLowerCase();

        if(
          status === "success" ||
          status === "paid" ||
          status === "completed" ||
          data.paid === true
        ){

          clearInterval(paymentPollTimer);

          paymentBusy = false;

          paymentStatus.textContent =
            "Payment confirmed";

          setTimeout(
            openLiveVideo,
            700
          );

          return;
        }

        if(
          status === "failed" ||
          status === "cancelled" ||
          status === "canceled"
        ){

          clearInterval(paymentPollTimer);

          paymentBusy = false;

          showFailedPayment();

          return;
        }

        paymentStatus.textContent =
          "Checking payment...";

        if(attempts >= maxAttempts){

          clearInterval(paymentPollTimer);

          paymentBusy = false;

          showFailedPayment();
        }

      }catch(error){

        if(attempts >= maxAttempts){

          clearInterval(paymentPollTimer);

          paymentBusy = false;

          showFailedPayment();
        }
      }

    },2000);
  }
function showFailedPayment(){

  paymentStatus.textContent =
    "No payment is done";

  liveScreen.classList.add("hidden");

  failedScreen.classList.add("hidden");

  packagesScreen.classList.remove("hidden");
}

/* PAYMENT CONFIRMED -> VIDEO */

function openLiveVideo(){

  packagesScreen.classList.add("hidden");
  failedScreen.classList.add("hidden");
  liveScreen.classList.remove("hidden");

  liveStarted = true;
  videoReconnectUsed = false;

  startLiveVideo();
  startLiveChat();
}

/* VIDEO START */

function startLiveVideo(){

  clearInterval(liveTimer);

  hideVideoOverlay();

  liveVideo.pause();
  liveVideo.currentTime = 0;

  liveVideo.src =
    LIVE_VIDEO_URL;

  liveVideo.load();

  const playPromise =
    liveVideo.play();

  if(
    playPromise &&
    typeof playPromise.catch === "function"
  ){

    playPromise.catch(function(){

      showVideoOverlay(
        "Tap to start live video",
        "The video is ready"
      );

    });
  }

  startLiveClock();
}

/*
30 SECONDS:
VIDEO PAUSES
RECONNECTING FOR 3 SECONDS
THEN VIDEO CONTINUES
*/

function startLiveClock(){

  clearInterval(liveTimer);

  const startedAt =
    Date.now();

  liveTimer =
    setInterval(function(){

      const elapsed =
        Math.floor(
          (Date.now() - startedAt) / 1000
        );

      if(
        elapsed >= 30 &&
        !videoReconnectUsed
      ){

        videoReconnectUsed = true;

        liveVideo.pause();

        showVideoOverlay(
          "Reconnecting...",
          "Please wait 3 seconds"
        );

        clearInterval(liveTimer);

        setTimeout(function(){

          hideVideoOverlay();

          liveVideo.play()
            .catch(function(){});

          startSecondStageTimer();

        },3000);
      }

    },250);
}

/*
AFTER RECONNECT:
27 SECONDS LATER
= 60 SECONDS TOTAL
*/

function startSecondStageTimer(){

  clearInterval(liveTimer);

  const secondStarted =
    Date.now();

  liveTimer =
    setInterval(function(){

      const elapsed =
        Math.floor(
          (Date.now() - secondStarted) / 1000
        );

      if(elapsed >= 27){

        clearInterval(liveTimer);

        liveVideo.pause();

        showReloadError();
      }

    },250);
}

function showReloadError(){

  showVideoOverlay(
    "Network error",
    "Live video connection lost"
  );

  reloadLiveBtn.classList.remove(
    "hidden"
  );
}

/*
BUTTON:
RECONNECTING 5 SECONDS
THEN FAILED 2 SECONDS
THEN PACKAGES
*/

function reloadLiveVideo(){

  reloadLiveBtn.classList.add(
    "hidden"
  );

  showVideoOverlay(
    "Reconnecting...",
    "Please wait 5 seconds"
  );

  liveVideo.pause();

  clearInterval(liveTimer);

  setTimeout(function(){

    showVideoOverlay(
      "Failed",
      "Returning to packages..."
    );

    setTimeout(function(){

      returnToPackages();

    },2000);

  },5000);
}

function showVideoOverlay(title,sub){

  videoOverlay.classList.remove(
    "hidden"
  );

  videoOverlayTitle.textContent =
    title;

  videoOverlaySub.textContent =
    sub;
}

function hideVideoOverlay(){

  videoOverlay.classList.add(
    "hidden"
  );

  reloadLiveBtn.classList.add(
    "hidden"
  );
}

function returnToPackages(){

  clearInterval(liveTimer);
  clearInterval(chatTimer);

  liveVideo.pause();

  liveVideo.removeAttribute("src");
  liveVideo.load();

  liveStarted = false;

  liveScreen.classList.add("hidden");
  failedScreen.classList.add("hidden");

  packagesScreen.classList.remove(
    "hidden"
  );

  paymentStatus.textContent =
    "Select another package to continue";
  }
  const leftChatData = [
 ["Sarah","Hi ❤️"],
 ["Maya","Hello live!"],
 ["Ann","Wow 😍"],
 ["Lucy","So nice"],
 ["Grace","Hi there"],
 ["Jane","Watching now"],
 ["Emma","Hello 👋"],
 ["Linda","Amazing"],
 ["Nina","❤️❤️"],
 ["Rose","Hi everyone"]
];

const rightChatData = [
 ["David","Hello 👋"],
 ["Brian","Nice live"],
 ["Kevin","Wow"],
 ["Mark","Hello"],
 ["Alex","Watching"],
 ["Daniel","Great"],
 ["Chris","Hi ❤️"],
 ["Mike","Live now"],
 ["John","Amazing"],
 ["Peter","Hello everyone"]
];

const centerChatData = [
 ["Amina","Hello ❤️"],
 ["Grace","Wow 😍"],
 ["Kevin","Nice live 👍"],
 ["Maya","Watching now"],
 ["Rose","Hello 👋"],
 ["John","Amazing"],
 ["Nina","❤️❤️"],
 ["David","Nice video"],
 ["Sarah","Hello everyone"],
 ["Brian","Wow 👍"]
];

let leftChatIndex = 0;
let rightChatIndex = 0;
let centerChatIndex = 0;

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;
}

function createMessage(
  container,
  name,
  message
){

  const item =
    document.createElement("div");

  item.className =
    "side-message";

  item.innerHTML =
    "<b>" +
    escapeHtml(name) +
    ":</b> " +
    escapeHtml(message);

  container.appendChild(item);

  while(container.children.length > 9){

    container.removeChild(
      container.firstChild
    );
  }
}

function addLeftChat(){

  const item =
    leftChatData[
      leftChatIndex %
      leftChatData.length
    ];

  createMessage(
    leftChatMessages,
    item[0],
    item[1]
  );

  leftChatIndex++;
}

function addRightChat(){

  const item =
    rightChatData[
      rightChatIndex %
      rightChatData.length
    ];

  createMessage(
    rightChatMessages,
    item[0],
    item[1]
  );

  rightChatIndex++;
}

function addCenterChat(){

  const item =
    centerChatData[
      centerChatIndex %
      centerChatData.length
    ];

  createMessage(
    centerChatMessages,
    item[0],
    item[1]
  );

  centerChatIndex++;

  centerChatMessages.scrollLeft =
    centerChatMessages.scrollWidth;
}

function startLiveChat(){

  clearInterval(chatTimer);

  leftChatMessages.innerHTML = "";
  rightChatMessages.innerHTML = "";
  centerChatMessages.innerHTML = "";

  leftChatIndex = 0;
  rightChatIndex = 0;
  centerChatIndex = 0;

  for(let i=0;i<5;i++){

    addLeftChat();
    addCenterChat();
    addRightChat();
  }

  chatTimer =
    setInterval(function(){

      addLeftChat();

      setTimeout(
        addCenterChat,
        300
      );

      setTimeout(
        addRightChat,
        600
      );

    },1600);
}

function reactLive(reaction){

  const el =
    document.createElement("div");

  el.className =
    "center-reaction";

  el.textContent =
    reaction;

  const area =
    document.querySelector(
      ".live-video-area"
    );

  if(!area)return;

  area.appendChild(el);

  setTimeout(function(){
    el.remove();
  },1800);
}

function toggleFollow(){

  const button =
    document.getElementById(
      "followBtn"
    );

  if(button.textContent.trim() === "Follow"){

    button.textContent =
      "Following ✓";

    button.style.background =
      "#555";

  }else{

    button.textContent =
      "Follow";

    button.style.background =
      "#e91e63";
  }
}

function sendCenterMessage(){

  const input =
    document.getElementById(
      "centerMessageInput"
    );

  const text =
    input.value.trim();

  if(!text)return;

  const message =
    document.createElement("div");

  message.className =
    "center-user-message";

  message.innerHTML =
    "<b>You:</b> " +
    escapeHtml(text);

  const area =
    document.querySelector(
      ".live-video-area"
    );

  if(area){

    area.appendChild(message);

    setTimeout(function(){
      message.remove();
    },2500);
  }

  createMessage(
    centerChatMessages,
    "You",
    text
  );

  input.value = "";

  centerChatMessages.scrollLeft =
    centerChatMessages.scrollWidth;
}

document
  .getElementById("centerMessageInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        sendCenterMessage();
      }
    }
  );

liveVideo.addEventListener(
  "error",
  function(){

    if(liveStarted){

      showVideoOverlay(
        "Network error",
        "Live video could not continue"
      );

      reloadLiveBtn.classList.remove(
        "hidden"
      );
    }
  }
);

liveVideo.addEventListener(
  "ended",
  function(){

    if(liveStarted){

      liveVideo.currentTime = 0;

      liveVideo.play()
        .catch(function(){});
    }
  }
);

document.addEventListener(
  "DOMContentLoaded",
  function(){

    packagesScreen.classList.remove(
      "hidden"
    );

    liveScreen.classList.add(
      "hidden"
    );

    failedScreen.classList.add(
      "hidden"
    );

    const firstPackage =
      document.querySelector(".package");

    if(firstPackage){

      selectPackage(
        firstPackage
      );
    }
  }
);

window.addEventListener(
  "beforeunload",
  function(){

    clearInterval(paymentPollTimer);
    clearInterval(liveTimer);
    clearInterval(chatTimer);

  }
);

</script>
