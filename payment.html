      position: relative;

      bottom: -170px;

    /* PACKAGE */

    .package {
      position: relative;

      width: 100%;

      min-height: 330px;

      border-radius: 25px;

      border:

      color: white;

      cursor: pointer;

      overflow: hidden;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }


    .package::before {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      top: -80px;
      right: -70px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,220,255,.28),

      pointer-events: none;
    }


    .package::after {
      content: "";

      position: absolute;

      width: 160px;
      height: 160px;

      bottom: -90px;
      left: -70px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(110,50,255,.25),
          transparent 70%
        );

      pointer-events: none;
    }


    .package:hover {
      transform:
        translateY(-6px)
        scale(1.015);

      border-color:
        rgba(0,220,255,.9);

      box-shadow:
        0 0 25px
        rgba(0,180,255,.30);
    }


    .package.selected {
      transform:
        translateY(-5px)
        scale(1.025);

      border-color:
        #00d9ff;

      box-shadow:
        0 0 25px
        rgba(0,210,255,.45),

        inset 0 0 25px
        rgba(30,80,255,.12);
    }

        inset 0 0 18px

    <!-- FEATURES -->

         <!-- PAYMENT SECTION -->

    <div
      class="payment-section"
      id="paymentSection">

      <div class="till">

        Send money:

        <strong id="tillNumber">
          0783783687
        </strong>

        <button
          type="button"
          class="copy-till"
          onclick="copyTillNumber()">

          📋 COPY

        </button>

      </div>


      <div
        class="selected-info"
        id="selectedInfo">

        No package selected

      </div>


      <button
        type="button"
        class="pay intaSendPayButton"
        id="payButton"
        data-currency="KES"
        data-method="M-PESA">

        Pay with M-PESA

      </button>


      <div
        class="message-area"
        id="messageArea">

        <div class="message-row">

          <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Paste M-PESA message here..."
            autocomplete="off">

          <div class="paste-text">

            Paste M-PESA
            <br>
            message &amp; continue

          </div>

        </div>


        <div
          class="message-error"
          id="messageError">
        </div>

      </div>


      <div

        id="paymentStatus">

        </small>

  </div>
     <script>

    /* =========================
       GET ELEMENTS
    ========================= */

    const packages =
      document.querySelectorAll(".package");

    const paymentSection =
      document.getElementById(
        "paymentSection"
      );

    const selectedInfo =
      document.getElementById(
        "selectedInfo"
      );

    const payButton =
      document.getElementById(
        "payButton"
      );

    const messageArea =
      document.getElementById(
        "messageArea"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const messageError =
      document.getElementById(
        "messageError"
      );

    const paymentStatus =
      document.getElementById(
        "paymentStatus"
      );

    let selectedAmount = null;

    let selectedMinutes = null;

    let messageTimer = null;


    /* =========================
       SELECT PACKAGE
    ========================= */

    packages.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            packages.forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

              }
            );


            this.classList.add(
              "selected"
            );


            selectedAmount =
              this.dataset.amount;

            selectedMinutes =
              this.dataset.minutes;


            selectedInfo.textContent =
              "Selected: KSh " +
              selectedAmount +
              " for " +
              selectedMinutes +
              " minutes";


            payButton.dataset.amount =
              selectedAmount;

            payButton.dataset.currency =
              "KES";

            payButton.dataset.method =
              "M-PESA";

            payButton.dataset.api_ref =
              "access-" +
              selectedMinutes +
              "min-" +
              Date.now();


            paymentSection.style.display =
              "block";

            messageArea.style.display =
              "none";

            paymentStatus.style.display =
              "none";


            messageInput.value = "";

            messageInput.classList.remove(
              "rejected"
            );

            messageError.style.display =
              "none";

            messageError.textContent =
              "";


            if (messageTimer) {

              clearTimeout(
                messageTimer
              );

              messageTimer = null;

            }


            setTimeout(
              function() {

                paymentSection.scrollIntoView({
                  behavior: "smooth",
                  block: "center"
                });

              },
              100
            );

          }
        );

      }
    );


    /* =========================
       COPY TILL
    ========================= */

    function copyTillNumber() {

      const till =
        document
          .getElementById(
            "tillNumber"
          )
          .textContent
          .trim();


      navigator.clipboard
        .writeText(till)

        .then(
          function() {

            const button =
              document.querySelector(
                ".copy-till"
              );

            button.textContent =
              "✓ COPIED";


            setTimeout(
              function() {

                button.textContent =
                  "📋 COPY";

              },
              2000
            );

          }
        )

        .catch(
          function() {

            alert(
              "Please copy the Till number manually: " +
              till
            );

          }
        );

    }


    /* =========================
       PAY BUTTON
    ========================= */

    payButton.addEventListener(
      "click",
      function() {

        if (!selectedAmount) {

          alert(
            "Please select a package first."
          );

          return;

        }


        paymentStatus.style.display =
          "none";

        messageArea.style.display =
          "block";

        messageInput.focus();

      }
    );


    /* =========================
       M-PESA MESSAGE
       10 SECOND LOADING
    ========================= */

    messageInput.addEventListener(
      "input",
      function() {

        const message =
          this.value.trim();


        if (!message) {

          if (messageTimer) {

            clearTimeout(
              messageTimer
            );

            messageTimer = null;

          }


          messageError.style.display =
            "none";

          messageError.textContent =
            "";

          this.classList.remove(
            "rejected"
          );

          return;

        }


        this.classList.remove(
          "rejected"
        );


        messageError.style.display =
          "block";

        messageError.style.color =
          "white";

        messageError.textContent =
          "Loading...";


        if (messageTimer) {

          clearTimeout(
            messageTimer
          );

        }


        messageTimer =
          setTimeout(
            function() {

              messageError.style.display =
                "block";

              messageError.style.color =
                "#ff4747";

              messageError.textContent =
                "Incorrect message";

              messageInput.classList.add(
                "rejected"
              );

              messageTimer = null;

            },
            10000
          );

      }
    );


    /* =========================
       INTASEND
    ========================= */

    const intasend =
      new window.IntaSend({

        publicAPIKey:
          "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

        live: true

      });


    /* =========================
       PAYMENT SUCCESS
    ========================= */

    intasend.on(
      "COMPLETE",
      function(results) {

        console.log(
          "Payment successful:",
          results
        );


        paymentStatus.style.display =
          "none";


        alert(
          "Payment successful!"
        );


        window.location.href =
          "index.html";

      }
    );


    /* =========================
       PAYMENT FAILED
    ========================= */

    intasend.on(
      "FAILED",
      function(results) {

        console.log(
          "Payment failed:",
          results
        );


        paymentStatus.style.display =
          "block";


        paymentStatus.innerHTML =
          "No payment is done" +

          "<small>" +

          "Payment was not completed. " +

          "Please try again." +

          "</small>";

      }
    );


    /* =========================
       PAYMENT IN PROGRESS
    ========================= */

    intasend.on(
      "IN-PROGRESS",
      function(results) {

        console.log(
          "Payment in progress:",
          results
        );


        paymentStatus.style.display =
          "block";


        paymentStatus.innerHTML =
          "Payment in progress..." +

          "<small>" +

          "Please complete the payment " +

          "on your phone." +

          "</small>";

      }
    );


  </script>
