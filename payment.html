<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Buy Minutes</title>

  <script src="https://unpkg.com/intasend-checkout-sdk"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px 8px 70px;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at 50% 15%,
          #18205d 0%,
          #070b25 45%,
          #02040d 100%
        );

      color: white;

      text-align: center;

      min-height: 100vh;
    }


    /* MAIN CARD */

    .card {
      width: 100%;
      max-width: 760px;

      margin: auto;

      padding: 25px 12px 35px;

      border-radius: 28px;

      background:
        rgba(5, 8, 28, 0.92);

      box-shadow:
        0 0 50px rgba(45, 75, 255, 0.15),
        inset 0 0 50px rgba(20, 30, 100, 0.12);

      overflow: hidden;
    }


    /* HEADER */

    .header-icon {
      width: 65px;
      height: 65px;

      margin: 0 auto 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #a238ff,
          #006eff
        );

      box-shadow:
        0 0 30px rgba(80, 80, 255, 0.5);

      font-size: 34px;
    }


    h1 {
      margin: 0;

      font-size: 40px;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #22baff,
          #8b5cff
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;
    }


    .subtitle {
      margin-top: 10px;

      margin-bottom: 18px;

      color: #b9c0ee;

      font-size: 17px;
    }


    .header-line {
      width: 235px;

      height: 5px;

      margin: 0 auto 30px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #ff19c8,
          #743cff,
          #00eaff
        );

      box-shadow:
        0 0 18px rgba(0, 220, 255, 0.7);
    }


    /* =========================
       PACKAGE GRID - TWO COLUMNS
    ========================= */

    .package-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;

      max-width: 650px;

      margin: auto;
    }


    /* =========================
       TRIANGLE PACKAGE
    ========================= */

    .package {

      position: relative;

      width: 100%;

      min-height: 350px;

      border: 0;

      padding: 0;

      background: transparent;

      color: white;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;

      clip-path:
        polygon(
          50% 0%,
          100% 72%,
          50% 100%,
          0% 72%
        );

      filter:
        drop-shadow(
          0 0 10px
          rgba(70, 100, 255, 0.5)
        );
    }


    .package::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          145deg,
          #182c91,
          #080d2d 35%,
          #05091d 70%,
          #101c61
        );

      z-index: -2;
    }


    .package::after {

      content: "";

      position: absolute;

      inset: 4px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(45, 90, 255, 0.18),
          transparent 35%
        ),
        #060a22;

      clip-path:
        polygon(
          50% 0%,
          100% 72%,
          50% 100%,
          0% 72%
        );

      z-index: -1;
    }


    .package:hover {

      transform:
        translateY(-7px)
        scale(1.02);

      filter:
        drop-shadow(
          0 0 20px
          rgba(0, 190, 255, 0.8)
        );
    }


    .package.selected {

      transform:
        translateY(-5px)
        scale(1.03);

      filter:
        drop-shadow(
          0 0 22px #00c8ff
        )
        drop-shadow(
          0 0 35px
          rgba(100, 40, 255, 0.5)
        );
    }


    /* DIFFERENT CARD GLOW */

    .package:nth-child(1) {
      filter:
        drop-shadow(
          0 0 10px #ff19c8
        );
    }


    .package:nth-child(2) {
      filter:
        drop-shadow(
          0 0 10px #147dff
        );
    }


    .package:nth-child(3) {
      filter:
        drop-shadow(
          0 0 10px #00e6d2
        );
    }


    .package:nth-child(4) {
      filter:
        drop-shadow(
          0 0 10px #ff9d00
        );
    }


    .package:nth-child(5) {
      filter:
        drop-shadow(
          0 0 10px #b83cff
        );
    }


    /* =========================
       HOT BADGE
    ========================= */

    .hot {

      position: absolute;

      top: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      padding:
        8px 18px;

      border-radius: 30px;

      background:
        linear-gradient(
          90deg,
          #ff173f,
          #ff0088
        );

      color: white;

      font-size: 13px;

      font-weight: 900;

      white-space: nowrap;

      z-index: 20;

      box-shadow:
        0 0 20px
        rgba(255, 0, 100, 0.8);
    }


    /* CAMERA */

    .camera-circle {

      position: absolute;

      top: 72px;

      left: 50%;

      transform:
        translateX(-50%);

      width: 70px;

      height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #2630a5,
          #080c35
        );

      border:
        3px solid #08bfff;

      box-shadow:
        0 0 12px #08bfff,
        inset 0 0 15px
        rgba(80, 50, 255, 0.7);

      font-size: 31px;
    }


    /* MINUTES */

    .minutes {

      position: absolute;

      top: 160px;

      left: 0;

      right: 0;

      font-size: 23px;

      font-weight: 900;

      text-shadow:
        0 2px 8px black;
    }


    /* PRICE */

    .price {

      position: absolute;

      left: 7%;

      right: 7%;

      bottom: 22px;

      padding:
        13px 8px 16px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #ff62ad,
          #ff1fc4
        );

      color: white;

      box-shadow:
        0 0 20px
        rgba(255, 35, 180, 0.35);

      font-weight: 900;

      z-index: 5;
    }


    .package:nth-child(2) .price {

      background:
        linear-gradient(
          135deg,
          #18d8ff,
          #2450ff
        );
    }


    .package:nth-child(3) .price {

      background:
        linear-gradient(
          135deg,
          #27ffd0,
          #00bfae
        );

      color: #061c20;
    }


    .package:nth-child(4) .price {

      background:
        linear-gradient(
          135deg,
          #ffd21c,
          #ff9500
        );

      color: #111;
    }


    .package:nth-child(5) .price {

      background:
        linear-gradient(
          135deg,
          #ff55df,
          #702cff
        );
    }


    /* PRICE ROW */

    .price-row {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      margin: 4px 0;

      font-size: 15px;
    }


    .currency-icon {

      width: 27px;

      height: 27px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      font-size: 11px;

      font-weight: 900;

      color: white;

      box-shadow:
        0 2px 5px
        rgba(0,0,0,0.3);
    }


    .kes {
      background: #08a85c;
    }


    .usd {
      background: #1677ed;
    }


    .eur {
      background: #6a24d9;
    }


    /* FEATURES */

    .features {

      display: flex;

      justify-content: center;

      gap: 25px;

      margin-top: 35px;

      color: #bfc7f5;

      font-size: 14px;

      font-weight: bold;

      flex-wrap: wrap;
    }


    .feature {

      display: flex;

      align-items: center;

      gap: 7px;
    }


    .feature-icon {
      font-size: 21px;
    }


    /* PAYMENT SECTION */

    .payment-section {

      display: none;

      max-width: 500px;

      margin: 35px auto 0;

      padding: 20px;

      border-radius: 20px;

      background:
        rgba(17, 23, 60, 0.95);

      border:
        1px solid #263d91;

      box-shadow:
        0 0 25px
        rgba(30, 100, 255, 0.2);
    }


    .till {

      padding: 15px;

      border-radius: 12px;

      background: #080d27;

      font-size: 17px;

      font-weight: bold;
    }


    .selected-info {

      margin: 18px 0;

      color: #dce3ff;

      font-size: 16px;

      font-weight: bold;
    }


    .pay {

      width: 100%;

      padding: 16px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          90deg,
          #00b96b,
          #00d889
        );

      color: white;

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 0 20px
        rgba(0, 220, 130, 0.3);
    }


    .pay:hover {
      transform: translateY(-2px);
    }


    /* MESSAGE AREA */

    .message-area {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 12px;

      background: #080d27;
    }


    .message-row {

      display: flex;

      gap: 8px;

      align-items: center;
    }


    .message-input {

      flex: 1;

      min-width: 0;

      padding: 13px;

      border:
        2px solid #454d78;

      border-radius: 9px;

      background: white;

      color: #111;

      font-size: 14px;

      outline: none;
    }


    .message-input:focus {

      border-color:
        #168cff;
    }


    .message-input.rejected {

      border-color:
        #e32626;

      background:
        #fff0f0;

      color:
        #d00000;
    }


    .paste-text {

      width: 115px;

      color: #32b8ff;

      font-size: 13px;

      font-weight: bold;

      line-height: 1.3;
    }


    .message-error {

      display: none;

      margin-top: 8px;

      color: #ff4747;

      font-size: 13px;

      font-weight: bold;
    }


    /* PAYMENT STATUS */

    .payment-status {

      display: none;

      margin-top: 12px;

      padding: 14px;

      border-radius: 10px;

      background: #fff0f0;

      color: #d92525;

      font-size: 16px;

      font-weight: bold;
    }


    .payment-status small {

      display: block;

      margin-top: 5px;

      color: #333;

      font-weight: normal;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 12px 4px 60px;
      }


      .card {

        padding:
          20px 5px 30px;

        border-radius: 22px;
      }


      h1 {
        font-size: 34px;
      }


      .subtitle {
        font-size: 15px;
      }


      .header-line {

        width: 200px;

        margin-bottom: 25px;
      }


      .package-grid {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;
      }


      .package {

        min-height: 310px;
      }


      .camera-circle {

        width: 57px;

        height: 57px;

        top: 63px;

        font-size: 24px;
      }


      .minutes {

        top: 132px;

        font-size: 17px;
      }


      .price {

        left: 5%;

        right: 5%;

        bottom: 17px;

        padding:
          10px 3px 12px;
      }


      .price-row {

        font-size: 11px;

        gap: 4px;
      }


      .currency-icon {

        width: 21px;

        height: 21px;

        font-size: 8px;
      }


      .hot {

        top: 17px;

        padding:
          6px 10px;

        font-size: 10px;
      }


      .features {

        gap: 10px;

        font-size: 11px;
      }

    }


    @media (max-width: 360px) {

      .package {

        min-height: 290px;
      }


      .minutes {

        font-size: 15px;
      }


      .price-row {

        font-size: 9px;
      }


      .currency-icon {

        width: 19px;

        height: 19px;

        font-size: 7px;
      }


      .hot {

        font-size: 8px;

        padding:
          5px 8px;
      }

    }

  </style>

</head>


<body>

    <!-- PACKAGE GRID -->

      </button>


      <!-- 55 MINUTES -->

      <button

        </div>


        <span class="minutes">

        <div class="price">

          <div class="price-row">

          </div>


          <div class="price-row">

          <div class="price-row">

          </div>

      </button>


      <!-- 73 MINUTES -->

      <button

        data-amount="207"
        data-minutes="73">

        <div class="camera-circle">
          🎥
        </div>


        <span class="minutes">
          73 Mins
        </span>


        <div class="price">

          <div class="price-row">
            <span class="currency-icon kes">
              KSh
            </span>
            KSh 207
          </div>


          <div class="price-row">
            <span class="currency-icon usd">
              $
            </span>
            $1.59
          </div>


          <div class="price-row">
            <span class="currency-icon eur">
              €
            </span>
            €1.45
          </div>

        </div>

      </button>


      <!-- 95 MINUTES -->

      <button
        class="package"
        data-amount="253"
        data-minutes="95">

        <div class="camera-circle">
          🎥
        </div>


        <span class="minutes">
          95 Mins
        </span>


        <div class="price">

          <div class="price-row">
            <span class="currency-icon kes">
              KSh
            </span>
            KSh 253
          </div>


          <div class="price-row">
            <span class="currency-icon usd">

          </div>


          <div class="price-row">
            <span class="currency-icon eur">

      <!-- 105 MINUTES - HOT -->

      <button
        class="package"

        data-minutes="105">

        <span class="hot">
          🔥 HOT
        </span>


        <div class="camera-circle">
          🎥
        </div>


        <span class="minutes">
          105 Mins
        </span>


        <div class="price">

          <div class="price-row">
            <span class="currency-icon kes">
              KSh
            </span>
            KSh 299
          </div>


          <div class="price-row">
            <span class="currency-icon usd">
              $
            </span>
            $2.29
          </div>

            <span class="currency-icon eur">

            </span>

      </button>


    </div>


    <!-- FEATURES -->

    <div class="features">

      <div class="feature">
        <span class="feature-icon">
          🛡️
        </span>
        Secure Payments
      </div>


      <div class="feature">
        <span class="feature-icon">
          ⚡
        </span>
        Instant Access
      </div>


      <div class="feature">
        <span class="feature-icon">

      </div>

    </div>


    <!-- PAYMENT SECTION STARTS IN PART 2 -->

    <div
      class="payment-section"
      id="paymentSection">

      <div class="till">
        Send money:
        <strong>0795939598</strong>
      </div>


      <div
        class="selected-info"
        id="selectedInfo">

        No package selected

      </div>


      <button
        type="button"
        class="pay intaSendPayButton"
        id="payButton"
        data-currency="KES"
        data-method="M-PESA">

        Pay with M-PESA

      </button>


      <div
        class="message-area"
        id="messageArea">

        <div class="message-row">

          <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Paste M-PESA message here..."
            autocomplete="off">


          <div class="paste-text">
            Paste M-PESA
            <br>
            message &amp; continue
          </div>

        </div>


        <div
          class="message-error"
          id="messageError">

          ❌ Message not accepted.

        </div>

      </div>


      <div
        class="payment-status"
        id="paymentStatus">

        ❌ No payment is done

        <small>
          Please complete the M-PESA payment to continue.
        </small>

      </div>

    </div>


  </div>
  <script>

  /* =========================
     GET ELEMENTS
  ========================= */

  const packages =
    document.querySelectorAll(".package");

  const paymentSection =
    document.getElementById("paymentSection");

  const selectedInfo =
    document.getElementById("selectedInfo");

  const payButton =
    document.getElementById("payButton");

  const messageArea =
    document.getElementById("messageArea");

  const messageInput =
    document.getElementById("messageInput");

  const messageError =
    document.getElementById("messageError");

  const paymentStatus =
    document.getElementById("paymentStatus");


  let selectedAmount = null;
  let selectedMinutes = null;


  /* =========================
     SELECT PACKAGE
  ========================= */

  packages.forEach(function(button) {

    button.addEventListener(
      "click",
      function() {

        /* Remove old selection */

        packages.forEach(function(item) {

          item.classList.remove(
            "selected"
          );

        });


        /* Select this package */

        this.classList.add(
          "selected"
        );


        /* Get package information */

        selectedAmount =
          this.dataset.amount;

        selectedMinutes =
          this.dataset.minutes;


        /* Display selection */

        selectedInfo.textContent =
          "Selected: KSh " +
          selectedAmount +
          " for " +
          selectedMinutes +
          " minutes";


        /* Configure payment button */

        payButton.dataset.amount =
          selectedAmount;

        payButton.dataset.currency =
          "KES";

        payButton.dataset.method =
          "M-PESA";


        payButton.dataset.api_ref =
          "access-" +
          selectedMinutes +
          "min-" +
          Date.now();


        /* Show payment section */

        paymentSection.style.display =
          "block";


        messageArea.style.display =
          "none";

        paymentStatus.style.display =
          "none";


        /* Clear old message */

        messageInput.value = "";

        messageInput.classList.remove(
          "rejected"
        );

        messageError.style.display =
          "none";


        /* Scroll to payment */

        setTimeout(function() {

          paymentSection.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

        }, 100);

      }
    );

  });


  /* =========================
     PAY BUTTON
  ========================= */

  payButton.addEventListener(
    "click",
    function() {

      if (!selectedAmount) {

        alert(
          "Please select a package first."
        );

        return;

      }


      paymentStatus.style.display =
        "block";


      messageArea.style.display =
        "block";

    }
  );


  /* =========================
     M-PESA MESSAGE INPUT
  ========================= */

  messageInput.addEventListener(
    "input",
    function() {

      if (
        this.value.trim().length > 0
      ) {

        this.classList.add(
          "rejected"
        );

        messageError.style.display =
          "block";

      } else {

        this.classList.remove(
          "rejected"
        );

        messageError.style.display =
          "none";

      }

    }
  );


  /* =========================
     INTASEND
  ========================= */

  const intasend =
    new window.IntaSend({

      publicAPIKey:
        "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

      live: true

    });


  /* =========================
     PAYMENT SUCCESS
  ========================= */

  intasend.on(
    "COMPLETE",
    function(results) {

      console.log(
        "Payment successful:",
        results
      );


      paymentStatus.style.display =
        "none";


      alert(
        "Payment successful!"
      );


      /* Go back to your main page */

      window.location.href =
        "index.html";

    }
  );


  /* =========================
     PAYMENT FAILED
  ========================= */

  intasend.on(
    "FAILED",
    function(results) {

      console.log(
        "Payment failed:",
        results
      );


      paymentStatus.style.display =
        "block";


      paymentStatus.innerHTML =
        "❌ No payment is done" +

        "<small>" +

        "Payment was not completed. " +

        "Please try again." +

        "</small>";

    }
  );


  /* =========================
     PAYMENT IN PROGRESS
  ========================= */

  intasend.on(
    "IN-PROGRESS",
    function(results) {

      console.log(
        "Payment in progress:",
        results
      );


      paymentStatus.style.display =
        "block";


      paymentStatus.innerHTML =
        "⏳ Payment in progress..." +

        "<small>" +

        "Please complete the payment " +

        "on your phone." +

        "</small>";

    }
  );

</script>
