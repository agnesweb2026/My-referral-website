<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Access</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px 15px;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 20px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .ref {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0 25px;
    }

    .package {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 17px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .package:hover {
      border-color: #1877f2;
    }

    .package.selected {
      border-color: #1877f2;
      background: #eef5ff;
    }

    .pay {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .selected-info {
      margin-top: 18px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Choose Access</h1>

    <div class="ref">
      Referral Code:
      <strong id="refCode">GB3HLT</strong>
    </div>

    <p>Select your preferred access package:</p>

    <button class="package" data-amount="80" data-minutes="10">
    KSh 25 — 10 Minutes
</button>

<button class="package" data-amount="135" data-minutes="25">
    KSh 30 — 25 Minutes
</button>

<button class="package" data-amount="200" data-minutes="40">
    KSh 40 — 40 Minutes
</button>

<button class="package" data-amount="250" data-minutes="55">
    KSh 50 — 55 Minutes
</button>

<button class="package" data-amount="300" data-minutes="65">
    KSh 60 — 65 Minutes
</button>
<input id="phoneNumber" type="tel" placeholder="Pay with Till: 1605854">
    <div class="selected-info" id="selectedInfo">
      No package selected
    </div>

    <button class="pay" id="payButton">
      Continue to Payment
    </button>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");

    if (ref) {
      document.getElementById("refCode").textContent = ref;
    }

    const packages = document.querySelectorAll(".package");
    const selectedInfo = document.getElementById("selectedInfo");
    const payButton = document.getElementById("payButton");

    let selectedAmount = null;
    let selectedMinutes = null;

    packages.forEach(button => {
      button.addEventListener("click", () => {

        packages.forEach(item => {
          item.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedAmount = button.dataset.amount;
        selectedMinutes = button.dataset.minutes;

        selectedInfo.textContent =
          "Selected: KSh " + selectedAmount +
          " for " + selectedMinutes + " minutes";
document.getElementById("phoneNumber").placeholder = "Pay with Till: 1605854";
        payButton.style.display = "block";
      });
    });

    payButton.addEventListener("click", () => {
    if (!selectedAmount || !selectedMinutes) {
        alert("Please select a package first.");
        return;
    }

    window.location.href =
        "mpesa.html?amount=" + selectedAmount +
        "&minutes=" + selectedMinutes +
        "&ref=" + encodeURIComponent(ref || "");
});
      

      
    
  </script>

</body>
</html>
