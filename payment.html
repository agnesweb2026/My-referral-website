<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose Access</title>

  <script src="https://unpkg.com/intasend-checkout-sdk"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px 15px;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 20px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .package {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 17px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .package.selected {
      border-color: #1877f2;
      background: #eef5ff;
    }

    .till {
      margin-top: 18px;
      padding: 13px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .selected-info {
      margin-top: 18px;
      font-size: 16px;
    }

    .pay {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    /* PAYMENT STATUS MESSAGE */
    .payment-status {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #f5b5b5;
      border-radius: 10px;
      background: #fff0f0;
      color: #d92525;
      font-size: 16px;
      font-weight: bold;
    }

    .payment-status small {
      display: block;
      margin-top: 5px;
      color: #333;
      font-weight: normal;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Choose Access</h1>

  <p>Select your preferred access package:</p>

  <button class="package" data-amount="80" data-minutes="10">
    KSh 80 — 10 Minutes
  </button>

  <button class="package" data-amount="135" data-minutes="25">
    KSh 135 — 25 Minutes
  </button>

  <button class="package" data-amount="200" data-minutes="40">
    KSh 200 — 40 Minutes
  </button>

  <button class="package" data-amount="250" data-minutes="55">
    KSh 250 — 55 Minutes
  </button>

  <button class="package" data-amount="300" data-minutes="65">
    KSh 300 — 65 Minutes
  </button>

  <div class="till">
    Pay with Till: 1605854
  </div>

  <div class="selected-info" id="selectedInfo">
    No package selected
  </div>

  <button
    type="button"
    class="pay intaSendPayButton"
    id="payButton"
    data-currency="KES"
    data-method="M-PESA">
    Pay with M-PESA
  </button>

  <!-- THIS APPEARS AFTER PAY WITH M-PESA IS TAPPED -->
  <div class="payment-status" id="paymentStatus">
    ❌ No payment is done
    <small>Please complete the M-PESA payment to continue.</small>
  </div>

</div>

<script>

const packages = document.querySelectorAll(".package");
const selectedInfo = document.getElementById("selectedInfo");
const payButton = document.getElementById("payButton");
const paymentStatus = document.getElementById("paymentStatus");

let selectedAmount = null;
let selectedMinutes = null;


/* SELECT PACKAGE */
packages.forEach(function(button) {

  button.addEventListener("click", function() {

    packages.forEach(function(item) {
      item.classList.remove("selected");
    });

    this.classList.add("selected");

    selectedAmount = this.dataset.amount;
    selectedMinutes = this.dataset.minutes;

    selectedInfo.textContent =
      "Selected: KSh " +
      selectedAmount +
      " for " +
      selectedMinutes +
      " minutes";

    payButton.dataset.amount = selectedAmount;
    payButton.dataset.currency = "KES";
    payButton.dataset.method = "M-PESA";

    payButton.dataset.api_ref =
      "access-" +
      selectedMinutes +
      "min-" +
      Date.now();

    payButton.style.display = "block";

    /* Hide old payment message when changing package */
    paymentStatus.style.display = "none";

  });

});


/* SHOW MESSAGE WHEN M-PESA BUTTON IS TAPPED */
payButton.addEventListener("click", function() {

  paymentStatus.style.display = "block";

});


/* INTASEND */
new window.IntaSend({

  publicAPIKey:
    "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

  live: true

})


/* PAYMENT SUCCESS */
.on("COMPLETE", function(results) {

  console.log("Payment successful:", results);

  paymentStatus.style.display = "none";

  alert("Payment successful!");

  window.location.href = "index.html";

})


/* PAYMENT FAILED */
.on("FAILED", function(results) {

  console.log("Payment failed:", results);

  paymentStatus.style.display = "block";

  paymentStatus.innerHTML =
    "❌ No payment is done" +
    "<small>Payment was not completed. Please try again.</small>";

})


/* PAYMENT IN PROGRESS */
.on("IN-PROGRESS", function(results) {

  console.log("Payment in progress:", results);

  paymentStatus.style.display = "block";

});

</script>

</body>
</html>
