<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-PESA Payment</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050505;color:white;
 font-family:Arial
}
.container{
 max-width:520px;margin:auto;padding:18px
}
h1{text-align:center;color:#32cd32}
.packages{
 display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.package{
 background:#111;border:1px solid #333;
 border-radius:14px;padding:18px 8px;
 text-align:center;cursor:pointer
}
.package.selected{
 border:2px solid #32cd32;
 background:#102010
}
.minutes{
 font-size:21px;font-weight:bold
}
.price{
 color:#32cd32;font-size:18px;margin-top:8px
}
.payment-box,.instructions{
 margin-top:18px;background:#101010;
 padding:18px;border-radius:15px
}
input{
 width:100%;padding:14px;background:#050505;
 color:white;border:1px solid #444;
 border-radius:9px;font-size:17px
}
button{
 width:100%;padding:15px;margin-top:15px;
 border:0;border-radius:10px;
 background:#32cd32;font-weight:bold;
 font-size:16px
}
button:disabled{opacity:.5}
.status{
 text-align:center;margin-top:15px;color:#aaa
}

/* LIVE-STYLE */
.live{
 position:fixed;inset:0;background:#000;
 z-index:9999;display:flex;
 flex-direction:column
}
.videoBox{
 height:62vh;position:relative;
 background:#000
}
.video{
 width:100%;height:100%;
 object-fit:cover
}
.liveBadge{
 position:absolute;top:15px;left:15px;
 background:red;padding:7px 12px;
 border-radius:7px;font-weight:bold
}
.viewers{
 position:absolute;top:15px;right:15px;
 background:#000b;padding:7px 10px;
 border-radius:15px
}
.chat{
 height:38vh;display:flex;
 flex-direction:column;background:#090909
}
.chatTitle{
 padding:11px;border-bottom:1px solid #222;
 font-weight:bold
}
.messages{
 flex:1;overflow:hidden;padding:10px;
 display:flex;flex-direction:column;
 justify-content:flex-end;gap:7px
}
.msg{font-size:13px}
.name{
 color:#32cd32;font-weight:bold
}
.heart{color:#ff4b6e}

.insufficient{
 position:fixed;inset:0;background:#050505;
 z-index:10000;display:flex;
 align-items:center;justify-content:center;
 text-align:center
}
.insufficient h1{color:red}

.spinner{
 width:55px;height:55px;margin:25px auto;
 border:5px solid #222;
 border-top-color:#32cd32;
 border-radius:50%;
 animation:spin 1s linear infinite
}
@keyframes spin{
 to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="container">

<h1>M-PESA PAYMENT</h1>

<p style="text-align:center;color:#aaa">
Choose your minutes package
</p>

<div class="packages">

<div class="package"
onclick="selectPackage(this,30,90)">
<div class="minutes">30 Mins</div>
<div class="price">KSh 90</div>
</div>

<div class="package"
onclick="selectPackage(this,55,138)">
<div class="minutes">55 Mins</div>
<div class="price">KSh 138</div>
</div>

<div class="package"
onclick="selectPackage(this,73,207)">
<div class="minutes">73 Mins</div>
<div class="price">KSh 207</div>
</div>

<div class="package"
onclick="selectPackage(this,95,253)">
<div class="minutes">95 Mins</div>
<div class="price">KSh 253</div>
</div>

<div class="package"
onclick="selectPackage(this,105,299)">
<div class="minutes">105 Mins</div>
<div class="price">KSh 299</div>
</div>

<div class="package"
onclick="selectPackage(this,166,393)">
<div class="minutes">166 Mins</div>
<div class="price">KSh 393</div>
</div>

</div>

<div class="payment-box">

<h3>Pay with M-PESA</h3>

<input
id="customerPhone"
type="tel"
inputmode="numeric"
placeholder="07XXXXXXXX">

<button id="payButton"
onclick="payWithMpesa()">
PAY WITH M-PESA
</button>

<div id="status" class="status"></div>

</div>

<div class="instructions">
<h3>How to pay</h3>
<ol>
<li>Select package</li>
<li>Enter M-PESA number</li>
<li>Tap PAY WITH M-PESA</li>
<li>Complete the M-PESA prompt</li>
</ol>
</div>

</div>
<script>

const params=new URLSearchParams(location.search);

let employeeId=
params.get("employee")||
params.get("ref")||
localStorage.getItem("referralEmployeeId");

if(employeeId){
 localStorage.setItem(
  "referralEmployeeId",
  employeeId
 );
}

const TILL_NUMBER="1605854";

let selectedMinutes=null;
let selectedPrice=null;

function selectPackage(el,m,p){

document.querySelectorAll(".package")
.forEach(x=>x.classList.remove("selected"));

el.classList.add("selected");

selectedMinutes=m;
selectedPrice=p;

document.getElementById("status").textContent=
m+" minutes — KSh "+p;
}

function phone(v){

v=v.replace(/\s|-/g,"");

if(/^07\d{8}$/.test(v))
return "254"+v.slice(1);

if(/^01\d{8}$/.test(v))
return "254"+v.slice(1);

if(/^254[17]\d{8}$/.test(v))
return v;

return null;
}

function makeRef(){

return (
 "ORD"+
 Math.random()
 .toString(36)
 .slice(2,11)
)
.toUpperCase()
.slice(0,12);

}

async function payWithMpesa(){

if(!selectedPrice){
alert("Select a package first");
return;
}

let p=phone(
document.getElementById("customerPhone").value
);

if(!p){
alert("Enter a valid M-PESA number");
return;
}

const btn=document.getElementById("payButton");

btn.disabled=true;

document.getElementById("status").textContent=
"Sending M-PESA prompt...";

try{

let r=await fetch("/api/stk-push",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:p,

amount:selectedPrice,

reference:makeRef()

})

});

let d=await r.json();

if(!r.ok||!d.success){

throw new Error(
d.message||"Payment failed"
);

}

checkPayment(
d.paymentId||
d.transaction_request_id
);

}catch(e){

document.getElementById("status")
.textContent=e.message;

btn.disabled=false;

}

}

function checkPayment(id){

document.body.innerHTML=`

<div style="
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white">

<h1 style="color:#32cd32">
CHECK YOUR PHONE
</h1>

<p>Complete the M-PESA prompt</p>

<div class="spinner"></div>

<p id="checking">Waiting...</p>

</div>
`;

let n=0;

let timer=setInterval(async()=>{

n++;

try{

let r=await fetch(
"/api/payment-status",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
transaction_request_id:id
})
}
);

let d=await r.json();

if(
d.paid===true &&
d.status==="Completed"
){

clearInterval(timer);

recordPayment(d,id);

showLive();

return;
}

let checking=
document.getElementById("checking");

if(checking){

checking.textContent=
"Waiting for confirmation "+
n+"/20";

}

}catch(e){}

if(n>=20){

clearInterval(timer);

location.reload();

}

},3000);

}

function recordPayment(d,id){

if(!employeeId)return;

let amount=Number(
d.amount||
selectedPrice||
0
);

let record={

id:id,

paymentId:id,

employeeId:employeeId,

ref:employeeId,

minutes:selectedMinutes,

amount:amount,

commission:
Math.round(amount*.25*100)/100,

commissionRate:25,

status:"paid",

receipt:d.receipt||null,

date:new Date().toISOString()

};

let key=
"employeePayments_"+employeeId;

let list=JSON.parse(
localStorage.getItem(key)||"[]"
);

if(
!list.some(
x=>String(x.paymentId)==String(id)
)
){

list.unshift(record);

localStorage.setItem(
key,
JSON.stringify(list)
);

}

}
 function showLive(){

document.body.innerHTML=`

<div class="live">

<div class="videoBox">

<video
id="liveVideo"
class="video"
playsinline
autoplay
preload="auto"
disablepictureinpicture
controlslist="nodownload nofullscreen noremoteplayback">

<source
src="https://raw.githubusercontent.com/agnesweb2026/My-referral-website/main/preview_20_seconds.mp4"
type="video/mp4">

</video>

<div class="liveBadge">
● LIVE-STYLE
</div>

<div class="viewers">
👁 <span id="views">20</span>
</div>

</div>

<div class="chat">

<div class="chatTitle">
💬 Live chat
</div>

<div
id="messages"
class="messages">
</div>

</div>

</div>
`;

startLive();

}

function startLive(){

const v=
document.getElementById("liveVideo");

const box=
document.getElementById("messages");

const views=
document.getElementById("views");

const names=[
"Asha","Brian","Mercy","Kevin",
"Sarah","John","Linda","Mike",
"Grace","Daniel","Sharon","David",
"Lucy","James","Mary","Alex"
];

const comments=[
"Hey 😍",
"Hello ❤️",
"Wow!",
"Looking good 😍",
"Hi beautiful",
"I just joined 👋",
"Hello everyone ❤️",
"Wow wow!",
"Can you reply?",
"Don't go 😂",
"Beautiful 😍",
"Anyone watching?",
"Hello!",
"Wow ❤️",
"Please reply",
"Heyyy 😍"
];

function addComment(){

let d=
document.createElement("div");

d.className="msg";

let name=
names[
Math.floor(
Math.random()*names.length
)
];

let comment=
comments[
Math.floor(
Math.random()*comments.length
)
];

d.innerHTML=
`<span class="name">
${name}:
</span>
<span>${comment}</span>
<span class="heart">
 ❤️
</span>`;

box.appendChild(d);

while(box.children.length>12){

box.removeChild(
box.firstChild
);

}

}

for(let i=0;i<7;i++){
addComment();
}

let chatTimer=
setInterval(addComment,600);

let viewerTimer=
setInterval(()=>{

views.textContent=
15+
Math.floor(
Math.random()*16
);

},2500);


/* VIDEO */

v.removeAttribute("controls");
v.controls=false;

v.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

v.addEventListener(
"loadedmetadata",
()=>{

let start=
Math.min(20,v.duration);

v.currentTime=start;

v.muted=false;
v.volume=1;

v.play().catch(()=>{

/*
Chrome/Android inaweza
kuzuia autoplay yenye sound.
Hatuwezi kuvunja browser policy.
*/

v.muted=false;

});


/*
20 seconds -> 1 second
*/

let begin=null;

function reverse(t){

if(begin===null)
begin=t;

let elapsed=
(t-begin)/1000;

let current=
start-elapsed;

if(current<=1){

clearInterval(chatTimer);
clearInterval(viewerTimer);

v.pause();

v.currentTime=1;

showInsufficient();

return;

}

v.currentTime=current;

requestAnimationFrame(reverse);

}

requestAnimationFrame(reverse);

},
{once:true}
);

v.load();

}


/* ZUIA CONTROLS / FORWARD / BACK */

document.addEventListener(
"keydown",
e=>{

if(
e.code==="Space"||
e.code==="ArrowLeft"||
e.code==="ArrowRight"
){

let v=
document.getElementById("liveVideo");

if(v)e.preventDefault();

}

}
);


/* INSUFFICIENT MINUTES */

function showInsufficient(){

document.body.innerHTML=`

<div class="insufficient">

<div>

<div style="font-size:60px">
⏱️
</div>

<h1>
INSUFFICIENT MINUTES
</h1>

<p>
Your available minutes have ended.
</p>

<div class="spinner"></div>

<p>
Returning to packages...
</p>

</div>

</div>
`;

setTimeout(()=>{

/*
Reload returns to the
original packages screen.
*/

location.reload();

},2000);

}

</script>

</body>
</html>
