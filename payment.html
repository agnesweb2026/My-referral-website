<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M-PESA Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px 12px;
}

.container{
  width:100%;
  max-width:480px;
  margin:auto;
}

h1{
  text-align:center;
  color:#00ff88;
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

.card{
  background:#101010;
  border:1px solid #252525;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.label{
  display:block;
  color:#bbb;
  font-size:14px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#00ff88;
}

.packages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.package{
  background:#171717;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  cursor:pointer;
}

.package.selected{
  border:2px solid #00ff88;
  background:#10251b;
}

.minutes{
  font-size:18px;
  font-weight:bold;
}

.price{
  color:#00ff88;
  font-size:20px;
  font-weight:bold;
  margin-top:7px;
}

.hot{
  color:#ff4444;
  font-size:12px;
  margin-top:5px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:17px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#00d875;
  color:#000;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:#171717;
  border:1px solid #333;
  line-height:1.5;
}

.status.show{
  display:block;
}

.info{
  color:#00ff88;
}

.warning{
  color:#ffd000;
}

.small{
  color:#888;
  text-align:center;
  font-size:12px;
  line-height:1.5;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>M-PESA PAYMENT</h1>

  <div class="subtitle">
    Send Money
  </div>


  <!-- PHONE NUMBER -->

  <div class="card">

    <label class="label">
      M-PESA phone number
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="12"
      placeholder="0712345678"
    >

  </div>


  <!-- PACKAGES -->

  <div class="card">

    <label class="label">
      Choose package
    </label>

    <div class="packages">

      <div
        class="package"
        data-minutes="30"
        data-price="81"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          30 Mins
        </div>

        <div class="price">
          KSh 81
        </div>
      </div>


      <div
        class="package"
        data-minutes="55"
        data-price="138"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          55 Mins
        </div>

        <div class="price">
          KSh 138
        </div>
      </div>


      <div
        class="package"
        data-minutes="73"
        data-price="207"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          73 Mins
        </div>

        <div class="price">
          KSh 207
        </div>
      </div>


      <div
        class="package"
        data-minutes="95"
        data-price="253"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          95 Mins
        </div>

        <div class="price">
          KSh 253
        </div>
      </div>


      <div
        class="package"
        data-minutes="105"
        data-price="299"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          105 Mins
        </div>

        <div class="price">
          KSh 299
        </div>
      </div>


      <div
        class="package"
        data-minutes="166"
        data-price="393"
        onclick="selectPackage(this)"
      >
        <div class="minutes">
          166 Mins
        </div>

        <div class="price">
          KSh 393
        </div>

        <div class="hot">
          🔥 HOT
        </div>
      </div>

    </div>

  </div>


  <!-- PAYMENT -->

  <div class="card">

    <button
      id="payButton"
      onclick="testMpesa()"
      disabled
    >
      PAY WITH M-PESA
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div class="small">
    This is an Android USSD test.
    The website does not request or handle your M-PESA PIN.
  </div>

</div>


<script>

let selectedPackage = null;


/* ============================
   SELECT PACKAGE
============================ */

function selectPackage(element){

  document
    .querySelectorAll(".package")
    .forEach(function(item){

      item.classList.remove("selected");

    });


  element.classList.add("selected");


  selectedPackage = {

    minutes:
      Number(element.dataset.minutes),

    price:
      Number(element.dataset.price)

  };


  checkReady();

}


/* ============================
   CHECK INPUT
============================ */

document
  .getElementById("phone")
  .addEventListener(
    "input",
    checkReady
  );


function checkReady(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  document
    .getElementById("payButton")
    .disabled =
      !selectedPackage ||
      phone.length < 10;

}


/* ============================
   TEST M-PESA
============================ */

function testMpesa(){

  if(!selectedPackage){

    showStatus(
      "Please select a package.",
      "warning"
    );

    return;

  }


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if(phone.length < 10){

    showStatus(
      "Please enter your M-PESA phone number.",
      "warning"
    );

    return;

  }


  showStatus(

    `
    <div class="info">
      Opening M-PESA USSD...
    </div>

    <br>

    Selected amount:
    <strong>
      KSh ${selectedPackage.price}
    </strong>

    <br><br>

    After M-PESA opens, select
    <strong>Send Money</strong>.
    `,

    "info"

  );


  /*
    ANDROID INTENT TEST

    This asks Android to open
    the telephone/USSD handler
    with *334#
  */

  const ussd =
    "*334#";


  const intentUrl =
    "intent://" +
    encodeURIComponent(ussd) +
    "#Intent;" +
    "scheme=tel;" +
    "action=android.intent.action.CALL;" +
    "end";


  setTimeout(function(){

    window.location.href =
      intentUrl;

  },500);

}


/* ============================
   STATUS
============================ */

function showStatus(
  message,
  type
){

  const status =
    document.getElementById("status");


  status.className =
    "status show " + type;


  status.innerHTML =
    message;

}

</script>

</body>
</html>
