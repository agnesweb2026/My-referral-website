<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose Access</title>

  <script src="https://unpkg.com/intasend-checkout-sdk"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px 100px;
      font-family: Arial, sans-serif;
      background: #0d0d18;
      color: white;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: #11111f;
      padding: 20px 12px 25px;
      border-radius: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* PACKAGE GRID */
    .package-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .package {
      position: relative;
      width: 100%;
      min-height: 185px;
      padding: 0;
      overflow: hidden;
      border: 2px solid #292943;
      border-radius: 18px;
      background: #19192d;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .package:hover {
      transform: translateY(-2px);
    }

    .package.selected {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24,119,242,0.25);
    }

    .hot {
      position: absolute;
      top: 8px;
      right: 6px;
      padding: 6px 9px;
      border-radius: 20px;
      background: #ff3d69;
      color: white;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
    }

    .camera-circle {
      width: 55px;
      height: 55px;
      margin: 25px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #342d35;
      border: 2px solid #755a25;
      font-size: 26px;
    }

    .minutes {
      display: block;
      min-height: 42px;
      padding: 0 4px;
      font-size: 16px;
      font-weight: bold;
    }

    .price {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 3px;
      background: #ff9f1c;
      color: #111;
      font-size: 17px;
      font-weight: bold;
    }

    /* PAYMENT AREA */
    .payment-section {
      display: none;
      margin-top: 22px;
    }

    .till {
      padding: 13px;
      background: #242433;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .selected-info {
      margin: 15px 0;
      color: #ddd;
      font-size: 15px;
    }

    .pay {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MESSAGE BOX */
    .message-area {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 10px;
      background: #19192d;
    }

    .message-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      padding: 13px 10px;
      border: 2px solid #777;
      border-radius: 9px;
      background: white;
      color: #111;
      font-size: 14px;
      outline: none;
    }

    .message-input:focus {
      border-color: #1877f2;
    }

    .message-input.rejected {
      border-color: #e32626;
      background: #fff0f0;
      color: #d00000;
    }

    .paste-text {
      width: 120px;
      color: #1877f2;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.3;
    }

    .message-error {
      display: none;
      margin-top: 8px;
      color: #ff3b3b;
      font-size: 13px;
      font-weight: bold;
    }

    /* NO PAYMENT */
    .payment-status {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #f5a8a8;
      border-radius: 10px;
      background: #fff0f0;
      color: #d92525;
      font-size: 16px;
      font-weight: bold;
    }

    .payment-status small {
      display: block;
      margin-top: 5px;
      color: #333;
      font-weight: normal;
    }

    /* SMALL PHONES */
    @media (max-width: 350px) {

      .package-grid {
        gap: 7px;
      }

      .package {
        min-height: 170px;
      }

      .minutes {
        font-size: 14px;
      }

      .price {
        font-size: 15px;
      }

      .paste-text {
        width: 105px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Buy Minutes</h1>

  <div class="subtitle">
    Choose a plan that works for you
  </div>

  <div class="package-grid">

    <button class="package" data-amount="80" data-minutes="10">

      <span class="hot">🔥 HOT</span>

      <div class="camera-circle">📹</div>

      <span class="minutes">
        25 Mins
      </span>

      <div class="price">
        KSh 80
      </div>

    </button>


    <button class="package" data-amount="135" data-minutes="25">

      <div class="camera-circle">📹</div>

      <span class="minutes">
        40 Mins
      </span>

      <div class="price">
        KSh 135
      </div>

    </button>


    <button class="package" data-amount="200" data-minutes="40">

      <div class="camera-circle">📹</div>

      <span class="minutes">
        55 Mins
      </span>

      <div class="price">
        KSh 200
      </div>

    </button>


    <button class="package" data-amount="250" data-minutes="55">

      <div class="camera-circle">📹</div>

      <span class="minutes">
        65 Mins
      </span>

      <div class="price">
        KSh 250
      </div>

    </button>


    <button class="package" data-amount="300" data-minutes="65">

      <div class="camera-circle">📹</div>

      <span class="minutes">
        85 Mins
      </span>

      <div class="price">
        KSh 300
      </div>

    </button>

  </div>


  <!-- PAYMENT SECTION -->

  <div class="payment-section" id="paymentSection">

    <div class="till">
      Pay with Till: 1605854
    </div>

    <div class="selected-info" id="selectedInfo">
      No package selected
    </div>


    <button
      type="button"
      class="pay intaSendPayButton"
      id="payButton"
      data-currency="KES"
      data-method="M-PESA">

      Pay with M-PESA

    </button>


    <!-- MESSAGE BOX -->

    <div class="message-area" id="messageArea">

      <div class="message-row">

        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="Paste M-PESA message here..."
          autocomplete="off">

        <div class="paste-text">
          Paste mpesa<br>
          message &amp; continue
        </div>

      </div>

      <div class="message-error" id="messageError">
        ❌ Message not accepted.
      </div>

    </div>


    <!-- NO PAYMENT MESSAGE -->

    <div class="payment-status" id="paymentStatus">

      ❌ No payment is done

      <small>
        Please complete the M-PESA payment to continue.
      </small>

    </div>

  </div>

</div>


<script>

const packages = document.querySelectorAll(".package");

const paymentSection =
  document.getElementById("paymentSection");

const selectedInfo =
  document.getElementById("selectedInfo");

const payButton =
  document.getElementById("payButton");

const messageArea =
  document.getElementById("messageArea");

const messageInput =
  document.getElementById("messageInput");

const messageError =
  document.getElementById("messageError");

const paymentStatus =
  document.getElementById("paymentStatus");

let selectedAmount = null;
let selectedMinutes = null;


/* SELECT PACKAGE */

packages.forEach(function(button) {

  button.addEventListener("click", function() {

    packages.forEach(function(item) {
      item.classList.remove("selected");
    });

    this.classList.add("selected");

    selectedAmount =
      this.dataset.amount;

    selectedMinutes =
      this.dataset.minutes;


    selectedInfo.textContent =
      "Selected: KSh " +
      selectedAmount +
      " for " +
      selectedMinutes +
      " minutes";


    payButton.dataset.amount =
      selectedAmount;

    payButton.dataset.currency =
      "KES";

    payButton.dataset.method =
      "M-PESA";


    payButton.dataset.api_ref =
      "access-" +
      selectedMinutes +
      "min-" +
      Date.now();


    paymentSection.style.display =
      "block";


    messageArea.style.display =
      "none";

    paymentStatus.style.display =
      "none";


    messageInput.value = "";

    messageInput.classList.remove(
      "rejected"
    );

    messageError.style.display =
      "none";

  });

});


/* PAY WITH M-PESA */

payButton.addEventListener(
  "click",
  function() {

    paymentStatus.style.display =
      "block";

    messageArea.style.display =
      "block";

  }
);


/* REJECT ANY TYPED / PASTED MESSAGE */

messageInput.addEventListener(
  "input",
  function() {

    if (this.value.trim().length > 0) {

      this.classList.add(
        "rejected"
      );

      messageError.style.display =
        "block";

    } else {

      this.classList.remove(
        "rejected"
      );

      messageError.style.display =
        "none";

    }

  }
);


/* INTASEND */

new window.IntaSend({

  publicAPIKey:
    "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

  live: true

})


/* PAYMENT SUCCESS */

.on(
  "COMPLETE",
  function(results) {

    console.log(
      "Payment successful:",
      results
    );

    paymentStatus.style.display =
      "none";

    alert(
      "Payment successful!"
    );

    window.location.href =
      "index.html";

  }
)


/* PAYMENT FAILED */

.on(
  "FAILED",
  function(results) {

    console.log(
      "Payment failed:",
      results
    );

    paymentStatus.style.display =
      "block";

    paymentStatus.innerHTML =
      "❌ No payment is done" +
      "<small>" +
      "Payment was not completed. Please try again." +
      "</small>";

  }
)


/* PAYMENT IN PROGRESS */

.on(
  "IN-PROGRESS",
  function(results) {

    console.log(
      "Payment in progress:",
      results
    );

    paymentStatus.style.display =
      "block";

  }
);

</script>

</body>
</html>
