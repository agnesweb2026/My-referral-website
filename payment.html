<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose Access</title>

  <!-- IntaSend Checkout -->
  <script src="https://unpkg.com/intasend-checkout-sdk"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px 100px;
      font-family: Arial, sans-serif;
      background: #0d0d18;
      color: white;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: #11111f;
      padding: 20px 12px 25px;
      border-radius: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* =========================
       PACKAGE GRID
    ========================= */

    .package-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .package {
      position: relative;
      width: 100%;
      min-height: 235px;
      padding: 0;
      overflow: hidden;
      border: 2px solid #292943;
      border-radius: 18px;
      background: #19192d;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .package:hover {
      transform: translateY(-2px);
    }

    .package.selected {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24,119,242,0.25);
    }

    /* HOT BADGE */

    .hot {
      position: absolute;
      top: 8px;
      right: 6px;
      padding: 6px 9px;
      border-radius: 20px;
      background: #ff3d69;
      color: white;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
    }

    /* CAMERA */

    .camera-circle {
      width: 55px;
      height: 55px;
      margin: 25px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #342d35;
      border: 2px solid #755a25;
      font-size: 26px;
    }

    /* MINUTES */

    .minutes {
      display: block;
      min-height: 42px;
      padding: 0 4px;
      font-size: 16px;
      font-weight: bold;
    }

    /* PRICE AREA */

    .price {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      padding: 8px 3px;

      background: #ff9f1c;
      color: #111;

      font-size: 14px;
      font-weight: bold;

      line-height: 1.45;
    }

    .price div {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    /* =========================
       PAYMENT AREA
    ========================= */

    .payment-section {
      display: none;
      margin-top: 22px;
    }

    .till {
      padding: 13px;
      background: #242433;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .selected-info {
      margin: 15px 0;
      color: #ddd;
      font-size: 15px;
    }

    .pay {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay:hover {
      background: #0d65d9;
    }

    /* =========================
       MESSAGE BOX
    ========================= */

    .message-area {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 10px;
      background: #19192d;
    }

    .message-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      padding: 13px 10px;
      border: 2px solid #777;
      border-radius: 9px;
      background: white;
      color: #111;
      font-size: 14px;
      outline: none;
    }

    .message-input:focus {
      border-color: #1877f2;
    }

    .message-input.rejected {
      border-color: #e32626;
      background: #fff0f0;
      color: #d00000;
    }

    .paste-text {
      width: 120px;
      color: #1877f2;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.3;
    }

    .message-error {
      display: none;
      margin-top: 8px;
      color: #ff3b3b;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       PAYMENT STATUS
    ========================= */

    .payment-status {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #f5a8a8;
      border-radius: 10px;
      background: #fff0f0;
      color: #d92525;
      font-size: 16px;
      font-weight: bold;
    }

    .payment-status small {
      display: block;
      margin-top: 5px;
      color: #333;
      font-weight: normal;
    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 350px) {

      .package-grid {
        gap: 7px;
      }

      .package {
        min-height: 225px;
      }

      .minutes {
        font-size: 14px;
      }

      .price {
        font-size: 12px;
      }

      .paste-text {
        width: 105px;
        font-size: 12px;
      }
    }

  </style>
</head>


<body>

<div class="card">

  <h1>Buy Minutes</h1>

  <div class="subtitle">
    Choose a plan that works for you
  </div>


  <!-- =========================
       PACKAGES
  ========================= -->

  <div class="package-grid">


    <!-- 30 MINUTES -->

    <button
      class="package"
      data-amount="81"
      data-minutes="30">

      <span class="hot">
        🔥 HOT
      </span>

      <div class="camera-circle">
        📹
      </div>

      <span class="minutes">
        30 Mins
      </span>

      <div class="price">

        <div>
          KSh 81
        </div>

        <div>
          $0.62
        </div>

        <div>
          €0.57
        </div>

      </div>

    </button>


    <!-- 55 MINUTES -->

    <button
      class="package"
      data-amount="138"
      data-minutes="55">

      <div class="camera-circle">
        📹
      </div>

      <span class="minutes">
        55 Mins
      </span>

      <div class="price">

        <div>
          KSh 138
        </div>

        <div>
          $1.06
        </div>

        <div>
          €0.97
        </div>

      </div>

    </button>


    <!-- 73 MINUTES -->

    <button
      class="package"
      data-amount="207"
      data-minutes="73">

      <div class="camera-circle">
        📹
      </div>

      <span class="minutes">
        73 Mins
      </span>

      <div class="price">

        <div>
          KSh 207
        </div>

        <div>
          $1.59
        </div>

        <div>
          €1.45
        </div>

      </div>

    </button>


    <!-- 95 MINUTES -->

    <button
      class="package"
      data-amount="253"
      data-minutes="95">

      <div class="camera-circle">
        📹
      </div>

      <span class="minutes">
        95 Mins
      </span>

      <div class="price">

        <div>
          KSh 253
        </div>

        <div>
          $1.94
        </div>

        <div>
          €1.77
        </div>

      </div>

    </button>


    <!-- 105 MINUTES -->

    <button
      class="package"
      data-amount="299"
      data-minutes="105">

      <div class="camera-circle">
        📹
      </div>

      <span class="minutes">
        105 Mins
      </span>

      <div class="price">

        <div>
          KSh 299
        </div>

        <div>
          $2.29
        </div>

        <div>
          €2.09
        </div>

      </div>

    </button>

  </div>


  <!-- =========================
       PAYMENT SECTION
  ========================= -->

  <div
    class="payment-section"
    id="paymentSection">


    <!-- MPESA NUMBER -->

    <div class="till">

      send money:
      <strong>0795939598</strong>

    </div>


    <!-- SELECTED PACKAGE -->

    <div
      class="selected-info"
      id="selectedInfo">

      No package selected

    </div>


    <!-- PAYMENT BUTTON -->

    <button
      type="button"
      class="pay intaSendPayButton"
      id="payButton"
      data-currency="KES"
      data-method="M-PESA">

      Pay with M-PESA

    </button>


    <!-- =========================
         MESSAGE BOX
    ========================= -->

    <div
      class="message-area"
      id="messageArea">

      <div class="message-row">

        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="Paste M-PESA message here..."
          autocomplete="off">


        <div class="paste-text">

          Paste mpesa
          <br>

          message &amp; continue

        </div>

      </div>


      <div
        class="message-error"
        id="messageError">

        ❌ Message not accepted.

      </div>

    </div>


    <!-- =========================
         PAYMENT STATUS
    ========================= -->

    <div
      class="payment-status"
      id="paymentStatus">

      ❌ No payment is done

      <small>

        Please complete the M-PESA payment
        to continue.

      </small>

    </div>

  </div>

</div>



<script>

/* =========================
   ELEMENTS
========================= */

const packages =
  document.querySelectorAll(".package");

const paymentSection =
  document.getElementById("paymentSection");

const selectedInfo =
  document.getElementById("selectedInfo");

const payButton =
  document.getElementById("payButton");

const messageArea =
  document.getElementById("messageArea");

const messageInput =
  document.getElementById("messageInput");

const messageError =
  document.getElementById("messageError");

const paymentStatus =
  document.getElementById("paymentStatus");


/* =========================
   VARIABLES
========================= */

let selectedAmount = null;

let selectedMinutes = null;


/* =========================
   SELECT PACKAGE
========================= */

packages.forEach(function(button) {

  button.addEventListener(
    "click",
    function() {


      /* Remove previous selection */

      packages.forEach(function(item) {

        item.classList.remove(
          "selected"
        );

      });


      /* Select current package */

      this.classList.add(
        "selected"
      );


      /* Get package data */

      selectedAmount =
        this.dataset.amount;

      selectedMinutes =
        this.dataset.minutes;


      /* Display selection */

      selectedInfo.textContent =
        "Selected: KSh " +
        selectedAmount +
        " for " +
        selectedMinutes +
        " minutes";


      /* Set IntaSend amount */

      payButton.dataset.amount =
        selectedAmount;


      payButton.dataset.currency =
        "KES";


      payButton.dataset.method =
        "M-PESA";


      /* Unique reference */

      payButton.dataset.api_ref =
        "access-" +
        selectedMinutes +
        "min-" +
        Date.now();


      /* Show payment */

      paymentSection.style.display =
        "block";


      /* Reset payment messages */

      messageArea.style.display =
        "none";

      paymentStatus.style.display =
        "none";


      messageInput.value =
        "";

      messageInput.classList.remove(
        "rejected"
      );

      messageError.style.display =
        "none";

    }

  );

});


/* =========================
   PAY WITH MPESA
========================= */

payButton.addEventListener(
  "click",
  function() {


    if (!selectedAmount) {

      alert(
        "Please select a package first."
      );

      return;

    }


    paymentStatus.style.display =
      "block";

    messageArea.style.display =
      "block";

  }
);


/* =========================
   REJECT TYPED MESSAGE
========================= */

messageInput.addEventListener(
  "input",
  function() {


    if (
      this.value.trim().length > 0
    ) {

      this.classList.add(
        "rejected"
      );

      messageError.style.display =
        "block";

    }

    else {

      this.classList.remove(
        "rejected"
      );

      messageError.style.display =
        "none";

    }

  }
);


/* =========================
   INTASEND
========================= */

const intasend =
  new window.IntaSend({

    publicAPIKey:
      "ISPubKey_live_7b5c9f64-df56-449c-880b-dc2d83876cae",

    live: true

  });


/* =========================
   PAYMENT SUCCESS
========================= */

intasend.on(
  "COMPLETE",
  function(results) {


    console.log(
      "Payment successful:",
      results
    );


    paymentStatus.style.display =
      "none";


    alert(
      "Payment successful!"
    );


    window.location.href =
      "index.html";

  }
);


/* =========================
   PAYMENT FAILED
========================= */

intasend.on(
  "FAILED",
  function(results) {


    console.log(
      "Payment failed:",
      results
    );


    paymentStatus.style.display =
      "block";


    paymentStatus.innerHTML =

      "❌ No payment is done" +

      "<small>" +

      "Payment was not completed. " +
      "Please try again." +

      "</small>";

  }
);


/* =========================
   PAYMENT IN PROGRESS
========================= */

intasend.on(
  "IN-PROGRESS",
  function(results) {


    console.log(
      "Payment in progress:",
      results
    );


    paymentStatus.style.display =
      "block";


    paymentStatus.innerHTML =

      "⏳ Payment in progress..." +

      "<small>" +

      "Please complete the payment " +
      "on your phone." +

      "</small>";

  }
);

</script>

</body>
</html>
