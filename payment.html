<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<script src="https://unpkg.com/intasend-checkout-sdk"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#030414;
  color:white;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* NEON BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  background:#073cff;
  filter:blur(100px);
  opacity:.25;
  top:-80px;
  left:-80px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  background:#ff007f;
  filter:blur(110px);
  opacity:.18;
  right:-100px;
  bottom:-100px;
  z-index:-2;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:20px 14px 40px;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:28px;
  color:#fff;
  text-shadow:
    0 0 8px #00c8ff,
    0 0 20px #006eff;
}

.header p{
  margin:8px 0 0;
  color:#aeb8d8;
  font-size:14px;
}

/* PAYMENT CARD */
.payment-card{
  position:relative;
  background:rgba(8,12,40,.88);
  border:1px solid rgba(0,195,255,.45);
  border-radius:22px;
  padding:18px;
  box-shadow:
    0 0 20px rgba(0,150,255,.18),
    inset 0 0 25px rgba(0,100,255,.05);
}

/* TILL */
.till{
  margin:0 0 20px;
  padding:13px;
  border-radius:13px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.12);
  text-align:center;
  font-size:14px;
}

.till strong{
  color:#00e5ff;
  font-size:17px;
  margin-left:5px;
}

.copy-till{
  margin-left:8px;
  padding:7px 10px;
  border:0;
  border-radius:8px;
  background:#168cff;
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 10px rgba(22,140,255,.5);
}

.copy-till:active{
  transform:scale(.95);
}

/* PACKAGE GRID */
.packages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.package{
  position:relative;
  min-height:190px;
  border:1px solid rgba(0,208,255,.35);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(15,27,83,.96),
      rgba(5,7,28,.96)
    );
  color:white;
  padding:14px 8px;
  cursor:pointer;
  overflow:hidden;
  box-shadow:
    0 0 12px rgba(0,180,255,.08);
  transition:.2s;
}

.package:active{
  transform:scale(.97);
}

.package.selected{
  border:2px solid #00e5ff;
  box-shadow:
    0 0 12px #00bfff,
    0 0 30px rgba(0,180,255,.35);
}

.hot{
  position:absolute;
  top:8px;
  right:8px;
  background:#ff1744;
  color:white;
  font-size:10px;
  font-weight:bold;
  padding:5px 7px;
  border-radius:8px;
  box-shadow:0 0 12px rgba(255,23,68,.7);
}

.camera-circle{
  width:62px;
  height:62px;
  margin:12px auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #263db0,
      #080c35
    );
  border:2px solid #12c7ff;
  box-shadow:
    0 0 15px #08bfff,
    inset 0 0 18px rgba(0,200,255,.3);
  font-size:27px;
}

.minutes{
  display:block;
  font-size:17px;
  font-weight:bold;
  color:#fff;
  margin-bottom:9px;
}

.price{
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:center;
  font-size:13px;
  color:#dce8ff;
}

.price-row{
  display:flex;
  align-items:center;
  gap:5px;
}

.currency-icon{
  width:21px;
  height:21px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:bold;
}

.currency-icon.kes{
  background:#20c66b;
}

.currency-icon.usd{
  background:#277cff;
}

.currency-icon.eur{
  background:#ff9d21;
}
  /* PAYMENT CONTROLS */
.selected-info{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:12px;
  text-align:center;
  background:rgba(0,229,255,.08);
  border:1px solid rgba(0,229,255,.25);
  color:#dffaff;
  font-size:14px;
}

.pay{
  display:block;
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:
    linear-gradient(
      90deg,
      #00b7ff,
      #176cff
    );
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:
    0 0 15px rgba(0,174,255,.45);
}

.pay:active{
  transform:scale(.98);
}

/* MESSAGE AREA */
.message-area{
  display:none;
  margin-top:15px;
}

.message-title{
  margin-bottom:8px;
  font-size:13px;
  color:#b9c7e8;
}

.message-input{
  width:100%;
  min-height:100px;
  resize:none;
  border-radius:12px;
  border:1px solid rgba(0,200,255,.35);
  outline:none;
  background:#05081e;
  color:white;
  padding:13px;
  font-size:14px;
}

.message-input:focus{
  border-color:#00d9ff;
  box-shadow:0 0 12px rgba(0,200,255,.2);
}

.message-input.rejected{
  border-color:#ff3030;
}

.message-error{
  display:none;
  margin-top:8px;
  font-size:13px;
  text-align:center;
}

.payment-status{
  display:none;
  margin-top:15px;
  text-align:center;
  color:white;
  font-size:14px;
}

/* RESPONSIVE */
@media(max-width:360px){
  .packages{
    gap:8px;
  }

  .package{
    min-height:180px;
  }

  .minutes{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>💳 PAYMENT</h1>
    <p>Select your preferred minutes package</p>
  </div>

  <div class="payment-card">

    <div class="till">
      Send money:
      <strong id="tillNumber">0783783687</strong>

      <button
        type="button"
        class="copy-till"
        onclick="copyTillNumber()">
        📋 COPY
      </button>
    </div>

    <div class="packages">

      <button
        class="package"
        data-amount="81"
        data-minutes="30">

        <div class="camera-circle">🎥</div>

        <span class="minutes">30 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 81
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $0.62
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €0.57
          </div>
        </div>
      </button>


      <button
        class="package"
        data-amount="138"
        data-minutes="55">

        <div class="camera-circle">🎥</div>

        <span class="minutes">55 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 138
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $1.06
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €0.97
          </div>
        </div>
      </button>


      <button
        class="package"
        data-amount="207"
        data-minutes="73">

        <div class="camera-circle">🎥</div>

        <span class="minutes">73 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 207
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $1.59
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €1.45
          </div>
        </div>
      </button>


      <button
        class="package"
        data-amount="253"
        data-minutes="95">

        <div class="camera-circle">🎥</div>

        <span class="minutes">95 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 253
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $1.95
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €1.77
          </div>
        </div>
      </button>


      <button
        class="package"
        data-amount="299"
        data-minutes="105">

        <div class="camera-circle">🎥</div>

        <span class="minutes">105 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 299
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $2.30
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €2.09
          </div>
        </div>
      </button>


      <!-- FINAL PACKAGE -->
      <button
        class="package"
        data-amount="393"
        data-minutes="166">

        <span class="hot">🔥 HOT</span>

        <div class="camera-circle">🎥</div>

        <span class="minutes">166 Mins</span>

        <div class="price">
          <div class="price-row">
            <span class="currency-icon kes">KSh</span>
            KSh 393
          </div>

          <div class="price-row">
            <span class="currency-icon usd">$</span>
            $3.02
          </div>

          <div class="price-row">
            <span class="currency-icon eur">€</span>
            €2.75
          </div>
        </div>
      </button>

    </div>
        <div
      class="selected-info"
      id="selectedInfo">
    </div>

    <button
      class="pay"
      id="payButton">
      💚 PAY WITH M-PESA
    </button>

    <div
      class="message-area"
      id="messageArea">

      <div class="message-title">
        Paste your M-PESA message below:
      </div>

      <textarea
        class="message-input"
        id="messageInput"
        placeholder="paste mpesa message & continue">
      </textarea>

      <div
        class="message-error"
        id="messageError">
      </div>

    </div>

    <div
      class="payment-status"
      id="paymentStatus">
      No payment is done
    </div>

  </div>
</div>

<script>

let selectedPackage = null;
let messageTimer = null;


/* COPY TILL */
function copyTillNumber(){

  const till =
    document
      .getElementById("tillNumber")
      .textContent
      .trim();

  navigator.clipboard
    .writeText(till)

    .then(function(){

      const button =
        document.querySelector(".copy-till");

      button.textContent = "✓ COPIED";

      setTimeout(function(){

        button.textContent = "📋 COPY";

      },2000);

    })

    .catch(function(){

      alert(
        "Please copy the Till number manually: " +
        till
      );

    });
}


/* PACKAGE SELECTION */
const packages =
  document.querySelectorAll(".package");

const selectedInfo =
  document.getElementById("selectedInfo");

const payButton =
  document.getElementById("payButton");

const messageArea =
  document.getElementById("messageArea");

const messageInput =
  document.getElementById("messageInput");

const messageError =
  document.getElementById("messageError");

const paymentStatus =
  document.getElementById("paymentStatus");


packages.forEach(function(packageButton){

  packageButton.addEventListener(
    "click",
    function(){

      packages.forEach(function(item){
        item.classList.remove("selected");
      });

      this.classList.add("selected");

      selectedPackage = {
        amount:this.dataset.amount,
        minutes:this.dataset.minutes
      };

      selectedInfo.style.display = "block";

      selectedInfo.textContent =
        selectedPackage.minutes +
        " Minutes — KSh " +
        selectedPackage.amount;

      messageArea.style.display = "none";

      paymentStatus.style.display = "none";

      messageInput.value = "";

      messageError.style.display = "none";

      messageError.textContent = "";

      messageInput.classList.remove(
        "rejected"
      );

      if(messageTimer){

        clearTimeout(messageTimer);

        messageTimer = null;

      }

    }
  );

});


/* PAY BUTTON */
payButton.addEventListener(
  "click",
  function(){

    if(!selectedPackage){

      alert(
        "Please select a package first."
      );

      return;
    }

    messageArea.style.display = "block";

    paymentStatus.style.display = "none";

    messageInput.focus();

  }
);


/* M-PESA MESSAGE */
messageInput.addEventListener(
  "input",
  function(){

    const message =
      this.value.trim();

    if(!message){

      if(messageTimer){

        clearTimeout(messageTimer);

        messageTimer = null;

      }

      messageError.style.display = "none";

      messageError.textContent = "";

      this.classList.remove(
        "rejected"
      );

      return;
    }


    this.classList.remove(
      "rejected"
    );

    messageError.style.display =
      "block";

    messageError.style.color =
      "white";

    messageError.textContent =
      "Loading...";


    if(messageTimer){

      clearTimeout(messageTimer);

    }


    messageTimer =
      setTimeout(function(){

        messageError.style.display =
          "block";

        messageError.style.color =
          "#ff4747";

        messageError.textContent =
          "Incorrect message";

        messageInput.classList.add(
          "rejected"
        );

        messageTimer = null;

      },10000);

  }
);

  </script>
  <script>

/*
  INTASEND
  Keep this section if your
  existing IntaSend setup is
  configured.
*/

try{

  if(
    typeof window.IntaSend !==
    "undefined"
  ){

    const intasend =
      new window.IntaSend({
        publicAPIKey:
          "",
        live:false
      });

    intasend.on(
      "COMPLETE",
      function(response){

        paymentStatus.style.display =
          "block";

        paymentStatus.textContent =
          "Payment received";

      }
    );

    intasend.on(
      "FAILED",
      function(response){

        paymentStatus.style.display =
          "block";

        paymentStatus.textContent =
          "No payment is done";

      }
    );

    intasend.on(
      "IN-PROGRESS",
      function(response){

        paymentStatus.style.display =
          "block";

        paymentStatus.textContent =
          "Payment in progress";

      }
    );

  }

}catch(error){

  console.log(
    "IntaSend not configured."
  );

}

</script>

</body>
</html>
