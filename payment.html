<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PESA PAYMENT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}

h1{
  text-align:center;
  font-size:24px;
  margin:10px 0 18px;
}

.packages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.package{
  background:#171717;
  border:1px solid #333;
  border-radius:12px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
}

.package.selected{
  border:2px solid #00ff66;
  background:#102015;
}

.package .minutes{

}

.package .price{
  margin-top:8px;

  font-weight:bold;
}

.hot{
  display:inline-block;
  background:red;
  color:white;
  font-size:11px;
  padding:4px 7px;

}

.paymentBox{
  background:#151515;
  border-radius:14px;
  padding:18px;
  margin-top:18px;
}

.paymentBox h2{
  text-align:center;
  margin-top:0;
  font-size:19px;
}

input{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:1px solid #444;
  background:#080808;
  color:white;
  font-size:16px;
  margin-top:10px;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:14px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.mpesaBtn{
  background:#00c853;
  color:white;
}

.status{
  text-align:center;
  margin-top:12px;
  min-height:20px;
  color:#ddd;
}

.hidden{
  display:none!important;
}

/* LIVE STYLE PAGE */

#livePage{
  min-height:100vh;
  background:#000;
  padding-bottom:20px;
}

.liveHeader{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:#111;
}

.liveTitle{
  font-weight:bold;
}

.liveBadge{
  background:red;
  color:white;
  border-radius:6px;
  padding:5px 9px;
  font-size:13px;
  font-weight:bold;
}

.videoBox{
  width:100%;
  background:#000;
  position:relative;
  overflow:hidden;
}

#liveVideo{
  width:100%;
  height:auto;
  max-height:70vh;
  display:block;
  object-fit:contain;
  background:#000;
}

.videoTime{
  position:absolute;
  bottom:8px;
  right:10px;
  background:rgba(0,0,0,.7);
  padding:5px 8px;
  border-radius:5px;
  font-size:13px;
}

/* CHAT */

.chatBox{
  background:#111;
  margin-top:0;
  padding:10px;
}

.chatTitle{
  font-weight:bold;
  font-size:16px;
  padding:5px 2px 10px;
  border-bottom:1px solid #292929;
}

.comments{
  height:230px;
  overflow:hidden;
  position:relative;
}

.comment{
  display:flex;
  gap:9px;
  padding:9px 3px;
  border-bottom:1px solid #202020;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:15px;
}

.commentText{
  font-size:14px;
  line-height:1.35;
}

.commentName{
  color:#00e676;
  font-weight:bold;
  margin-right:5px;
}

.commentTime{
  color:#777;
  font-size:11px;
}

.commentInput{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.commentInput input{
  margin:0;
  flex:1;
}

.commentInput button{
  width:auto;
  margin:0;
  padding:10px 14px;
  background:#00c853;
  color:white;
}

/* INSUFFICIENT */

#insufficientPage{
  min-height:100vh;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.insufficientBox{
  width:100%;
  max-width:380px;
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:30px 20px;
}

.insufficientBox h2{
  color:#ff3030;
  font-size:24px;
  margin:0 0 10px;
}

.insufficientBox p{
  color:#ccc;
}

.timer{
  font-size:28px;
  font-weight:bold;
  color:white;
}
</style>
</head>

<body>

<!-- PACKAGES PAGE -->

<div id="packagesPage">
  <div class="container">

    <h1>M-PESA PAYMENT</h1>

    <div class="packages">

      <div class="package" data-minutes="30" data-price="90">
        <div class="minutes">30 MIN</div>
        <div class="price">KSh 90</div>
      </div>

      <div class="package" data-minutes="55" data-price="138">
        <div class="minutes">55 MIN</div>
        <div class="price">KSh 138</div>
      </div>

      <div class="package" data-minutes="73" data-price="207">
        <div class="minutes">73 MIN</div>
        <div class="price">KSh 207</div>
      </div>

      <div class="package" data-minutes="95" data-price="253">
        <div class="minutes">95 MIN</div>
        <div class="price">KSh 253</div>
      </div>

      <div class="package" data-minutes="105" data-price="299">
        <div class="minutes">105 MIN</div>
        <div class="price">KSh 299</div>
      </div>

      <div class="package" data-minutes="166" data-price="393">
        <span class="hot">HOT</span>
        <div class="minutes">166 MIN</div>
        <div class="price">KSh 393</div>
      </div>

    </div>

    <div class="paymentBox">

      <h2>PAY WITH M-PESA</h2>

      <input
        id="customerPhone"
        type="tel"
        inputmode="numeric"
        placeholder="Enter M-PESA phone number"
      >

      <button class="mpesaBtn" onclick="payWithMpesa()">
        PAY WITH M-PESA
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>
</div>


<!-- LIVE PAGE -->

<div id="livePage" class="hidden">

  <div class="liveHeader">
    <div class="liveTitle">LIVE</div>
    <div class="liveBadge">● LIVE</div>
  </div>

  <div class="videoBox">

    <video
      id="liveVideo"
      playsinline
      preload="auto"
    >
      <source src="./preview_20_seconds.mp4" type="video/mp4">
    </video>

    <div class="videoTime" id="videoTime">
      00:00 / 00:20
    </div>

  </div>

  <div class="chatBox">

    <div class="chatTitle">
      Live chat
    </div>

    <div id="comments" class="comments"></div>

    <div class="commentInput">
      <input
        id="commentInput"
        type="text"
        placeholder="Write a comment..."
      >
      <button onclick="sendComment()">SEND</button>
    </div>

  </div>

</div>


<!-- INSUFFICIENT PAGE -->

<div id="insufficientPage" class="hidden">

  <div class="insufficientBox">

    <h2>INSUFFICIENT MINUTES</h2>

    <p>Your minutes have ended.</p>

    <div class="timer" id="insufficientTimer">
      2
    </div>

  </div>

</div>


<script>

/* =========================
   PAYMENT / REFERRAL DATA
========================= */

const TILL_NUMBER = "1605854";

let selectedMinutes = 30;
let selectedPrice = 90;

let paymentChecking = false;

const params = new URLSearchParams(window.location.search);

const employeeFromUrl =
  params.get("employee") ||
  params.get("ref") ||
  "";

if(employeeFromUrl){
  localStorage.setItem(
    "referralEmployeeId",
    employeeFromUrl
  );
}

const employeeId =
  employeeFromUrl ||
  localStorage.getItem("referralEmployeeId") ||
  "";


/* =========================
   PACKAGE SELECTION
========================= */

const packages =
  document.querySelectorAll(".package");

packages.forEach(pkg => {

  pkg.addEventListener("click", function(){

    packages.forEach(p =>
      p.classList.remove("selected")
    );

    this.classList.add("selected");

    selectedMinutes =
      Number(this.dataset.minutes);

    selectedPrice =
      Number(this.dataset.price);

  });

});


/* Select first package */

if(packages.length > 0){
  packages[0].classList.add("selected");
}


/* =========================
   PHONE NORMALIZATION
========================= */

function normalizePhone(phone){

  phone = phone.replace(/\s+/g,"").trim();

  if(phone.startsWith("+254")){
    return "254" + phone.substring(4);
  }

  if(phone.startsWith("254")){
    return phone;
  }

  if(phone.startsWith("0")){
    return "254" + phone.substring(1);
  }

  return phone;
}


/* =========================
   M-PESA PAYMENT
========================= */

async function payWithMpesa(){

  if(paymentChecking){
    return;
  }

  const phoneInput =
    document.getElementById("customerPhone");

  const status =
    document.getElementById("status");

  const phone =
    normalizePhone(phoneInput.value);

  if(!phone || phone.length < 12){

    status.textContent =
      "Enter a valid M-PESA number.";

    return;
  }

  paymentChecking = true;

  status.textContent =
    "Sending M-PESA prompt...";

  try{

    const response =
      await fetch("/api/stk-push",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          phone:phone,

          amount:selectedPrice,

          reference:
            employeeId
              ? employeeId + "-" + selectedMinutes
              : "PAYMENT-" + selectedMinutes

        })

      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        "Payment request failed"
      );

    }

    status.textContent =
      "Check your phone and enter your M-PESA PIN.";

    const checkoutRequestID =
      data.checkoutRequestID ||
      data.CheckoutRequestID ||
      data.checkout_request_id ||
      data.id ||
      "";

    if(!checkoutRequestID){

      paymentChecking = false;

      status.textContent =
        "Payment request sent. Waiting for confirmation...";

      return;
    }

    checkPayment(checkoutRequestID);

  }catch(error){

    console.error(error);

    status.textContent =
      error.message ||
      "Unable to start payment.";

    paymentChecking = false;

  }

}


/* =========================
   PAYMENT STATUS
========================= */

async function checkPayment(checkoutRequestID){

  let attempts = 0;

  const maxAttempts = 20;

  const timer =
    setInterval(async function(){

      attempts++;

      try{

        const response =
          await fetch(
            "/api/payment-status?checkoutRequestID=" +
            encodeURIComponent(checkoutRequestID)
          );

        const data =
          await response.json();

        if(
          data.paid === true &&
          data.status === "Completed"
        ){

          clearInterval(timer);

          paymentChecking = false;

          recordPayment(
            data,
            employeeId
          );

          showLive();

          return;
        }

        if(
          data.status === "Failed" ||
          data.status === "Cancelled"
        ){

          clearInterval(timer);

          paymentChecking = false;

          document.getElementById("status")
            .textContent =
            "No payment is done.";

          return;
        }

        document.getElementById("status")
          .textContent =
          "Checking payment...";

        if(attempts >= maxAttempts){

          clearInterval(timer);

          paymentChecking = false;

          document.getElementById("status")
            .textContent =
            "No payment is done.";

        }

      }catch(error){

        console.error(error);

        if(attempts >= maxAttempts){

          clearInterval(timer);

          paymentChecking = false;

          document.getElementById("status")
            .textContent =
            "No payment is done.";

        }

      }

    },3000);

}


/* =========================
   RECORD 25% COMMISSION
========================= */

function recordPayment(data,id){

  if(!id){
    return;
  }

  const amount =
    Number(
      data.amount ||
      selectedPrice ||
      0
    );

  const commission =
    amount * 0.25;

  const key =
    "employeePayments_" + id;

  let payments = [];

  try{

    payments =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

  }catch(e){

    payments = [];

  }

  payments.push({

    amount:amount,

    commission:commission,

    minutes:selectedMinutes,

    date:new Date().toISOString(),

    transaction:
      data.receipt ||
      data.MpesaReceiptNumber ||
      data.receiptNumber ||
      ""

  });

  localStorage.setItem(
    key,
    JSON.stringify(payments)
  );

}


/* =========================
   LIVE PAGE
========================= */

function showLive(){

  document
    .getElementById("packagesPage")
    .classList.add("hidden");

  document
    .getElementById("insufficientPage")
    .classList.add("hidden");

  document
    .getElementById("livePage")
    .classList.remove("hidden");

  startLive();

}


/* =========================
   COMMENTS
========================= */

const commentData = [

  ["Grace","Hello ❤️"],
  ["Mimi","Wow 😍"],
  ["Sharon","Hi everyone"],
  ["Asha","This is nice"],
  ["Nadia","Hello dear"],
  ["Bella","❤️❤️❤️"],
  ["Neema","I am here"],
  ["Jessica","Wow"],

  ["Sophie","Hello everyone"],
  ["Zawadi","So nice"],
  ["Emily","Hi"],
  ["Peace","❤️"],
  ["Joy","Wow wow"],
  ["Favour","Hello"],
  ["Blessing","I love this"],
  ["Princess","Hi dear"],
  ["Thandi","Hello ❤️"],
  ["Lerato","Nice live"],
  ["Dorry","Hey everyone"],
  ["Becky","😍😍😍"],
  ["Sarah","Hello"],
  ["Mary","Wow ❤️"],
  ["Lucy","Hi"],
  ["Ann","Beautiful"],
  ["Mercy","Hello there"],
  ["Faith","❤️❤️"],
  ["Esther","Hi everyone"],
  ["Janet","Wow"],
  ["Ruth","Hello"],
  ["Cynthia","😍"],
  ["Nancy","Nice"],
  ["Vicky","Hey"],
  ["Diana","Hello ❤️"],
  ["Irene","Wow"],
  ["Stacy","Hi"],
  ["Monica","❤️"],
  ["Caroline","Hello"],
  ["Wendy","Nice live"],
  ["Rachel","😍😍"],
  ["Linda","Hello dear"],
  ["Betty","Wow"],
  ["Naomi","❤️❤️❤️"],
  ["Susan","Hi everyone"],
  ["Angela","Amazing"],
  ["Rebecca","Hello"],
  ["Alice","Wow 😍"]
];


function addComment(name,message){

  const comments =
    document.getElementById("comments");

  const div =
    document.createElement("div");

  div.className = "comment";

  const firstLetter =
    name.charAt(0).toUpperCase();

  div.innerHTML = `

    <div class="avatar">
      ${firstLetter}
    </div>

    <div class="commentText">

      <span class="commentName">
        ${escapeHTML(name)}
      </span>

      <span class="commentTime">
        now
      </span>

      <br>

      ${escapeHTML(message)}

    </div>

  `;

  comments.appendChild(div);

  while(comments.children.length > 9){
    comments.removeChild(
      comments.firstChild
    );
  }

  comments.scrollTop =
    comments.scrollHeight;

}


function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function startComments(){

  const comments =
    document.getElementById("comments");

  comments.innerHTML = "";

  commentData
    .slice(0,9)
    .forEach(item => {

      addComment(
        item[0],
        item[1]
      );

    });

  let index = 9;

  setInterval(function(){

    if(index >= commentData.length){
      index = 0;
    }

    addComment(
      commentData[index][0],
      commentData[index][1]
    );

    index++;

  },900);

}


function sendComment(){

  const input =
    document.getElementById("commentInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addComment(
    "You",
    text
  );

  input.value = "";

}


/* Allow Enter to send comment */

document
  .getElementById("commentInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        sendComment();
      }

    }
  );


/* =========================
   VIDEO — NORMAL 1 → 20
========================= */

function startLive(){

  const video =
    document.getElementById("liveVideo");

  const time =
    document.getElementById("videoTime");

  /*
    IMPORTANT:
    Video now starts from the
    beginning and plays normally.
    No reverse playback.
  */

  video.pause();

  video.currentTime = 0;

  startComments();

  video.muted = false;

  video.volume = 1;

  video.play()
    .catch(function(error){

      console.log(
        "Autoplay blocked:",
        error
      );

      /*
        If browser blocks sound,
        try again after user interaction.
      */

    });

  function updateTime(){

    const current =
      Math.floor(video.currentTime);

    const duration =
      Math.min(
        20,
        Math.floor(video.duration || 20)
      );

    time.textContent =
      formatTime(current) +
      " / " +
      formatTime(duration);

  }

  video.addEventListener(
    "timeupdate",
    updateTime
  );

  video.addEventListener(
    "ended",
    finishLive
  );

  /*
    Safety limit:
    Stop exactly at 20 seconds.
  */

  video.addEventListener(
    "timeupdate",
    function(){

      if(video.currentTime >= 20){

        video.pause();

        finishLive();

      }

    }
  );

}


function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );

}


/* =========================
   AFTER VIDEO
========================= */

let liveFinished = false;

function finishLive(){

  if(liveFinished){
    return;
  }

  liveFinished = true;

  const video =
    document.getElementById("liveVideo");

  video.pause();

  showInsufficient();

}


/* =========================
   INSUFFICIENT MINUTES
========================= */

function showInsufficient(){

  document
    .getElementById("livePage")
    .classList.add("hidden");

  document
    .getElementById("insufficientPage")
    .classList.remove("hidden");

  let seconds = 2;

  const timer =
    document.getElementById(
      "insufficientTimer"
    );

  timer.textContent = seconds;

  const countdown =
    setInterval(function(){

      seconds--;

      timer.textContent =
        seconds;

      if(seconds <= 0){

        clearInterval(countdown);

        backToPackages();

      }

    },1000);

}


/* =========================
   BACK TO PACKAGES
========================= */

function backToPackages(){

  liveFinished = false;

  const video =
    document.getElementById("liveVideo");

  video.pause();

  video.currentTime = 0;

  document
    .getElementById("insufficientPage")
    .classList.add("hidden");

  document
    .getElementById("livePage")
    .classList.add("hidden");

  document
    .getElementById("packagesPage")
    .classList.remove("hidden");

  document
    .getElementById("status")
    .textContent = "";

}

</script>

 </html>
