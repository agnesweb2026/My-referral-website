/* ==========================================

========================================== */

function readStorage(key, fallback) {

  try {

    const value =
      localStorage.getItem(key);

    if (!value) {
      return fallback;
    }

    return JSON.parse(value);

  } catch (error) {

    console.warn(
      "Storage read failed:",
      key,
      error
    );

    return fallback;

  }

}


function writeStorage(key, value) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  } catch (error) {

    console.warn(
      "Storage write failed:",
      key,
      error
    );

  }

}


/* ==========================================
   RANDOM NUMBER
========================================== */

function randomNumber(min, max) {

  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;

}


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

  const result =
    array.slice();

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* ==========================================

/* ==========================================
   STOP VIDEO
========================================== */

function stopSampleVideo() {

  if (!sampleVideo) {
    return;
  }

  try {

    sampleVideo.pause();

    sampleVideo.currentTime = 0;

    sampleVideo.muted = true;

  } catch (error) {

    console.warn(
      "Could not reset video:",
      error
    );

  }

}


/* ==========================================
   RESET VIDEO
========================================== */

function resetSampleVideo() {

  if (!sampleVideo) {
    return;
  }

  try {

    sampleVideo.pause();

    sampleVideo.currentTime = 0;

    sampleVideo.src =
      SAMPLE_VIDEO_URL;

    sampleVideo.load();

    /*
      Do not use the invalid HTML
      "sound" attribute.
    */

    sampleVideo.muted = false;

    sampleVideo.volume = 1;

  } catch (error) {

    console.warn(
      "Video reset error:",
      error
    );

  }

}


/* ==========================================
   UPDATE SAMPLE TIMER
========================================== */

function updateSampleTimer() {

  if (!sampleTimer) {
    return;
  }

  /*
    Timer remains hidden visually.
    We still update it internally.
  */

  sampleTimer.textContent =
    "Sample: " +
    secondsLeft +
    " seconds";

}


/* ==========================================
   START SAMPLE
========================================== */

function startSample() {

  if (sampleRunning) {
    return;
  }

  clearAllTimers();

  sampleRunning = true;

  secondsLeft =
    SAMPLE_DURATION;

  updateSampleTimer();

  showSamplePage();

  resetSampleVideo();

  /*
    The video starts after the user has
    pressed Answer, so sound is allowed
    by most mobile browsers.
  */

  sampleVideo.muted = false;

  sampleVideo.volume = 1;

  const playPromise =
    sampleVideo.play();

  if (
    playPromise &&
    typeof playPromise.catch ===
      "function"
  ) {

    playPromise.catch(
      function(error) {

        console.warn(
          "Video autoplay/play error:",
          error
        );

        /*
          If playback is blocked or the
          video file cannot be played,
          don't leave the visitor stuck.
        */

        setTimeout(
          function() {

            if (sampleRunning) {

              finishSample();

            }

          },
          1000
        );

      }
    );

  }


  sampleTimerInterval =
    setInterval(
      function() {

        if (!sampleRunning) {
          return;
        }

        secondsLeft--;

        updateSampleTimer();

        if (
          secondsLeft <= 0
        ) {

          finishSample();

        }

      },
      1000
    );

}


/* ==========================================
   FINISH SAMPLE
========================================== */

function finishSample() {

  if (!sampleRunning) {
    return;
  }

  sampleRunning = false;

  if (sampleTimerInterval) {

    clearInterval(
      sampleTimerInterval
    );

    sampleTimerInterval = null;

  }

  stopSampleVideo();

  /*
    Remember that the visitor has
    completed the sample.
  */

  try {

    localStorage.setItem(
      FLOW_STORAGE_KEY,
      "sample-completed"
    );

  } catch (error) {

    console.warn(
      "Could not save sample state:",
      error
    );

  }

  /*
    Insufficient page first.
  */

  insufficientThen(
    function() {

      /*
        Then show the next call.
      */

      showSecondIncomingCall();

    }
  );

}


/* ==========================================
   INSUFFICIENT THEN CALLBACK
========================================== */

function insufficientThen(callback) {

  clearTimeout(
    insufficientTimer
  );

  showInsufficientPage();

  insufficientTimer =
    setTimeout(
      function() {

        insufficientTimer =
          null;

        if (
          typeof callback ===
          "function"
        ) {

          callback();

        }

      },
      INSUFFICIENT_DURATION
    );

}

/* ==========================================
   LOAD PHOTOS FROM GITHUB
========================================== */

async function loadPhotos() {

  if (photosLoaded) {

    refreshPhotoClicks();

    return availablePhotos;

  }

  /*
    Show loading state without blocking
    the rest of the website flow.
  */

  livePhotos.innerHTML =
    '<div class="loading">Loading live profiles...</div>';

  let githubFiles = [];

  try {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        function() {

          controller.abort();

        },
        7000
      );

    const response =
      await fetch(
        GITHUB_API_URL,
        {
          method: "GET",
          cache: "no-store",
          signal: controller.signal,
          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );

    clearTimeout(timeout);

    if (!response.ok) {

      throw new Error(
        "GitHub returned HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {

      throw new Error(
        "Invalid GitHub response"
      );

    }

    githubFiles =
      data.filter(
        function(file) {

          if (
            !file ||
            file.type !== "file"
          ) {

            return false;

          }

          const lower =
            String(
              file.name || ""
            ).toLowerCase();

          return (
            lower.endsWith(".jpg") ||
            lower.endsWith(".jpeg") ||
            lower.endsWith(".png") ||
            lower.endsWith(".webp")
          );

        }
      );

  } catch (error) {

    console.warn(
      "GitHub image loading failed:",
      error
    );

  }


  /*
    If GitHub API is unavailable,
    use known local/raw image names.
    This prevents the page from getting
    stuck on the first screen.
  */

  if (
    githubFiles.length === 0
  ) {

    githubFiles =
      LOCAL_IMAGE_NAMES.map(
        function(name) {

          return {
            name: name,
            download_url:
              getImageUrl(name)
          };

        }
      );

  }


  availablePhotos =
    githubFiles.slice(
      0,
      Math.max(
        PROFILE_DATA.length,
        1
      )
    );


  photosLoaded =
    true;


  renderPhotos();

  photosReady =
    true;

  preloadPhotos();

  refreshPhotoClicks();

  return availablePhotos;

}

/* ==========================================

========================================== */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

          }

function toggleLike(index) {

  const counts =
    getLikeData();

  const states =
    readStorage(
      LIKE_STORAGE_KEY + "_state",
      {}
    );

  if (
    states[index]
  ) {

      );

    counts[index] =
      getLikeCount(index) + 1;

    LIKE_STORAGE_KEY,
    counts
  );

  writeStorage(
    LIKE_STORAGE_KEY + "_state",
    states
  );

/* ==========================================
   FORMAT COUNTS
========================================== */

function formatCount(number) {

  const value =
    Number(number) || 0;

  if (
    value >= 1000000
  ) {

    return (
      (value / 1000000)
        .toFixed(1)
        .replace(
          ".0",
          ""
        ) +
      "M"
    );

  }

  if (
    value >= 1000
  ) {

    return (
      (value / 1000)
        .toFixed(1)
        .replace(
          ".0",
          ""
        ) +
      "K"
    );

  }

  return String(value);

}

function attachPhotoClickEvents() {

  const cards =
    document.querySelectorAll(
      ".live-photo"
    );

  cards.forEach(
    function(card) {

      if (
        card.dataset.eventsAttached ===
        "true"
      ) {

        return;

        "true";


      card.addEventListener(
        "click",
        function(event) {

          const action =
            event.target.closest(
              "[data-action]"
            );

          /*
            Social buttons NEVER open payment.
          */

          if (action) {

            event.preventDefault();

            event.stopPropagation();

            handleSocialAction(
              action
            );

            return;

          }


          /*
            Only the profile itself
            opens payment.
          */

          const index =
            Number(
              card.dataset.index
            );

          handlePhotoClick(
            index
          );

        }
      );

    }
  );

}


/* ==========================================
   SOCIAL ACTION HANDLER
========================================== */

function handleSocialAction(
  button
) {

  const action =
    button.dataset.action;

  const index =
    Number(
      button.dataset.index
    );


  if (
    !Number.isInteger(index)
  ) {

    return;

  }


  if (
    action === "like"
  ) {

    toggleLike(index);

  }


  if (
    action === "love"
  ) {

    toggleLove(index);

  }


  if (
    action === "follow"
  ) {

    toggleFollow(index);

  }


  if (
    action === "chat"
  ) {

    openChat(index);

    return;

  }


  refreshPhotoClicks();

}

/* ==========================================

========================================== */

function openPaymentPageSafely(
  profileIndex
) {

  try {

    const url =
      new URL(
        PAYMENT_PAGE_URL,
        window.location.href
      );


    const currentParams =
      new URLSearchParams(
        window.location.search
      );


    const referral =
      currentParams.get("employee") ||
      currentParams.get("ref") ||
      "";


    if (referral) {

      url.searchParams.set(
        "ref",
        referral
      );

      url.searchParams.set(
        "employee",
        referral
      );

    }


    if (
      Number.isInteger(
        profileIndex
      ) &&
      PROFILE_DATA[profileIndex]
    ) {

      const profile =
        PROFILE_DATA[
          profileIndex
        ];

      const photo =
        availablePhotos[
          profileIndex %
          Math.max(
            availablePhotos.length,
            1
          )
        ];


      url.searchParams.set(
        "profile",
        profile.name
      );

      url.searchParams.set(
        "age",
        String(profile.age)
      );

      url.searchParams.set(
        "country",
        profile.country
      );


      if (photo) {

        url.searchParams.set(
          "image",
          photo.name || ""
        );

      }

    }


    window.location.href =
      url.toString();

  } catch (error) {

    console.error(
      "Payment navigation error:",
      error
    );

    /*
      Absolute fallback.
      Payment remains a separate page.
    */

    window.location.href =
      PAYMENT_PAGE_URL;

  }

}

  chatList.innerHTML =
    "";


  comments
    .slice(-15)
    .forEach(
      function(comment) {

        const bubble =
          document.createElement(
            "div"
          );

        bubble.className =
          "chat-bubble";

        bubble.innerHTML =
          "<strong>" +
          escapeHtml(
            comment.user
          ) +
          "</strong><br>" +
          escapeHtml(
            comment.text
          );

        chatList.appendChild(
          bubble
        );

      }
    );


  chatList.scrollTop =
    chatList.scrollHeight;

}


/* ==========================================
   INDIVIDUAL COMMENT ROTATION
========================================== */

function stopProfileChatRotation() {

  commentTimers.forEach(
    function(timer) {

      clearTimeout(
        timer
      );

    }
  );

  commentTimers = [];

}


function startProfileChatRotation() {

  stopProfileChatRotation();


  PROFILE_DATA.forEach(
    function(profile, index) {

      scheduleNextComment(
        index
      );

    }
  );

}


function scheduleNextComment(
  index
) {

  const delay =
    randomNumber(
      2500,
      8500
    );


  const timer =
    setTimeout(
      function() {

        addGeneratedComment(
          index
        );

        scheduleNextComment(
          index
        );

      },
      delay
    );


  commentTimers.push(
    timer
  );

}


/* ==========================================
   GENERATED COMMENT
========================================== */

function addGeneratedComment(
  index
) {

  const user =
    COMMENT_USERS[
      randomNumber(
        0,
        COMMENT_USERS.length - 1
      )
    ];


  const text =
    COMMENT_MESSAGES[
      randomNumber(
        0,
        COMMENT_MESSAGES.length - 1
      )
    ];


  const data =
    getCommentsData();


  if (
    !Array.isArray(
      data[index]
    )
  ) {

    data[index] = [];

  }


  data[index].push({

    user: user,

    text: text,

    time: Date.now()

  });


  if (
    data[index].length > 30
  ) {

    data[index] =
      data[index].slice(-30);

  }


  saveCommentsData(
    data
  );


  /*
    Update only this profile's
    preview. Other profiles do
    not move together.
  */

  updateCommentPreview(
    index
  );


  /*
    If this profile's chat is
    currently open, update it too.
  */

  if (
    currentChatProfileIndex ===
    index
  ) {

    renderChatMessages(
      index
    );

  }

}


/* ==========================================
   COMMENT PREVIEW
========================================== */

function updateCommentPreview(
  index
) {

  const preview =
    document.querySelector(
      '[data-preview-index="' +
      index +
      '"]'
    );


  if (!preview) {
    return;
  }


  const comments =
    getProfileComments(
      index
    );


  const last =
    comments[
      comments.length - 1
    ];


  if (!last) {
    return;
  }


  const text =
    preview.querySelector(
      ".preview-text"
    );


  if (text) {

    text.textContent =
      last.text;

  }

      }

/* ==========================================
   OFFLINE PROFILES
========================================== */

function updateOfflineProfiles() {

  const indexes =
    PROFILE_DATA.map(
      function(_, index) {
        return index;
      }
    );


  offlineIndexes =
    shuffle(
      indexes
    ).slice(
      0,
      Math.min(
        5,
        PROFILE_DATA.length
      )
    );


  updateProfileStatuses();

}


function updateProfileStatuses() {

  const cards =
    document.querySelectorAll(
      ".live-photo"
    );


  cards.forEach(
    function(card) {

      const index =
        Number(
          card.dataset.index
        );

      const offline =
        offlineIndexes.includes(
          index
        );


      const status =
        card.querySelector(
          ".live-status"
        );

      const dot =
        card.querySelector(
          ".live-dot"
        );


      if (status) {

        const text =
          status.querySelector(
            "span:last-child"
          );

        if (text) {

          text.textContent =
            offline
              ? "Offline"
              : "Live now";

        }

      }


      if (dot) {

        dot.classList.toggle(
          "offline",
          offline
        );

      }

    }
  );

}


/* ==========================================
   START OFFLINE ROTATION
========================================== */

function startOfflineRotation() {

  clearInterval(
    offlineTimer
  );


  /*
    Exactly five random profiles
    are selected initially.
  */

  updateOfflineProfiles();


  /*
    Change them every five minutes.
  */

  offlineTimer =
    setInterval(
      function() {

        updateOfflineProfiles();

      },
      300000
    );

}


/* ==========================================
   NEXT INCOMING PHOTO
========================================== */

function getNextIncomingPhoto() {

  if (
    availablePhotos.length === 0
  ) {

    return null;

  }


  const photo =
    availablePhotos[
      incomingPhotoIndex %
      availablePhotos.length
    ];


  incomingPhotoIndex++;


  return photo;

}


/* ==========================================
   UPDATE CALL PHOTO
========================================== */

function updateIncomingCallPhoto() {

  const photo =
    getNextIncomingPhoto();


  if (!photo) {

    callPhoto.removeAttribute(
      "src"
    );

    callName.textContent =
      "Live Video";

    return;

  }


  const imageUrl =
    photo.download_url ||
    getImageUrl(
      photo.name
    );


  callPhoto.src =
    imageUrl;


  const photoIndex =
    (
      incomingPhotoIndex - 1
    ) %
    PROFILE_DATA.length;


  const profile =
    PROFILE_DATA[
      photoIndex
    ];


  if (profile) {

    callName.textContent =
      profile.flag +
      " " +
      profile.name;

  } else {

    callName.textContent =
      "Live Video";

  }

}

/* ==========================================
   ANSWER CALL
========================================== */

answerCall.onclick =
  function(event) {

    event.preventDefault();

    event.stopPropagation();


    clearTimeout(
      photoWaitTimer
    );


    hideIncomingCall();


    /*
      FIRST CALL
    */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      /*
        If sample was already completed
        previously, don't play it again.
      */

      let sampleCompleted =
        false;


      try {

        sampleCompleted =
          localStorage.getItem(
            FLOW_STORAGE_KEY
          ) ===
          "sample-completed";

      } catch (error) {

        sampleCompleted =
          false;

      }


      if (sampleCompleted) {

        currentFlow =
          "FIRST_CALL_ANSWERED";


        insufficientThen(
          function() {

            enterPhotosPage();

          }
        );

      } else {

        currentFlow =
          "SAMPLE";

        startSample();

      }


      return;

    }


    /*
      SECOND CALL
    */

    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      currentFlow =
        "SECOND_CALL_ANSWERED";


      insufficientThen(
        function() {

          enterPhotosPage();

        }
      );


      return;

    }


    /*
      LATER CALL
    */

    if (
      currentFlow ===
      "LATER_CALL"
    ) {

      currentFlow =
        "LATER_CALL_ANSWERED";


      insufficientThen(
        function() {

          enterPhotosPage();

        }
      );


      return;

    }

  };


/* ==========================================
   REJECT CALL
========================================== */

rejectCall.onclick =
  function(event) {

    event.preventDefault();

    event.stopPropagation();


    clearTimeout(
      photoWaitTimer
    );


    hideIncomingCall();


    /*
      If rejected from photos,
      return to photos.
    */

    if (
      currentFlow ===
      "LATER_CALL"
    ) {

      enterPhotosPage();

      return;

    }


    /*
      For the first or second call,
      show the same call again after
      a short pause.
    */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      setTimeout(
        function() {

          showFirstIncomingCall();

        },
        500
      );

      return;

    }


    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      setTimeout(
        function() {

          showSecondIncomingCall();

        },
        500
      );

      return;

    }

  };


/* ==========================================
   SAMPLE VIDEO EVENTS
========================================== */

sampleVideo.addEventListener(

);


sampleVideo.addEventListener(

    if (

    ) {

      setTimeout(

          ) {

);

);

   VISIBILITY SAFETY
========================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.hidden &&
      sampleRunning
    ) {

      /*
        Pause while the browser tab
        is hidden instead of losing
        the flow.
      */

      try {

        sampleVideo.pause();

      } catch (error) {

        console.warn(
          "Could not pause sample:",
          error
        );

      }

   PRELOAD PHOTOS
========================================== */

function preloadPhotos() {

  if (
    !availablePhotos ||
    availablePhotos.length === 0
  ) {

    return;

  }


  availablePhotos.forEach(
    function(photo) {

      const url =
        photo.download_url ||
        getImageUrl(
          photo.name
        );


      if (!url) {
        return;
      }


      const image =
        new Image();

      image.src =
        url;

/* ==========================================
   SAFE VIDEO FALLBACK
========================================== */

function forceFinishSample() {

  if (
    sampleRunning
  ) {

    finishSample();

  }

}


setInterval(
  function() {

    if (
      sampleRunning &&
      sampleVideo &&
      Number.isFinite(
        sampleVideo.currentTime
      ) &&
      sampleVideo.currentTime >=
        SAMPLE_DURATION
    ) {

      finishSample();

/* ==========================================
   START WEBSITE FLOW
========================================== */

function startWebsiteFlow() {

  clearAllTimers();

  hideAllPages();


  sampleRunning =
    false;

  secondsLeft =
    SAMPLE_DURATION;

  incomingPhotoIndex =
    0;


  /*
    IMPORTANT FIX:
    Do not wait for GitHub before
    displaying the website.

    The old code waited for
    loadPhotos().then(...).
    If GitHub failed/hung, the flow
    could remain on the first page.

    We now display the photos/call
    flow independently.
  */

  currentFlow =
    "FIRST_CALL";


  /*
    Load photos in the background.
  */

  loadPhotos()
    .catch(
      function(error) {

        console.warn(
          "Background photo load failed:",
          error
        );

      }
    );


  /*
    Start first call immediately
    after a very short delay.
  */

  setTimeout(
    function() {

      showFirstIncomingCall();

    },
    500
  );

}


/* ==========================================
   SAFE INITIALIZATION
========================================== */

let websiteStarted =
  false;


function initializeWebsite() {

  if (websiteStarted) {

    return;

  }


  websiteStarted =
    true;


  try {

    startOfflineRotation();

  } catch (error) {

    console.warn(
      "Offline rotation failed:",
      error
    );

  }


  try {

    initializeChatPreviews();

  } catch (error) {

    console.warn(
      "Chat initialization failed:",
      error
    );

  }


  try {

    startWebsiteFlow();

  } catch (error) {

    console.error(
      "Website startup failed:",
      error
    );


    /*
      Emergency fallback:
      show the call instead of
      leaving the visitor stuck.
    */

    setTimeout(
      function() {

        try {

          showFirstIncomingCall();

        } catch (secondError) {

          console.error(
            "Emergency flow failed:",
            secondError
          );

        }

      },
      500
    );

  }

                  }

/* ==========================================
   FINAL SAFETY CHECK
========================================== */

(function finalSafetyCheck() {

  /*
    Check the important elements.
  */

  const requiredElements = [

    samplePage,
    insufficientPage,
    photosPage,
    incomingCall,
    sampleVideo,
    livePhotos,
    answerCall,
    rejectCall

  ];


  const missing =
    requiredElements.filter(
      function(element) {

        return !element;

      }
    );


  if (
    missing.length > 0
  ) {

    console.error(
      "Important website elements are missing:",
      missing.length
    );

  }


  /*
    Make sure the sample video has
    the correct source.
  */

  if (
    sampleVideo
  ) {

    if (
      sampleVideo.src === "" ||
      !sampleVideo.querySelector(
        "source"
      )
    ) {

      sampleVideo.src =
        SAMPLE_VIDEO_URL;

    }

  }


  /*
    Do NOT use the invalid "sound"
    HTML attribute.
  */

  if (
    sampleVideo
  ) {

    sampleVideo.removeAttribute(
      "sound"
    );

  }

})();
