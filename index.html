  font-weight:bold;

.photoAge{

  font-size:12px;
  color:#ddd;

/* CENTER PLAY ICON */
.videoPlayIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  height:46px;

  line-height:1;
  z-index:8;

}

@keyframes videoPulse{
  0%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
  50%{
    transform:translate(-50%,-50%) scale(1.12);
    opacity:.72;
  }
  100%{

    opacity:1;
  }

function shuffleArray(array){
  const arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }

  return arr;
}

function getRandomBusyIndexes(){
  const result = [];
  const available = [];

  for(let i=0;i<MAX_PHOTOS;i++){
    available.push(i);
  }

  const shuffled = shuffleArray(available);

  for(let i=0;i<5;i++){
    result.push(shuffled[i]);
  }

  return result;
}

async function getGitHubContents(path=""){
  const url =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("GitHub request failed");
  }

  return await response.json();
}

function isImageFile(name){
  return /\.(jpg|jpeg|png|webp|gif)$/i.test(name);
}

async function collectImages(path="",result=[]){
  const items = await getGitHubContents(path);

  for(const item of items){

    if(item.type === "file" && isImageFile(item.name)){
      result.push(item.path);
    }

    if(item.type === "dir"){
      await collectImages(item.path,result);
    }

    if(result.length >= MAX_PHOTOS){
      break;
    }
  }

  return result;
}

function getFileUrl(path){
  return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
}

async function loadPhotos(){

  let imagePaths = [];

  try{
    imagePaths = await collectImages("",[]);
  }catch(error){
    console.error(error);
    return;
  }

  imagePaths = imagePaths.slice(0,MAX_PHOTOS);

  photosData = imagePaths.map((path,index)=>({
    path,
    url:getFileUrl(path),
    name:names[index] || `User ${index+1}`,
    age:ages[index] || 25,
    country:countries[index] || {
      name:"Kenya",
      flag:"🇰🇪"
    }
  }));
  }
  function renderPhotos(){

  photoGrid.innerHTML = "";

  if(!photosData.length){
    photoGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
        color:#aaa;
      ">
        Loading photos...
      </div>
    `;
    return;
  }

  const displayPhotos = shuffleArray(photosData);
  const busyIndexes = getRandomBusyIndexes();

  displayPhotos.forEach((photo,displayIndex)=>{

    const card = document.createElement("div");
    card.className = "photoCard";

    const img = document.createElement("img");
    img.src = photo.url;
    img.alt = photo.name;
    img.loading = "lazy";

    card.appendChild(img);

    const isBusy =
      busyIndexes.includes(displayIndex);

    const status = document.createElement("div");
    status.className = "statusBadge";

    if(isBusy){

      status.classList.add("offlineBadge");
      status.textContent = "OFFLINE";

      const closed = document.createElement("div");
      closed.className = "roomClosed";
      closed.textContent = "ROOM CLOSED";

      card.appendChild(closed);

    }else{

      status.classList.add("liveBadge");

      const dot = document.createElement("span");
      dot.className = "liveDot";

      status.appendChild(dot);
      status.appendChild(
        document.createTextNode("LIVE")
      );

      card.addEventListener("click",()=>{
        window.location.href = PAYMENT_PAGE_URL;
      });
    }

    card.appendChild(status);

    const videoIcon =
      document.createElement("div");

    videoIcon.className = "videoPlayIcon";
    videoIcon.innerHTML = "▶";

    card.appendChild(videoIcon);

    const info =
      document.createElement("div");

    info.className = "photoInfo";

    info.innerHTML = `
      <div class="photoName">
        ${photo.name}
      </div>

      <div class="photoAge">
        ${photo.country.flag} ${photo.age} yrs
      </div>
    `;

    card.appendChild(info);

    photoGrid.appendChild(card);
  });
}

/*
 * Handles the payment return when index.html
 * is restored from browser Back / bfcache.
 */
function checkPaymentReturn(){

  const returning =
    sessionStorage.getItem(
      "returnToLivePhotos"
    );

  if(returning === "yes"){

    sessionStorage.removeItem(
      "returnToLivePhotos"
    );

    redLiveShownThisVisit =
      localStorage.getItem(
        RED_LIVE_KEY
      ) === "yes";

    setTimeout(()=>{
      showLivePhotos();
    },100);

    return true;
  }

  return false;
      }
  async function startWebsite(){

  /*
   * If the user is coming back from payment,
   * don't show Welcome or another incoming call.
   */
  if(checkPaymentReturn()){

    websiteStarted = true;

    return;
  }

  hideAllPages();

  welcomeScreen.style.display = "flex";

  const startTime = Date.now();

  /*
   * Load the photos while Welcome is showing.
   */
  const photosPromise = loadPhotos();

  /*
   * Welcome stays for at least 3 seconds.
   */
  await Promise.all([
    photosPromise,
    new Promise(resolve =>
      setTimeout(resolve,3000)
    )
  ]);

  welcomeScreen.style.display = "none";

  /*
   * FIRST INCOMING CALL APPEARS IMMEDIATELY
   * after Welcome.
   */
  showIncomingCall();

  websiteStarted = true;
}

/*
 * Important:
 * When payment page is opened and the user presses
 * phone/browser Back, index.html can be restored
 * from browser cache instead of reloading.
 *
 * pageshow catches that situation.
 */
window.addEventListener("pageshow",()=>{

  stopBackgroundSound();
  stopLiveVideo();

  /*
   * Don't interfere with the first page load.
   */
  if(!websiteStarted){
    return;
  }

  if(
    sessionStorage.getItem(
      "returnToLivePhotos"
    ) === "yes"
  ){

    sessionStorage.removeItem(
      "returnToLivePhotos"
    );

    redLiveShownThisVisit =
      localStorage.getItem(
        RED_LIVE_KEY
      ) === "yes";

    setTimeout(()=>{
      showLivePhotos();
    },50);
  }
});

  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopBackgroundSound();

    }else{

      if(
        photosPage.style.display !== "none"
      ){
        playLivePhotosSound();
      }
    }
  }
);


/*
 * Reload / page restoration safety.
 */
window.addEventListener(
  "beforeunload",
  ()=>{
    stopBackgroundSound();
    stopLiveVideo();
  }
);


window.addEventListener(
  "load",
  ()=>{

    prepareVideo();
    prepareAudio();

    startWebsite();
  }
);

</script>

</body>
</html>
