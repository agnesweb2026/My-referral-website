  box-sizing:border-box;

html,body{
  margin:0;
  padding:0;

body{

/* WELCOME */

#welcomeScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.welcome-content{

}

.welcome-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.welcome-loading{
  font-size:15px;
  color:#aaa;
}

.welcome-loading span{
  animation:loadingDots 1.4s infinite;
}

.welcome-loading span:nth-child(2){
  animation-delay:.2s;
}

.welcome-loading span:nth-child(3){
  animation-delay:.4s;
}

@keyframes loadingDots{
  0%,20%{opacity:0;}
  50%,100%{opacity:1;}
}


/* LIVE PEOPLE */

#photosPage{
  display:none;
  width:100%;
  min-height:100vh;
  background:#000;
}

.photos-top{
  position:sticky;
  top:0;
  z-index:20;
  width:100%;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#111;
  border-bottom:1px solid #222;
}

.photos-title{
  font-size:16px;
  font-weight:bold;
}

.online-box{
  font-size:13px;
  color:#fff;
}

.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:5px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 8px #00ff66;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{
  0%,100%{opacity:1;}
  50%{opacity:.25;}
}

#photosGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:3px;
}

.photo-card{
  position:relative;
  width:100%;
  aspect-ratio:.72;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}

.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-dark{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.22);
}

.photo-live{
  position:absolute;
  top:8px;
  left:8px;
  display:flex;
  align-items:center;
  gap:4px;
  background:rgba(0,0,0,.65);
  padding:5px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
  z-index:5;
}

.photo-green-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 6px #00ff66;
  animation:greenBlink 1.2s infinite;
}

.photo-green-dot:nth-child(2){
  animation-delay:.2s;
}

.photo-green-dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes greenBlink{
  0%,100%{opacity:1;}
  50%{opacity:.35;}
}

.photo-offline{
  position:absolute;
  top:8px;
  left:8px;
  display:flex;
  align-items:center;
  gap:5px;
  background:rgba(0,0,0,.72);
  padding:5px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
  z-index:5;
}

.photo-red-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff3333;
  box-shadow:0 0 6px #ff3333;
}

.photo-video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.65);

  align-items:center;
  justify-content:center;

.photo-name{

  left:8px;

  font-weight:bold;
  text-shadow:0 2px 5px #000;

.photo-meta{

  left:8px;

  color:rgba(255,255,255,.82);

.busy-label{

  font-weight:bold;

.caller-name{

.call-buttons{

.call-button{

#insufficientPage{

function shuffleArray(array){

  const copy =
    [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


async function loadPhotos(){

  try{

    const treeUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      "/git/trees/" +
      GITHUB_BRANCH +
      "?recursive=1";

    const response =
      await fetch(treeUrl);

    if(!response.ok){

      throw new Error(
        "GitHub request failed"
      );

    }

    const data =
      await response.json();

    const imageFiles =
      (data.tree || [])
      .filter(file => {

        if(
          file.type !== "blob"
        ){

          return false;

        }

        const name =
          file.path.toLowerCase();

        return (

          name.endsWith(".jpg") ||
          name.endsWith(".jpeg") ||
          name.endsWith(".png") ||
          name.endsWith(".webp")

        );

      });


    photos =
      imageFiles
      .slice(0,24)
      .map(
        (file,index) => ({

          url:
            "https://raw.githubusercontent.com/" +
            GITHUB_OWNER +
            "/" +
            GITHUB_REPO +
            "/" +
            GITHUB_BRANCH +
            "/" +
            file.path,

          name:
            photoNames[index],

          age:
            photoAges[index],

          country:
            photoCountries[index].country,

          flag:
            photoCountries[index].flag

        })
      );


    console.log(
      "Photos loaded:",
      photos.length
    );


  }catch(error){

    console.log(
      "Photo loading error:",
      error
    );

    photos = [];

  }

}


function createBusyIndexes(total){

  const busyIndexes =
    new Set();

  if(total <= 0){

    return busyIndexes;

  }

  const busyCount =
    Math.min(
      total,
      5
    );

  while(
    busyIndexes.size <
    busyCount
  ){

    busyIndexes.add(

      Math.floor(
        Math.random() * total
      )

    );

  }

  return busyIndexes;

  }
  function renderPhotos(){

  clearTimeout(
    busyTimer
  );

  photosGrid.innerHTML =
    "";

  const shuffled =
    shuffleArray(
      photos
    );

  const busyIndexes =
    createBusyIndexes(
      shuffled.length
    );


  shuffled.forEach(
    (photo,index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "photo-card";


      const isBusy =
        busyIndexes.has(
          index
        );


      card.innerHTML = `

        <img
          src="${photo.url}"
          alt="${photo.name}"
          loading="lazy"
        >

        <div class="photo-dark"></div>

        ${
          isBusy

          ?

          `
            <div class="photo-offline">

              <span
                class="photo-red-dot">
              </span>

              OFFLINE

            </div>
          `

          :

          `

                class="photo-green-dot">
              </span>

              <span
                class="photo-green-dot">
              </span>

              <span
                class="photo-green-dot">

              LIVE

          ▷
        </div>


        <div class="photo-name">
          ${photo.name}
        </div>


        <div class="photo-meta">
          ${photo.flag} ${photo.age} yrs
        </div>


        ${
          isBusy

          ?

          `
            <div class="busy-label">
              ROOM CLOSED
            </div>
          `

          :

          ""

        }

      `;


      card.addEventListener(
        "click",
        () => {

            const nameElement =
              card.querySelector(
                ".photo-name"
              );


            nameElement.textContent =
              "ROOM CLOSED";


            setTimeout(
              () => {

              BUSY_MESSAGE_DURATION
            );


            return;

          window.location.href =

      );


      photosGrid.appendChild(

    ){

      localStorage.setItem(
        "redLiveShown",
        "true"
      );


      showLiveSound();


    }else{

      /*
        Later calls skip the
        red LIVE video.
      */

      showInsufficient();

    }

  }
);


declineButton.addEventListener(
  "click",
  () => {

    showLivePhotos();

  }
);


/*
  If the video ends before
  the timer, continue.
*/

liveSoundVideo.addEventListener(
  "ended",
  () => {

    showInsufficient();

  }
);


/*
  Keep online number changing.
*/

setInterval(
  () => {

    if(
      photosPage.style.display !==
      "none"
    ){

      updateOnlineNumber();

    }

  },
  5000
);


/*
  Start everything.
*/

startWebsite();

</script>

</body>
</html>
