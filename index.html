html,

/* =========================

========================= */

.welcome-title{

/* =========================
   PHOTOS PAGE
========================= */

#photosPage{

}

.top-bar{
  position:sticky;
  top:0;

  align-items:center;

.site-title{

}

.online-box{

  color:#ddd;

  font-weight:600;
}

.online-dot{
  width:9px;

  background:#18e66a;

}

.live-header{

  font-size:13px;
  font-weight:900;
}

#photoGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:4px;
  background:#000;
}

.photoCard{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#101010;
  border-radius:5px;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.72;
  overflow:hidden;
  background:#161616;
}

.profile-photo{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#161616;
}

.photo-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#151515;
  color:#666;
  font-size:11px;
  text-align:center;
}

.photo-placeholder-icon{
  font-size:30px;
  margin-bottom:7px;
}

.photo-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  border:2px solid rgba(255,255,255,.9);
  color:#fff;
  font-size:20px;
  animation:playPulse 1.5s infinite;
}

@keyframes playPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.08);
  }
}

.live-badge{
  position:absolute;
  top:6px;
  left:6px;
  padding:4px 7px;
  border-radius:5px;
  background:#e60000;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.offline-badge{
  position:absolute;
  top:6px;
  left:6px;
  padding:4px 7px;
  border-radius:5px;
  background:#555;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.photo-info{
  padding:7px;
  background:#0b0b0b;
}

.photo-name{
  color:#fff;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.photo-meta{
  margin-top:3px;
  color:#999;
  font-size:10px;

.offline-meta{

/* =========================
   INCOMING CALL
========================= */

.incoming-label{

.caller-photo-wrap{

#callerImage{

#callerName{

.caller-status{

.call-buttons{

.call-button{

/* =========================

const RED_LIVE_SEEN_KEY = "redLiveVideoSeen";
const REFERRAL_STORAGE_KEY = "referralEmployeeId";


/* =========================

/* =========================

========================= */

const PROFILES = [

  {name:"Lerato",age:26,country:"South Africa",flag:"🇿🇦",image:"Lerato"},

  {name:"Ashley",age:24,country:"USA",flag:"🇺🇸",image:"Ashley"},
  {name:"Jessica",age:27,country:"USA",flag:"🇺🇸",image:"Jessica"}
];


/* =========================
   STATE
========================= */

let currentCallerIndex = 0;

let referralCode = null;

let referralEmployee = null;

let onlineInterval = null;

let timers = [];

let offlineProfiles = new Map();


/* =========================
   ELEMENTS
========================= */

const welcomeScreen =

const photosPage =

/* =========================
   REFERRAL
========================= */

function loadReferral(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const fromURL =
    params.get("employee") ||
    params.get("ref");

  if(
    fromURL &&
    VALID_REFERRALS[fromURL]
  ){

    referralCode = fromURL;

    referralEmployee =
      VALID_REFERRALS[fromURL];

    localStorage.setItem(
      REFERRAL_STORAGE_KEY,
      referralCode
    );

    return;
  }

  const saved =
    localStorage.getItem(
      REFERRAL_STORAGE_KEY
    );

  if(
    saved &&
    VALID_REFERRALS[saved]
  ){

    referralCode = saved;

    referralEmployee =
      VALID_REFERRALS[saved];
  }
}


/* =========================
   HIDE SCREENS
========================= */

function hideAllScreens(){

/* =========================
   TIMERS
========================= */

function addTimer(callback,delay){

  const timer =
    setTimeout(
      callback,
      delay
    );

  timers.push(timer);

  return timer;
}


function clearTimers(){

  timers.forEach(
    timer => clearTimeout(timer)
  );

  timers = [];
}


/* =========================
   IMAGE LOADER
========================= */

function createImageCandidates(name){

  return [

    IMAGE_BASE +
    encodeURIComponent(name) +
    ".jpg",

    IMAGE_BASE +
    encodeURIComponent(name) +
    ".jpeg",

    IMAGE_BASE +
    encodeURIComponent(name) +
    ".png",

    IMAGE_BASE +
    encodeURIComponent(name) +
    ".webp"

  ];
}


function setupImageFallback(
  image,
  profile
){

  const sources =
    createImageCandidates(
      profile.image
    );

  let index = 0;

  image.src =
    sources[index];

  image.addEventListener(
    "error",
    function(){

      index++;

      if(index < sources.length){

        image.src =
          sources[index];

      }else{

        image.style.display =
          "none";

        const parent =
          image.parentElement;

        const placeholder =
          document.createElement("div");

        placeholder.className =
          "photo-placeholder";

        placeholder.innerHTML = `
          <div class="photo-placeholder-icon">
            👤
          </div>
          <div>
            ${profile.name}
          </div>
        `;

        parent.appendChild(
          placeholder
        );
      }

    }
  );
}


/* =========================
   OFFLINE SYSTEM
========================= */

function randomOfflineStatus(){

  const now = Date.now();

  const status = [];

  PROFILES.forEach(
    (profile,index) => {

      const existing =
        offlineProfiles.get(index);

      if(
        existing &&
        existing.until > now
      ){

        status[index] = true;

        return;
      }

      /*
        Approximately 20% of profiles
        become offline.
      */

      const offline =
        Math.random() < 0.20;

      if(offline){

        offlineProfiles.set(
          index,
          {
            until:
              now +
              OFFLINE_DURATION
          }
        );

        status[index] = true;

      }else{

        offlineProfiles.delete(index);

        status[index] = false;
      }

    }
  );

  return status;
}


function isProfileOffline(index){

  const item =
    offlineProfiles.get(index);

  if(!item){

    return false;
  }

  if(
    Date.now() <
    item.until
  ){

    return true;
  }

  offlineProfiles.delete(index);

  return false;
}


/* =========================
   BUILD PHOTOS
========================= */

function buildPhotoGrid(){

  photoGrid.innerHTML = "";

  const offlineStatus =
    randomOfflineStatus();

  PROFILES.forEach(
    (profile,index) => {

      const offline =
        offlineStatus[index];

      const card =
        document.createElement("div");

      card.className =
        "photoCard";

      card.innerHTML = `

        <div class="photo-image-wrap">

          <img
            class="profile-photo"
            alt="${profile.name}"
          >

          ${
            offline
            ?
            `
            <div class="offline-badge">
              OFFLINE
            </div>
            `
            :
            `
            <div class="live-badge">
              LIVE
            </div>
            `
          }

          ${
            !offline
            ?
            `
            <div class="photo-play">
              ▶
            </div>
            `
            :
            ``
          }

        </div>

        <div class="photo-info">

          <div class="photo-name">
            ${profile.name}
          </div>

          <div class="photo-meta ${
            offline
            ? "offline-meta"
            : ""
          }">

            ${profile.flag}
            ${profile.country}
            ·
            ${profile.age}

            ${
              offline
              ? " · Offline"
              : ""
            }

          </div>

        </div>
      `;


      const image =
        card.querySelector(
          ".profile-photo"
        );

      setupImageFallback(
        image,
        profile
      );


      card.addEventListener(
        "click",
        function(){

          /*
            Offline profiles cannot
            start a live call.
          */

          if(offline){

            return;
          }

          openPaymentPage();

        }
      );


      photoGrid.appendChild(
        card
      );

    }
  );
}


/* =========================
   ONLINE NUMBER
========================= */

function updateOnlineNumber(){

  const total =
    PROFILES.length;

  let offlineCount = 0;

  PROFILES.forEach(
    (_,index) => {

      if(
        isProfileOffline(index)
      ){

        offlineCount++;
      }

    }
  );

  const online =
    Math.max(
      1,
      total - offlineCount
    );

  onlineNumber.textContent =
    online + " online";
}


function startOnlineCounter(){

  if(onlineInterval){

    clearInterval(
      onlineInterval
    );
  }

  onlineNumber.textContent =
    "21 online";

  onlineInterval =
    setInterval(
      function(){

        updateOnlineNumber();

        buildPhotoGrid();

      },
      10000
    );
}

   WELCOME
========================= */

function showWelcome(){

  clearTimers();

  hideAllScreens();

  welcomeScreen.style.display =
    "flex";

  addTimer(
    function(){

      showLivePhotos();

    },
    3000
  );
}


/* =========================
   LIVE PHOTOS
========================= */

function showLivePhotos(){

  clearTimers();

  hideAllScreens();

  photosPage.style.display =
    "block";

  buildPhotoGrid();

  startOnlineCounter();

  scheduleNextIncomingCall();
}


/* =========================
   NEXT CALL
========================= */

function scheduleNextIncomingCall(){

  addTimer(
    function(){

      showIncomingCall();

    },
    NEXT_CALL_DELAY
  );
}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(){

  clearTimers();

  hideAllScreens();

  let profileIndex =
    currentCallerIndex %
    PROFILES.length;

  /*
    If selected caller is offline,
    find another online profile.
  */

  let attempts = 0;

  while(
    isProfileOffline(profileIndex) &&
    attempts < PROFILES.length
  ){

    profileIndex =
      (
        profileIndex + 1
      ) %
      PROFILES.length;

    attempts++;
  }

  currentCallerIndex =
    profileIndex;

  const profile =
    PROFILES[profileIndex];

  const sources =
    createImageCandidates(
      profile.image
    );

  callerImage.src =
    sources[0];

  callerImage.onerror =
    function(){

      let current =
        Number(
          callerImage.dataset.fallback ||
          0
        );

      current++;

      if(
        current <
        sources.length
      ){

        callerImage.dataset.fallback =
          current;

        callerImage.src =
          sources[current];
      }
    };

  callerName.textContent =
    profile.name;

  incomingCall.style.display =
    "flex";
}


/* =========================
   DECLINE
========================= */

function declineCall(){

  clearTimers();

  showLivePhotos();
}


/* =========================
   ANSWER
========================= */

function answerCall(){

  clearTimers();

  hideAllScreens();

  currentCallerIndex++;

  const alreadySeen =
    localStorage.getItem(
      RED_LIVE_SEEN_KEY
    );

  if(!alreadySeen){

    localStorage.setItem(
      RED_LIVE_SEEN_KEY,
      "1"
    );

    showRedLiveVideo();

  }else{

    showBlackLive();

  }
}


/* =========================
   RED LIVE
========================= */

function showRedLiveVideo(){

  clearTimers();

  hideAllScreens();

  redLiveVideoPage.style.display =
    "flex";

  try{

    redLiveVideo.currentTime = 0;

    redLiveVideo.muted = false;

    redLiveVideo.volume = 1;

    const promise =
      redLiveVideo.play();

    if(
      promise &&
      promise.catch
    ){

      promise.catch(
        function(){}
      );
    }

  }catch(error){}


  addTimer(
    function(){

      try{

        redLiveVideo.pause();

        redLiveVideo.currentTime = 0;

      }catch(error){}

      showBlackLive();

    },
    RED_LIVE_DURATION
  );
}


/* =========================
   BLACK LIVE
========================= */

function showBlackLive(){

  clearTimers();

  hideAllScreens();

  blackLivePage.style.display =
    "flex";

  try{

    blackLiveSoundVideo.currentTime =
      0;

    blackLiveSoundVideo.muted =
      false;

    blackLiveSoundVideo.volume =
      1;

    const promise =
      blackLiveSoundVideo.play();

    if(
      promise &&
      promise.catch
    ){

      promise.catch(
        function(){}
      );
    }

  }catch(error){}


  addTimer(
    function(){

      stopBlackLiveSound();

      showInsufficient();

    },
    BLACK_LIVE_DURATION
  );
}


/* =========================
   STOP BLACK SOUND
========================= */

function stopBlackLiveSound(){

  try{

    blackLiveSoundVideo.pause();

    blackLiveSoundVideo.currentTime =
      0;

  }catch(error){}
}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(){

  clearTimers();

  hideAllScreens();

  insufficientPage.style.display =
    "flex";

  let seconds = 2;

  insufficientTimer.textContent =
    seconds;

  const countdown =
    setInterval(
      function(){

        seconds--;

        if(seconds <= 0){

          clearInterval(
            countdown
          );

          insufficientTimer.textContent =
            "0";

        }else{

          insufficientTimer.textContent =
            seconds;
        }

      },
      1000
    );


  addTimer(
    function(){

      showLivePhotos();

    },
    INSUFFICIENT_DURATION
  );
}


/* =========================
   PAYMENT
========================= */

function openPaymentPage(){

  sessionStorage.setItem(
    "returnToLivePhotos",
    "1"
  );

  let url =
    PAYMENT_PAGE_URL;

  if(referralCode){

    url +=
      "?employee=" +
      encodeURIComponent(
        referralCode
      );
  }

  window.location.href =
    url;
}
