function getNextIncomingPhoto() {

  if (
    !availablePhotos ||
    availablePhotos.length === 0
  ) {

    return null;

  }

    availablePhotos[
      incomingPhotoIndex %

  return photo;

  */

  if (
    currentFlow ===

  ) {

/* ==========================================
   SAMPLE START
========================================== */

function startSample() {

  /*
    Do not allow the sample to
    start more than once during
    the current page session.
  */

  if (
    sampleRunning
  ) {

    return;

  }


  /*
    IMPORTANT:

    Mark the sample as SEEN
    immediately.

    This is the part that makes
    a browser reload skip the
    sample even if the visitor
    reloads while the video is
    still playing.
  */

  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-seen"
  );


  clearAllTimers();


  currentFlow =
    "SAMPLE";


  sampleRunning =
    true;


  secondsLeft =
    SAMPLE_DURATION;


  updateSampleTimer();


  showSamplePage();


  /*
    Start from the beginning.
  */

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (
    error
  ) {

    console.log(
      "Video reset error:",
      error
    );

  }


  /*
    Mobile browser settings.
  */

  sampleVideo.muted =
    true;

  sampleVideo.playsInline =
    true;


  /*
    Play sample.
  */

  const playPromise =
    sampleVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      function(error) {

        console.log(
          "Video play was blocked:",
          error
        );

      }
    );

  }


  /*
    20-second sample timer.
  */

  sampleTimerInterval =
    setInterval(
      function() {

        if (
          !sampleRunning
        ) {

          return;

        }


        secondsLeft--;


        if (
          secondsLeft > 0
        ) {

          updateSampleTimer();

        }


        if (
          secondsLeft <= 0
        ) {

          finishSample();

        }

      },
      1000
    );

  }
  /* ==========================================
   FINISH SAMPLE
========================================== */

function finishSample() {

  if (
    !sampleRunning
  ) {

    return;

  }


  sampleRunning =
    false;


  clearInterval(
    sampleTimerInterval
  );


  sampleTimerInterval =
    null;


  /*
    Stop the video.
  */

  try {

    sampleVideo.pause();

  } catch (error) {

    console.log(
      error
    );

  }


  /*
    Sample is now completed.

    Save this state so a normal
    page reload does NOT send the
    visitor back to the beginning
    of the sample flow.
  */

  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-completed"
  );


  /*
    First sample ends with
    Insufficient minutes.
  */

  currentFlow =
    "AFTER_SAMPLE";


  insufficientThen(
    function() {

      /*
        After insufficient minutes,
        show the SECOND incoming call.

        A new photo is automatically
        selected.
      */

      currentFlow =
        "SECOND_CALL";

      showIncomingCall();

    }
  );

}


/* ==========================================
   VIDEO ENDED EVENT
========================================== */

sampleVideo.addEventListener(
  "ended",
  function() {

    /*
      The timer normally controls
      the 20-second limit.

      This event is a safety backup
      if the video itself ends first.
    */

    if (
      sampleRunning
    ) {

      finishSample();

    }

  }
);


/* ==========================================
   VIDEO LOADED
========================================== */

sampleVideo.addEventListener(
  "loadedmetadata",
  function() {

    console.log(
      "Sample video loaded."
    );

  }
);


/* ==========================================
   VIDEO ERROR
========================================== */

sampleVideo.addEventListener(
  "error",
  function() {

    console.error(
      "Sample video could not load."
    );


    sampleTimer.textContent =
      "Sample video could not load.";

  }
);


/* ==========================================
   VIDEO TIME SAFETY
========================================== */

sampleVideo.addEventListener(
  "timeupdate",
  function() {

    if (
      !sampleRunning
    ) {

      return;

    }


    /*
      Extra safety:

      Never allow the sample to
      continue beyond 20 seconds.
    */

    if (
      sampleVideo.currentTime >=
      SAMPLE_DURATION
    ) {

      finishSample();

    }

  }
);
  /* ==========================================
   SHOW PHOTOS AND START 10 SECOND TIMER
========================================== */

function showPhotosAndStartTimer() {

  showPhotosPage();


  if (
    !photosLoaded
  ) {

    loadPhotos();

  }


  clearTimeout(
    photoWaitTimer
  );


  photoWaitTimer =
    setTimeout(
      function() {

        showIncomingCall();

      },
      PHOTO_WAIT_DURATION
    );

}


/* ==========================================
   ANSWER CALL
========================================== */

answerCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();


    /*
      FIRST CALL:
      Answer → Sample
    */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      currentFlow =
        "SAMPLE";

      startSample();

      return;

    }


    /*
      LATER CALL:
      Answer → Insufficient
      → Photos
    */

    currentFlow =
      "PHOTOS";

    insufficientThen(
      function() {

        showPhotosAndStartTimer();

      }
    );

  }
);


/* ==========================================
   REJECT CALL
========================================== */

rejectCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();


    /*
      If the call appeared on
      the photos page, restart
      the 10-second waiting timer.
    */

    if (
      currentFlow ===
      "PHOTOS"
    ) {

      showPhotosAndStartTimer();

    }

  }
);


/* ==========================================
   RESET SAMPLE VIDEO
========================================== */

function resetSampleVideo() {

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (error) {

    console.log(
      "Sample reset error:",
      error
    );

  }

}


/* ==========================================
   UPDATE SAMPLE TIMER
========================================== */

function updateSampleTimer() {

  sampleTimer.textContent =
    "Sample: " +
    secondsLeft +
    " seconds";

}


/* ==========================================
   START SAMPLE
========================================== */

function startSample() {

  if (
    sampleRunning
  ) {

    return;

  }


  /*
    IMPORTANT:

    Save this BEFORE playing.

    Therefore, if the visitor reloads
    while the sample is playing,
    the browser remembers that the
    sample has already been started.
  */

  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-seen"
  );


  clearAllTimers();


  currentFlow =
    "SAMPLE";


  sampleRunning =
    true;


  secondsLeft =
    SAMPLE_DURATION;


  updateSampleTimer();


  showSamplePage();


  resetSampleVideo();


  sampleVideo.muted =
    true;

  sampleVideo.playsInline =
    true;


  const playPromise =
    sampleVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      function(error) {

        console.log(
          "Video play blocked:",
          error
        );

      }
    );

  }


  sampleTimerInterval =
    setInterval(
      function() {

        if (
          !sampleRunning
        ) {

          return;

        }


        secondsLeft--;


        if (
          secondsLeft > 0
        ) {

          updateSampleTimer();

        }


        if (
          secondsLeft <= 0
        ) {

          finishSample();

        }

      },
      1000
    );

}
  /* ==========================================
   SHOW PHOTOS AND START TIMER
========================================== */

function openPhotosPage() {

  clearTimeout(
    photoWaitTimer
  );

  currentFlow =
    "PHOTOS";

  showPhotosPage();

  if (
    !photosLoaded
  ) {

    loadPhotos();

  }

  startPhotoPageTimer();

}


/* ==========================================
   RETURN TO PHOTOS AFTER CALL
========================================== */

function returnToPhotosAfterCall() {

  hideIncomingCall();

  currentFlow =
    "AFTER_CALL";

  insufficientThen(
    function() {

      openPhotosPage();

    }
  );

}


/* ==========================================
   SECOND INCOMING CALL
========================================== */

function handleSecondIncomingCall() {

  hideIncomingCall();

  currentFlow =
    "SECOND_CALL_ANSWERED";

  insufficientThen(
    function() {

      openPhotosPage();

    }
  );

}


/* ==========================================
   LATER INCOMING CALL
========================================== */

function handleLaterIncomingCall() {

  hideIncomingCall();

  currentFlow =
    "LATER_CALL_ANSWERED";

  insufficientThen(
    function() {

      openPhotosPage();

    }
  );

}


/* ==========================================
   ANSWER BUTTON
========================================== */

answerCall.onclick =
  function() {

    clearTimeout(
      photoWaitTimer
    );

    hideIncomingCall();


    /*
      FIRST CALL
    */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      currentFlow =
        "SAMPLE";

      startSample();

      return;

    }


    /*
      SECOND CALL
    */

    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      handleSecondIncomingCall();

      return;

    }


    /*
      ALL LATER CALLS
    */

    handleLaterIncomingCall();

  };


/* ==========================================
   REJECT BUTTON
========================================== */

rejectCall.onclick =
  function() {

    clearTimeout(
      photoWaitTimer
    );

    hideIncomingCall();


    /*
      Calls appearing from
      the Photos page.
    */

    if (
      currentFlow ===
      "NEXT_CALL" ||
      currentFlow ===
      "LATER_CALL"
    ) {

      openPhotosPage();

      return;

    }


    /*
      First call.
    */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      currentFlow =
        "FIRST_CALL";

      showIncomingCall();

      return;

    }


    /*
      Second call.
    */

    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      currentFlow =
        "SECOND_CALL";

      showIncomingCall();

      return;

    }

  };


/* ==========================================
   PHOTO OBSERVER
========================================== */

const photoObserver =
  new MutationObserver(
    function() {

      attachPhotoClickEvents();

    }
  );


photoObserver.observe(
  livePhotos,
  {
    childList: true,
    subtree: true
  }
);


/* ==========================================
   REFRESH PHOTO CLICKS
========================================== */

function refreshPhotoClicks() {

  attachPhotoClickEvents();

}


/* ==========================================
   OPEN PAYMENT SAFELY
========================================== */

function openPaymentPageSafely() {

  clearTimeout(
    photoWaitTimer
  );

  hideIncomingCall();

  clearInterval(
    sampleTimerInterval
  );


  if (
    PAYMENT_PAGE_URL &&
    PAYMENT_PAGE_URL.trim() !== ""
  ) {

    window.location.href =
      PAYMENT_PAGE_URL;

  }

}
  /* ==========================================
   FINAL FLOW CONTROLLER
========================================== */

function runFinalFlow() {

  clearAllTimers();

  hideAllPages();

  hideIncomingCall();


  /*
    IMPORTANT:
    Check whether this browser has
    already started the sample.

    If yes, NEVER show the sample again.
  */

  const sampleAlreadySeen =
    localStorage.getItem(
      FLOW_STORAGE_KEY
    );


  if (
    sampleAlreadySeen
  ) {

    /*
      Visitor already saw/started
      the sample.

      Go directly to the photos page.
    */

    currentFlow =
      "PHOTOS";

    sampleRunning =
      false;

    showPhotosPage();

    loadPhotos();

    return;

  }


  /*
    FIRST VISIT:

    Start with the first incoming
    video call.
  */

  sampleRunning =
    false;

  secondsLeft =
    SAMPLE_DURATION;


  sampleTimer.textContent =
    "Sample: " +
    SAMPLE_DURATION +
    " seconds";


  incomingPhotoIndex =
    0;


  currentFlow =
    "FIRST_CALL";


  /*
    Load photos before displaying
    the first incoming call.
  */

  if (
    !photosLoaded
  ) {

    loadPhotos()
      .then(
        function() {

          showFirstIncomingCall();

        }
      )
      .catch(
        function() {

          showFirstIncomingCall();

        }
      );

  } else {

    showFirstIncomingCall();

  }

}


/* ==========================================
   SAMPLE SAFETY
========================================== */

function forceFinishSample() {

  if (
    sampleRunning
  ) {

    finishSample();

  }

}


/* ==========================================
   PAGE RELOAD PROTECTION
========================================== */

/*
  localStorage is intentionally used
  for the sample.

  Once the sample is started, the key
  remains even after the visitor reloads
  the page.

  Therefore:

  FIRST VISIT
  ↓
  Incoming call
  ↓
  Sample
  ↓
  localStorage = sample-seen

  RELOAD
  ↓
  Sample is skipped
  ↓
  Photos page
*/


/* ==========================================
   BROWSER BACK / PAGE SHOW
========================================== */

window.addEventListener(
  "pageshow",
  function() {

    if (
      localStorage.getItem(
        FLOW_STORAGE_KEY
      )
    ) {

      /*
        Never restart the sample
        after a reload/back-cache restore.
      */

      if (
        !sampleRunning
      ) {

        currentFlow =
          "PHOTOS";

        hideIncomingCall();

        showPhotosPage();

        refreshPhotoClicks();

      }

    }

  }
);


/* ==========================================
   WINDOW FOCUS
========================================== */

window.addEventListener(
  "focus",
  function() {

    /*
      Do not restart the sample when
      the visitor returns to the browser.
    */

    if (
      sampleRunning
    ) {

      console.log(
        "Sample is already running."
      );

    }

  }
);


/* ==========================================
   ONLINE
========================================== */

window.addEventListener(
  "online",
  function() {

    console.log(
      "Internet connection restored."
    );


    if (
      !photosLoaded
    ) {

      loadPhotos();

    }

  }
);


/* ==========================================
   OFFLINE
========================================== */

window.addEventListener(
  "offline",
  function() {

    console.log(
      "Internet connection lost."
    );

  }
);


/* ==========================================
   PREVENT ACCIDENTAL FORM SUBMISSION
========================================== */

document.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

  }
);


/* ==========================================
   START WHEN DOM IS READY
========================================== */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      setTimeout(
        function() {

          runFinalFlow();

        },
        300
      );

    }
  );

} else {

  setTimeout(
    function() {

      runFinalFlow();

    },
    300
  );

      }
  <script>

/* ==========================================
   FINAL START
========================================== */

window.addEventListener(
  "DOMContentLoaded",
  function () {

    startWebsiteFlow();

  }
);


/* ==========================================
   FINAL SAMPLE-ONCE PROTECTION
========================================== */

window.addEventListener(
  "pageshow",
  function () {

    const sampleSeen =
      localStorage.getItem(
        "myReferralFlowStarted"
      );

    if (
      sampleSeen &&
      !sampleRunning
    ) {

      currentFlow =
        "PHOTOS";

      hideAllPages();

      hideIncomingCall();

      showPhotosPage();

      loadPhotos();

    }

  }
);

</script>
