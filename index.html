<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

.card {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}

/* =========================
   SAMPLE PAGE
========================= */

#samplePage {
  display: flex;
  width: 100%;
  min-height: calc(100vh - 30px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.sample-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.sample-subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 15px;
}

#sampleVideo {
  width: 100%;
  max-width: 450px;
  max-height: 70vh;
  display: block;
  background: #111;
  border-radius: 14px;
  object-fit: contain;
}

.sample-timer {
  margin-top: 12px;
  color: #aaa;
  font-size: 13px;
}

/* =========================
   INSUFFICIENT PAGE
========================= */

#insufficientPage {
  display: none;
  width: 100%;
  min-height: calc(100vh - 30px);
  align-items: center;
  justify-content: center;
  text-align: center;
}

.insufficient-box {
  width: 100%;
  background: #111;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 30px 20px;
}

.insufficient-title {
  font-size: 25px;
  font-weight: bold;
  color: #ff5252;
  margin-bottom: 10px;
}

.insufficient-text {
  color: #aaa;
  font-size: 14px;
  line-height: 1.5;
}

/* =========================
   PHOTOS PAGE
========================= */

#photosPage {
  display: none;
}

.top-bar {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 15px;
}

.online-box {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: #111;
  border: 1px solid #292929;
  color: #fff;
  padding: 7px 11px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.online-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  animation: onlineBlink 1.2s infinite;
}

@keyframes onlineBlink {
  50% {
    opacity: .35;
  }
}

h1 {
  margin: 8px 0 5px;
  font-size: 25px;
}

.subtitle {
  color: #aaa;
  margin: 0 0 15px;
  font-size: 14px;
}

#livePhotos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 15px;
}

.live-photo {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #111;
  cursor: pointer;
  min-height: 250px;
  padding-bottom: 45px;
  border: 1px solid #1e1e1e;
  transition: transform .15s ease;
}

.live-photo:active {
  transform: scale(.98);
}

.live-photo img {
  display: block;
  width: 100%;
  height: 205px;
  object-fit: cover;
  background: #111;
}

.photo-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 5px;
  background: #111;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
}

.live-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 5;
  background: #f0184c;
  color: #fff;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: bold;
}

.live-badge::before {
  content: "●";
  margin-right: 4px;
}

.live-status {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,0,0,.82);
  padding: 5px 7px;
  border-radius: 7px;
  font-size: 10px;
}

.live-dot {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #22c55e;
  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {
  50% {
    opacity: .35;
  }
}

.loading {
  grid-column: 1 / -1;
  padding: 45px 20px;
  color: #aaa;
  text-align: center;
}

.error {
  grid-column: 1 / -1;
  padding: 35px 15px;
  color: #ff6b6b;
  text-align: center;
  line-height: 1.5;
}

/* =========================
   INCOMING CALL
========================= */

#incomingCall {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background:
    radial-gradient(
      circle at center,
      #202020 0%,
      #080808 55%,
      #000 100%
    );
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.call-box {
  width: 100%;
  max-width: 360px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 22px;
  padding: 28px 20px 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}

.call-avatar {
  width: 105px;
  height: 105px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: linear-gradient(135deg,#333,#111);
  border: 3px solid #22c55e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.call-incoming {
  color: #22c55e;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.call-name {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 7px;
}

.call-type {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 25px;
}

.call-buttons {
  display: flex;
  justify-content: center;
  gap: 35px;
}

.call-action {
  border: none;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  color: #fff;
  font-size: 27px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.call-answer {
  background: #22c55e;
}

.call-end {
  background: #ef4444;
  transform: rotate(135deg);
}

@media (max-width: 380px) {

  body {
    padding: 12px;
  }

  #livePhotos {
    gap: 10px;
  }

  .live-photo {
    min-height: 215px;
  }

  .live-photo img {
    height: 170px;
  }

  .photo-name {
    font-size: 12px;
  }

}

</style>
</head>

<body>

<div class="card">

  <!-- SAMPLE -->

  <div id="samplePage">

    <div class="sample-title">
      Live Video
    </div>

    <div class="sample-subtitle">
      join
    </div>

    <video
      id="sampleVideo"
      muted
      playsinline
      preload="auto"
      controls
    >

      <source
        src="preview_20_seconds.mp4"
        type="video/mp4"
      >

      Your browser does not support video.

    </video>

    <div
      class="sample-timer"
      id="sampleTimer"
    >
      Sample: 20 seconds
    </div>

  </div>

  <!-- INSUFFICIENT -->

  <div id="insufficientPage">

    <div class="insufficient-box">

      <div class="insufficient-title">
        Insufficient minutes
      </div>

      <div class="insufficient-text">
        Buy more minutes!
        <br>
        Opening live video call...
      </div>

    </div>

  </div>

  <!-- PHOTOS -->

  <div id="photosPage">

    <div class="top-bar">

      <div class="online-box">

        <span class="online-dot"></span>

        <span>
          21 online
        </span>

      </div>

    </div>

    <h1>
      Welcome
    </h1>

    <p class="subtitle">
      People live now
    </p>

    <div id="livePhotos"></div>

  </div>

</div>

<!-- INCOMING CALL -->

<div id="incomingCall">

  <div class="call-box">

    <div class="call-avatar">
      📞
    </div>

    <div class="call-incoming">
      INCOMING VIDEO CALL
    </div>

    <div class="call-name">
      Live Video
    </div>

    <div class="call-type">
      Someone wants to start a video call
    </div>

    <div class="call-buttons">

      <button
        class="call-action call-end"
        id="rejectCall"
        type="button"
      >
        ☎
      </button>

      <button
        class="call-action call-answer"
        id="answerCall"
        type="button"
      >
        📞
      </button>

    </div>

  </div>

</div>

<script>

/* ==========================================
   WEBSITE SETTINGS
========================================== */

const GITHUB_OWNER = "agnesweb2026";
const GITHUB_REPO = "My-referral-website";
const GITHUB_BRANCH = "main";

const MAX_PHOTOS = 24;


/* ==========================================
   PHOTO NAMES
========================================== */

const PHOTO_NAMES = [

  "Cute 😍❤️",
  "Becky 💦❤️‍🔥",
  "Dorry 🔥✅",
  "Jenny 💦❤️‍🔥",
  "Caro 💦❤️‍🔥❤️",
  "Juck 💦❤️‍🔥",
  "Bella 🥀👄",
  "Faith 🌟",
  "Chepto 😜🔥",
  "Shelley",
  "Phapy 🥰😍",
  "Chris 💖💘",
  "Juphio 😴💦💦",
  "Judy 💖",
  "Kandy 💦😴",
  "Jennifer ❤️‍🔥🔥",
  "Pento 🥀👄",
  "Shallow ❤️‍🔥🔥🥀",
  "Grees 🌟",
  "Betty 🔥❤️‍🔥",
  "Maria 🌟🥀💦",
  "Kitty 💦❤️",
  "Sweetgy 😍🥰",
  "Fellow 💦❤️"

];


/* ==========================================
   GET ELEMENTS
========================================== */

const samplePage =
  document.getElementById("samplePage");

const insufficientPage =
  document.getElementById("insufficientPage");

const photosPage =
  document.getElementById("photosPage");

const sampleVideo =
  document.getElementById("sampleVideo");

const sampleTimer =
  document.getElementById("sampleTimer");

const livePhotos =
  document.getElementById("livePhotos");

const incomingCall =
  document.getElementById("incomingCall");

const answerCall =
  document.getElementById("answerCall");

const rejectCall =
  document.getElementById("rejectCall");


/* ==========================================
   SAMPLE SETTINGS
========================================== */

let sampleRunning = false;

let secondsLeft = 20;

let sampleTimerInterval = null;


/* ==========================================
   SHOW SAMPLE
========================================== */

function showSample() {

  samplePage.style.display = "flex";

  insufficientPage.style.display = "none";

  photosPage.style.display = "none";

  incomingCall.style.display = "none";

}


/* ==========================================
   START SAMPLE
========================================== */

function startSample() {

  if (sampleRunning) {
    return;
  }

  sampleRunning = true;

  secondsLeft = 20;

  sampleTimer.textContent =
    "Sample: 20 seconds";

  showSample();

  clearInterval(sampleTimerInterval);

  try {

    sampleVideo.currentTime = 0;

  } catch (error) {

    console.log(error);

  }

  sampleVideo.muted = true;

  const playPromise =
    sampleVideo.play();

  if (playPromise !== undefined) {

    playPromise.catch(function(error) {

      console.log(
        "Video autoplay blocked:",
        error
      );

    });

  }

  sampleTimerInterval =
    setInterval(function() {

      secondsLeft--;

      if (secondsLeft > 0) {

        sampleTimer.textContent =
          "Sample: " +
          secondsLeft +
          " seconds";

      }

      if (secondsLeft <= 0) {

        clearInterval(
          sampleTimerInterval
        );

        finishSample();

      }

    }, 1000);

}
  /* ==========================================
   FINISH SAMPLE
========================================== */

function finishSample() {

  if (!sampleRunning) {
    return;
  }

  sampleRunning = false;

  clearInterval(
    sampleTimerInterval
  );

  sampleVideo.pause();

  /*
    Hide sample.
  */

  samplePage.style.display =
    "none";

  /*
    Show insufficient minutes.
  */

  insufficientPage.style.display =
    "flex";

  /*
    Keep message for 2 seconds.
  */

  setTimeout(function() {

    insufficientPage.style.display =
      "none";

    photosPage.style.display =
      "block";

    loadPhotos();

    /*
      Incoming call appears
      shortly after photos load.
    */

    setTimeout(function() {

      showIncomingCall();

    }, 1000);

  }, 2000);

}


/* ==========================================
   VIDEO ENDED EVENT
========================================== */

sampleVideo.addEventListener(
  "ended",
  function() {

    finishSample();

  }
);


/* ==========================================
   SHOW INCOMING CALL
========================================== */

function showIncomingCall() {

  incomingCall.style.display =
    "flex";

}


/* ==========================================
   HIDE INCOMING CALL
========================================== */

function hideIncomingCall() {

  incomingCall.style.display =
    "none";

}


/* ==========================================
   ANSWER CALL
========================================== */

answerCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

    photosPage.style.display =
      "block";

  }
);


/* ==========================================
   REJECT CALL
========================================== */

rejectCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

    startSample();

  }
);


/* ==========================================
   PHOTO IMAGE URL
========================================== */

function getImageUrl(
  fileName
) {

  return (
    "https://raw.githubusercontent.com/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/" +
    GITHUB_BRANCH +
    "/" +
    encodeURIComponent(fileName)
  );

}


/* ==========================================
   LOAD PHOTOS
========================================== */

async function loadPhotos() {

  livePhotos.innerHTML = "";

  const loading =
    document.createElement("div");

  loading.className =
    "loading";

  loading.textContent =
    "Loading live now...";

  livePhotos.appendChild(
    loading
  );

  try {

    const response =
      await fetch(
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPO +
        "/contents"
      );

    if (!response.ok) {

      throw new Error(
        "GitHub request failed: " +
        response.status
      );

    }

    const files =
      await response.json();

    /*
      Make sure GitHub returned
      an array.
    */

    if (!Array.isArray(files)) {

      throw new Error(
        "GitHub did not return a file list."
      );

    }

    /*
      Find image files.
    */

    const imageFiles =
      files.filter(function(file) {

        if (!file || !file.name) {
          return false;
        }

        const name =
          file.name.toLowerCase();

        return (
          name.endsWith(".jpg") ||
          name.endsWith(".jpeg") ||
          name.endsWith(".png") ||
          name.endsWith(".webp") ||
          name.endsWith(".gif")
        );

      });

    /*
      Limit photos.
    */

    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );

    livePhotos.innerHTML = "";

    if (
      selectedFiles.length === 0
    ) {

      livePhotos.innerHTML =
        '<div class="error">' +
        'No photos were found in the repository.' +
        '<br><br>' +
        'Make sure your image files are in the main repository folder.' +
        '</div>';

      return;

    }

    selectedFiles.forEach(
      function(file, index) {

        createPhotoCard(
          file,
          index
        );

      }
    );

  } catch (error) {

    console.error(
      "Photo loading error:",
      error
    );

    livePhotos.innerHTML =
      '<div class="error">' +
      'Unable to load live photos right now.' +
      '<br><br>' +
      'Please try again.' +
      '</div>';

  }

}


/* ==========================================
   CREATE PHOTO CARD
========================================== */

function createPhotoCard(
  file,
  index
) {

  const card =
    document.createElement("div");

  card.className =
    "live-photo";

  const image =
    document.createElement("img");

  image.loading =
    "lazy";

  image.alt =
    PHOTO_NAMES[index] ||
    "Live photo";

  image.src =
    file.download_url ||
    getImageUrl(file.name);

  image.onerror =
    function() {

      image.style.display =
        "none";

    };

  const badge =
    document.createElement("div");

  badge.className =
    "live-badge";

  badge.textContent =
    "LIVE";

  const status =
    document.createElement("div");

  status.className =
    "live-status";

  status.innerHTML =
    '<span class="live-dot"></span>' +
    '<span>Live now</span>';

  const name =
    document.createElement("div");

  name.className =
    "photo-name";

  name.textContent =
    PHOTO_NAMES[index] ||
    "Live";

  card.appendChild(
    image
  );

  card.appendChild(
    badge
  );

  card.appendChild(
    status
  );

  card.appendChild(
    name
  );

  livePhotos.appendChild(
    card
  );

      }
  /* ==========================================
   PHOTO CLICK
========================================== */

function handlePhotoClick(card) {

  if (!card) {
    return;
  }

  /*
    Open incoming call screen
    when a live photo is tapped.
  */

  showIncomingCall();

}


/* ==========================================
   ATTACH PHOTO CLICK EVENTS
========================================== */

function attachPhotoClickEvents() {

  const cards =
    document.querySelectorAll(
      ".live-photo"
    );

  cards.forEach(function(card) {

    /*
      Prevent attaching the
      same listener twice.
    */

    if (
      card.dataset.clickAttached ===
      "true"
    ) {
      return;
    }

    card.dataset.clickAttached =
      "true";

    card.addEventListener(
      "click",
      function() {

        handlePhotoClick(card);

      }
    );

  });

}


/* ==========================================
   WATCH FOR NEW PHOTO CARDS
========================================== */

const photoObserver =
  new MutationObserver(
    function() {

      attachPhotoClickEvents();

    }
  );

photoObserver.observe(
  livePhotos,
  {
    childList: true,
    subtree: true
  }
);


/* ==========================================
   INITIAL PAGE FLOW
========================================== */

function initializeWebsite() {

  /*
    Always start with the sample
    when the page opens.
  */

  samplePage.style.display =
    "flex";

  insufficientPage.style.display =
    "none";

  photosPage.style.display =
    "none";

  incomingCall.style.display =
    "none";

  /*
    Reset sample.
  */

  sampleRunning =
    false;

  secondsLeft =
    20;

  sampleTimer.textContent =
    "Sample: 20 seconds";

  clearInterval(
    sampleTimerInterval
  );

  /*
    Reset video.
  */

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (error) {

    console.log(error);

  }

  /*
    Start sample after
    page has rendered.
  */

  setTimeout(
    function() {

      startSample();

    },
    300
  );

}


/* ==========================================
   PAGE VISIBILITY
========================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    /*
      Pause sample when the user
      leaves the browser tab.
    */

    if (
      document.hidden &&
      sampleRunning
    ) {

      sampleVideo.pause();

    }

  }
);


/* ==========================================
   RETURN TO SAMPLE
========================================== */

function returnToSample() {

  hideIncomingCall();

  photosPage.style.display =
    "none";

  insufficientPage.style.display =
    "none";

  samplePage.style.display =
    "flex";

  clearInterval(
    sampleTimerInterval
  );

  sampleRunning =
    false;

  secondsLeft =
    20;

  sampleTimer.textContent =
    "Sample: 20 seconds";

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (error) {

    console.log(error);

  }

  setTimeout(
    function() {

      startSample();

    },
    200
  );

}


/* ==========================================
   REJECT CALL
========================================== */

rejectCall.onclick =
  function() {

    returnToSample();

  };


/* ==========================================
   ANSWER CALL
========================================== */

answerCall.onclick =
  function() {

    hideIncomingCall();

    photosPage.style.display =
      "block";

  };
  /* ==========================================
   SAMPLE VIDEO ERROR
========================================== */

sampleVideo.addEventListener(
  "error",
  function() {

    console.error(
      "The sample video could not be loaded."
    );

    sampleTimer.textContent =
      "Sample video could not load.";

  }
);


/* ==========================================
   SAMPLE VIDEO LOADED
========================================== */

sampleVideo.addEventListener(
  "loadedmetadata",
  function() {

    console.log(
      "Sample video loaded successfully."
    );

  }
);


/* ==========================================
   SAMPLE VIDEO PLAYING
========================================== */

sampleVideo.addEventListener(
  "playing",
  function() {

    console.log(
      "Sample video is playing."
    );

  }
);


/* ==========================================
   SAMPLE VIDEO PAUSED
========================================== */

sampleVideo.addEventListener(
  "pause",
  function() {

    console.log(
      "Sample video paused."
    );

  }
);


/* ==========================================
   KEEP SAMPLE TIMER SYNCHRONIZED
========================================== */

sampleVideo.addEventListener(
  "timeupdate",
  function() {

    if (!sampleRunning) {
      return;
    }

    const currentTime =
      sampleVideo.currentTime;

    /*
      If the actual video reaches
      20 seconds, finish the sample.
    */

    if (
      currentTime >= 20
    ) {

      finishSample();

    }

  }
);


/* ==========================================
   PREVENT VIDEO FROM GOING
   BEYOND 20 SECONDS
========================================== */

sampleVideo.addEventListener(
  "timeupdate",
  function() {

    if (
      sampleVideo.currentTime >= 20
    ) {

      sampleVideo.pause();

    }

  }
);


/* ==========================================
   START WEBSITE
========================================== */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      initializeWebsite();

    }
  );

} else {

  initializeWebsite();

}


/* ==========================================
   END OF JAVASCRIPT
========================================== */
  /*
  This final section intentionally
  contains no additional functions.

  The complete JavaScript is already
  initialized by initializeWebsite()
  in Part 4.
*/


console.log(
  "My Referral Website started successfully."
);


/* ==========================================
   END SCRIPT
========================================== */

</script>

</body>
</html>
