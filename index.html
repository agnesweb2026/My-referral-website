<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

.page{
  min-height:100vh;
  width:100%;
}

.hidden{
  display:none !important;
}

/* WELCOME */
#welcomeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

.welcome-box{
  padding:25px;
}

.welcome-box h1{
  font-size:28px;
  margin-bottom:12px;
}

.welcome-box p{
  color:#aaa;
  font-size:15px;
}

/* PHOTOS */
#photosPage{
  min-height:100vh;
  background:#000;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #222;
  background:#080808;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:13px;
  color:#fff;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#20e060;
  border-radius:50%;
  margin-right:5px;
}

#photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:4px;
}

.photoCard{
  background:#111;
  border-radius:5px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:0.78;
  overflow:hidden;
  background:#151515;
}

.profile-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  z-index:3;
}

.photo-play::after{
  content:"▶";
  margin-left:3px;
}

.live-badge{
  position:absolute;
  top:7px;
  left:7px;
  background:#e60000;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  padding:4px 7px;
  border-radius:4px;
  z-index:4;
}

.offline-badge{
  position:absolute;
  top:7px;
  left:7px;
  background:#555;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  padding:4px 7px;
  border-radius:4px;
  z-index:4;
}

.photo-info{
  padding:7px 7px 9px;
  background:#101010;
}

.photo-name{
  font-size:13px;
  font-weight:bold;
  margin-bottom:4px;
}

.photo-meta{
  font-size:11px;
  color:#aaa;
}

/* INCOMING CALL */
#incomingCall{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#050505;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.call-label{
  color:#aaa;
  font-size:14px;
  margin-bottom:20px;
}

#callerImage{
  width:145px;
  height:145px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #e00000;
  margin-bottom:18px;
}

#callerName{
  font-size:25px;
  font-weight:bold;
  margin-bottom:8px;
}

.call-status{
  color:#aaa;
  font-size:14px;
  margin-bottom:45px;
}

.call-buttons{
  display:flex;
  gap:35px;
  align-items:center;
  justify-content:center;
}

.call-btn{
  width:75px;
  height:75px;
  border-radius:50%;
  border:none;
  color:#fff;
  font-size:28px;
  cursor:pointer;
}

.decline{
  background:#e00000;
}

.answer{
  background:#16a34a;
}

/* RED LIVE */
#redLiveVideoPage,
#blackLivePage{
  position:fixed;
  inset:0;
  z-index:900;
  background:#000;
}

.live-video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.red-live-label{
  position:absolute;
  top:15px;
  left:15px;
  z-index:10;
  background:#e00000;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  padding:6px 10px;
  border-radius:4px;
}

/* INSUFFICIENT */
#insufficientPage{
  position:fixed;
  inset:0;
  z-index:800;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.insufficient-box{
  width:90%;
  max-width:390px;
  border:1px solid #333;
  border-radius:12px;
  padding:30px 20px;
  background:#111;
}

.insufficient-box h2{
  color:#ff3333;
  margin-bottom:12px;
}

.insufficient-box p{
  color:#aaa;
  font-size:14px;
}

#insufficientTimer{
  margin-top:18px;
  color:#fff;
  font-size:13px;
}

/* MOBILE */
@media(max-width:600px){
  .photo-name{
    font-size:12px;
  }

  .photo-meta{
    font-size:10px;
  }

  .photo-play{
    width:40px;
    height:40px;
    font-size:17px;
  }

  #callerImage{
    width:130px;
    height:130px;
  }
}
</style>
</head>

<body>

<div id="welcomeScreen" class="page">
  <div class="welcome-box">
    <h1>Welcome</h1>
    <p>Connecting you to live profiles...</p>
  </div>
</div>

<div id="photosPage" class="page hidden">

  <div class="topbar">
    <div class="logo">LIVE</div>

    <div class="online">
      <span class="online-dot"></span>
      <span id="onlineNumber">21</span> online
    </div>
  </div>

  <div id="photoGrid"></div>

</div>
<!-- INCOMING CALL -->
<div id="incomingCall" class="hidden">

  <div class="call-label">Incoming video call</div>

  <img id="callerImage" src="photo1.jpg" alt="Caller">

  <div id="callerName">Cute</div>

  <div class="call-status">is calling you...</div>

  <div class="call-buttons">

    <button
      id="declineButton"
      class="call-btn decline"
      type="button">
      ✕
    </button>

    <button
      id="answerButton"
      class="call-btn answer"
      type="button">
      ✓
    </button>

  </div>

</div>


<!-- RED LIVE VIDEO -->
<div id="redLiveVideoPage" class="hidden">

  <div class="red-live-label">● LIVE</div>

  <video
    id="redLiveVideo"
    class="live-video"
    playsinline
    preload="auto">
  </video>

</div>


<!-- BLACK LIVE WITH SOUND -->
<div id="blackLivePage" class="hidden">

  <div class="red-live-label">● LIVE</div>

  <video
    id="blackLiveSoundVideo"
    class="live-video"
    playsinline
    preload="auto">
  </video>

</div>


<!-- INSUFFICIENT MINUTES -->
<div id="insufficientPage" class="hidden">

  <div class="insufficient-box">

    <h2>Insufficient Minutes</h2>

    <p>
      You don't have enough minutes to continue this live call.
    </p>

    <div id="insufficientTimer">
      Loading...
    </div>

  </div>

</div>


<!-- VIDEO FILE -->
<!-- Make sure preview_20_seconds.mp4 is in your GitHub repository -->

<script>
  const IMAGE_BASE =
  "https://raw.githubusercontent.com/agnesweb2026/My-referral-website/main/";

const VIDEO_URL =
  IMAGE_BASE + "preview_20_seconds.mp4";


/* =========================
   ELEMENTS
========================= */

const welcomeScreen =
  document.getElementById("welcomeScreen");

const photosPage =
  document.getElementById("photosPage");

const photoGrid =
  document.getElementById("photoGrid");

const incomingCall =
  document.getElementById("incomingCall");

const callerImage =
  document.getElementById("callerImage");

const callerName =
  document.getElementById("callerName");

const declineButton =
  document.getElementById("declineButton");

const answerButton =
  document.getElementById("answerButton");

const redLiveVideoPage =
  document.getElementById("redLiveVideoPage");

const redLiveVideo =
  document.getElementById("redLiveVideo");

const blackLivePage =
  document.getElementById("blackLivePage");

const blackLiveSoundVideo =
  document.getElementById("blackLiveSoundVideo");

const insufficientPage =
  document.getElementById("insufficientPage");

const insufficientTimer =
  document.getElementById("insufficientTimer");

const onlineNumber =
  document.getElementById("onlineNumber");


/* =========================
   REFERRAL
========================= */

const params =
  new URLSearchParams(window.location.search);

const employee =
  params.get("employee");

const ref =
  params.get("ref");


function openPaymentPage(){

  let url = "payment.html";

  if(employee){
    url += "?employee=" +
      encodeURIComponent(employee);
  }

  else if(ref){
    url += "?ref=" +
      encodeURIComponent(ref);
  }

  window.location.href = url;
}


/* =========================
   PHOTOS
========================= */

const imageFiles = [
  "photo1.jpg",
  "photo2.jpg",
  "photo4.jpg",
  "photo5.jpg",
  "1785179340825.jpg",
  "1785179340825 (1).jpg",
  "1785179362758.jpg",
  "1785179915649.jpg",
  "Screenshot_20260731-045343.png"
];

const profiles = [

  {name:"Cute",age:24,country:"Kenya",flag:"🇰🇪"},
  {name:"Becky",age:22,country:"Kenya",flag:"🇰🇪"},
  {name:"Dorry",age:26,country:"Kenya",flag:"🇰🇪"},
  {name:"Sharon",age:23,country:"Kenya",flag:"🇰🇪"},
  {name:"Lilian",age:27,country:"Kenya",flag:"🇰🇪"},

  {name:"Asha",age:25,country:"Tanzania",flag:"🇹🇿"},
  {name:"Neema",age:23,country:"Tanzania",flag:"🇹🇿"},
  {name:"Zawadi",age:28,country:"Tanzania",flag:"🇹🇿"},
  {name:"Rehema",age:24,country:"Tanzania",flag:"🇹🇿"},

  {name:"Blessing",age:22,country:"Nigeria",flag:"🇳🇬"},
  {name:"Favour",age:26,country:"Nigeria",flag:"🇳🇬"},
  {name:"Peace",age:25,country:"Nigeria",flag:"🇳🇬"},
  {name:"Joy",age:27,country:"Nigeria",flag:"🇳🇬"},

  {name:"Grace",age:24,country:"Congo",flag:"🇨🇩"},
  {name:"Mimi",age:23,country:"Congo",flag:"🇨🇩"},
  {name:"Nadia",age:26,country:"Congo",flag:"🇨🇩"},
  {name:"Bella",age:25,country:"Congo",flag:"🇨🇩"},
  {name:"Princess",age:28,country:"Congo",flag:"🇨🇩"},

  {name:"Emily",age:24,country:"Canada",flag:"🇨🇦"},
  {name:"Sophie",age:27,country:"Canada",flag:"🇨🇦"},

  {name:"Thandi",age:25,country:"South Africa",flag:"🇿🇦"},
  {name:"Lerato",age:29,country:"South Africa",flag:"🇿🇦"},

  {name:"Ashley",age:23,country:"USA",flag:"🇺🇸"},
  {name:"Jessica",age:26,country:"USA",flag:"🇺🇸"}

];


/* =========================
   CREATE PHOTO GRID
========================= */

function createPhotos(){

  photoGrid.innerHTML = "";

  profiles.forEach((profile,index)=>{

    const card =
      document.createElement("div");

    card.className = "photoCard";

    const imageFile =
      imageFiles[index % imageFiles.length];

    card.innerHTML = `

      <div class="photo-image-wrap">

        <img
          class="profile-photo"
          src="${IMAGE_BASE}${encodeURIComponent(imageFile)}"
          alt="${profile.name}"
          loading="lazy"
        >

        <div
          class="live-badge"
          id="badge-${index}">
          ● LIVE
        </div>

        <div class="photo-play"></div>

      </div>

      <div class="photo-info">

        <div class="photo-name">
          ${profile.name}
        </div>

        <div class="photo-meta">
          ${profile.flag} ${profile.country}
          • ${profile.age}
        </div>

      </div>

    `;

    card.addEventListener("click",()=>{

      openPaymentPage();

    });

    photoGrid.appendChild(card);

  });

}

createPhotos();


/* =========================
   ONLINE NUMBER
========================= */

function randomOnline(){

  const number =
    Math.floor(Math.random()*16)+15;

  onlineNumber.textContent =
    number;
}

randomOnline();


setInterval(()=>{

  randomOnline();

},Math.floor(Math.random()*25000)+15000);


/* =========================
   OFFLINE RANDOM
   5 MINUTES
========================= */

const offlineUntil = {};

function randomOffline(){

  const index =
    Math.floor(Math.random()*profiles.length);

  const badge =
    document.getElementById("badge-"+index);

  if(!badge) return;

  const now = Date.now();

  if(
    offlineUntil[index] &&
    offlineUntil[index] > now
  ){
    return;
  }

  offlineUntil[index] =
    now + (5 * 60 * 1000);

  badge.textContent =
    "OFFLINE";

  badge.className =
    "offline-badge";

  setTimeout(()=>{

    badge.textContent =
      "● LIVE";

    badge.className =
      "live-badge";

    delete offlineUntil[index];

  },5 * 60 * 1000);

}


/* Random offline approximately every 30–60 seconds */

setInterval(()=>{

  randomOffline();

},Math.floor(Math.random()*30000)+30000);


/* =========================
   CALL SYSTEM
========================= */

let firstCallAnswered = false;

let callActive = false;

const SAMPLE_KEY =
  "myReferralSampleWatched";


/* =========================
   SHOW PHOTOS
========================= */

function showPhotos(){

  welcomeScreen.classList.add("hidden");

  incomingCall.classList.add("hidden");

  redLiveVideoPage.classList.add("hidden");

  blackLivePage.classList.add("hidden");

  insufficientPage.classList.add("hidden");

  photosPage.classList.remove("hidden");

}


/* =========================
   SHOW INCOMING CALL
========================= */

function showIncomingCall(){

  photosPage.classList.add("hidden");

  incomingCall.classList.remove("hidden");

  const randomIndex =
    Math.floor(Math.random()*profiles.length);

  const profile =
    profiles[randomIndex];

  callerName.textContent =
    profile.name;

  const imageFile =
    imageFiles[randomIndex % imageFiles.length];

  callerImage.src =
    IMAGE_BASE +
    encodeURIComponent(imageFile);

}


/* =========================
   WELCOME
========================= */

setTimeout(()=>{

  showPhotos();

  /*
    Live photos remain visible
    for exactly 2 seconds.
  */

  setTimeout(()=>{

    showIncomingCall();

  },2000);

},3000);


/* =========================
   DECLINE
========================= */

declineButton.addEventListener("click",()=>{

  incomingCall.classList.add("hidden");

  showPhotos();

});


/* =========================
   ANSWER
========================= */

answerButton.addEventListener("click",()=>{

  if(callActive) return;

  callActive = true;

  incomingCall.classList.add("hidden");


  /*
    FIRST VISITOR:
    Red LIVE starts at 10 seconds
    and plays for 7 seconds.
  */

  if(!localStorage.getItem(SAMPLE_KEY)){

    firstCallAnswered = true;

    localStorage.setItem(
      SAMPLE_KEY,
      "true"
    );

    playRedLive();

  }

  else{

    /*
      RETURNING VISITOR:
      black screen for 2 seconds,
      no sound and no video.
    */

    playReturningCall();

  }

});


/* =========================
   RED LIVE
========================= */

function playRedLive(){

  redLiveVideoPage.classList.remove("hidden");

  redLiveVideo.src =
    VIDEO_URL;

  redLiveVideo.currentTime = 10;

  redLiveVideo.muted = false;

  redLiveVideo.volume = 1;

  /*
    Answer button click is user initiated,
    so play immediately.
  */

  const playPromise =
    redLiveVideo.play();

  if(playPromise){

    playPromise.catch(()=>{

      /*
        Some browsers block sound.
        The video remains available.
      */

      redLiveVideo.muted = false;

      redLiveVideo.play().catch(()=>{});

    });

  }


  /*
    Play from 10s to 17s = 7 seconds
  */

  setTimeout(()=>{

    redLiveVideo.pause();

    redLiveVideo.currentTime = 10;

    redLiveVideoPage.classList.add("hidden");

    playBlackLive();

  },7000);

}


/* =========================
   BLACK LIVE WITH SOUND
========================= */

function playBlackLive(){

  blackLivePage.classList.remove("hidden");

  blackLiveSoundVideo.src =
    VIDEO_URL;

  blackLiveSoundVideo.currentTime =
    0;

  blackLiveSoundVideo.muted =
    false;

  blackLiveSoundVideo.volume =
    1;

  const playPromise =
    blackLiveSoundVideo.play();

  if(playPromise){

    playPromise.catch(()=>{

      blackLiveSoundVideo.play()
        .catch(()=>{});

    });

  }


  setTimeout(()=>{

    blackLiveSoundVideo.pause();

    blackLiveSoundVideo.currentTime = 0;

    blackLivePage.classList.add("hidden");

    showInsufficient();

  },5000);

}


/* =========================
   RETURNING VISITOR
========================= */

function playReturningCall(){

  blackLivePage.classList.remove("hidden");

  blackLiveSoundVideo.pause();

  blackLiveSoundVideo.removeAttribute("src");

  blackLiveSoundVideo.load();

  blackLiveSoundVideo.style.background =
    "#000";

  /*
    Exactly 2 seconds black.
  */

  setTimeout(()=>{

    blackLivePage.classList.add("hidden");

    showInsufficient();

  },2000);

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(){

  insufficientPage.classList.remove("hidden");

  let seconds = 2;

  insufficientTimer.textContent =
    "Continuing...";

  const timer =
    setInterval(()=>{

      seconds--;

      if(seconds <= 0){

        clearInterval(timer);

        insufficientPage.classList.add("hidden");

        showPhotos();

      }

    },1000);

}


/* =========================
   SAFETY
========================= */

window.addEventListener("pageshow",()=>{

  /*
    Ensure the correct initial screen
    after browser back/forward cache.
  */

  if(
    !incomingCall.classList.contains("hidden") ||
    !redLiveVideoPage.classList.contains("hidden") ||
    !blackLivePage.classList.contains("hidden") ||
    !insufficientPage.classList.contains("hidden")
  ){

    return;

  }

});


/* =========================
   END
========================= */

</script>

</body>
</html>
