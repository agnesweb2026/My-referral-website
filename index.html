<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding:20px 12px;
  text-align:center;
}


/* =========================
   AGE GATE
========================= */

#ageGate{

  position:fixed;

  inset:0;

  z-index:9999;

  background:#111;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;
}

.ageBox{

  max-width:380px;

  text-align:center;
}

.ageIcon{

  font-size:60px;
}

.ageBox h1{

  margin:10px 0;
}

.ageBox p{

  color:#ccc;
}

.ageBox button{

  border:0;

  border-radius:12px;

  padding:15px 22px;

  margin:8px;

  color:#fff;

  font-weight:bold;

  font-size:15px;

  cursor:pointer;
}

.enterButton{

  background:#22c55e;
}

.exitButton{

  background:#666;
}


/* =========================
   INCOMING CALL
========================= */

#incomingCall{

  position:fixed;

  inset:0;

  z-index:9000;

  display:none;

  background:#17161b;

  align-items:center;

  justify-content:center;

  overflow:hidden;
}

.callBackground{

  position:absolute;

  inset:-30px;

  background:
    radial-gradient(
      circle,
      #5d5050 0%,
      #302b2e 45%,
      #101014 100%
    );

  filter:blur(20px);

  transform:scale(1.1);
}

.callOverlay{

  position:absolute;

  inset:0;

  background:rgba(0,0,0,.55);
}

.callContent{

  position:relative;

  z-index:2;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  height:100%;

  width:100%;
}

.profileRing{

  width:155px;

  height:155px;

  border-radius:50%;

  border:3px solid #8b5cf6;

  display:flex;

  align-items:center;

  justify-content:center;
}

.profilePhoto{

  width:125px;

  height:125px;

  border-radius:50%;

  object-fit:cover;

  background:#222;
}

.callerName{

  margin-top:15px;

  font-size:28px;

  font-weight:bold;
}

.callTitle{

  margin-top:5px;

  font-size:13px;

  color:#aaa;

  letter-spacing:1px;
}

.ringing{

  margin-top:15px;

  color:#c19cff;
}

.ringDot{

  display:inline-block;

  width:9px;

  height:9px;

  border-radius:50%;

  background:#22c55e;

  animation:blink 1s infinite;
}

@keyframes blink{

  50%{
    opacity:.2;
  }

}

.callButtons{

  display:flex;

  gap:70px;

  margin-top:100px;
}

.callOption{

  text-align:center;
}

.callButton{

  width:78px;

  height:78px;

  border:0;

  border-radius:50%;

  color:#fff;

  font-size:30px;

  cursor:pointer;
}

.declineButton{

  background:#ed3b3b;
}

.answerButton{

  background:#14a94b;
}

.callLabel{

  margin-top:8px;

  color:#ccc;
}


/* =========================
   VIDEO SAMPLE
========================= */

#videoPreview{

  position:fixed;

  inset:0;

  z-index:9500;

  background:#000;

  display:none;

  align-items:center;

  justify-content:center;
}

#previewVideo{

  width:100%;

  height:100%;

  object-fit:contain;
}

.previewCounter{

  position:absolute;

  bottom:20px;

  left:0;

  right:0;

  color:#fff;

  font-size:18px;

  text-shadow:0 1px 4px #000;
}


/* =========================
   INSUFFICIENT MINUTES
========================= */

#insufficientScreen{

  position:fixed;

  inset:0;

  z-index:9800;

  display:none;

  align-items:center;

  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #302342 0%,
      #111018 45%,
      #050507 100%
    );

  padding:25px;
}

.insufficientBox{

  width:100%;

  max-width:390px;

  background:#fff;

  color:#111;

  border-radius:24px;

  padding:35px 25px;

  box-shadow:
    0 10px 40px rgba(0,0,0,.5);

  text-align:center;
}

.insufficientIcon{

  font-size:55px;

  margin-bottom:10px;
}

.insufficientBox h1{

  margin:8px 0;

  font-size:30px;
}

.insufficientBox p{

  margin:10px 0 0;

  color:#777;

  font-size:16px;
}

.insufficientLoader{

  width:35px;

  height:35px;

  margin:25px auto 0;

  border:4px solid #ddd;

  border-top-color:#8b5cf6;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   MAIN PAGE
========================= */

.pageTitle{

  margin:10px 0;
}

.pageText{

  color:#ccc;
}


/* =========================
   GALLERY
========================= */

#gallery{

  display:none;

  grid-template-columns:1fr 1fr;

  gap:18px;

  margin-top:25px;
}

.photoCard{

  position:relative;

  height:230px;

  background:#111;

  border-radius:14px;

  overflow:hidden;

  cursor:pointer;

  border:1px solid #222;
}

.photoCard img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;
}

.liveBadge{

  position:absolute;

  top:9px;

  left:9px;

  z-index:2;

  background:#f0184c;

  color:#fff;

  padding:7px 10px;

  border-radius:8px;

  font-size:12px;

  font-weight:bold;
}

.liveStatus{

  left:9px;

  right:9px;

  bottom:9px;

  z-index:2;

  background:rgba(0,0,0,.82);

  padding:8px;
