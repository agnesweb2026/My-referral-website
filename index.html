function stopBackgroundSound(){

/* SHUFFLE */

function shuffleArray(array){

const arr =
[...array];

for(
let i=arr.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()*(i+1)
);

[
arr[i],
arr[j]
]=
[
arr[j],
arr[i]
];

}

return arr;

}


/* GITHUB */

async function getGitHubContents(
path=""
){

const url =
`https://api.github.com/repos/` +
`${GITHUB_OWNER}/${GITHUB_REPO}` +
`/contents/${path}?ref=${GITHUB_BRANCH}`;

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"GitHub request failed"
);

}

return await response.json();

}


/* IMAGE CHECK */

function isImageFile(name){

return /\.(jpg|jpeg|png|webp|gif)$/i
.test(name);

}


/* COLLECT IMAGES */

async function collectImages(
path="",
result=[]
){

const items =
await getGitHubContents(
path
);

for(
const item of items
){

if(
item.type === "file" &&
isImageFile(item.name)
){

result.push(
item.path
);

}

if(item.type === "dir"){

await collectImages(
item.path,
result
);

}

if(
result.length >=
MAX_PHOTOS
){

break;

}

}

return result;

}


/* FILE URL */

function getFileUrl(path){

return (
"https://raw.githubusercontent.com/" +
GITHUB_OWNER + "/" +
GITHUB_REPO + "/" +
GITHUB_BRANCH + "/" +
path
);

}

try{

imagePaths =
await collectImages(
"",
[]
);

}catch(error){

console.error(error);
return;

}

imagePaths =
imagePaths.slice(
0,
MAX_PHOTOS
);

photosData =
imagePaths.map(
(path,index)=>({

path:path,

url:
getFileUrl(path),

name:
names[index] ||
`User ${index+1}`,

age:
ages[index] ||
25,

country:
countries[index] ||
{
name:"Kenya",
flag:"🇰🇪"
}

})
);

}
 /* =========================

path="",
result=[]
){

let items = [];

try{

items =
await getGitHubContents(
path
);

}catch(error){

console.error(
"Audio folder error:",
error
);

return result;

}


for(
const item of items
){

/*
FILE
*/

if(
item.type === "file" &&
AUDIO_EXTENSIONS.test(item.name)
){

result.push(
item.path
);

}


/*
FOLDER
*/

if(
item.type === "dir"
){

await collectAudioFiles(
item.path,
result
);

}

}


return result;

}


/* LOAD RANDOM SOUNDS */

async function loadRandomSounds(){

try{

randomSounds =
await collectAudioFiles(
"",
[]
);

console.log(
"Uploaded sounds found:",
randomSounds
);

}catch(error){

console.error(
"Could not load sounds:",
error
);

randomSounds = [];

}

}


/* GET RANDOM SOUND */

function getRandomSound(){

if(
!randomSounds.length
){

return null;

}


let randomIndex =
Math.floor(
Math.random() *
randomSounds.length
);


/*
Do not use exactly
the same sound twice
in a row.
*/

if(
randomSounds.length > 1 &&
randomSounds[randomIndex] ===
currentRandomSound
){

randomIndex =
(randomIndex + 1) %
randomSounds.length;

}


currentRandomSound =
randomSounds[randomIndex];

return currentRandomSound;

}


/* PLAY RANDOM SOUND */

function playRandomSound(){

const soundPath =
getRandomSound();


if(!soundPath){

console.log(
"No uploaded audio files found."
);

return;

}


const soundUrl =
getFileUrl(
soundPath
);


console.log(
"Playing random sound:",
soundPath
);


try{

backgroundSound.pause();

backgroundSound.currentTime =
0;

backgroundSound.src =
soundUrl;

backgroundSound.load();

backgroundSound.volume =
1;


/*
Play sound
*/

const playPromise =
backgroundSound.play();


if(playPromise){

playPromise.catch(
function(error){

console.log(
"Audio play blocked:",
error
);

}
);

}

}catch(error){

console.error(
"Sound playback error:",
error
);

}

}


/* RANDOM BUSY */

function getRandomBusyIndexes(){

const indexes = [];

for(
let i=0;
i<MAX_PHOTOS;
i++
){

indexes.push(i);

}

return shuffleArray(
indexes
).slice(0,5);

}

"block";


if(!photosData.length){

return;

}


let randomIndex =
Math.floor(
Math.random() *
photosData.length
);


currentCaller =
photosData[randomIndex];


callerImage.src =
currentCaller.url;

callerName.textContent =
currentCaller.name;

}


/* =========================
   RED LIVE
========================= */

function showLiveSound(){

clearAllTimers();

stopBackgroundSound();

hideAllPages();

liveSoundPage.style.display =
"flex";


/*
Video has no sound.
Random uploaded audio
will provide the sound.
*/

try{

liveSoundVideo.muted =
true;

liveSoundVideo.currentTime =
0;

liveSoundVideo.volume =
0;

const playPromise =
liveSoundVideo.play();

if(playPromise){

playPromise.catch(
function(){}
);

}

}catch(e){}


/*
PLAY RANDOM UPLOADED SOUND
*/

playRandomSound();


/*
Keep Red LIVE alive
for the same duration.
*/

soundTimer =
setTimeout(
function(){

stopBackgroundSound();

stopLiveVideo();

showInsufficient();

},
SECOND_CALL_SOUND_DURATION
);

  }
  /* =========================
   BLACK LIVE
========================= */

function showBlackLive(){

clearAllTimers();

stopLiveVideo();

stopBackgroundSound();

hideAllPages();

blackLivePage.style.display =
"flex";


/*
Every Black LIVE call
gets a random uploaded sound.
*/

playRandomSound();


soundTimer =
setTimeout(
function(){

showInsufficient();

},
SECOND_CALL_SOUND_DURATION
);

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(){

stopLiveVideo();

stopBackgroundSound();

hideAllPages();

insufficientPage.style.display =

insufficientTimer =

},
INSUFFICIENT_DURATION
);

}


/* =========================
   ANSWER
========================= */

function answerIncomingCall(){

clearAllTimers();


if(
!redLiveShownThisVisit
){

redLiveShownThisVisit =
true;

localStorage.setItem(
RED_LIVE_KEY,
"yes"
);

showLiveSound();

}else{

showBlackLive();

}

}


/* =========================
   DECLINE
========================= */

function declineIncomingCall(){

clearAllTimers();

stopLiveVideo();

stopBackgroundSound();

showLivePhotos();

}


/* =========================
   SWIPE
========================= */

function enableSwipe(
element,
direction,
action
){

let startX = 0;
let startY = 0;


element.addEventListener(
"touchstart",
function(e){

if(
!e.touches.length
){

return;

}

startX =
e.touches[0].clientX;

startY =
e.touches[0].clientY;

},
{passive:true}
);


element.addEventListener(
"touchend",
function(e){

if(
!e.changedTouches.length
){

return;

}

const endX =
e.changedTouches[0].clientX;

const endY =
e.changedTouches[0].clientY;


const dx =
endX - startX;

const dy =
endY - startY;


if(
Math.abs(dy) >
Math.abs(dx)
){

return;

}


if(
Math.abs(dx) < 80
){

return;

}


if(
direction === "left" &&
dx < 0
){

action();

}


if(
direction === "right" &&
dx > 0
){

action();

}

},
{passive:true}
);


/* DECLINE */

}

enableSwipe(
declineSwipe,
"left",
function(){

declineIncomingCall();

}
);


/* ANSWER */

enableSwipe(
answerSwipe,
"right",
function(){

answerIncomingCall();

}
);


/* =========================
   PAYMENT RETURN
========================= */

function checkPaymentReturn(){

const returning =
sessionStorage.getItem(
"returnToLivePhotos"
);


if(
returning === "yes"
){

sessionStorage.removeItem(
"returnToLivePhotos"
);


setTimeout(
function(){

showLivePhotos();

},
100
);


return true;

}


return false;

}


/* =========================
   START WEBSITE
========================= */

async function startWebsite(){

if(
checkPaymentReturn()
){

websiteStarted =
true;

return;

}


hideAllPages();

welcomeScreen.style.display =
"flex";


await Promise.all([

loadPhotos(),

new Promise(
function(resolve){

setTimeout(
resolve,
3000
);

}

)

]);


welcomeScreen.style.display =
"none";


/*
FIRST CALL
*/

showIncomingCall();

websiteStarted =
true;

}


/* =========================
   ONLINE NUMBER
========================= */

setInterval(
function(){

updateOnlineNumber();

},
10000
);


/* =========================
   PREPARE VIDEO
========================= */

function prepareVideo(){

try{

liveSoundVideo.load();

}catch(e){}

}


/* =========================
   PREPARE AUDIO
========================= */

function prepareAudio(){

try{

backgroundSound.load();

}catch(e){}

}


/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
"pageshow",
function(){

stopBackgroundSound();

stopLiveVideo();


if(!websiteStarted){

return;

}


if(
sessionStorage.getItem(
"returnToLivePhotos"
) === "yes"
){

sessionStorage.removeItem(
"returnToLivePhotos"
);


setTimeout(
function(){

showLivePhotos();

},
50
);

}

}
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
"visibilitychange",
function(){

if(
document.hidden
){

stopBackgroundSound();

}

}
);


/* =========================
   CLOSE
========================= */

window.addEventListener(
"beforeunload",
function(){

stopBackgroundSound();

stopLiveVideo();

}
);


/* =========================
   START
========================= */

window.addEventListener(
"load",
async function(){

prepareVideo();

prepareAudio();


/*
WAIT FOR ALL UPLOADED
SOUNDS TO BE FOUND
*/

await loadRandomSounds();


startWebsite();

}
);

</script>
