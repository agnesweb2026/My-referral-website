<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referral Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.page{
  position:fixed;
  inset:0;
  display:none;
  background:#000;
}

#samplePage{
  display:flex;
  align-items:center;
  justify-content:center;
}

#sampleVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

#loadingPage{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000;
  z-index:20;
}

.loader{
  width:48px;
  height:48px;
  border:4px solid rgba(255,255,255,.2);
  border-top:4px solid #fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loading-text{
  margin-top:18px;
  font-size:20px;
  font-weight:bold;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* INSUFFICIENT */
#insufficientPage{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.insufficient-box{
  width:90%;
  max-width:380px;
  padding:28px 20px;
  border-radius:18px;
  background:#111;
  border:1px solid #333;
}

.insufficient-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:12px;
}

.insufficient-text{
  color:#bbb;
  font-size:15px;
}

/* PHOTOS */
#photosPage{
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:30px;
}

.photos-header{
  position:sticky;
  top:0;
  z-index:50;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:rgba(0,0,0,.94);
  border-bottom:1px solid #222;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.online-status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#ddd;
}

.live-dot{
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 8px #22c55e;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.photos-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:8px;
}

.photo-card{
  position:relative;
  height:245px;
  overflow:hidden;
  border-radius:10px;
  background:#111;
  cursor:pointer;
}

.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.live-badge{
  position:absolute;
  top:9px;
  left:9px;
  background:#e60000;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:5px 8px;
  border-radius:5px;
  z-index:3;
}

.photo-live-dot{
  position:absolute;
  top:11px;
  right:10px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#20c55a;
  box-shadow:0 0 9px #20c55a;
  animation:photoDotBlink 1.2s infinite;
  z-index:3;
}

@keyframes photoDotBlink{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.4;
    transform:scale(.8);
  }
}

.photo-video-icon{
  position:absolute;
  right:9px;
  bottom:42px;
  width:34px;
  height:28px;
  border-radius:7px;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  z-index:3;
}

.photo-name{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:20px 10px 10px;
  background:linear-gradient(transparent,rgba(0,0,0,.9));
  font-size:15px;
  font-weight:bold;
  z-index:2;
}

/* BLACK 2 SECOND LIVE SOUND SCREEN */
#liveSoundScreen{
  position:fixed;
  inset:0;
  z-index:100000;
  display:none;
  background:#000;
  align-items:flex-start;
  justify-content:center;
}

.live-top{
  margin-top:18px;
  background:#e00000;
  padding:7px 12px;
  border-radius:6px;
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:7px;
}

.live-red-dot{
  width:9px;
  height:9px;
  background:#fff;
  border-radius:50%;
  animation:redBlink .8s infinite;
}

@keyframes redBlink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

/* INCOMING CALL */
#incomingCall{
  z-index:90000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.incoming-background{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(18px) brightness(.35);
  transform:scale(1.1);
}

.incoming-content{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.incoming-label{
  font-size:15px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:20px;
}

.caller-photo-wrap{
  position:relative;
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

.call-ring{
  position:absolute;
  width:190px;
  height:190px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:50%;
  animation:ring 1.6s infinite;
}

.call-ring:nth-child(2){
  animation-delay:.5s;
}

@keyframes ring{
  0%{
    transform:scale(.9);
    opacity:.9;
  }
  100%{
    transform:scale(1.35);
    opacity:0;
  }
}

.caller-photo{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #fff;
  position:relative;
  z-index:2;
  animation:callerZoom 2s infinite alternate;
}

@keyframes callerZoom{
  from{transform:scale(1)}
  to{transform:scale(1.04)}
}

.caller-name{
  font-size:27px;
  font-weight:bold;
  margin-bottom:8px;
}

.ringing{
  font-size:15px;
  color:#ddd;
  margin-bottom:35px;
}

.call-buttons{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:60px;
}

.call-button{
  width:72px;
  height:72px;
  border-radius:50%;
  border:0;
  color:#fff;
  font-size:29px;
  cursor:pointer;
}

.decline{
  background:#e11d48;
}

.answer{
  background:#16a34a;
}

/* MOBILE */
@media(max-width:500px){
  .photo-card{
    height:235px;
  }

  .caller-photo-wrap{
    width:175px;
    height:175px;
  }

  .call-ring{
    width:175px;
    height:175px;
  }

  .caller-photo{
    width:138px;
    height:138px;
  }

  .caller-name{
    font-size:24px;
  }

  .call-buttons{
    gap:50px;
  }
}
</style>
</head>

<body>

<!-- SAMPLE VIDEO -->
<section id="samplePage" class="page">
  <video
    id="sampleVideo"
    autoplay
    muted
    playsinline
    preload="auto">
    <source src="preview_20_seconds.mp4" type="video/mp4">
  </video>
</section>


<!-- LOADING -->
<section id="loadingPage" class="page">
  <div class="loader"></div>
  <div class="loading-text">Connecting...</div>
</section>


<!-- INSUFFICIENT -->
<section id="insufficientPage" class="page">
  <div class="insufficient-box">
    <div class="insufficient-title">
      Insufficient Minutes
    </div>

    <div class="insufficient-text">
      You do not have enough minutes to continue this video call.
    </div>
  </div>
</section>


<!-- LIVE PHOTOS -->
<section id="photosPage" class="page">

  <div class="photos-header">
    <div class="logo">LIVE</div>

    <div class="online-status">
      <span class="live-dot"></span>
      <span id="onlineCount">19</span>
      online
    </div>
  </div>

  <div id="photosGrid" class="photos-grid"></div>

</section>


<!-- INCOMING CALL -->
<section id="incomingCall" class="page">

  <div
    id="incomingBackground"
    class="incoming-background">
  </div>

  <div class="incoming-content">

    <div class="incoming-label">
      INCOMING VIDEO CALL
    </div>

    <div class="caller-photo-wrap">

      <div class="call-ring"></div>
      <div class="call-ring"></div>

      <img
        id="callerPhoto"
        class="caller-photo"
        src=""
        alt="">
    </div>

    <div
      id="callerName"
      class="caller-name">
      Cute
    </div>

    <div class="ringing">
      Ringing...
    </div>

    <div class="call-buttons">

      <button
        id="declineButton"
        class="call-button decline">
        ✕
      </button>

      <button
        id="answerButton"
        class="call-button answer">
        ✓
      </button>

    </div>

  </div>
</section>


<!-- 2 SECOND BLACK LIVE SOUND -->
<div id="liveSoundScreen">

  <div class="live-top">
    <span class="live-red-dot"></span>
    LIVE
  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const GITHUB_OWNER = "agnesweb2026";
const GITHUB_REPO = "My-referral-website";
const GITHUB_BRANCH = "main";

const PAYMENT_PAGE_URL = "payment.html";

const SAMPLE_VIDEO = "preview_20_seconds.mp4";

const INSUFFICIENT_DURATION = 2000;
const LIVE_SOUND_DURATION = 2000;

const FLOW_STARTED_KEY = "myReferralFlowStarted";
const SOUND_PLAYED_KEY = "incomingSoundPlayed";


/* =========================
   ELEMENTS
========================= */

const samplePage =
  document.getElementById("samplePage");

const sampleVideo =
  document.getElementById("sampleVideo");

const loadingPage =
  document.getElementById("loadingPage");

const insufficientPage =
  document.getElementById("insufficientPage");

const photosPage =
  document.getElementById("photosPage");

const incomingCall =
  document.getElementById("incomingCall");

const liveSoundScreen =
  document.getElementById("liveSoundScreen");

const incomingBackground =
  document.getElementById("incomingBackground");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerName =
  document.getElementById("callerName");

const answerButton =
  document.getElementById("answerButton");

const declineButton =
  document.getElementById("declineButton");

const photosGrid =
  document.getElementById("photosGrid");

const onlineCount =
  document.getElementById("onlineCount");


/* =========================
   PHOTO NAMES
========================= */

const photoNames = [
  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Mercy",
  "Brenda",
  "Sharon",
  "Diana",
  "Lucy",
  "Ann",
  "Carol",
  "Faith",
  "Lydia",
  "Nancy",
  "Esther",
  "Joy",
  "Rose",
  "Mary",
  "Cindy",
  "Betty",
  "Vicky",
  "Milly",
  "Susan",
  "Fellow"
];


/* =========================
   STATE
========================= */

let photos = [];
let usedCallerPhotos = [];
let currentCaller = null;


/* =========================
   HIDE EVERYTHING
========================= */

function hideAllPages(){

  samplePage.style.display = "none";
  loadingPage.style.display = "none";
  insufficientPage.style.display = "none";
  photosPage.style.display = "none";
  incomingCall.style.display = "none";

}


/* =========================
   LOADING
========================= */

function showLoading(){

  hideAllPages();

  loadingPage.style.display = "flex";

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficientThenPhotos(){

  hideAllPages();

  insufficientPage.style.display = "flex";

  setTimeout(() => {

    showLivePhotos();

  }, INSUFFICIENT_DURATION);

}


/* =========================
   LIVE PHOTOS
========================= */

function showLivePhotos(){

  hideAllPages();

  shufflePhotos();

  renderPhotos();

  photosPage.style.display = "block";

}


/* =========================
   SHUFFLE PHOTOS
========================= */

function shufflePhotos(){

  photos = photos.sort(() => Math.random() - 0.5);

}


/* =========================
   RENDER PHOTOS
========================= */

function renderPhotos(){

  photosGrid.innerHTML = "";

  photos.forEach((photo) => {

    const card =
      document.createElement("div");

    card.className = "photo-card";

    card.innerHTML = `

      <img
        src="${photo.url}"
        alt="${photo.name}"
        loading="lazy">

      <div class="live-badge">
        LIVE
      </div>

      <div class="photo-live-dot"></div>

      <div class="photo-video-icon">
        ▶
      </div>

      <div class="photo-name">
        ${photo.name}
      </div>

    `;

    /* EVERY PHOTO GOES TO PAYMENT */

    card.addEventListener("click", () => {

      window.location.href =
        PAYMENT_PAGE_URL;

    });

    photosGrid.appendChild(card);

  });

}


/* =========================
   GET GITHUB PHOTOS
========================= */

async function loadPhotos(){

  try{

    const apiUrl =
      `https://api.github.com/repos/` +
      `${GITHUB_OWNER}/${GITHUB_REPO}/contents/` +
      `?ref=${GITHUB_BRANCH}`;

    const response =
      await fetch(apiUrl);

    if(!response.ok){
      throw new Error("GitHub request failed");
    }

    const files =
      await response.json();

    const imageFiles =
      files.filter(file => {

        if(file.type !== "file"){
          return false;
        }

        const name =
          file.name.toLowerCase();

        return (
          name.endsWith(".jpg") ||
          name.endsWith(".jpeg") ||
          name.endsWith(".png") ||
          name.endsWith(".webp")
        );

      });

    photos =
      imageFiles.map((file,index) => {

        return {
          url:file.download_url,
          name:photoNames[
            index % photoNames.length
          ]
        };

      });

    shufflePhotos();
    renderPhotos();

  }catch(error){

    console.error(
      "Could not load photos:",
      error
    );

  }

}


/* =========================
   RANDOM CALLER
========================= */

function chooseCaller(){

  if(photos.length === 0){
    return null;
  }

  /* RESET WHEN ALL PHOTOS HAVE BEEN USED */

  if(
    usedCallerPhotos.length >= photos.length
  ){

    usedCallerPhotos = [];

  }

  let available =
    photos.filter(
      photo =>
        !usedCallerPhotos.includes(photo.url)
    );

  if(available.length === 0){
    available = photos;
  }

  const selected =
    available[
      Math.floor(
        Math.random() * available.length
      )
    ];

  usedCallerPhotos.push(selected.url);

  return selected;

}


/* =========================
   SHOW INCOMING CALL
========================= */

function showIncomingCall(){

  const caller =
    chooseCaller();

  if(!caller){

    showLivePhotos();

    return;

  }

  currentCaller = caller;

  callerPhoto.src =
    caller.url;

  incomingBackground.style.backgroundImage =
    `url("${caller.url}")`;

  callerName.textContent =
    caller.name;

  hideAllPages();

  incomingCall.style.display =
    "flex";

}


/* =========================
   BLACK LIVE SOUND SCREEN
========================= */

async function playLiveSound(){

  hideAllPages();

  liveSoundScreen.style.display =
    "flex";

  /*
    Reuse the SAME sample video.
    The screen stays black, so only
    its sound is heard.
  */

  try{

    sampleVideo.pause();

    sampleVideo.currentTime = 0;

    sampleVideo.muted = false;

    sampleVideo.volume = 1;

    const playPromise =
      sampleVideo.play();

    if(playPromise){
      await playPromise;
    }

  }catch(error){

    console.log(
      "Audio autoplay was blocked:",
      error
    );

  }

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        LIVE_SOUND_DURATION
      )
  );

  sampleVideo.pause();

  sampleVideo.muted = true;

  sampleVideo.currentTime = 0;

  liveSoundScreen.style.display =
    "none";

}


/* =========================
   ANSWER
========================= */

answerButton.addEventListener(
  "click",
  async () => {

    /*
      SOUND ONLY ONCE PER NEW VISIT/SESSION
    */

    const soundAlreadyPlayed =
      sessionStorage.getItem(
        SOUND_PLAYED_KEY
      );

    if(!soundAlreadyPlayed){

      sessionStorage.setItem(
        SOUND_PLAYED_KEY,
        "true"
      );

      await playLiveSound();

    }else{

      hideAllPages();

    }

    /*
      AFTER ANSWER:
      INSUFFICIENT -> LIVE PHOTOS
    */

    showInsufficientThenPhotos();

  }
);


/* =========================
   DECLINE
========================= */

declineButton.addEventListener(
  "click",
  () => {

    /*
      Declining skips insufficient
      and opens live photos.
    */

    showLivePhotos();

  }
);


/* =========================
   SAMPLE FINISHED
========================= */

sampleVideo.addEventListener(
  "ended",
  () => {

    /*
      Remember that this visitor
      already watched the sample.
    */

    localStorage.setItem(
      FLOW_STARTED_KEY,
      "true"
    );

    /*
      Sample is finished.
      Show the incoming call.
    */

    showIncomingCall();

  }
);


/* =========================
   START FLOW
========================= */

function startMainFlow(){

  const flowStarted =
    localStorage.getItem(
      FLOW_STARTED_KEY
    );

  if(!flowStarted){

    /*
      NEW VISITOR:
      SAMPLE FIRST
    */

    hideAllPages();

    samplePage.style.display =
      "flex";

    sampleVideo.muted = true;

    const playPromise =
      sampleVideo.play();

    if(playPromise){

      playPromise.catch(
        error => {
          console.log(
            "Sample autoplay blocked:",
            error
          );
        }
      );

    }

  }else{

    /*
      RETURNING VISITOR:
      DIRECTLY TO INCOMING CALL
    */

    showIncomingCall();

  }

}


/* =========================
   ONLINE NUMBER
========================= */

function updateOnlineNumber(){

  const numbers = [
    15,
    17,
    18,
    19,
    20,
    21,
    22
  ];

  const number =
    numbers[
      Math.floor(
        Math.random() *
        numbers.length
      )
    ];

  onlineCount.textContent =
    number;

}

setInterval(
  updateOnlineNumber,
  5000
);

updateOnlineNumber();


/* =========================
   START
========================= */

loadPhotos();

startMainFlow();

</script>

</body>
  </html>
