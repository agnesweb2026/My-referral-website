<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 15px;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.card {
  max-width: 450px;
  margin: auto;
}

h1 {
  margin-top: 10px;
}

p {
  color: #ccc;
}

/* AGE GATE */

#ageGate {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.age-box {
  max-width: 380px;
  text-align: center;
}

.age-icon {
  font-size: 60px;
}

.age-box button {
  border: 0;
  border-radius: 10px;
  padding: 14px 22px;
  margin: 8px;
  color: #fff;
  font-weight: bold;
  font-size: 15px;
}

.enter-button {
  background: #22c55e;
}

.exit-button {
  background: #666;
}

/* INCOMING CALL */

#incomingCall {
  position: fixed;
  inset: 0;
  z-index: 90000;
  display: none;
  background: #17161b;
  overflow: hidden;
}

.call-background {
  position: absolute;
  inset: -30px;
  background:
    radial-gradient(
      circle at center,
      #5d5050 0%,
      #302b2e 45%,
      #101014 100%
    );
  filter: blur(20px);
  transform: scale(1.1);
}

.call-dark-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
}

.call-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.profile-ring {
  width: 155px;
  height: 155px;
  border-radius: 50%;
  border: 2px solid rgba(125,80,210,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 7px rgba(125,80,210,.08);
}

.profile-photo {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  border: 3px solid #7650c9;
  object-fit: cover;
  background: #211d26;
}

.caller-name {
  margin-top: 12px;
  font-size: 28px;
}

.call-title {
  margin-top: 5px;
  font-size: 13px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.65);
}

.ringing {
  margin-top: 16px;
  color: #b98cff;
}

.ringing-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #a66cff;
  margin-right: 6px;
  animation: ringBlink 1s infinite;
}

@keyframes ringBlink {
  50% {
    opacity: .2;
  }
}

.call-buttons {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 95px;
  display: flex;
  justify-content: center;
  gap: 70px;
}

.call-option {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.call-button {
  width: 78px;
  height: 78px;
  border: 3px solid rgba(255,255,255,.18);
  border-radius: 50%;
  color: #fff;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.decline-button {
  background: #ed3b3b;
}

.answer-button {
  background: #14a94b;
}

.call-label {
  margin-top: 8px;
  color: rgba(255,255,255,.72);
}

.swipe-message {
  position: absolute;
  bottom: 38px;
  color: rgba(255,255,255,.3);
  font-size: 12px;
}

/* VIDEO */

#videoPreview {
  position: fixed;
  inset: 0;
  z-index: 80000;
  display: none;
  background: #000;
  align-items: center;
  justify-content: center;
}

#previewVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.preview-counter {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  color: #fff;
  text-shadow: 0 1px 3px #000;
}

/* MINUTES */

#insufficientMinutes {
  position: fixed;
  inset: 0;
  z-index: 85000;
  display: none;
  background: #111;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.insufficient-box {
  max-width: 350px;
}

/* GALLERY */

#livePhotos {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 25px;
}

.live-photo {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #111;
  cursor: pointer;
  min-height: 210px;
}

.live-photo img {
  display: block;
  width: 100%;
  height: 210px;
  object-fit: cover;
  background: #111;
}

/* LIVE */

.live-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 5;
  background: #f0184c;
  color: #fff;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.live-badge::before {
  content: "●";
  margin-right: 5px;
}

.live-status {
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: calc(100% - 16px);
  background: rgba(0,0,0,.82);
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  white-space: nowrap;
}

.live-dot {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #22c55e;
  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {
  50% {
    opacity: .2;
  }
}

.loading {
  grid-column: 1 / -1;
  padding: 30px;
  color: #aaa;
}

.error {
  grid-column: 1 / -1;
  padding: 30px;
  color: #ff6b6b;
}

/* MOBILE */

@media (max-width: 380px) {

  #livePhotos {
    gap: 12px;
  }

  .live-photo {
    min-height: 170px;
  }

  .live-photo img {
    height: 170px;
  }

  .call-buttons {
    gap: 55px;
  }

  .call-button {
    width: 70px;
    height: 70px;
  }
}
</style>
</head>

<body>

<!-- AGE GATE -->

<div id="ageGate">

  <div class="age-box">

    <div class="age-icon">🔞</div>

    <h1>18+ ONLY</h1>

    <p>
      You must be 18 years or older to enter.
    </p>

    <button
      class="enter-button"
      onclick="enterSite()">

      I AM 18+ — ENTER

    </button>

    <button
      class="exit-button"
      onclick="leaveSite()">

      EXIT

    </button>

  </div>

</div>


<!-- INCOMING CALL -->

<div id="incomingCall">

  <div class="call-background"></div>

  <div class="call-dark-overlay"></div>

  <div class="call-content">

    <div class="profile-ring">

      <img
        id="callerPhoto"
        class="profile-photo"
        src=""
        alt="Caller">

    </div>

    <div
      id="callerName"
      class="caller-name">

      Caller

    </div>

    <div class="call-title">

      INCOMING VIDEO CALL

    </div>

    <div class="ringing">

      <span class="ringing-dot"></span>

      Ringing...

    </div>

    <div class="call-buttons">

      <div class="call-option">

        <button
          id="declineCall"
          class="call-button decline-button">

          ☎

        </button>

        <div class="call-label">
          Decline
        </div>

      </div>

      <div class="call-option">

        <button
          id="answerCall"
          class="call-button answer-button">

          ☎

        </button>

        <div class="call-label">
          Answer
        </div>

      </div>

    </div>

    <div class="swipe-message">

      SWIPE UP TO MESSAGE

    </div>

  </div>

</div>


<!-- VIDEO PREVIEW -->

<div id="videoPreview">

  <video
    id="previewVideo"
    autoplay
    muted
    playsinline>

    <source
      src="/preview_20_seconds.mp4"
      type="video/mp4">

  </video>

  <div class="preview-counter">

    Preview:
    <span id="previewSeconds">
      20
    </span>
    seconds

  </div>

</div>


<!-- INSUFFICIENT MINUTES -->

<div id="insufficientMinutes">

  <div class="insufficient-box">

    <h2>
      INSUFFICIENT MINUTES
    </h2>

    <p>
      Your preview has ended.
    </p>

    <p>
      Please purchase minutes to continue.
    </p>

  </div>

</div>


<!-- MAIN WEBSITE -->

<div class="card">

  <h1>
    Welcome
  </h1>

  <p>
    Welcome to my referral website.
  </p>

  <div id="livePhotos">

    <div class="loading">
      Loading photos...
    </div>

  </div>

</div>


<script>

/* =====================================================
   GITHUB SETTINGS
===================================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";

const GALLERY_FOLDER =
  "gallery";


/* =====================================================
   MAXIMUM PHOTOS
===================================================== */

const MAX_PHOTOS = 24;


/* =====================================================
   SAMPLE
===================================================== */

const SAMPLE_LINK_ID =
  "referral-001";

const SAMPLE_WATCHED_KEY =
  "sampleWatched_" +
  SAMPLE_LINK_ID;


/* =====================================================
   VARIABLES
===================================================== */

let callers = [];

let lastCaller = -1;


/* =====================================================
   ELEMENTS
===================================================== */

const ageGate =
  document.getElementById(
    "ageGate"
  );

const incomingCall =
  document.getElementById(
    "incomingCall"
  );

const callerPhoto =
  document.getElementById(
    "callerPhoto"
  );

const callerName =
  document.getElementById(
    "callerName"
  );

const videoPreview =
  document.getElementById(
    "videoPreview"
  );

const previewVideo =
  document.getElementById(
    "previewVideo"
  );

const previewSeconds =
  document.getElementById(
    "previewSeconds"
  );

const insufficientMinutes =
  document.getElementById(
    "insufficientMinutes"
  );

const livePhotos =
  document.getElementById(
    "livePhotos"
  );

const answerCall =
  document.getElementById(
    "answerCall"
  );

const declineCall =
  document.getElementById(
    "declineCall"
  );


/* =====================================================
   CLEAN FILE NAME
===================================================== */

function makeDisplayName(filename) {

  return filename
    .replace(/\.[^/.]+$/, "")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array) {

  const shuffled =
    [...array];

  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];

  }

  return shuffled;

}


/* =====================================================
   LOAD PHOTOS FROM GITHUB
===================================================== */

async function loadPhotos() {

  livePhotos.innerHTML = `

    <div class="loading">
      Loading photos...
    </div>

  `;


  const apiUrl =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/" +
    GALLERY_FOLDER +
    "?ref=" +
    GITHUB_BRANCH;


  try {

    const response =
      await fetch(
        apiUrl,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub gallery could not be loaded. HTTP " +
        response.status
      );

    }


    const files =
      await response.json();


    if (!Array.isArray(files)) {

      throw new Error(
        "Gallery folder did not return files."
      );

    }


    /* ONLY IMAGE FILES */

    const imageFiles =
      files.filter(
        function(file) {

          return (
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
              .test(file.name)
          );

        }
      );


    /* MAXIMUM 24 PHOTOS */

    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    if (selectedFiles.length === 0) {

      livePhotos.innerHTML = `

        <div class="error">

          No photos found.

          <br><br>

          Make sure your photos are inside:

          <br>

          <b>gallery</b>

        </div>

      `;

      return;

    }


    /* CREATE CALLER OBJECTS */

    callers =
      selectedFiles.map(
        function(file) {

          return {

            name:
              makeDisplayName(
                file.name
              ),

            photo:
              file.download_url

          };

        }
      );


    /* RANDOMIZE */

    callers =
      shuffleArray(
        callers
      );


    /* CREATE GALLERY */

    createGallery();


    /* SHOW RANDOM CALLER */

    showRandomCaller();


  } catch (error) {

    console.error(
      "Gallery error:",
      error
    );


    livePhotos.innerHTML = `

      <div class="error">

        Unable to load the photos.

        <br><br>

        Please check that the folder

        <b>gallery</b>

        exists in your GitHub repository.

        <br><br>

        <small>
          ${error.message}
        </small>

      </div>

    `;

  }

}


/* =====================================================
   CREATE GALLERY
===================================================== */

function createGallery() {

  livePhotos.innerHTML = "";


  const randomPhotos =
    shuffleArray(
      callers
    );


  randomPhotos.forEach(
    function(person) {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "live-photo";


      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "live-badge";

      badge.textContent =
        "LIVE";


      const image =
        document.createElement(
          "img"
        );

      image.src =
        person.photo;

      image.alt =
        person.name;

      image.loading =
        "lazy";


      const status =
        document.createElement(
          "span"
        );

      status.className =
        "live-status";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "live-dot";


      status.appendChild(
        dot
      );


      status.appendChild(
        document.createTextNode(
          person.name
        )
      );


      box.appendChild(
        badge
      );

      box.appendChild(
        image
      );

      box.appendChild(
        status
      );


      box.addEventListener(
        "click",
        function() {

          window.location.href =
            "payment.html";

        }
      );


      livePhotos.appendChild(
        box
      );

    }
  );

}


/* =====================================================
   RANDOM CALLER
===================================================== */

function showRandomCaller() {

  if (!callers.length) {
    return;
  }


  let randomIndex;


  do {

    randomIndex =
      Math.floor(
        Math.random() *
        callers.length
      );

  } while (
    callers.length > 1 &&
    randomIndex === lastCaller
  );


  lastCaller =
    randomIndex;


  const caller =
    callers[randomIndex];


  callerPhoto.src =
    caller.photo;

  callerPhoto.alt =
    caller.name;

  callerName.textContent =
    caller.name;


  incomingCall.style.display =
    "block";

}


/* =====================================================
   AGE GATE
===================================================== */

function enterSite() {

  ageGate.style.display =
    "none";


  if (callers.length) {

    showRandomCaller();

  }

}


function leaveSite() {

  window.location.href =
    "https://www.google.com";

}


/* =====================================================
   SAMPLE CHECK
===================================================== */

function hasWatchedSample() {

  return (
    localStorage.getItem(
      SAMPLE_WATCHED_KEY
    ) === "yes"
  );

}


function markSampleAsWatched() {

  localStorage.setItem(
    SAMPLE_WATCHED_KEY,
    "yes"
  );

}


/* =====================================================
   SHOW INSUFFICIENT MINUTES
===================================================== */

function showInsufficientMinutes() {

  videoPreview.style.display =
    "none";


  insufficientMinutes.style.display =
    "flex";


  setTimeout(
    function() {

      insufficientMinutes.style.display =
        "none";


      livePhotos.style.display =
        "grid";


      createGallery();


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    },
    1500
  );

}


/* =====================================================
   PLAY SAMPLE
===================================================== */

function playSample() {

  incomingCall.style.display =
    "none";


  if (hasWatchedSample()) {

    showInsufficientMinutes();

    return;

  }


  videoPreview.style.display =
    "flex";


  previewVideo.currentTime =
    0;


  previewVideo.play().catch(
    function(error) {

      console.log(
        "Video playback:",
        error
      );

    }
  );

}


/* =====================================================
   ANSWER
===================================================== */

answerCall.addEventListener(
  "click",
  function() {

    playSample();

  }
);


/* =====================================================
   DECLINE
===================================================== */

declineCall.addEventListener(
  "click",
  function() {

    playSample();

  }
);


/* =====================================================
   SAMPLE PLAY
===================================================== */

previewVideo.addEventListener(
  "play",
  function() {

    markSampleAsWatched();

  },
  {
    once: true
  }
);


/* =====================================================
   SAMPLE END
===================================================== */

previewVideo.addEventListener(
  "ended",
  function() {

    showInsufficientMinutes();

  }
);


/* =====================================================
   COUNTDOWN
===================================================== */

previewVideo.addEventListener(
  "timeupdate",
  function() {

    if (
      !isNaN(
        previewVideo.duration
      )
    ) {

      const remaining =
        Math.max(
          0,
          Math.ceil(
            previewVideo.duration -
            previewVideo.currentTime
          )
        );


      previewSeconds.textContent =
        remaining;

    }

  }
);


/* =====================================================
   START
===================================================== */

loadPhotos();

</script>

</body>
</html>
