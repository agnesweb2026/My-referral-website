<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LiveX</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;min-height:100%;
 background:#050505;color:#fff;font-family:Arial,sans-serif;
}
body{overflow-x:hidden}

#welcomeScreen{
 position:fixed;inset:0;z-index:99999;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;
 background:radial-gradient(circle at 50% 35%,#36102d 0,#100810 35%,#030303 75%);
}
.logo{font-size:38px;font-weight:900;letter-spacing:2px}
.logo span{color:#ff1744}
.welcomeText{margin-top:12px;color:#ccc;font-size:15px;text-align:center}
.loader{
 width:45px;height:45px;margin-top:25px;
 border:4px solid #333;border-top-color:#ff1744;
 border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#photosPage{display:none;min-height:100vh;padding-bottom:30px}

.topbar{
 position:sticky;top:0;z-index:500;height:58px;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 13px;background:rgba(5,5,5,.97);
 border-bottom:1px solid #252525;
}
.brand{font-size:22px;font-weight:900}
.brand span{color:#ff1744}
.online{font-size:13px;color:#ddd}
.liveDot{
 display:inline-block;width:8px;height:8px;margin-right:5px;
 background:#00e676;border-radius:50%;
 box-shadow:0 0 8px #00e676;
 animation:onlineBlink 1s infinite;
}
@keyframes onlineBlink{0%,100%{opacity:1}50%{opacity:.25}}

.photoGrid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:6px;padding:7px;
}
.photoCard{
 position:relative;min-width:0;background:#111;
 border-radius:10px;overflow:hidden;border:1px solid #222;
}

.photoWrap{
 position:relative;width:100%;aspect-ratio:3/4;
 overflow:hidden;cursor:pointer;background:#151515;
}
.photoWrap img{
 width:100%;height:100%;object-fit:cover;display:block;
 transition:transform .25s ease;
}
.photoWrap:active img{transform:scale(.98)}

.liveBadge{
 position:absolute;top:7px;left:7px;padding:4px 7px;
 border-radius:5px;background:#e6002d;color:white;
 font-size:9px;font-weight:900;z-index:5;
}

.playIcon{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:42px;height:42px;border-radius:50%;
 background:rgba(0,0,0,.62);
 display:flex;align-items:center;justify-content:center;
 font-size:19px;box-shadow:0 0 0 2px rgba(255,255,255,.35);
 animation:pulsePlay 1.5s infinite;pointer-events:none;
}
@keyframes pulsePlay{
 0%,100%{transform:translate(-50%,-50%) scale(1)}
 50%{transform:translate(-50%,-50%) scale(1.08)}
}

.profileInfo{padding:7px 7px 3px}
.profileName{
 display:flex;align-items:center;min-width:0;
 font-size:13px;font-weight:800;
}
.profileNameText{
 min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.profileAge{font-size:11px;color:#aaa;margin-top:3px}
.flag{margin-right:3px}

.nameStatusDot{
 display:inline-block;flex:none;width:7px;height:7px;
 margin-right:5px;border-radius:50%;
 background:#00e676;box-shadow:0 0 7px #00e676;
 animation:statusBlink 1s infinite;
}
.nameStatusDot.offline{
 background:#666;box-shadow:none;animation:none;
}
@keyframes statusBlink{
 0%,100%{opacity:1}
 50%{opacity:.2}
}
  .socialRow{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:3px;padding:5px;
}
.socialBtn{
 border:0;border-radius:7px;background:#1b1b1b;color:#ddd;
 min-height:36px;font-size:9px;font-weight:700;
 cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.socialBtn:active{transform:scale(.95)}
.socialBtn.liked{color:#ff335f;background:#281019}
.socialBtn.loved{color:#ff1744;background:#281019}
.socialBtn.followed{color:#00e676;background:#092117}

.chatBox{
 margin:2px 5px 7px;background:#0b0b0b;
 border:1px solid #252525;border-radius:8px;overflow:hidden;
}
.chatTitle{
 padding:6px 8px;font-size:10px;font-weight:800;
 color:#bbb;border-bottom:1px solid #202020;
}

.chat-comments{
 height:132px;overflow-y:auto;overflow-x:hidden;
 padding:5px 6px;scroll-behavior:auto;
 -webkit-overflow-scrolling:touch;
}
.chat-comments::-webkit-scrollbar{width:3px}
.chat-comments::-webkit-scrollbar-thumb{
 background:#555;border-radius:5px;
}

.comment{
 padding:5px 6px;margin-bottom:4px;
 background:#151515;border-radius:7px;
 font-size:10px;line-height:1.35;
}
.comment strong{color:#ff6685;margin-right:3px}
.comment small{
 display:block;color:#777;font-size:8px;margin-top:2px;
}

.commentForm{
 display:flex;gap:4px;padding:5px;border-top:1px solid #222;
}
.commentInput{
 min-width:0;flex:1;border:1px solid #333;
 background:#171717;color:white;border-radius:7px;
 padding:8px;outline:none;font-size:10px;
}
.commentInput::placeholder{color:#777}
.commentInput:focus{border-color:#ff1744}
.commentSend{
 width:45px;border:0;border-radius:7px;
 background:#ff1744;color:#fff;font-weight:900;
 font-size:10px;cursor:pointer;
}

.reactionPopup{
 position:fixed;left:50%;bottom:25%;
 transform:translateX(-50%);z-index:5000;
 background:rgba(255,23,68,.95);
 padding:10px 18px;border-radius:25px;
 font-weight:900;display:none;
 box-shadow:0 5px 25px rgba(0,0,0,.5);
}

@media(max-width:420px){
 .photoGrid{gap:4px;padding:5px}
 .socialBtn{font-size:8px}
 .profileName{font-size:12px}
 .profileAge{font-size:10px}
 .chat-comments{height:125px}
}
@media(min-width:700px){
 .photoGrid{
  grid-template-columns:repeat(4,1fr);
  max-width:1000px;margin:auto;
 }
}

</style>
</head>

  function readStorage(key,fallback){
 try{
  const value=localStorage.getItem(key);
  return value?JSON.parse(value):fallback;
 }catch(e){
  return fallback;
 }
}

function writeStorage(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value));
 }catch(e){}
}

function profileId(index){
 return "profile_"+index;
}

function escapeHtml(value){
 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function formatNumber(number){
 return Number(number||0).toLocaleString();
}

function getLikes(index){
 const data=readStorage(STORAGE_LIKES,{});
 const id=profileId(index);

 if(data[id]==null){
  data[id]=5000+(index*137)+Math.floor(Math.random()*300);
  writeStorage(STORAGE_LIKES,data);
 }

 return data[id];
}

function getLove(index){
 const data=readStorage(STORAGE_LOVES,{});
 const id=profileId(index);

 if(data[id]==null){
  data[id]=800+(index*31);
  writeStorage(STORAGE_LOVES,data);
 }

 return data[id];
}

function getFollow(index){
 const data=readStorage(STORAGE_FOLLOWS,{});
 const id=profileId(index);

 if(data[id]==null){
  data[id]=300+(index*17);
  writeStorage(STORAGE_FOLLOWS,data);
 }

 return data[id];
}

function getComments(index){
 const data=readStorage(STORAGE_COMMENTS,{});
 const id=profileId(index);

 if(!Array.isArray(data[id])){
  const source=SAMPLE_COMMENTS[index%SAMPLE_COMMENTS.length];

  data[id]=source.map(function(item){
   return{
    name:item[0],
    text:item[1],
    time:"now"
   };
  });

  writeStorage(STORAGE_COMMENTS,data);
 }

 return data[id];
}

function saveComments(index,comments){
 const data=readStorage(STORAGE_COMMENTS,{});
 data[profileId(index)]=comments;
 writeStorage(STORAGE_COMMENTS,data);
}

function renderComments(index){
 const box=document.getElementById("comments_"+index);

 if(!box)return;

 const comments=getComments(index);

 if(!comments.length){
  box.innerHTML=
   '<div class="comment">No comments yet.</div>';
  return;
 }

 box.innerHTML=comments.map(function(comment){

  return `
   <div class="comment">
    <strong>${escapeHtml(comment.name)}</strong>
    ${escapeHtml(comment.text)}
    <small>${escapeHtml(comment.time||"now")}</small>
   </div>
  `;

 }).join("");
}

function addComment(index,input){
 if(!input)return;

 const text=input.value.trim();

 if(!text)return;

 const comments=getComments(index);

 comments.push({
  name:"You",
  text:text,
  time:"just now"
 });

 saveComments(index,comments);

 input.value="";

 renderComments(index);

 const box=document.getElementById("comments_"+index);

 if(box){
  box.scrollTop=box.scrollHeight;
 }
}
  function toggleLike(index,button){
 const data=readStorage(STORAGE_LIKES,{});
 const id=profileId(index);

 data[id]=(data[id]||getLikes(index))+1;

 writeStorage(STORAGE_LIKES,data);

 const count=button.querySelector(".count");

 if(count){
  count.textContent=formatNumber(data[id]);
 }

 button.classList.add("liked");

 showReaction("❤️ Liked");
}

function toggleLove(index,button){

function showReaction(message){

 clearTimeout(window.reactionTimer);

 window.reactionTimer=setTimeout(function(){

 },1200);
}

function openPayment(index){

 params.set("employee",profile.name);
 params.set("profile",profile.name);
 params.set("age",profile.age);

 const currentRef=
  new URLSearchParams(location.search).get("ref");

 if(currentRef){
  params.set("ref",currentRef);
 }

  "payment.html?"+params.toString();
}

/* =========================
   RANDOM OFFLINE SYSTEM
========================= */

let offlineProfiles=new Set();

function chooseRandomOfflineProfiles(){

 offlineProfiles=new Set();

 const total=PHOTO_NAMES.length;

 const amount=Math.min(5,total);

 while(offlineProfiles.size<amount){

  const index=
   Math.floor(Math.random()*total);

  offlineProfiles.add(index);
 }

 updateProfileStatuses();
}

function updateProfileStatuses(){

 PHOTO_NAMES.forEach(function(profile,index){

  const dot=
   document.getElementById("statusDot_"+index);

  if(!dot)return;

  if(offlineProfiles.has(index)){

   dot.classList.add("offline");
   dot.title="Offline";

  }else{

   dot.classList.remove("offline");
   dot.title="Online";

  }

 });

}

/*
 Every 5 minutes a new random group
 of exactly 5 profiles becomes offline.
*/

function startOfflineRotation(){

 chooseRandomOfflineProfiles();

 setInterval(function(){

  chooseRandomOfflineProfiles();

 },300000);

}

/* =========================
   AUTO CHAT SCROLL
========================= */

function startChatAutoScroll(index){

 const box=
  document.getElementById("comments_"+index);

 if(!box)return;

 if(box.dataset.autoScrollStarted==="1"){
  return;
 }

 box.dataset.autoScrollStarted="1";

 let direction=1;

 function move(){

  if(!box||
     !document.body.contains(box)){
   return;
  }

  const max=
   box.scrollHeight-box.clientHeight;

  if(max<=0)return;

  if(direction===1){

   box.scrollTop+=1;

   if(box.scrollTop>=max-1){
    direction=-1;
   }

  }else{

   box.scrollTop-=1;

   if(box.scrollTop<=1){
    direction=1;
   }

  }

 }

 const timer=setInterval(move,80);

 box.dataset.scrollTimer=
  String(timer);

 box.addEventListener(
  "touchstart",
  function(){
   direction=0;
  },
  {passive:true}
 );

 box.addEventListener(
  "touchend",
  function(){

   setTimeout(function(){
    direction=1;
   },700);

  },
  {passive:true}
 );

 box.addEventListener(
  "wheel",
  function(){

   direction=0;

   clearTimeout(box._wheelTimer);

   box._wheelTimer=setTimeout(function(){
    direction=1;
   },700);

  },
  {passive:true}
 );
}

function startAllChatAutoScroll(){

 PHOTO_NAMES.forEach(function(profile,index){

  setTimeout(function(){

   startChatAutoScroll(index);

  },500+(index*80));

 });

}
  function refreshChatAutoScroll(index){

 const box=
  document.getElementById("comments_"+index);

 if(!box)return;

 const timer=box.dataset.scrollTimer;

 if(timer){

  clearInterval(Number(timer));

  box.dataset.autoScrollStarted="0";

  box.dataset.scrollTimer="";

 }

 startChatAutoScroll(index);
}

function restartAllAutoChats(){

 PHOTO_NAMES.forEach(function(profile,index){

  refreshChatAutoScroll(index);

 });

}

function setupImageFallbacks(){

 document.querySelectorAll(".photoWrap img")
 .forEach(function(img){

  img.addEventListener("error",function(){

   img.style.opacity=".35";

   img.parentElement.style.background=
    "linear-gradient(135deg,#29101a,#111,#251018)";

  });

 });

}

function setupChatObservers(){

 const observer=
  new MutationObserver(function(){

   PHOTO_NAMES.forEach(function(profile,index){

    const box=
     document.getElementById("comments_"+index);

    if(
     box &&
     box.dataset.autoScrollStarted!=="1"
    ){

     startChatAutoScroll(index);

    }

   });

  });

 observer.observe(
  document.body,
  {
   childList:true,
   subtree:true
  }
 );

}

function ensureEveryProfileHasComments(){

 PHOTO_NAMES.forEach(function(profile,index){

  const comments=
   getComments(index);

  if(!Array.isArray(comments)){

   saveComments(index,[]);

  }

  renderComments(index);

 });

}

function safeCreatePhotos(){

 try{

  createPhotos();

 }catch(error){

  console.error(
   "Photo loading error:",
   error
  );

  const grid=
   document.getElementById("photoGrid");

  if(grid){

   grid.innerHTML=`
    <div style="
      grid-column:1/-1;
      padding:30px;
      text-align:center;
      color:#aaa;
    ">
      Loading live profiles...
    </div>
   `;

   setTimeout(function(){

    try{

     createPhotos();

    }catch(e){

     console.error(e);

    }

   },500);

  }

 }

}

function startWelcomeFlow(){

 setTimeout(function(){

  showPhotos();

  setTimeout(function(){

   setupImageFallbacks();
   startAllChatAutoScroll();
   updateProfileStatuses();

  },700);

 },3000);

}
  function initialise(){

 safeCreatePhotos();

 updateOnline();

 startOfflineRotation();

 setInterval(function(){

  updateOnline();

 },20000);

 setupChatObservers();

 ensureEveryProfileHasComments();

 startWelcomeFlow();

}

 function(){

  }

 }
);

========================= */

 function(){

);

   PAYMENT
========================= */

document.addEventListener(
 "click",
 function(event){

  const interactive=
   event.target.closest(
    ".socialBtn,.chatBox,.commentForm,.commentInput,.commentSend"
   );

   event.stopPropagation();

  }

 },

);

/* =========================
   START APP
========================= */

if(
 document.readyState==="loading"
){

 document.addEventListener(
  "DOMContentLoaded",

 );

}else{

 initialise();

  }

function createIncomingCall(){

 if(
  document.getElementById("incomingCall")
 ){
  return;
 }

 const call=
  document.createElement("div");

 call.id="incomingCall";

 call.innerHTML=`

  <div style="
   position:fixed;
   inset:0;
   z-index:10000;
   display:flex;
   align-items:center;
   justify-content:center;
   background:rgba(0,0,0,.94);
   padding:20px;
  ">

   <div style="
    width:min(360px,100%);
    background:#151515;
    border-radius:20px;
    padding:25px;
    text-align:center;
    border:1px solid #333;
   ">

    <div style="
     width:85px;
     height:85px;
     margin:0 auto 15px;
     border-radius:50%;
     background:linear-gradient(135deg,#ff1744,#68152c);
     display:flex;
     align-items:center;
     justify-content:center;
     font-size:38px;
    ">
     📞
    </div>

    <div style="
     color:#ff1744;
     font-size:12px;
     font-weight:900;
     margin-bottom:7px;
    ">
     ● LIVE CALL
    </div>

    <div style="
     font-size:22px;
     font-weight:900;
     margin-bottom:5px;
    ">
     Incoming call
    </div>

    <div style="
     color:#aaa;
     font-size:13px;
     margin-bottom:25px;
    ">
     Someone wants to talk with you
    </div>

    <div style="
     display:flex;
     gap:10px;
    ">

     <button
      id="rejectCallBtn"
      style="
       flex:1;
       padding:14px;
       border:0;
       border-radius:10px;
       background:#d50032;
       color:white;
       font-weight:900;
      "
     >
      Reject
     </button>

     <button
      id="answerCallBtn"
      style="
       flex:1;
       padding:14px;
       border:0;
       border-radius:10px;
       background:#00a83b;
       color:white;
       font-weight:900;
      "
     >
      Answer
     </button>

    </div>

   </div>

  </div>
 `;

 document.body.appendChild(call);

 const reject=
  document.getElementById("rejectCallBtn");

 const answer=
  document.getElementById("answerCallBtn");

 if(reject){

  reject.addEventListener(
   "click",
   function(){

    call.remove();

   }
  );

 }

 if(answer){

  answer.addEventListener(
   "click",
   function(){

    call.remove();

    showReaction(
     "📞 Connecting..."
    );

   }
  );

 }

}
