<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Live Referral</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

button {
  font-family: inherit;
}


/* =========================
   SAMPLE
========================= */

#samplePage {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: #000;
}

#sampleVideo {
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  border-radius: 14px;
  background: #000;
  object-fit: contain;
}

.sample-title {
  margin-top: 12px;
  font-size: 18px;
  font-weight: 700;
}


/* =========================
   LOADING
========================= */

#loadingPage {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
  background: #000;
}

.loader {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 4px solid #444;
  border-top-color: #fff;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text {
  margin-top: 15px;
  font-size: 16px;
}


/* =========================
   ONLINE
========================= */

.online-status {
  font-size: 15px;
  font-weight: 700;
}

.live-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 5px;
  border-radius: 50%;
  background: #20c55a;
  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {

  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .25;
  }

}


/* =========================
   INSUFFICIENT
========================= */

#insufficientPage {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background: #000;
}

.insufficient-box {
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 16px;
  background: #1d1d1d;
}

.insufficient-box h2 {
  margin-top: 0;
}

.insufficient-box button {
  border: 0;
  padding: 12px 28px;
  border-radius: 8px;
  background: #fff;
  color: #111;
  font-weight: 700;
  cursor: pointer;
}


/* =========================
   LIVE PHOTOS
========================= */

#photosPage {
  display: none;
  min-height: 100vh;
  padding: 15px;
  background: #111;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.photo-card {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  background: #222;
  cursor: pointer;
}

.photo-card img {
  display: block;
  width: 100%;
  height: 230px;
  object-fit: cover;
}

.live-badge {
  position: absolute;
  top: 9px;
  left: 9px;
  padding: 5px 9px;
  border-radius: 7px;
  background: #e53935;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}

.photo-name {
  padding: 9px;
  font-size: 14px;
  font-weight: 700;
}


/* =========================
   INCOMING VIDEO CALL
========================= */

.incoming-call {

  position: fixed;
  inset: 0;
  z-index: 99999;

  display: none;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  overflow: hidden;

  background: #050505;
}

.incoming-call-bg {

  position: absolute;
  inset: -35px;

  background-position: center;
  background-size: cover;

  filter:
    blur(25px)
    brightness(.25);

  transform: scale(1.15);

  transition:
    background-image .3s ease;
}

.incoming-call::after {

  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.2),
      rgba(0,0,0,.35),
      rgba(0,0,0,.75)
    );
}

.caller-box {

  position: relative;
  z-index: 2;

  width: 100%;

  text-align: center;

  padding-top: 5vh;
}

.caller-photo-wrap {

  position: relative;

  width: 165px;
  height: 165px;

  margin: 0 auto 30px;
}

.caller-photo {

  width: 165px;
  height: 165px;

  object-fit: cover;

  border: 3px solid rgba(255,255,255,.95);

  border-radius: 50%;

  box-shadow:
    0 0 35px rgba(255,255,255,.18);

  animation:
    callerZoom 3s ease-in-out infinite;
}

.call-ring {

  position: absolute;

  inset: -14px;

  border:
    2px solid
    rgba(255,255,255,.65);

  border-radius: 50%;

  animation:
    ringPulse 2s infinite;
}

.call-ring:nth-child(2) {

  inset: -30px;

  animation-delay: .55s;
}

@keyframes ringPulse {

  0% {
    opacity: .75;
    transform: scale(.82);
  }

  100% {
    opacity: 0;
    transform: scale(1.2);
  }

}

@keyframes callerZoom {

  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.05);
  }

}

.caller-name {

  font-size: 29px;
  font-weight: 700;

  text-shadow:
    0 2px 10px rgba(0,0,0,.6);
}

.call-title {

  margin-top: 9px;

  font-size: 13px;

  letter-spacing: 1.8px;

  font-weight: 700;

  opacity: .9;
}

.call-ringing {

  margin-top: 9px;

  font-size: 14px;

  opacity: .8;
}


/* =========================
   CALL BUTTONS
========================= */

.call-buttons {

  position: absolute;

  z-index: 3;

  bottom: 9vh;

  left: 0;
  right: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 70px;
}

.call-action {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 9px;
}

.call-btn {

  width: 68px;
  height: 68px;

  border: 0;

  border-radius: 50%;

  color: #fff;

  font-size: 27px;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition:
    transform .15s ease;
}

.call-btn:active {
  transform: scale(.9);
}

.decline-btn {
  background: #e53935;
}

.answer-btn {
  background: #20c55a;
}

.call-label {

  font-size: 12px;

  font-weight: 600;

  opacity: .9;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  .photo-card img {
    height: 200px;
  }

  .caller-photo-wrap,
  .caller-photo {
    width: 145px;
    height: 145px;
  }

  .caller-name {
    font-size: 26px;
  }

  .call-buttons {
    gap: 55px;
  }

}

</style>

</head>
<body>

<!-- =========================
     SAMPLE PAGE
========================= -->

<section id="samplePage">

  <video
    id="sampleVideo"
    autoplay
    muted
    playsinline
    preload="auto">

    <source
      src="preview_20_seconds.mp4"
      type="video/mp4">

  </video>

  <div class="sample-title">
    Watch preview
  </div>

</section>


<!-- =========================
     LOADING PAGE
========================= -->

<section id="loadingPage">

  <div class="loader"></div>

  <div class="loading-text">
    Loading...
  </div>

  <p class="online-status">

    <span class="live-dot"></span>

    <span id="loadingOnlineCount">19</span>

    online

  </p>

</section>


<!-- =========================
     INSUFFICIENT MINUTES
========================= -->

<section id="insufficientPage">

  <div class="insufficient-box">

    <h2>
      Insufficient Minutes
    </h2>

    <p>
      You need more minutes to continue.
    </p>

    <button
      id="continuePayment"
      type="button">

      Continue

    </button>

  </div>

</section>


<!-- =========================
     LIVE PHOTOS
========================= -->

<section id="photosPage">

  <div class="top-bar">

    <div class="online-status">

      <span class="live-dot"></span>

      <span id="onlineCount">19</span>

      online

    </div>

  </div>


  <div
    id="photoGrid"
    class="photo-grid">
  </div>

</section>


<!-- =========================
     INCOMING VIDEO CALL
========================= -->

<div
  id="incomingCall"
  class="incoming-call">

  <div
    id="callerBg"
    class="incoming-call-bg">
  </div>


  <div class="caller-box">

    <div class="caller-photo-wrap">

      <div class="call-ring"></div>

      <div class="call-ring"></div>


      <img
        id="callerPhoto"
        class="caller-photo"
        src="photo1.jpg"
        alt="Caller">

    </div>


    <div
      id="callerName"
      class="caller-name">

      Incoming Caller

    </div>


    <div class="call-title">
      INCOMING VIDEO CALL
    </div>


    <div class="call-ringing">
      Ringing...
    </div>

  </div>


  <div class="call-buttons">


    <div class="call-action">

      <button
        id="rejectCall"
        class="call-btn decline-btn"
        type="button"
        aria-label="Decline">

        ☎

      </button>

      <div class="call-label">
        Decline
      </div>

    </div>


    <div class="call-action">

      <button
        id="answerCall"
        class="call-btn answer-btn"
        type="button"
        aria-label="Answer">

        ☎

      </button>

      <div class="call-label">
        Answer
      </div>

    </div>


  </div>

</div>
<script>

/* =========================
   SETTINGS
========================= */

const INSUFFICIENT_DURATION = 2000;

const FLOW_KEY = "myReferralFlowStarted";

const MAX_PHOTOS = 24;


/* =========================
   PAGE ELEMENTS
========================= */

const samplePage =
  document.getElementById("samplePage");

const loadingPage =
  document.getElementById("loadingPage");

const insufficientPage =
  document.getElementById("insufficientPage");

const photosPage =
  document.getElementById("photosPage");

const sampleVideo =
  document.getElementById("sampleVideo");

const photoGrid =
  document.getElementById("photoGrid");

const continuePayment =
  document.getElementById("continuePayment");


/* =========================
   CALL ELEMENTS
========================= */

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerBg =
  document.getElementById("callerBg");

const callerName =
  document.getElementById("callerName");

const answerCall =
  document.getElementById("answerCall");

const rejectCall =
  document.getElementById("rejectCall");


/* =========================
   PHOTO + NAME LIST
========================= */

const callers = [

  {
    photo: "photo1.jpg",
    name: "Cute"
  },

  {
    photo: "photo2.jpg",
    name: "Becky"
  },

  {
    photo: "photo3.jpg",
    name: "Dorry"
  },

  {
    photo: "photo4.jpg",
    name: "Jenny"
  },

  {
    photo: "photo5.jpg",
    name: "Lynn"
  },

  {
    photo: "photo6.jpg",
    name: "Mercy"
  },

  {
    photo: "photo7.jpg",
    name: "Rose"
  },

  {
    photo: "photo8.jpg",
    name: "Sharon"
  },

  {
    photo: "photo9.jpg",
    name: "Brenda"
  },

  {
    photo: "photo10.jpg",
    name: "Lucy"
  },

  {
    photo: "photo11.jpg",
    name: "Wendy"
  },

  {
    photo: "photo12.jpg",
    name: "Daisy"
  },

  {
    photo: "photo13.jpg",
    name: "Faith"
  },

  {
    photo: "photo14.jpg",
    name: "Grace"
  },

  {
    photo: "photo15.jpg",
    name: "Mary"
  },

  {
    photo: "photo16.jpg",
    name: "Nancy"
  },

  {
    photo: "photo17.jpg",
    name: "Vicky"
  },

  {
    photo: "photo18.jpg",
    name: "Linda"
  },

  {
    photo: "photo19.jpg",
    name: "Stacy"
  },

  {
    photo: "photo20.jpg",
    name: "Joy"
  },

  {
    photo: "photo21.jpg",
    name: "Ann"
  },

  {
    photo: "photo22.jpg",
    name: "Cindy"
  },

  {
    photo: "photo23.jpg",
    name: "Fiona"
  },

  {
    photo: "photo24.jpg",
    name: "Fellow"
  }

];


/* =========================
   RANDOM CALLER
========================= */

let lastCallerIndex = -1;


function getRandomCaller() {

  if (callers.length === 0) {
    return {
      photo: "photo1.jpg",
      name: "Incoming Caller"
    };
  }


  let index;

  do {

    index =
      Math.floor(
        Math.random() *
        callers.length
      );

  } while (
    callers.length > 1 &&
    index === lastCallerIndex
  );


  lastCallerIndex = index;

  return callers[index];
}


/* =========================
   HIDE ALL PAGES
========================= */

function hideAllPages() {

  samplePage.style.display =
    "none";

  loadingPage.style.display =
    "none";

  insufficientPage.style.display =
    "none";

  photosPage.style.display =
    "none";
}


/* =========================
   SHOW RANDOM INCOMING CALL
========================= */

function showIncomingCall() {

  const caller =
    getRandomCaller();


  callerPhoto.src =
    caller.photo;


  callerBg.style.backgroundImage =
    `url("${caller.photo}")`;


  callerName.textContent =
    caller.name;


  incomingCall.style.display =
    "flex";
}


/* =========================
   HIDE INCOMING CALL
========================= */

function hideIncomingCall() {

  incomingCall.style.display =
    "none";
}


/* =========================
   SHOW LOADING
========================= */

function showLoading() {

  hideAllPages();

  loadingPage.style.display =
    "flex";


  /* Every new loading gets
     a new random caller */

  showIncomingCall();
}


/* =========================
   SHOW INSUFFICIENT
========================= */

function showInsufficient() {

  hideIncomingCall();

  hideAllPages();

  insufficientPage.style.display =
    "flex";
}


/* =========================
   SHUFFLE ARRAY
========================= */

function shuffleArray(array) {

  const shuffled =
    [...array];


  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];

  }


  return shuffled;
}


/* =========================
   SHOW LIVE PHOTOS
========================= */

function showPhotos() {

  hideIncomingCall();

  hideAllPages();

  photosPage.style.display =
    "block";


  /* New random arrangement
     every time */

  loadPhotos();
}


/* =========================
   LOAD RANDOM PHOTOS
========================= */

function loadPhotos() {

  photoGrid.innerHTML = "";


  const shuffledCallers =
    shuffleArray(callers);


  shuffledCallers.forEach(
    function(caller) {

      const card =
        document.createElement("div");


      card.className =
        "photo-card";


      card.innerHTML = `

        <img
          src="${caller.photo}"
          alt="${caller.name}"
          loading="lazy"
        >

        <div class="live-badge">
          LIVE
        </div>

        <div class="photo-name">
          ${caller.name}
        </div>

      `;


      card.addEventListener(
        "click",
        function() {

          window.location.href =
            "payment.html";

        }
      );


      photoGrid.appendChild(card);

    }
  );

}


/* =========================
   ANSWER
========================= */

answerCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

  }
);


/* =========================
   DECLINE
========================= */

rejectCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

  }
);


/* =========================
   CONTINUE PAYMENT
========================= */

continuePayment.addEventListener(
  "click",
  function() {

    window.location.href =
      "payment.html";

  }
);


/* =========================
   MAIN FLOW
========================= */

function startMainFlow() {


  /* First visitor */

  if (
    !localStorage.getItem(
      FLOW_KEY
    )
  ) {

    hideAllPages();

    samplePage.style.display =
      "flex";

    return;

  }


  /* Returning visitor */

  showLoading();


  setTimeout(
    function() {

      showInsufficient();


      setTimeout(
        function() {

          showPhotos();

        },
        INSUFFICIENT_DURATION
      );

    },
    2000
  );

}


/* =========================
   SAMPLE FINISHED
========================= */

sampleVideo.addEventListener(
  "ended",
  function() {

    localStorage.setItem(
      FLOW_KEY,
      "true"
    );


    showLoading();


    setTimeout(
      function() {

        showInsufficient();


        setTimeout(
          function() {

            showPhotos();

          },
          INSUFFICIENT_DURATION
        );

      },
      2000
    );

  }
);


/* =========================
   START
========================= */

startMainFlow();

</script>
<script>

/* =========================
   DYNAMIC ONLINE NUMBER
========================= */

const onlineNumbers = [
  15,
  17,
  18,
  19,
  20,
  21,
  22
];


function updateOnlineNumber() {

  const randomNumber =
    onlineNumbers[
      Math.floor(
        Math.random() *
        onlineNumbers.length
      )
    ];


  const onlineCount =
    document.getElementById(
      "onlineCount"
    );


  const loadingOnlineCount =
    document.getElementById(
      "loadingOnlineCount"
    );


  if (onlineCount) {

    onlineCount.textContent =
      randomNumber;

  }


  if (loadingOnlineCount) {

    loadingOnlineCount.textContent =
      randomNumber;

  }

}


/* Initial number */

updateOnlineNumber();


/* Change every 5 seconds */

setInterval(
  updateOnlineNumber,
  5000
);


/* =========================
   REFERRAL CODE
========================= */

const referralParams =
  new URLSearchParams(
    window.location.search
  );


const referralCode =
  referralParams.get("ref");


if (referralCode) {

  localStorage.setItem(
    "referralCode",
    referralCode
  );

}

</script>
<script>

/* =========================
   KEEP THE FLOW STABLE
========================= */

let callTimer = null;


/* =========================
   MAKE SURE PHOTOS
   ARE SHUFFLED ON OPEN
========================= */

function refreshRandomPhotos() {

  if (
    photosPage.style.display !== "none"
  ) {

    loadPhotos();

  }

}


/* =========================
   RANDOM CALL ON
   EVERY NEW LOADING
========================= */

function newIncomingCall() {

  hideIncomingCall();

  setTimeout(
    function() {

      showIncomingCall();

    },
    150
  );

}


/* =========================
   CLEAN OLD TIMER
========================= */

function stopCallTimer() {

  if (callTimer) {

    clearTimeout(callTimer);

    callTimer = null;

  }

}


/* =========================
   CALL AGAIN WHEN LOADING
   STARTS
========================= */

const originalShowLoading =
  showLoading;


showLoading = function() {

  stopCallTimer();

  originalShowLoading();

};


/* =========================
   PAYMENT BUTTON
========================= */

continuePayment.onclick =
  function() {

    window.location.href =
      "payment.html";

  };


/* =========================
   REFRESH PHOTOS WHEN
   PAGE BECOMES VISIBLE
========================= */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      !document.hidden &&
      photosPage.style.display !== "none"
    ) {

      refreshRandomPhotos();

    }

  }
);

</script>
</script>

</body>
</html>
