<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Referral</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

button {
  font-family: inherit;
}

/* =========================
   SAMPLE VIDEO
========================= */

#samplePage {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: #000;
}

#sampleVideo {
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  border-radius: 14px;
  background: #000;
  object-fit: contain;
}

.sample-title {
  margin-top: 12px;
  font-size: 18px;
  font-weight: 700;
}

/* =========================
   LOADING
========================= */

#loadingPage {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

.loader {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 4px solid #444;
  border-top-color: #fff;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text {
  margin-top: 15px;
  font-size: 16px;
}

/* =========================
   ONLINE STATUS
========================= */

.online-status {
  font-size: 15px;
  font-weight: 700;
}

.live-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 5px;
  border-radius: 50%;
  background: #20c55a;
  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .25;
  }
}

/* =========================
   INSUFFICIENT MINUTES
========================= */

#insufficientPage {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.insufficient-box {
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 16px;
  background: #1d1d1d;
}

.insufficient-box h2 {
  margin-top: 0;
}

.insufficient-box button {
  border: 0;
  padding: 12px 28px;
  border-radius: 8px;
  background: #fff;
  color: #111;
  font-weight: 700;
  cursor: pointer;
}

/* =========================
   PHOTOS
========================= */

#photosPage {
  display: none;
  min-height: 100vh;
  padding: 15px;
  background: #111;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.photo-card {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  background: #222;
  cursor: pointer;
}

.photo-card img {
  display: block;
  width: 100%;
  height: 230px;
  object-fit: cover;
}

.live-badge {
  position: absolute;
  top: 9px;
  left: 9px;
  padding: 5px 9px;
  border-radius: 7px;
  background: #e53935;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}

.photo-name {
  padding: 9px;
  font-size: 14px;
  font-weight: 700;
}

/* =========================
   INCOMING VIDEO CALL
========================= */

.incoming-call {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  overflow: hidden;
  background: #111;
}

.incoming-call-bg {
  position: absolute;
  inset: -25px;
  background-position: center;
  background-size: cover;
  filter: blur(20px) brightness(.32);
  transform: scale(1.12);
}

.caller-box {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
}

.caller-photo-wrap {
  position: relative;
  width: 155px;
  height: 155px;
  margin: 0 auto 28px;
}

.caller-photo {
  width: 155px;
  height: 155px;
  object-fit: cover;
  border: 4px solid #fff;
  border-radius: 50%;
  animation: callerZoom 3s ease-in-out infinite;
}

.call-ring {
  position: absolute;
  inset: -15px;
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 50%;
  animation: ringPulse 2s infinite;
}

.call-ring:nth-child(2) {
  inset: -30px;
  animation-delay: .5s;
}

@keyframes ringPulse {
  0% {
    opacity: .8;
    transform: scale(.8);
  }

  100% {
    opacity: 0;
    transform: scale(1.18);
  }
}

@keyframes callerZoom {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.06);
  }
}

.caller-name {
  font-size: 27px;
  font-weight: 700;
}

.call-title {
  margin-top: 8px;
  font-size: 14px;
  letter-spacing: 1.5px;
  font-weight: 700;
}

.call-ringing {
  margin-top: 8px;
  font-size: 14px;
  opacity: .8;
}

.call-buttons {
  position: relative;
  z-index: 3;
  display: flex;
  gap: 55px;
  margin-top: 55px;
}

.call-btn {
  width: 66px;
  height: 66px;
  border: 0;
  border-radius: 50%;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
}

.decline-btn {
  background: #e53935;
}

.answer-btn {
  background: #20c55a;
}

@media (max-width: 480px) {
  .photo-card img {
    height: 200px;
  }

  .caller-photo-wrap,
  .caller-photo {
    width: 140px;
    height: 140px;
  }
}
</style>
</head>
<body>

<!-- =========================
     SAMPLE PAGE
========================= -->

<section id="samplePage">

  <video
    id="sampleVideo"
    autoplay
    muted
    playsinline
    preload="auto">

    <source
      src="preview_20_seconds.mp4"
      type="video/mp4">

  </video>

  <div class="sample-title">
    Watch preview
  </div>

</section>


<!-- =========================
     LOADING PAGE
========================= -->

<section id="loadingPage">

  <div class="loader"></div>

  <div class="loading-text">
    Loading...
  </div>

  <p class="online-status">
    <span class="live-dot"></span>
    <span id="loadingOnlineCount">19</span>
    online
  </p>

</section>


<!-- =========================
     INSUFFICIENT MINUTES
========================= -->

<section id="insufficientPage">

  <div class="insufficient-box">

    <h2>
      Insufficient Minutes
    </h2>

    <p>
      You need more minutes to continue.
    </p>

    <button
      id="continuePayment"
      type="button">

      Continue

    </button>

  </div>

</section>


<!-- =========================
     PHOTOS PAGE
========================= -->

<section id="photosPage">

  <div class="top-bar">

    <div class="online-status">

      <span class="live-dot"></span>

      <span id="onlineCount">
        19
      </span>

      online

    </div>

  </div>


  <div
    id="photoGrid"
    class="photo-grid">
  </div>

</section>


<!-- =========================
     INCOMING VIDEO CALL
========================= -->

<div
  id="incomingCall"
  class="incoming-call">

  <div
    id="callerBg"
    class="incoming-call-bg">
  </div>


  <div class="caller-box">

    <div class="caller-photo-wrap">

      <div class="call-ring"></div>

      <div class="call-ring"></div>

      <img
        id="callerPhoto"
        class="caller-photo"
        src="photo1.jpg"
        alt="Caller">

    </div>


    <div
      id="callerName"
      class="caller-name">

      Incoming Caller

    </div>


    <div class="call-title">

      INCOMING VIDEO CALL

    </div>


    <div class="call-ringing">

      Ringing...

    </div>

  </div>


  <div class="call-buttons">

    <button
      id="rejectCall"
      class="call-btn decline-btn"
      type="button"
      aria-label="Decline">

      ☎

    </button>


    <button
      id="answerCall"
      class="call-btn answer-btn"
      type="button"
      aria-label="Answer">

      ☎

    </button>

  </div>

</div>
<script>

/* =========================
   SETTINGS
========================= */

const SAMPLE_DURATION = 20000;
const INSUFFICIENT_DURATION = 2000;

const FLOW_KEY = "myReferralFlowStarted";

const MAX_PHOTOS = 24;


/* =========================
   PAGE ELEMENTS
========================= */

const samplePage =
  document.getElementById("samplePage");

const loadingPage =
  document.getElementById("loadingPage");

const insufficientPage =
  document.getElementById("insufficientPage");

const photosPage =
  document.getElementById("photosPage");

const sampleVideo =
  document.getElementById("sampleVideo");

const photoGrid =
  document.getElementById("photoGrid");

const continuePayment =
  document.getElementById("continuePayment");


/* =========================
   INCOMING CALL ELEMENTS
========================= */

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerBg =
  document.getElementById("callerBg");

const callerName =
  document.getElementById("callerName");

const answerCall =
  document.getElementById("answerCall");

const rejectCall =
  document.getElementById("rejectCall");


/* =========================
   PHOTO NAMES
========================= */

const photoNames = [
  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Lynn",
  "Mercy",
  "Rose",
  "Sharon",
  "Brenda",
  "Lucy",
  "Wendy",
  "Daisy",
  "Faith",
  "Grace",
  "Mary",
  "Nancy",
  "Vicky",
  "Linda",
  "Stacy",
  "Joy",
  "Ann",
  "Cindy",
  "Fiona",
  "Fellow"
];


/* =========================
   HELPER
========================= */

function hideAllPages() {

  samplePage.style.display = "none";

  loadingPage.style.display = "none";

  insufficientPage.style.display = "none";

  photosPage.style.display = "none";
}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(
  photo = "photo1.jpg",
  name = "Incoming Caller"
) {

  callerPhoto.src = photo;

  callerBg.style.backgroundImage =
    `url("${photo}")`;

  callerName.textContent = name;

  incomingCall.style.display = "flex";
}


function hideIncomingCall() {

  incomingCall.style.display = "none";
}


/* =========================
   LOADING
========================= */

function showLoading(
  photo = "photo1.jpg",
  name = "Incoming Caller"
) {

  hideAllPages();

  loadingPage.style.display = "flex";

  showIncomingCall(photo, name);
}


/* =========================
   SHOW INSUFFICIENT
========================= */

function showInsufficient() {

  hideIncomingCall();

  hideAllPages();

  insufficientPage.style.display = "flex";
}


/* =========================
   SHOW PHOTOS
========================= */

function showPhotos() {

  hideIncomingCall();

  hideAllPages();

  photosPage.style.display = "block";

  loadPhotos();
}


/* =========================
   LOAD 24 PHOTOS
========================= */

function loadPhotos() {

  photoGrid.innerHTML = "";

  for (
    let i = 1;
    i <= MAX_PHOTOS;
    i++
  ) {

    const card =
      document.createElement("div");

    card.className =
      "photo-card";


    const name =
      photoNames[i - 1] ||
      `Caller ${i}`;


    card.innerHTML = `

      <img
        src="photo${i}.jpg"
        alt="${name}"
        loading="lazy"
        onerror="this.style.display='none'"
      >

      <div class="live-badge">
        LIVE
      </div>

      <div class="photo-name">
        ${name}
      </div>

    `;


    card.addEventListener(
      "click",
      function() {

        window.location.href =
          "payment.html";

      }
    );


    photoGrid.appendChild(card);
  }
}


/* =========================
   ANSWER BUTTON
========================= */

answerCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

  }
);


/* =========================
   DECLINE BUTTON
========================= */

rejectCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

  }
);


/* =========================
   CONTINUE PAYMENT
========================= */

continuePayment.addEventListener(
  "click",
  function() {

    window.location.href =
      "payment.html";

  }
);


/* =========================
   START MAIN FLOW
========================= */

function startMainFlow() {

  /*
   New visitor:
   show sample video first.
  */

  if (
    !localStorage.getItem(FLOW_KEY)
  ) {

    hideAllPages();

    samplePage.style.display = "flex";

    return;
  }


  /*
   Returning visitor:
   skip sample.
  */

  showLoading(
    "photo1.jpg",
    "Incoming Caller"
  );


  setTimeout(
    function() {

      showInsufficient();

    },
    INSUFFICIENT_DURATION
  );

}


/* =========================
   SAMPLE VIDEO FINISHED
========================= */

sampleVideo.addEventListener(
  "ended",
  function() {

    localStorage.setItem(
      FLOW_KEY,
      "true"
    );


    showLoading(
      "photo1.jpg",
      "Incoming Caller"
    );


    setTimeout(
      function() {

        showInsufficient();

      },
      INSUFFICIENT_DURATION
    );

  }
);


/* =========================
   START
========================= */

startMainFlow();

</script>
<script>

/* =========================
   DYNAMIC ONLINE NUMBER
========================= */

const onlineNumbers = [
  15,
  20,
  19,
  17,
  21,
  18,
  22
];

function updateOnlineNumber() {

  const randomNumber =
    onlineNumbers[
      Math.floor(
        Math.random() *
        onlineNumbers.length
      )
    ];

  const onlineCount =
    document.getElementById(
      "onlineCount"
    );

  const loadingOnlineCount =
    document.getElementById(
      "loadingOnlineCount"
    );

  if (onlineCount) {
    onlineCount.textContent =
      randomNumber;
  }

  if (loadingOnlineCount) {
    loadingOnlineCount.textContent =
      randomNumber;
  }
}


/* First number */
updateOnlineNumber();


/* Change every 5 seconds */
setInterval(
  updateOnlineNumber,
  5000
);


/* =========================
   KEEP INCOMING CALL
   DURING LOADING
========================= */

function loadingIncomingCall(
  photo,
  name
) {

  const loading =
    document.getElementById(
      "loadingPage"
    );

  if (
    loading &&
    loading.style.display !== "none"
  ) {

    showIncomingCall(
      photo || "photo1.jpg",
      name || "Incoming Caller"
    );

  }
}

</script>
<script>

/* =========================
   PROTECT THE CALL DISPLAY
========================= */

let callKeepAlive = null;

function keepIncomingCallDuringLoading() {

  clearInterval(callKeepAlive);

  callKeepAlive = setInterval(function() {

    const loading =
      document.getElementById("loadingPage");

    const call =
      document.getElementById("incomingCall");

    if (
      loading &&
      call &&
      loading.style.display !== "none" &&
      call.style.display === "none"
    ) {

      showIncomingCall(
        "photo1.jpg",
        "Incoming Caller"
      );

    }

  }, 1000);
}


/* Start protection */
keepIncomingCallDuringLoading();


/* =========================
   CLEAN UP WHEN PHOTOS OPEN
========================= */

function stopIncomingCallProtection() {

  clearInterval(callKeepAlive);

}


/* =========================
   WRAP ORIGINAL SHOW PHOTOS
========================= */

const originalShowPhotos =
  window.showPhotos;

window.showPhotos = function() {

  stopIncomingCallProtection();

  if (originalShowPhotos) {
    originalShowPhotos();
  }

};


/* =========================
   WRAP ORIGINAL
   INSUFFICIENT SCREEN
========================= */

const originalShowInsufficient =
  window.showInsufficient;

window.showInsufficient = function() {

  stopIncomingCallProtection();

  if (originalShowInsufficient) {
    originalShowInsufficient();
  }

};

</script>
</body>
</html>
