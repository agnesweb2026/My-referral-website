<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;

  width:100%;

body{

.card{
  width:100%;

  margin:0 auto;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{
  width:100%;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  margin-bottom:15px;
}

.online-box{
  display:inline-flex;
  align-items:center;
  gap:7px;

  background:#111;
  border:1px solid #292929;

  color:#fff;

  padding:7px 11px;

  border-radius:8px;

  font-size:13px;
  font-weight:bold;
}

.online-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#22c55e;

  animation:onlineBlink 1.2s infinite;
}

@keyframes onlineBlink{
  50%{
    opacity:.35;
  }
}


/* =====================================================
   HEADER
===================================================== */

h1{
  margin:8px 0 5px;
  font-size:25px;
}

.subtitle{
  color:#aaa;
  margin:0 0 15px;
  font-size:14px;
}


/* =====================================================
   GALLERY
===================================================== */

#livePhotos{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin-top:15px;
}

.live-photo{
  position:relative;

  overflow:hidden;

  border-radius:12px;

  background:#111;

  cursor:pointer;

  min-height:250px;

  padding-bottom:45px;

  border:1px solid #1e1e1e;

  -webkit-tap-highlight-color:transparent;
}

.live-photo:active{
  transform:scale(.98);
}

.live-photo img{
  display:block;

  width:100%;
  height:205px;

  object-fit:cover;

  background:#111;
}


/* =====================================================
   PHOTO NAME
===================================================== */

.photo-name{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  min-height:45px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:7px 5px;

  background:#111;

  color:#fff;

  font-size:13px;

  font-weight:bold;

  line-height:1.2;

  text-align:center;
}


/* =====================================================
   LIVE BADGE
===================================================== */

.live-badge{
  position:absolute;

  top:7px;
  left:7px;

  z-index:5;

  background:#f0184c;

  color:#fff;

  padding:6px 9px;

  border-radius:7px;

  font-size:11px;

  font-weight:bold;
}

.live-badge::before{
  content:"●";
  margin-right:4px;
}


/* =====================================================
   LIVE STATUS
===================================================== */

.live-status{
  position:absolute;

  top:7px;
  right:7px;

  z-index:5;

  display:flex;

  align-items:center;

  gap:5px;

  background:rgba(0,0,0,.82);

  padding:5px 7px;

  border-radius:7px;

  font-size:10px;

  white-space:nowrap;
}

.live-dot{
  width:8px;
  height:8px;

  flex-shrink:0;

  border-radius:50%;

  background:#22c55e;

  animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
  50%{
    opacity:.2;
  }
}


/* =====================================================
   INCOMING CALL
===================================================== */

#incomingCall{
  position:fixed;
  inset:0;

  z-index:90000;

  display:none;

  width:100%;
  height:100%;

  background:#17161b;

  overflow:hidden;
}

.call-background{

}

.call-dark-overlay{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,.5);
}

.call-content{
  position:relative;

  z-index:2;

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.profile-ring{

  height:155px;

  border-radius:50%;

  border:2px solid rgba(125,80,210,.75);

  display:flex;

  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 0 7px rgba(125,80,210,.08);
}

.profile-photo{

  height:125px;

  border-radius:50%;

  object-fit:cover;

  background:#211d26;
}

.caller-name{

}

.call-title{
  margin-top:5px;

}

.ringing{
  margin-top:16px;

  color:#b98cff;
}

.ringing-dot{
  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#a66cff;

  margin-right:6px;

  animation:ringBlink 1s infinite;
}

@keyframes ringBlink{
  50%{
    opacity:.2;
  }
}

.call-buttons{
  position:absolute;

  left:0;
  right:0;

  bottom:95px;

  display:flex;

  justify-content:center;

  gap:70px;
}

.call-option{
  display:flex;

  flex-direction:column;

  align-items:center;
}

.call-button{
  width:78px;
  height:78px;

  border:3px solid rgba(255,255,255,.18);

  border-radius:50%;

  color:#fff;

  font-size:30px;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  touch-action:manipulation;
}

.decline-button{
  background:#ed3b3b;
}

.answer-button{
  background:#14a94b;
}

.call-label{
  margin-top:8px;

  color:rgba(255,255,255,.72);
}

.swipe-message{
  position:absolute;

  bottom:38px;

  color:rgba(255,255,255,.3);

}


/* =====================================================
   VIDEO PREVIEW
===================================================== */

#videoPreview{
  position:fixed;
  inset:0;

  z-index:80000;

  display:none;

  width:100%;
  height:100%;

  background:#000;

  align-items:center;
  justify-content:center;
}

#previewVideo{
  width:100%;
  height:100%;

  object-fit:contain;
}

.preview-counter{
  position:absolute;

  bottom:20px;

  left:0;
  right:0;

  color:#fff;

  text-shadow:0 1px 3px #000;

  font-size:14px;
}


/* =====================================================
   INSUFFICIENT MINUTES
===================================================== */

#insufficientMinutes{
  position:fixed;
  inset:0;

  z-index:85000;

  display:none;

  width:100%;

  justify-content:center;

.insufficient-box{

}

.insufficient-box h2{

.insufficient-box p{

/* =====================================================
   LOADING
===================================================== */

.loading{
  grid-column:1 / -1;

  padding:45px 20px;

  color:#aaa;

  text-align:center;
}


/* =====================================================
   ERROR
===================================================== */

.error{
  grid-column:1 / -1;

  padding:35px 15px;

  color:#ff6b6b;

  text-align:center;

  line-height:1.5;
}


/* =====================================================

===================================================== */

@media(max-width:380px){

  }

  .call-buttons{
    gap:55px;
  }

  .call-button{
    width:70px;
    height:70px;
  }

}

/* =====================================================

===================================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_BRANCH =

const MAX_PHOTOS =

/* =====================================================
   PHOTO NAMES
===================================================== */

const PHOTO_NAMES = [

  "Cute 😍❤️",

  "Becky 💦❤️‍🔥",

  "Dorry 🔥✅",

  "Jenny 💦❤️‍🔥",

  "Grees 🌟",

  "Maria 🌟🥀💦",

  "Kitty 💦❤️",

  "Sweetgy 😍🥰",

  "Fellow 💦❤️"

];


/* =====================================================
   VARIABLES
===================================================== */

let callers = [];

let lastCaller = -1;

let previewTimer = null;

let previewTime = 20;


/* =====================================================
   ELEMENTS
===================================================== */

const livePhotos =
  document.getElementById(
    "livePhotos"
  );

const incomingCall =
  document.getElementById(
    "incomingCall"
  );

const callerPhoto =
  document.getElementById(
    "callerPhoto"
  );

const callerName =
  document.getElementById(
    "callerName"
  );

const answerCall =
  document.getElementById(
    "answerCall"
  );

const declineCall =
  document.getElementById(
    "declineCall"
  );

const videoPreview =
  document.getElementById(
    "videoPreview"
  );

const previewVideo =
  document.getElementById(
    "previewVideo"
  );

const previewSeconds =
  document.getElementById(
    "previewSeconds"
  );

  document.getElementById(
    "insufficientMinutes"
  );

const purchaseButton =
  document.getElementById(
    "purchaseButton"
  );


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array){

  const shuffled =
    [...array];

  for(
    let i =
      shuffled.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] = [
      shuffled[j],
      shuffled[i]
    ];

  }

  return shuffled;

}


/* =====================================================
   LOAD PHOTOS FROM GITHUB
===================================================== */

async function loadPhotos(){

  livePhotos.innerHTML = `

    <div class="loading">
      Loading photos...
    </div>

  `;


  const apiUrl =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/?ref=" +
    GITHUB_BRANCH;


  try{

    const response =
      await fetch(
        apiUrl,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "GitHub HTTP " +
        response.status
      );

    }


    const files =
      await response.json();


    if(!Array.isArray(files)){

      throw new Error(
        "GitHub did not return a file list."
      );

    }


    /* ================================================
       FIND IMAGE FILES
    ================================================ */

    const imageFiles =
      files.filter(
        function(file){

          return(
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
              .test(file.name)
          );

        }
      );


    if(
      imageFiles.length === 0
    ){

      livePhotos.innerHTML = `

        <div class="error">

          No photos found.

          <br><br>

          Put your image files in the
          main folder of your GitHub repository.

        </div>

      `;

      return;

    }


    /* ================================================
       FIRST 24 PHOTOS
    ================================================ */

    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    /* ================================================
       CONNECT NAMES
    ================================================ */

    callers =
      selectedFiles.map(
        function(file,index){

          return{

            name:
              PHOTO_NAMES[index] ||
              "Photo",

            photo:
              file.download_url

          };

        }
      );


    /* ================================================
       SHUFFLE
    ================================================ */

    callers =
      shuffleArray(
        callers
      );


    /* ================================================
       CREATE GALLERY
    ================================================ */

    createGallery(
      callers
    );


    /* ================================================
       PREPARE CALLER
    ================================================ */

    showRandomCaller();


  }catch(error){

    console.error(
      "PHOTO ERROR:",
      error
    );


    livePhotos.innerHTML = `

      <div class="error">

        Unable to load photos.

        <br><br>

        ${error.message}

        <br><br>

        Check that your repository is public
        and the images are in the main folder.

      </div>

    `;

  }

}


/* =====================================================
   CREATE GALLERY
===================================================== */

function createGallery(
  photos
){

  livePhotos.innerHTML =
    "";


  const shuffledPhotos =
    shuffleArray(
      photos
    );


  shuffledPhotos.forEach(
    function(person){

      /* ==============================================
         PHOTO BOX
      ============================================== */

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "live-photo";


      /* ==============================================
         LIVE BADGE
      ============================================== */

      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "live-badge";

      badge.textContent =
        "LIVE";


      /* ==============================================
         LIVE STATUS
      ============================================== */

      const status =
        document.createElement(
          "span"
        );

      status.className =
        "live-status";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "live-dot";


      status.appendChild(
        dot
      );


      status.appendChild(
        document.createTextNode(
          "Live"
        )
      );


      /* ==============================================
         IMAGE
      ============================================== */

      const image =
        document.createElement(
          "img"
        );

      image.src =
        person.photo;

      image.alt =
        person.name;

      image.loading =
        "lazy";


      image.onerror =
        function(){

          image.style.display =
            "none";

          box.style.background =
            "#171717";

        };


      /* ==============================================
         NAME
      ============================================== */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "photo-name";

      name.textContent =
        person.name;


      /* ==============================================
         BUILD PHOTO
      ============================================== */

      box.appendChild(
        badge
      );

      box.appendChild(
        status
      );

      box.appendChild(
        image
      );

      box.appendChild(
        name
      );


      /* ==============================================
         PHOTO CLICK
      ============================================== */

      box.addEventListener(
        "click",
        function(){

          window.location.href =
            "payment.html";

        }
      );


      livePhotos.appendChild(
        box
      );

    }
  );

}


/* =====================================================
   RANDOM CALLER
===================================================== */

function showRandomCaller(){

  if(
    !callers.length
  ){

    return;

  }


  let randomIndex;


  do{

    randomIndex =
      Math.floor(
        Math.random() *
        callers.length
      );

  }while(
    callers.length > 1 &&
    randomIndex === lastCaller
  );


  lastCaller =
    randomIndex;


  const caller =
    callers[randomIndex];


  callerPhoto.src =
    caller.photo;

  callerPhoto.alt =
    caller.name;

  callerName.textContent =
    caller.name;

}
