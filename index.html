<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Profiles</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.hidden{
  display:none !important;
}

.page{
  width:100%;
  min-height:100vh;
}


/* =========================
   WELCOME
========================= */

#welcomeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

.welcome-box{
  padding:25px;
}

.welcome-box h1{
  font-size:30px;
  margin-bottom:12px;
}

.welcome-box p{
  color:#aaa;
  font-size:15px;
}


/* =========================
   PHOTOS PAGE
========================= */

#photosPage{
  min-height:100vh;
  background:#000;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#080808;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:13px;
  color:#fff;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#19e66b;
  margin-right:5px;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}


/* =========================
   PHOTO GRID
========================= */

#photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:4px;
}

.photoCard{
  position:relative;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.78;
  overflow:hidden;
  background:#151515;
}

.profile-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================
   LIVE BADGE
========================= */

.live-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#e00000;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}


/* =========================
   OFFLINE BADGE
========================= */

.offline-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#555;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}


/* =========================
   VIDEO ICON
========================= */

.photo-play{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:45px;
  height:45px;

  border-radius:50%;

  background:rgba(0,0,0,.72);

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:6;

  animation:videoZoom 1.4s ease-in-out infinite;
}

.photo-play::after{
  content:"▶";

  color:#fff;

  font-size:19px;

  margin-left:3px;
}

@keyframes videoZoom{

  0%{
    transform:translate(-50%,-50%) scale(.82);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.16);
  }

  100%{
    transform:translate(-50%,-50%) scale(.82);
  }

}


/* =========================
   PHOTO INFO
========================= */

.photo-info{
  padding:7px 7px 9px;
  background:#101010;
}

.photo-name{
  display:flex;
  align-items:center;

  gap:5px;

  font-size:13px;
  font-weight:bold;

  margin-bottom:4px;
}

.name-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#19e66b;

  display:inline-block;

  flex:none;

  animation:nameBlink 1s infinite;
}

@keyframes nameBlink{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.2;
    transform:scale(.75);
  }

}

.photo-meta{
  font-size:11px;
  color:#aaa;
}


/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  position:fixed;
  inset:0;

  z-index:1000;

  background:#050505;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.call-label{
  color:#aaa;
  font-size:14px;

  margin-bottom:20px;
}

#callerImage{
  width:145px;
  height:145px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid #e00000;

  margin-bottom:18px;
}

#callerName{
  font-size:25px;
  font-weight:bold;

  margin-bottom:8px;
}

.call-status{
  color:#aaa;
  font-size:14px;

  margin-bottom:45px;
}

.call-buttons{
  display:flex;

  gap:35px;

  align-items:center;
  justify-content:center;
}

.call-btn{
  width:75px;
  height:75px;

  border:none;

  border-radius:50%;

  color:#fff;

  font-size:28px;

  cursor:pointer;
}

.decline{
  background:#e00000;
}

.answer{
  background:#16a34a;
}


/* =========================
   LIVE VIDEO PAGES
========================= */

#redLiveVideoPage,
#blackLivePage{
  position:fixed;
  inset:0;

  z-index:900;

  background:#000;
}

.live-video{
  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.red-live-label{
  position:absolute;

  top:15px;
  left:15px;

  z-index:20;

  background:#e00000;

  color:#fff;

  font-size:13px;
  font-weight:bold;

  padding:6px 10px;

  border-radius:4px;
}


/* =========================
   INSUFFICIENT PAGE
========================= */

#insufficientPage{
  position:fixed;
  inset:0;

  z-index:800;

  background:#000;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.insufficient-box{
  width:90%;
  max-width:390px;

  background:#111;

  border:1px solid #333;

  border-radius:12px;

  padding:30px 20px;
}

.insufficient-box h2{
  color:#ff3333;

  margin-bottom:12px;
}

.insufficient-box p{
  color:#aaa;

  font-size:14px;
}

#insufficientTimer{
  margin-top:18px;

  color:#fff;

  font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #photoGrid{
    grid-template-columns:repeat(3,1fr);
  }

  .photo-play{
    width:40px;
    height:40px;
  }

  .photo-play::after{
    font-size:17px;
  }

  .photo-name{
    font-size:12px;
  }

  .photo-meta{
    font-size:10px;
  }

  #callerImage{
    width:130px;
    height:130px;
  }

}

</style>
</head>

<body>

<div id="welcomeScreen" class="page">

  <div class="welcome-box">

    <h1>Welcome</h1>

    <p>
      Connecting you to live profiles...
    </p>

  </div>

</div>

<div id="photosPage" class="page hidden">

  <div class="topbar">

    <div class="logo">
      LIVE
    </div>

    <div class="online">

      <span class="online-dot"></span>

      <span id="onlineNumber">
        21
      </span>

      online

    </div>

  </div>

  <div id="photoGrid"></div>

</div>
<!-- =========================
     INCOMING CALL
========================= -->

<div id="incomingCall" class="hidden">

  <div class="call-label">
    Incoming video call
  </div>

  <img
    id="callerImage"
    src="photo1.jpg"
    alt="Caller"
  >

  <div id="callerName">
    Cute
  </div>

  <div class="call-status">
    is calling you...
  </div>

  <div class="call-buttons">

    <button
      id="declineButton"
      class="call-btn decline"
      type="button">
      ✕
    </button>

    <button
      id="answerButton"
      class="call-btn answer"
      type="button">
      ✓
    </button>

  </div>

</div>


<!-- =========================
     RED LIVE VIDEO
========================= -->

<div
  id="redLiveVideoPage"
  class="hidden">

  <div class="red-live-label">
    ● LIVE
  </div>

  <video
    id="redLiveVideo"
    class="live-video"
    playsinline
    preload="auto">
  </video>

</div>


<!-- =========================
     BLACK LIVE
========================= -->

<div
  id="blackLivePage"
  class="hidden">

  <div class="red-live-label">
    ● LIVE
  </div>

  <video
    id="blackLiveSoundVideo"
    class="live-video"
    playsinline
    preload="auto">
  </video>

</div>


<!-- =========================
     INSUFFICIENT MINUTES
========================= -->

<div
  id="insufficientPage"
  class="hidden">

  <div class="insufficient-box">

    <h2>
      Insufficient Minutes
    </h2>

    <p>
      You don't have enough minutes
      to continue this live call.
    </p>

    <div id="insufficientTimer">
      Continuing...
    </div>

  </div>

</div>


<!--
  IMPORTANT:
  Do NOT put another <script> here.

  Part 3 will contain the ONE
  JavaScript block and will close
  the HTML document.
-->
  <script>

const IMAGE_BASE = "./";
const VIDEO_URL = "./preview_20_seconds.mp4";
const SAMPLE_KEY = "myReferralSampleWatched";

const welcomeScreen = document.getElementById("welcomeScreen");
const photosPage = document.getElementById("photosPage");
const photoGrid = document.getElementById("photoGrid");

const incomingCall = document.getElementById("incomingCall");
const callerImage = document.getElementById("callerImage");
const callerName = document.getElementById("callerName");

const declineButton = document.getElementById("declineButton");
const answerButton = document.getElementById("answerButton");

const redLiveVideoPage =
  document.getElementById("redLiveVideoPage");

const redLiveVideo =
  document.getElementById("redLiveVideo");

const blackLivePage =
  document.getElementById("blackLivePage");

const blackLiveSoundVideo =
  document.getElementById("blackLiveSoundVideo");

const insufficientPage =
  document.getElementById("insufficientPage");

const insufficientTimer =
  document.getElementById("insufficientTimer");

const onlineNumber =
  document.getElementById("onlineNumber");


/* =========================
   REFERRAL
========================= */

const params =
  new URLSearchParams(window.location.search);

const employee =
  params.get("employee");

const ref =
  params.get("ref");


function openPaymentPage(){

  let url = "payment.html";

  if(employee){

    url +=
      "?employee=" +
      encodeURIComponent(employee);

  }else if(ref){

    url +=
      "?ref=" +
      encodeURIComponent(ref);

  }

  window.location.href = url;

}


/* =========================
   REAL FILES IN YOUR REPO
========================= */

const imageFiles = [

  "photo1.jpg",
  "photo2.jpg",
  "photo4.jpg",
  "photo5.jpg",

  "1785179340825.jpg",
  "1785179340825 (1).jpg",
  "1785179362758.jpg",
  "1785179915649.jpg",

  "Screenshot_20260731-045343.png"

];


/* =========================
   24 PROFILES
========================= */

const profiles = [

  ["Cute",24,"Kenya","🇰🇪"],
  ["Becky",22,"Kenya","🇰🇪"],
  ["Dorry",26,"Kenya","🇰🇪"],
  ["Sharon",23,"Kenya","🇰🇪"],
  ["Lilian",27,"Kenya","🇰🇪"],

  ["Asha",25,"Tanzania","🇹🇿"],
  ["Neema",23,"Tanzania","🇹🇿"],
  ["Zawadi",28,"Tanzania","🇹🇿"],
  ["Rehema",24,"Tanzania","🇹🇿"],

  ["Blessing",22,"Nigeria","🇳🇬"],
  ["Favour",26,"Nigeria","🇳🇬"],
  ["Peace",25,"Nigeria","🇳🇬"],
  ["Joy",27,"Nigeria","🇳🇬"],

  ["Grace",24,"Congo","🇨🇩"],
  ["Mimi",23,"Congo","🇨🇩"],
  ["Nadia",26,"Congo","🇨🇩"],
  ["Bella",25,"Congo","🇨🇩"],
  ["Princess",28,"Congo","🇨🇩"],

  ["Emily",24,"Canada","🇨🇦"],
  ["Sophie",27,"Canada","🇨🇦"],

  ["Thandi",25,"South Africa","🇿🇦"],
  ["Lerato",29,"South Africa","🇿🇦"],

  ["Ashley",23,"USA","🇺🇸"],
  ["Jessica",26,"USA","🇺🇸"]

];


/* =========================
   OFFLINE
========================= */

let offlinePeople =
  new Set();

const OFFLINE_TIME =
  5 * 60 * 1000;


function shuffle(array){

  const result =
    [...array];

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;

}


function chooseFiveOffline(){

  offlinePeople =
    new Set(
      shuffle(
        profiles.map(
          (_,i)=>i
        )
      ).slice(0,5)
    );

  updateStatuses();

}


function updateStatuses(){

  profiles.forEach(
    (_,index)=>{

      const badge =
        document.getElementById(
          "badge-" + index
        );

      const dot =
        document.getElementById(
          "dot-" + index
        );

      if(!badge || !dot){
        return;
      }

      if(
        offlinePeople.has(index)
      ){

        badge.textContent =
          "OFFLINE";

        badge.className =
          "offline-badge";

        dot.style.background =
          "#777";

        dot.style.animation =
          "none";

      }else{

        badge.textContent =
          "● LIVE";

        badge.className =
          "live-badge";

        dot.style.background =
          "#19e66b";

        dot.style.animation =
          "nameBlink 1s infinite";

      }

    }
  );

}


/* =========================
   CREATE LIVE PHOTOS
========================= */

function createPhotos(){

  photoGrid.innerHTML = "";

  profiles.forEach(
    (profile,index)=>{

      const name =
        profile[0];

      const age =
        profile[1];

      const country =
        profile[2];

      const flag =
        profile[3];

      const file =
        imageFiles[
          index % imageFiles.length
        ];

      const card =
        document.createElement("div");

      card.className =
        "photoCard";


      card.innerHTML = `

        <div class="photo-image-wrap">

          <img
            class="profile-photo"
            src="${IMAGE_BASE}${encodeURIComponent(file)}"
            alt="${name}"
            loading="eager"
            onerror="this.style.display='none';"
          >

          <div
            id="badge-${index}"
            class="live-badge">
            ● LIVE
          </div>

          <div class="photo-play"></div>

        </div>

        <div class="photo-info">

          <div class="photo-name">

            <span
              id="dot-${index}"
              class="name-dot">
            </span>

            <span>
              ${name}
            </span>

          </div>

          <div class="photo-meta">
            ${flag} ${country} • ${age}
          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        ()=>{
          openPaymentPage();
        }
      );


      photoGrid.appendChild(card);

    }
  );


  updateStatuses();

}


/* =========================
   ONLINE NUMBER
========================= */

function changeOnlineNumber(){

  onlineNumber.textContent =
    Math.floor(
      Math.random() * 16
    ) + 15;

}


changeOnlineNumber();


setInterval(
  changeOnlineNumber,
  20000
);


/* =========================
   OFFLINE CYCLE
========================= */

chooseFiveOffline();


setInterval(
  chooseFiveOffline,
  OFFLINE_TIME
);


/* =========================
   SHOW PHOTOS
========================= */

function showPhotos(){

  welcomeScreen.classList.add(
    "hidden"
  );

  incomingCall.classList.add(
    "hidden"
  );

  redLiveVideoPage.classList.add(
    "hidden"
  );

  blackLivePage.classList.add(
    "hidden"
  );

  insufficientPage.classList.add(
    "hidden"
  );

  photosPage.classList.remove(
    "hidden"
  );

}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(){

  photosPage.classList.add(
    "hidden"
  );

  incomingCall.classList.remove(
    "hidden"
  );


  const index =
    Math.floor(
      Math.random() *
      profiles.length
    );


  const profile =
    profiles[index];


  callerName.textContent =
    profile[0];


  const file =
    imageFiles[
      index % imageFiles.length
    ];


  callerImage.src =
    IMAGE_BASE +
    encodeURIComponent(file);

}


/* =========================
   START FLOW
========================= */

createPhotos();


setTimeout(
  ()=>{

    showPhotos();

    /*
      Photos visible for 2 seconds
    */

    setTimeout(
      ()=>{

        showIncomingCall();

      },
      2000
    );

  },
  3000
);


/* =========================
   DECLINE
========================= */

declineButton.addEventListener(
  "click",
  ()=>{

    incomingCall.classList.add(
      "hidden"
    );

    showPhotos();

  }
);


/* =========================
   ANSWER
========================= */

let callActive =
  false;


answerButton.addEventListener(
  "click",
  ()=>{

    if(callActive){
      return;
    }

    callActive =
      true;


    incomingCall.classList.add(
      "hidden"
    );


    if(
      !localStorage.getItem(
        SAMPLE_KEY
      )
    ){

      localStorage.setItem(
        SAMPLE_KEY,
        "true"
      );

      playRedLive();

    }else{

      playReturningCall();

    }

  }
);


/* =========================
   RED LIVE
   10s → 17s
========================= */

function playRedLive(){

  redLiveVideoPage.classList.remove(
    "hidden"
  );


  redLiveVideo.src =
    VIDEO_URL;

  redLiveVideo.muted =
    false;

  redLiveVideo.volume =
    1;


  function start(){

    try{

      redLiveVideo.currentTime =
        10;

    }catch(e){}


    redLiveVideo.play()
      .catch(
        ()=>{}
      );

  }


  if(
    redLiveVideo.readyState >= 1
  ){

    start();

  }else{

    redLiveVideo.addEventListener(
      "loadedmetadata",
      start,
      {once:true}
    );

  }


  setTimeout(
    ()=>{

      redLiveVideo.pause();

      redLiveVideoPage.classList.add(
        "hidden"
      );

      playBlackLive();

    },
    7000
  );

}


/* =========================
   BLACK LIVE
========================= */

function playBlackLive(){

  blackLivePage.classList.remove(
    "hidden"
  );


  blackLiveSoundVideo.src =
    VIDEO_URL;

  blackLiveSoundVideo.muted =
    false;

  blackLiveSoundVideo.volume =
    1;


  blackLiveSoundVideo.play()
    .catch(
      ()=>{}
    );


  setTimeout(
    ()=>{

      blackLiveSoundVideo.pause();

      blackLiveSoundVideo.removeAttribute(
        "src"
      );

      blackLiveSoundVideo.load();


      blackLivePage.classList.add(
        "hidden"
      );


      showInsufficient();

    },
    5000
  );

}


/* =========================
   RETURNING VISITOR
========================= */

function playReturningCall(){

  blackLivePage.classList.remove(
    "hidden"
  );


  blackLiveSoundVideo.pause();

  blackLiveSoundVideo.removeAttribute(
    "src"
  );

  blackLiveSoundVideo.load();


  setTimeout(
    ()=>{

      blackLivePage.classList.add(
        "hidden"
      );

      showInsufficient();

    },
    2000
  );

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(){

  insufficientPage.classList.remove(
    "hidden"
  );


  let seconds =
    2;


  insufficientTimer.textContent =
    "Continuing...";


  const timer =
    setInterval(
      ()=>{

        seconds--;


        if(seconds <= 0){

          clearInterval(timer);

          insufficientPage.classList.add(
            "hidden"
          );

          callActive =
            false;

          showPhotos();

        }

      },
      1000
    );

}

</script>

</body>
</html>
