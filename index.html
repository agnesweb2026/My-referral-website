<title>LiveX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.hidden{
  display:none!important;
}

button,input{
  font-family:inherit;
}

button{
  -webkit-appearance:none;
}

#welcomeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 25%,#3b071d,#15030d 38%,#050505 78%);
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span,
.brand span{
  color:#ff1744;
}

.welcome-title{
  margin-top:14px;
  font-size:24px;
  font-weight:800;
}

.welcome-text{
  max-width:320px;
  margin-top:8px;
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

.loading-ring{
  width:55px;
  height:55px;
  margin-top:28px;
  border:4px solid #333;
  border-top-color:#ff1744;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

#photosPage{
  display:none;
  min-height:100vh;
  padding-bottom:70px;
  background:#080808;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(5,5,5,.97);
  border-bottom:1px solid #222;
  backdrop-filter:blur(10px);
}

.brand{
  font-size:23px;
  font-weight:900;
}

.online-counter{
  padding:8px 11px;
  border-radius:20px;
  background:#151515;
  color:#ddd;
  font-size:12px;
}

.live-title{
  padding:15px 14px 6px;
  font-size:19px;
  font-weight:800;
}

.live-subtitle{
  padding:0 14px 14px;
  color:#888;
  font-size:12px;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:0 7px;
}

.profile-card{
  min-width:0;
  overflow:hidden;
  border-radius:10px;
  background:#111;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}

.profile-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.76;
  overflow:hidden;
  background:#171717;
}

.profile-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-icon{
  position:absolute;
  left:50%;
  top:50%;
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  background:rgba(0,0,0,.55);
  pointer-events:none;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.08);
  }
}
  .profile-info{
  padding:8px 7px 5px;
  background:#101010;
}

.profile-name-row{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}

.profile-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:800;
}

.country-age{
  margin-top:3px;
  color:#aaa;
  font-size:10px;
}

.status-dot{
  width:8px;
  min-width:8px;
  height:8px;
  display:inline-block;
  border-radius:50%;
}

.status-online{
  background:#20f06a;
  box-shadow:0 0 8px #20f06a;
  animation:blinkGreen 1s infinite;
}

.status-offline{
  background:#777;
}

@keyframes blinkGreen{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.25;
    transform:scale(.72);
  }
}

.actions{
  display:flex;
  gap:3px;
  padding:5px 4px;
  background:#101010;
}

.action-btn{
  flex:1;
  min-width:0;
  border:0;
  border-radius:7px;
  padding:6px 2px;
  background:#181818;
  color:#ddd;
  font-size:9px;
  cursor:pointer;
}

.action-btn:active{
  transform:scale(.94);
}

.action-btn.active{
  color:#ff4d72;
  background:#281018;
}

.chat-preview{
  min-height:29px;
  overflow:hidden;
  padding:4px 7px 7px;
  background:#101010;
  color:#aaa;
  font-size:9px;
  line-height:1.25;
}

.chat-preview span{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

#incomingCall{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:25px;
  background:
    radial-gradient(circle at center,#32101b,#080808 65%);
  text-align:center;
}

.call-avatar{
  width:120px;
  height:120px;
  object-fit:cover;
  border:4px solid #ff1744;
  border-radius:50%;
  animation:callPulse 1.3s infinite;
}

@keyframes callPulse{
  0%,100%{
    box-shadow:0 0 20px rgba(255,23,68,.35);
  }
  50%{
    box-shadow:0 0 50px rgba(255,23,68,.75);
  }
}

.call-live{

  padding:6px 11px;
  border-radius:20px;
  background:#ff1744;
  font-size:11px;
  font-weight:900;
}

.call-name{
  margin-top:13px;
  font-size:25px;
  font-weight:900;
}

.call-text{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

.call-buttons{
  display:flex;
  gap:30px;
  margin-top:35px;
}

.call-btn{

  height:68px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:25px;
}

.answer-btn{
  background:#16b957;
}

.reject-btn{
  background:#e5163e;
  }

  align-items:center;
  justify-content:center;

#callVideo{

.video-top{

.live-badge{

.video-name{

.video-bottom{

.video-timer{

.chat-input-area{

.chat-input{

  color:#fff;

.send-chat{
  width:45px;

  color:#fff;
  font-size:17px;

#toast{

  bottom:22px;
  z-index:1000;
  padding:10px 15px;
  border-radius:20px;
  background:#fff;
  color:#111;
  font-size:12px;
  font-weight:700;
  opacity:0;
  transform:translateX(-50%) translateY(100px);
  transition:.25s ease;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

  .photo-grid{

  document.getElementById("chatAvatar");

const chatPersonName =
  document.getElementById("chatPersonName");

const chatMessages =
  document.getElementById("chatMessages");

const chatInput =
  document.getElementById("chatInput");

const sendChat =
  document.getElementById("sendChat");

const closeChat =
  document.getElementById("closeChat");

const toast =
  document.getElementById("toast");

let currentCaller =
  profiles[0];

let currentChatProfile =
  null;

let currentVideoTimer =
  null;

let currentVideoStarted =
  false;

let offlineIndexes =
  new Set();

let chatTimers =
  [];

function shuffle(array){

  const copy =
    array.slice();

  for(
    let i=copy.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      copy[i],
      copy[j]
    ]=[
      copy[j],
      copy[i]
    ];

  }

  return copy;
}

function randomItem(array){

  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];

}

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    1800
  );

      }
  function openPayment(profile){

  const params =
    new URLSearchParams();

  params.set(
    "profile",
    profile.name
  );

  params.set(
    "age",
    profile.age
  );

  params.set(
    "country",
    profile.country
  );

  const ref =
    new URLSearchParams(
      window.location.search
    ).get("ref");

  if(ref){

    params.set(
      "ref",
      ref
    );

  }

  window.location.href =
    "payment.html?" +
    params.toString();

}

function chooseOfflinePeople(){

  const indexes =
    profiles.map(
      function(_,index){
        return index;
      }
    );

  offlineIndexes =
    new Set(
      shuffle(indexes).slice(0,5)
    );

  updateStatuses();

}

function updateStatuses(){

  const cards =
    document.querySelectorAll(
      ".profile-card"
    );

  cards.forEach(
    function(card){

      const index =
        Number(
          card.dataset.index
        );

      const dot =
        card.querySelector(
          ".status-dot"
        );

      if(
        offlineIndexes.has(index)
      ){

        dot.classList.remove(
          "status-online"
        );

        dot.classList.add(
          "status-offline"
        );

      }else{

        dot.classList.remove(
          "status-offline"
        );

        dot.classList.add(
          "status-online"
        );

      }

    }
  );

  onlineCounter.textContent =
    (
      profiles.length -
      offlineIndexes.size
    ) +
    " online";

}

function makeActionButton(
  icon,
  label
){

  const button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "action-btn";

  button.textContent =
    icon+" "+label;

  return button;

}

function renderPhotos(){

  photoGrid.innerHTML =
    "";

  profiles.forEach(
    function(profile,index){

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "profile-card";

      card.dataset.index =
        index;


      const imageWrap =
        document.createElement(
          "div"
        );

      imageWrap.className =
        "profile-image-wrap";


      const image =
        document.createElement(
          "img"
        );

      image.className =
        "profile-image";

      image.src =
        profile.image;

      image.alt =
        profile.name;

      image.loading =
        "lazy";


      const videoIcon =
        document.createElement(
          "div"
        );

      videoIcon.className =
        "video-icon";

      videoIcon.textContent =
        "▶";


      imageWrap.appendChild(
        image
      );

      imageWrap.appendChild(
        videoIcon
      );


      imageWrap.addEventListener(
        "click",
        function(){

          openPayment(
            profile
          );

        }
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "profile-info";


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "profile-name-row";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "status-dot";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "profile-name";

      name.textContent =
        profile.name;


      row.appendChild(
        dot
      );

      row.appendChild(
        name
      );


      const countryAge =
        document.createElement(
          "div"
        );

      countryAge.className =
        "country-age";

      countryAge.textContent =
        profile.country+
        " • "+
        profile.age;


      info.appendChild(
        row
      );

      info.appendChild(
        countryAge
      );


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "actions";


      const like =
        makeActionButton(
          "♡",
          "Like"
        );

      const love =
        makeActionButton(
          "♥",
          "Love"
        );

      const follow =
        makeActionButton(
          "＋",
          "Follow"
        );

      const chat =
        makeActionButton(
          "💬",
          "Chat"
        );


      like.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          like.classList.toggle(
            "active"
          );

        }
      );


      love.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          love.classList.toggle(
            "active"
          );

        }
      );


      follow.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          follow.classList.toggle(
            "active"
          );

          showToast(
            follow.classList.contains(
              "active"
            )
            ?
            "Following "+profile.name
            :
            "Unfollowed "+profile.name
          );

        }
      );


      chat.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          openChat(
            profile
          );

        }
      );


      actions.appendChild(
        like
      );

      actions.appendChild(
        love
      );

      actions.appendChild(
        follow
      );

      actions.appendChild(
        chat
      );


      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "chat-preview";

      preview.id =
        "preview-"+index;

      preview.innerHTML =
        "<span>Typing...</span>";


      card.appendChild(
        imageWrap
      );

      card.appendChild(
        info
      );

      card.appendChild(
        actions
      );

      card.appendChild(
        preview
      );

      photoGrid.appendChild(
        card
      );

    }
  );

  chooseOfflinePeople();

  startIndependentChats();

}

function startIndependentChats(){

  stopChatTimers();

  profiles.forEach(
    function(profile,index){

      let messageIndex =
        0;

      function nextMessage(){

        const preview =
          document.getElementById(
            "preview-"+index
          );

        if(!preview){
          return;
        }

        preview.innerHTML =
          "<span>"+
          profile.messages[
            messageIndex
          ]+
          "</span>";

        messageIndex =
          (
            messageIndex+1
          )%
          profile.messages.length;

        const timer =
          setTimeout(
            nextMessage,
            4500+
            Math.floor(
              Math.random()*7000
            )
          );

        chatTimers.push(
          timer
        );

      }

      const firstTimer =
        setTimeout(
          nextMessage,
          1000+
          Math.floor(
            Math.random()*5000
          )
        );

      chatTimers.push(
        firstTimer
      );

    }
  );

}

function stopChatTimers(){

  chatTimers.forEach(
    function(timer){

      clearTimeout(
        timer
      );

    }
  );

  chatTimers =
    [];

  }
  function openChat(profile){

  currentChatProfile =
    profile;

  chatAvatar.src =
    profile.image;

  chatPersonName.textContent =
    profile.name;

  chatMessages.innerHTML =
    "";

  profile.messages.forEach(
    function(message,index){

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message them";

      bubble.textContent =
        message;

      bubble.style.opacity =
        "0";

      chatMessages.appendChild(
        bubble
      );

      setTimeout(
        function(){

          bubble.style.transition =
            "opacity .25s ease";

          bubble.style.opacity =
            "1";

        },
        250*index
      );

    }
  );

  chatModal.style.display =
    "flex";

}

closeChat.addEventListener(
  "click",
  function(){

    chatModal.style.display =
      "none";

  }
);

chatModal.addEventListener(
  "click",
  function(e){

    if(
      e.target===chatModal
    ){

      chatModal.style.display =
        "none";

    }

  }
);

function sendMessage(){

  const text =
    chatInput.value.trim();

  if(
    !text ||
    !currentChatProfile
  ){

    return;

  }

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message me";

  bubble.textContent =
    text;

  chatMessages.appendChild(
    bubble
  );

  chatInput.value =
    "";

  chatMessages.scrollTop =
    chatMessages.scrollHeight;


  setTimeout(
    function(){

      if(
        !currentChatProfile
      ){

        return;

      }

      const reply =
        document.createElement(
          "div"
        );

      reply.className =
        "message them";

      reply.textContent =
        randomItem(
          currentChatProfile.messages
        );

      chatMessages.appendChild(
        reply
      );

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

    },
    1800+
    Math.floor(
      Math.random()*2200
    )
  );

}

sendChat.addEventListener(
  "click",
  sendMessage
);

chatInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="Enter"
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);

function showPhotos(){

  welcomeScreen.style.display =
    "none";

  photosPage.style.display =
    "block";

}

function chooseCaller(){

  currentCaller =
    randomItem(
      profiles
    );

  callAvatar.src =
    currentCaller.image;

  callName.textContent =
    currentCaller.name;

  videoCallerName.textContent =
    currentCaller.name;

}

function showIncomingCall(){

  chooseCaller();

  incomingCall.style.display =
    "flex";

}

function hideIncomingCall(){

  incomingCall.style.display =
    "none";

}

function startFirstVideo(){

  hideIncomingCall();

  videoCall.style.display =
    "flex";

  currentVideoStarted =
    true;

  callVideo.src =
    NEW_VIDEO;

  callVideo.currentTime =
    0;

  callVideo.loop =
    false;

  callVideo.muted =
    false;

  callVideo.volume =
    1;

  callVideo.controls =
    false;


  const playPromise =
    callVideo.play();

  if(
    playPromise &&
    typeof playPromise.catch==="function"
  ){

    playPromise.catch(
      function(){

        callVideo.controls =
          true;

        showToast(
          "Tap video to start sound"
        );

      }
    );

  }


  let remaining =
    40;

  videoTimer.textContent =
    remaining+
    " seconds";

  clearInterval(
    currentVideoTimer
  );

  currentVideoTimer =
    setInterval(
      function(){

        remaining--;

        if(
          remaining<0
        ){

          remaining=0;

        }

        videoTimer.textContent =
          remaining+
          " seconds";

      },
      1000
    );


  setTimeout(
    function(){

      if(
        currentVideoStarted
      ){

        finishVideoCall();

      }

    },
    VIDEO_DURATION
  );

}

function finishVideoCall(){

  if(
    !currentVideoStarted
  ){

    return;

  }

  currentVideoStarted =
    false;

  clearInterval(
    currentVideoTimer
  );

  callVideo.pause();

  callVideo.currentTime =
    0;

  callVideo.removeAttribute(
    "src"
  );

  callVideo.load();

  callVideo.controls =
    false;

  videoCall.style.display =
    "none";

  showInsufficient();

    }
  function showInsufficient(){

  insufficientPage.style.display =
    "flex";

  setTimeout(
    function(){

      insufficientPage.style.display =
        "none";

      showPhotos();

    },
    INSUFFICIENT_DURATION
  );

}

answerCall.addEventListener(
  "click",
  function(){

    const alreadyPlayed =
      localStorage.getItem(
        FIRST_VIDEO_KEY
      )==="yes";

    if(
      !alreadyPlayed
    ){

      localStorage.setItem(
        FIRST_VIDEO_KEY,
        "yes"
      );

      startFirstVideo();

    }else{

      hideIncomingCall();

      showPhotos();

    }

  }
);

rejectCall.addEventListener(
  "click",
  function(){

    hideIncomingCall();

    showPhotos();

  }
);

callVideo.addEventListener(
  "ended",
  function(){

    if(
      currentVideoStarted
    ){

      finishVideoCall();

    }

  }
);

callVideo.addEventListener(
  "error",
  function(){

    if(
      currentVideoStarted
    ){

      showToast(
        "Video could not be loaded"
      );

    }

  }
);

setInterval(
  function(){

    chooseOfflinePeople();

  },
  OFFLINE_CHANGE_TIME
);

function startWebsite(){

  renderPhotos();

  setTimeout(
    function(){

      showPhotos();

      setTimeout(
        function(){

          const alreadyPlayed =
            localStorage.getItem(
              FIRST_VIDEO_KEY
            )==="yes";

          if(
            !alreadyPlayed
          ){

            showIncomingCall();

          }

        },
        PHOTOS_DELAY
      );

    },
    WELCOME_DURATION
  );

}

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.hidden
    ){

      return;

    }

  }
);

callVideo.loop =
  false;

startWebsite();

</script>
