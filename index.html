/* =================================
   WELCOME
================================= */

  align-items:center;
  justify-content:center;
  flex-direction:column;

  text-align:center;

.welcome-title{
  font-size:30px;
  font-weight:900;
  margin-bottom:10px;
}

.welcome-subtitle{

/* =================================
   LIVE PHOTOS
================================= */

#photosPage{
  display:none;

  width:100%;
  min-height:100vh;

  background:#000;
}

.top-bar{
  position:sticky;
  top:0;
  z-index:30;

  width:100%;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  background:#090909;
  border-bottom:1px solid #222;
}

.site-title{
  font-size:20px;
  font-weight:900;
}

.online-box{
  display:flex;
  align-items:center;
  gap:6px;

  color:#ddd;
  font-size:13px;
  font-weight:700;
}

.online-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#18e66a;

  box-shadow:
    0 0 8px rgba(24,230,106,.8);
}

.live-header{
  color:#ff2020;
  font-size:13px;
  font-weight:900;
}


/* =================================
   PHOTO GRID
================================= */

#photoGrid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:4px;

  padding:4px;

  background:#000;
}

.photoCard{
  position:relative;

  width:100%;

  overflow:hidden;

  background:#111;

  border-radius:5px;

  cursor:pointer;
}

.photo-image-wrap{
  position:relative;

  width:100%;

  aspect-ratio:.72;

  overflow:hidden;

  background:#151515;
}

.profile-photo{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#151515;
}

.photo-play{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:45px;
  height:45px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    rgba(0,0,0,.68);

  border:
    2px solid rgba(255,255,255,.9);

  color:#fff;

  font-size:19px;

  animation:
    playPulse 1.5s infinite;
}

@keyframes playPulse{

  0%,100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

}

.live-badge,
.offline-badge{
  position:absolute;

  top:6px;
  left:6px;

  padding:4px 7px;

  border-radius:5px;

  color:#fff;

  font-size:9px;
  font-weight:900;
}

.live-badge{
  background:#e60000;
}

.offline-badge{
  background:#555;
}

.photo-info{
  padding:7px;

  background:#0b0b0b;
}

.photo-name{
  color:#fff;

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.photo-meta{
  margin-top:3px;

  color:#999;

  font-size:10px;

function getImage(index){

    imageFiles[

    ];


  return (
    IMAGE_BASE +
    encodeURIComponent(file)
  );

}


/* =====================================================
   OFFLINE SYSTEM
===================================================== */

const offlineUntil = {};


function isOffline(index){

  if(
    !offlineUntil[index]
  ){

    return false;

  }


  if(
    Date.now() >=
    offlineUntil[index]
  ){

    delete offlineUntil[index];

    return false;

  }


  return true;

}


function createRandomOffline(){

  /*
    Remove expired offline profiles.
  */

  Object.keys(
    offlineUntil
  ).forEach(
    function(index){

      if(
        Date.now() >=
        offlineUntil[index]
      ){

        delete offlineUntil[index];

      }

    }
  );


  /*
    Do not keep creating a new
    offline profile every refresh.
  */

  const activeOffline =
    Object.keys(
      offlineUntil
    ).filter(
      function(index){

        return isOffline(
          Number(index)
        );

      }
    );


  if(
    activeOffline.length === 0
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        profiles.length
      );


    offlineUntil[randomIndex] =
      Date.now() +
      OFFLINE_DURATION;

  }

}

  if(onlineNumber){

/*
   Change the number at a random
   interval between 15 and 35 seconds.
*/

function scheduleOnlineNumber(){

  const delay =
    Math.floor(
      Math.random() * 20000
    ) + 15000;


  setTimeout(
    function(){

      randomOnlineNumber();

      scheduleOnlineNumber();

    },
    delay
  );

}


/* =====================================================
   BUILD PHOTO GRID
===================================================== */

function buildPhotoGrid(){

  if(!photoGrid){
    return;
  }


  createRandomOffline();


  photoGrid.innerHTML = "";


  profiles.forEach(
    function(profile,index){

      const offline =
        isOffline(index);


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "photoCard";


      const imageWrap =
        document.createElement(
          "div"
        );


      imageWrap.className =
        "photo-image-wrap";


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "profile-photo";


      img.src =
        getImage(index);


      img.alt =
        profile.name;


      img.onerror =
        function(){

          /*
             If an image fails,
             use photo1.jpg.
          */

          if(
            this.dataset.fallback !==
            "yes"
          ){

            this.dataset.fallback =
              "yes";


            this.src =
              IMAGE_BASE +
              "photo1.jpg";

          }

        };


      imageWrap.appendChild(img);


      const play =
        document.createElement(
          "div"
        );


      play.className =
        "photo-play";


      play.textContent =
        "▶";


      imageWrap.appendChild(play);


      const badge =
        document.createElement(
          "div"
        );


      badge.className =
        offline
          ? "offline-badge"
          : "live-badge";


      badge.textContent =
        offline
          ? "OFFLINE"
          : "LIVE";


      imageWrap.appendChild(badge);


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "photo-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "photo-name";


      name.textContent =
        profile.name;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "photo-meta";


      meta.textContent =
        profile.flag +
        " " +
        profile.age;


      info.appendChild(name);

      info.appendChild(meta);


      card.appendChild(imageWrap);

      card.appendChild(info);


      /*
        Only LIVE profiles open
        payment.html.
      */

      card.addEventListener(
        "click",
        function(){

          if(offline){

            return;

          }


          openPaymentPage();

        }
      );


      photoGrid.appendChild(card);

    }
  );

function showPhotos(){

  hideAll();


  if(photosPage){

    photosPage.style.display =
      "block";

  }


  buildPhotoGrid();

}


/* =====================================================
   CHOOSE CALLER
===================================================== */

let currentCallerIndex = -1;


function chooseCaller(){

  const available = [];


  profiles.forEach(
    function(profile,index){

      if(
        !isOffline(index)
      ){

        available.push(index);

      }

    }
  );


  if(
    available.length === 0
  ){

    /*
      Safety fallback.
    */

    Object.keys(
      offlineUntil
    ).forEach(
      function(index){

        delete offlineUntil[index];

      }
    );


    return chooseCaller();

  }


  const randomPosition =
    Math.floor(
      Math.random() *
      available.length
    );


  return available[
    randomPosition
  ];

}


/* =====================================================
   SHOW INCOMING CALL
===================================================== */

function showIncomingCall(){

  currentCallerIndex =
    chooseCaller();


  const profile =
    profiles[
      currentCallerIndex
    ];


  if(callerImage){

    callerImage.src =
      getImage(
        currentCallerIndex
      );

  }


  if(callerName){

    callerName.textContent =
      profile.name;

  }


  hideAll();


  if(incomingCall){

    incomingCall.style.display =
      "flex";

  }

}
    <script>

/* =====================================================
   AUTOMATIC FIRST CALL
===================================================== */

function startCallTimer(){

  /*
    Live Photos appear first.

    After exactly 2 seconds,
    incoming call appears.
  */

  setTimeout(
    function(){

      showIncomingCall();

    },
    PHOTOS_BEFORE_CALL
  );

}


/* =====================================================
   DECLINE
===================================================== */

if(declineButton){

  declineButton.addEventListener(
    "click",
    function(){

      /*
        Decline simply returns
        to Live Photos.
      */

      showPhotos();

    }
  );

}


/* =====================================================
   ANSWER
===================================================== */

if(answerButton){

  answerButton.addEventListener(
    "click",
    function(){

      /*
        Check visitor history.
      */

      const firstRedAlreadyShown =
        localStorage.getItem(
          FIRST_RED_SEEN_KEY
        );


      /*
        FIRST CALL FOR THIS VISITOR
        ===========================

        Red LIVE
        Real video
        Sound ON
        Starts at 10 seconds
        Plays 7 seconds
      */

      if(
        !firstRedAlreadyShown
      ){

        playFirstRedLive();

      }


      /*
        SECOND / LATER CALL
        ===================

        No video.
        No sound.
        Black screen.
        Red LIVE.
        2 seconds.
      */

      else{

        playSecondBlackLive();

      }

    }
  );

}


/* =====================================================
   FIRST RED LIVE
===================================================== */

function playFirstRedLive(){

  hideAll();


  if(!redLiveVideoPage){

    return;

  }


  redLiveVideoPage.style.display =
    "flex";


  if(!redLiveVideo){

    return;

  }


  /*
    IMPORTANT:

    The video play() is called
    directly from the Answer
    button flow.

    This gives the browser the
    best chance of allowing
    sound because the visitor
    just interacted with the page.
  */

  try{

    redLiveVideo.pause();


    /*
      Start at exactly 10 seconds.
    */

    redLiveVideo.currentTime =
      FIRST_RED_START;


    redLiveVideo.muted =
      false;


    redLiveVideo.volume =
      1;


    const playPromise =
      redLiveVideo.play();


    if(
      playPromise &&
      playPromise.catch
    ){

      playPromise.catch(
        function(error){

          console.log(
            "Video playback blocked:",
            error
          );

        }
      );

    }

  }
  catch(error){

    console.log(error);

  }


  /*
    Mark the visitor as having
    already received the first
    Red LIVE.

    This happens BEFORE the
    7-second timer finishes, so
    refresh/revisit will not
    accidentally get another
    first Red LIVE.
  */

  localStorage.setItem(
    FIRST_RED_SEEN_KEY,
    "yes"
  );


  /*
    Stop after exactly 7 seconds.

    10s -> 17s
  */

  setTimeout(
    function(){

      try{

        redLiveVideo.pause();


        redLiveVideo.currentTime =
          FIRST_RED_START;

      }
      catch(error){}


      showInsufficient();

    },
    FIRST_RED_DURATION
  );

}


/* =====================================================
   SECOND / LATER CALL
===================================================== */

function playSecondBlackLive(){

  hideAll();


  if(!blackLivePage){

    return;

  }


  /*
    Black screen only.
  */

  blackLivePage.style.display =
    "flex";


  /*
    Make absolutely sure the
    real video is not playing.
  */

  if(redLiveVideo){

    try{

      redLiveVideo.pause();

      redLiveVideo.muted =
        true;

      redLiveVideo.volume =
        0;

    }
    catch(error){}

  }


  /*
    Exactly 2 seconds.
  */

  setTimeout(
    function(){

      showInsufficient();

    },
    SECOND_CALL_DURATION
  );

}


/* =====================================================
   INSUFFICIENT MINUTES
===================================================== */

function showInsufficient(){

  hideAll();


  if(insufficientPage){

    insufficientPage.style.display =
      "flex";

  }


  let seconds = 2;


  if(insufficientTimer){

    insufficientTimer.textContent =
      seconds;


    const timer =
      setInterval(
        function(){

          seconds--;


          if(
            seconds >= 0
          ){

            insufficientTimer.textContent =
              seconds;

          }


          if(
            seconds <= 0
          ){

            clearInterval(timer);

          }

        },
        1000
      );

  }


  /*
    After 2 seconds return
    to Live Photos.

    Then another automatic
    incoming call can appear
    after 2 more seconds.
  */

  setTimeout(
    function(){

      showPhotos();


      startCallTimer();

    },
    INSUFFICIENT_DURATION
  );

}


/* =====================================================
   PAYMENT PAGE
===================================================== */

function openPaymentPage(){

  const employee =
    localStorage.getItem(
      "referralEmployeeId"
    );


  let url =
    "payment.html";


  if(employee){

    url +=
      "?employee=" +
      encodeURIComponent(
        employee
      );

  }


  window.location.href =
    url;

}


/* =====================================================
   START WEBSITE
===================================================== */

function startWebsite(){

  hideAll();


  /*
    Welcome page first.
  */

  if(welcomeScreen){

    welcomeScreen.style.display =
      "flex";

  }


  /*
    Welcome lasts 3 seconds.
  */

  setTimeout(
    function(){

      showPhotos();


      /*
        Live Photos are shown.

        After 2 seconds:
        INCOMING CALL.
      */

      startCallTimer();

    },
    WELCOME_DURATION
  );

}


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /*
      Initial random online number.
    */

    randomOnlineNumber();


    /*
      Continue changing it at
      random intervals.
    */

    scheduleOnlineNumber();


    /*
      Build photos.
    */

    buildPhotoGrid();


    /*
      Start complete flow.
    */

    startWebsite();

  }
);


/* =====================================================
   OFFLINE PROFILE UPDATE
===================================================== */

setInterval(
  function(){

    createRandomOffline();


    /*
      Rebuild only when the
      visitor is currently looking
      at Live Photos.
    */

    if(
      photosPage &&
      photosPage.style.display !==
      "none"
    ){

      buildPhotoGrid();

    }

  },
  30000
);


/* =====================================================
   RED VIDEO SAFETY
===================================================== */

if(redLiveVideo){

  redLiveVideo.addEventListener(
    "timeupdate",
    function(){

      /*
        Never allow the first
        video to continue beyond
        17 seconds.
      */

      if(
        redLiveVideo.currentTime >=
        FIRST_RED_START + 7
      ){

        try{

          redLiveVideo.pause();

        }
        catch(error){}

      }

    }
  );


  redLiveVideo.addEventListener(
    "loadedmetadata",
    function(){

      /*
        Only seek to 10 seconds
        if the video is long enough.
      */

      if(
        redLiveVideo.duration >=
        FIRST_RED_START
      ){

        try{

          redLiveVideo.currentTime =
            FIRST_RED_START;

        }
        catch(error){}

      }

    }
  );

}


/* =====================================================
   STOP VIDEO WHEN PAGE IS LEFT
===================================================== */

window.addEventListener(
  "pagehide",
  function(){

    try{

      if(redLiveVideo){

        redLiveVideo.pause();

      }

    }
    catch(error){}

  }
);

</script>
