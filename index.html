<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>My Referral Website</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* =========================
   GENERAL
========================= */

.page{
  display:none;
  min-height:100vh;
  width:100%;
}

/* =========================
   LIVE PHOTOS PAGE
========================= */

#photosPage{
  background:#000;
  padding-bottom:20px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  height:52px;
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#080808;
  border-bottom:1px solid #222;

  font-size:15px;
  font-weight:bold;
}

.live-title{
  display:flex;
  align-items:center;
  gap:7px;
}

.live-badge{
  background:#e00000;
  color:#fff;
  padding:5px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00e676;
  display:inline-block;
  box-shadow:0 0 8px #00e676;
}

.photos-grid{
  width:100%;
  padding:10px;

  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.photo-card{
  position:relative;
  width:100%;
  aspect-ratio:0.78;

  overflow:hidden;
  border-radius:10px;

  background:#111;
  cursor:pointer;
}

.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-dark{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05),
      rgba(0,0,0,.10),
      rgba(0,0,0,.75)
    );
}

.photo-live{
  position:absolute;
  top:8px;
  left:8px;

  display:flex;
  align-items:center;
  gap:5px;

  background:#e00000;
  padding:5px 7px;
  border-radius:5px;

  font-size:10px;
  font-weight:bold;
}

.photo-live-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
}

.photo-video{
  position:absolute;
  top:8px;
  right:8px;

  width:25px;
  height:25px;

  border-radius:50%;
  background:rgba(0,0,0,.55);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
}

.photo-name{
  position:absolute;
  left:10px;
  bottom:9px;

  font-size:14px;
  font-weight:bold;

  text-shadow:0 2px 5px #000;
}

/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  position:fixed;
  inset:0;

  z-index:100000;

  display:none;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:#050505;
}

.call-background{
  position:absolute;
  inset:-20px;

  background-size:cover;
  background-position:center;

  filter:
    blur(14px)
    brightness(.30);

  transform:scale(1.08);
}

.call-overlay{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,.05),
      rgba(0,0,0,.65)
    );
}

.call-content{
  position:relative;
  z-index:5;

  width:100%;
  max-width:430px;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:25px;
}

.incoming-label{
  font-size:14px;
  letter-spacing:1px;
  margin-bottom:24px;

  color:#eee;
}

.caller-ring{
  position:relative;

  width:180px;
  height:180px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:25px;
}

.caller-ring::before,
.caller-ring::after{
  content:"";

  position:absolute;
  inset:0;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.35);

  animation:ringPulse 2s infinite;
}

.caller-ring::after{
  animation-delay:1s;
}

@keyframes ringPulse{

  0%{
    transform:scale(.90);
    opacity:.8;
  }

  100%{
    transform:scale(1.35);
    opacity:0;
  }
}

.caller-photo{
  position:relative;
  z-index:3;

  width:145px;
  height:145px;

  border-radius:50%;

  object-fit:cover;

  border:4px solid #fff;

  box-shadow:
    0 0 30px rgba(255,255,255,.25);

  animation:callerZoom 3s ease-in-out infinite;
}

@keyframes callerZoom{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }
}

.caller-name{
  font-size:27px;
  font-weight:bold;

  margin-bottom:8px;

  text-align:center;
}

.ringing{
  font-size:14px;
  color:#bbb;

  margin-bottom:50px;
}

.call-buttons{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:
    space-around;
}

.call-button{
  border:0;

  width:75px;
  height:75px;

  border-radius:50%;

  color:#fff;

  font-size:28px;

  cursor:pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);
}

.decline{
  background:#e00000;
}

.answer{
  background:#00a83b;
}

.button-label{
  margin-top:9px;
  text-align:center;

  font-size:12px;
  color:#ddd;
}

/* =========================
   LIVE ANSWER VIDEO
========================= */

#liveSoundScreen{
  position:fixed;
  inset:0;

  z-index:110000;

  display:none;

  background:#000;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

#liveSoundVideo{
  width:100%;
  height:100%;

  object-fit:cover;

  filter:
    blur(10px)
    brightness(.45);

  transform:scale(1.08);

  background:#000;
}

.live-top{
  position:absolute;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  align-items:center;
  gap:6px;

  background:#e00000;

  padding:7px 12px;

  border-radius:6px;

  font-size:13px;
  font-weight:bold;
}

.live-red-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;

  animation:blink 1s infinite;
}

@keyframes blink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }
}

/* =========================
   INSUFFICIENT MINUTES
========================= */

#insufficientPage{
  position:fixed;
  inset:0;

  z-index:90000;

  display:none;

  align-items:center;
  justify-content:center;

  background:#000;

  padding:20px;
}

.insufficient-box{
  width:100%;
  max-width:360px;

  background:#111;

  border:1px solid #2b2b2b;

  border-radius:16px;

  padding:28px 20px;

  text-align:center;

  box-shadow:
    0 15px 50px rgba(0,0,0,.6);
}

.insufficient-icon{
  width:65px;
  height:65px;

  margin:0 auto 18px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e00000;

  font-size:30px;
}

.insufficient-title{
  font-size:24px;
  font-weight:bold;

  margin-bottom:10px;
}

.insufficient-text{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:360px){

  .caller-ring{
    width:155px;
    height:155px;
  }

  .caller-photo{
    width:125px;
    height:125px;
  }

  .caller-name{
    font-size:24px;
  }

  .call-button{
    width:68px;
    height:68px;
  }
}

</style>
</head>

<body>


<!-- ==================================================
     LIVE PHOTOS
================================================== -->

<div id="photosPage" class="page">

  <div class="topbar">

    <div class="live-title">

      <span class="live-badge">
        LIVE
      </span>

      <span class="online-dot"></span>

      <span id="onlineNumber">
        19 online
      </span>

    </div>

  </div>


  <div id="photosGrid"
       class="photos-grid">
  </div>

</div>


<!-- ==================================================
     INSUFFICIENT MINUTES
================================================== -->

<div id="insufficientPage">

  <div class="insufficient-box">

    <div class="insufficient-icon">
      ⏱
    </div>

    <div class="insufficient-title">
      Insufficient Minutes
    </div>

    <div class="insufficient-text">
      You don't have enough minutes to continue this video call.
    </div>

  </div>

</div>


<!-- ==================================================
     INCOMING VIDEO CALL
================================================== -->

<div id="incomingCall">

  <div id="callBackground"
       class="call-background">
  </div>

  <div class="call-overlay"></div>


  <div class="call-content">

    <div class="incoming-label">
      INCOMING VIDEO CALL
    </div>


    <div class="caller-ring">

      <img id="callerPhoto"
           class="caller-photo"
           src=""
           alt="Caller">

    </div>


    <div id="callerName"
         class="caller-name">
      Incoming Call
    </div>


    <div class="ringing">
      Ringing...
    </div>


    <div class="call-buttons">


      <div>

        <button id="declineButton"
                class="call-button decline">
          ☎
        </button>

        <div class="button-label">
          Decline
        </div>

      </div>


      <div>

        <button id="answerButton"
                class="call-button answer">
          ☎
        </button>

        <div class="button-label">
          Answer
        </div>

      </div>


    </div>

  </div>

</div>


<!-- ==================================================
     ANSWERED LIVE VIDEO
================================================== -->

<div id="liveSoundScreen">

  <video id="liveSoundVideo"
         playsinline
         preload="auto">

    <source
      src="preview_20_seconds.mp4"
      type="video/mp4">

  </video>


  <div class="live-top">

    <span class="live-red-dot"></span>

    LIVE

  </div>

</div>


<script>

/* ==================================================
   SETTINGS
================================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";


/* Timing */

const LIVE_SOUND_DURATION =
  7000;

const INSUFFICIENT_DURATION =
  2000;

const PHOTOS_DURATION =
  5000;


/* ==================================================
   ELEMENTS
================================================== */

const photosPage =
  document.getElementById("photosPage");

const photosGrid =
  document.getElementById("photosGrid");

const incomingCall =
  document.getElementById("incomingCall");

const callBackground =
  document.getElementById("callBackground");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerName =
  document.getElementById("callerName");

const answerButton =
  document.getElementById("answerButton");

const declineButton =
  document.getElementById("declineButton");

const liveSoundScreen =
  document.getElementById("liveSoundScreen");

const liveSoundVideo =
  document.getElementById("liveSoundVideo");

const insufficientPage =
  document.getElementById("insufficientPage");

const onlineNumber =
  document.getElementById("onlineNumber");


/* ==================================================
   DATA
================================================== */

let photos = [];

let currentCaller = null;

let incomingTimer = null;

let photosTimer = null;


/* Names */

const photoNames = [

  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Ashley",
  "Mary",
  "Cindy",
  "Mercy",
  "Linda",
  "Sharon",
  "Brenda",
  "Diana",
  "Faith",
  "Joy",
  "Lucy",
  "Angela",
  "Betty",
  "Nancy",
  "Winnie",
  "Ann",
  "Carol",
  "Irene",
  "Rose",
  "Fellow"

];


/* ==================================================
   HIDE ALL PAGES
================================================== */

function hideAllPages(){

  photosPage.style.display =
    "none";

  incomingCall.style.display =
    "none";

  liveSoundScreen.style.display =
    "none";

  insufficientPage.style.display =
    "none";

}


/* ==================================================
   SHUFFLE
================================================== */

function shuffleArray(array){

  const copy =
    [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


/* ==================================================
   LOAD GITHUB PHOTOS
================================================== */

async function loadPhotos(){

  try{

    const treeUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      "/git/trees/" +
      GITHUB_BRANCH +
      "?recursive=1";


    const response =
      await fetch(treeUrl);


    if(!response.ok){

      throw new Error(
        "GitHub request failed"
      );

    }


    const data =
      await response.json();


    const imageFiles =
      (data.tree || []).filter(
        file => {

          if(
            file.type !== "blob"
          ){

            return false;

          }


          const name =
            file.path.toLowerCase();


          return(

            name.endsWith(".jpg") ||

            name.endsWith(".jpeg") ||

            name.endsWith(".png") ||

            name.endsWith(".webp")

          );

        }
      );


    photos =
      imageFiles.map(
        (file,index) => ({

          url:
            "https://raw.githubusercontent.com/" +
            GITHUB_OWNER +
            "/" +
            GITHUB_REPO +
            "/" +
            GITHUB_BRANCH +
            "/" +
            file.path,

          name:
            photoNames[
              index %
              photoNames.length
            ]

        })
      );


    console.log(
      "Photos loaded:",
      photos.length
    );


  }catch(error){

    console.log(
      "Photo loading error:",
      error
    );

    photos = [];

  }

}


/* ==================================================
   RENDER PHOTOS
================================================== */

function renderPhotos(){

  photosGrid.innerHTML = "";


  const shuffled =
    shuffleArray(photos);


  shuffled.forEach(
    (photo,index) => {

      const card =
        document.createElement("div");


      card.className =
        "photo-card";


      card.innerHTML = `

        <img
          src="${photo.url}"
          alt="${photo.name}"
          loading="lazy"
        >

        <div class="photo-dark"></div>

        <div class="photo-live">

          <span class="photo-live-dot"></span>

          LIVE

        </div>

        <div class="photo-video">
          ▷
        </div>

        <div class="photo-name">
          ${photo.name}
        </div>

      `;


      /* ANY PHOTO TAP */

      card.addEventListener(
        "click",
        function(){

          window.location.href =
            "payment.html";

        }
      );


      photosGrid.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   UPDATE ONLINE NUMBER
================================================== */

function updateOnlineNumber(){

  const numbers =
    [
      15,
      17,
      18,
      19,
      20,
      21,
      22
    ];


  const number =
    numbers[
      Math.floor(
        Math.random() *
        numbers.length
      )
    ];


  onlineNumber.textContent =
    number + " online";

}


/* ==================================================
   CHOOSE RANDOM CALLER
================================================== */

function chooseCaller(){

  if(
    !photos.length
  ){

    return null;

  }


  let available =
    photos;


  if(
    currentCaller
  ){

    available =
      photos.filter(
        photo =>
          photo.url !==
          currentCaller.url
      );

  }


  if(
    !available.length
  ){

    available =
      photos;

  }


  const caller =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  currentCaller =
    caller;


  return caller;

}


/* ==================================================
   SHOW INCOMING CALL
================================================== */

function showIncomingCall(){

  clearTimeout(
    incomingTimer
  );

  clearTimeout(
    photosTimer
  );


  if(
    !photos.length
  ){

    console.log(
      "No photos available yet."
    );

    setTimeout(
      showIncomingCall,
      1000
    );

    return;

  }


  const caller =
    chooseCaller();


  if(!caller){

    return;

  }


  callerPhoto.src =
    caller.url;


  callerName.textContent =
    caller.name;


  callBackground.style.backgroundImage =
    `url("${caller.url}")`;


  hideAllPages();


  incomingCall.style.display =
    "flex";

}


/* ==================================================
   SHOW LIVE PHOTOS
================================================== */

function showLivePhotos(){

  clearTimeout(
    incomingTimer
  );

  clearTimeout(
    photosTimer
  );


  hideAllPages();


  renderPhotos();


  photosPage.style.display =
    "block";


  updateOnlineNumber();


  /*
     Wait 5 seconds,
     then show another
     incoming video call.
  */

  photosTimer =
    setTimeout(
      function(){

        showIncomingCall();

      },
      PHOTOS_DURATION
    );

}


/* ==================================================
   PLAY ANSWER VIDEO
================================================== */

async function playLiveSound(){

  hideAllPages();


  liveSoundScreen.style.display =
    "flex";


  try{

    liveSoundVideo.pause();

    liveSoundVideo.currentTime =
      0;

    liveSoundVideo.muted =
      false;

    liveSoundVideo.volume =
      1;


    await liveSoundVideo.play();


  }catch(error){

    console.log(
      "Video sound blocked:",
      error
    );

  }


  await new Promise(
    resolve => {

      setTimeout(
        resolve,
        LIVE_SOUND_DURATION
      );

    }
  );


  liveSoundVideo.pause();

  liveSoundVideo.currentTime =
    0;

  liveSoundVideo.muted =
    true;


  liveSoundScreen.style.display =
    "none";

}


/* ==================================================
   ANSWER BUTTON
================================================== */

answerButton.addEventListener(
  "click",
  async function(){

    /*
       Answer starts directly
       from the user's tap,
       which gives the browser
       permission to play sound.
    */

    await playLiveSound();


    /*
       Show insufficient minutes.
    */

    hideAllPages();


    insufficientPage.style.display =
      "flex";


    /*
       After 2 seconds,
       return to Live Photos.
    */

    setTimeout(
      function(){

        showLivePhotos();

      },
      INSUFFICIENT_DURATION
    );

  }
);


/* ==================================================
   DECLINE BUTTON
================================================== */

declineButton.addEventListener(
  "click",
  function(){

    /*
       Decline skips the video
       and goes straight to
       Live Photos.
    */

    showLivePhotos();

  }
);


/* ==================================================
   START WEBSITE
================================================== */

async function startWebsite(){

  /*
     Load the actual GitHub
     photos first.
  */

  await loadPhotos();


  /*
     Start with incoming call
     immediately on first visit.
  */

  showIncomingCall();

}


/* ==================================================
   START
================================================== */

startWebsite();


/* ==================================================
   KEEP ONLINE NUMBER DYNAMIC
================================================== */

setInterval(
  updateOnlineNumber,
  5000
);

</script>

</body>
</html>
