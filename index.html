<title>My Referral Website</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

.page{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* WELCOME */

#welcomeScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

#welcomeScreen h1{
  font-size:32px;
  font-weight:700;
  margin-bottom:18px;
}

#welcomeScreen p{
  font-size:18px;
  color:#ccc;
}

.loadingDots{
  margin-top:20px;
  font-size:18px;
  color:#aaa;
}

/* PHOTOS */

#photosPage{
  display:none;
  min-height:100vh;
  background:#000;
  padding-bottom:20px;
}

.photosHeader{
  position:sticky;
  top:0;
  z-index:20;
  width:100%;
  background:#000;
  padding:12px;
  border-bottom:1px solid #222;
}

.photosHeaderTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.photosTitle{
  font-size:20px;
  font-weight:700;
}

.onlineBox{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#ddd;
}

.onlineDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#18e36f;
  box-shadow:0 0 8px rgba(24,227,111,.8);
}

.photosGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  padding:5px;
}

.photoCard{
  position:relative;
  width:100%;
  aspect-ratio:.78;
  overflow:hidden;
  background:#111;
  border-radius:5px;
  cursor:pointer;
}

.photoCard img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* CENTER VIDEO ICON */

.videoPlayIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  width:46px;
  height:46px;

  border-radius:50%;

  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:22px;
  line-height:1;

  z-index:8;
  pointer-events:none;

  animation:videoPulse 1.5s infinite;
}

@keyframes videoPulse{

  0%{
    transform:translate(-50%,-50%) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.12);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }

}

/* LIVE */

.liveLabel{
  position:absolute;
  top:7px;
  left:7px;
  z-index:10;

  display:flex;
  align-items:center;
  gap:5px;

  padding:4px 7px;
  border-radius:4px;

  background:#e60000;
  color:#fff;

  font-size:10px;
  font-weight:700;
}

.liveSmallDot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;

  animation:liveBlink 1s infinite;
}

@keyframes liveBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}

/* OFFLINE */

.offlineLabel{
  position:absolute;
  top:7px;
  left:7px;
  z-index:10;

  padding:4px 7px;
  border-radius:4px;

  background:#555;
  color:#fff;

  font-size:10px;
  font-weight:700;
}

.roomClosed{
  position:absolute;
  inset:0;
  z-index:9;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.48);

  font-size:13px;
  font-weight:700;
  color:#fff;

  text-align:center;
}

/* PHOTO INFO */

.photoInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:10;

  padding:22px 7px 7px;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,.55),
    transparent
  );
}

.photoName{
  font-size:13px;
  font-weight:700;
  color:#fff;
  margin-bottom:3px;
}

.photoMeta{
  font-size:10px;
  color:#ddd;
}

/* INCOMING CALL */

#incomingCall{
  display:none;
  min-height:100vh;
  background:#000;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.incomingBox{
  width:100%;
  max-width:380px;
  text-align:center;
}

.incomingTitle{
  font-size:20px;
  font-weight:700;
  margin-bottom:22px;
}

.callerPhoto{
  width:150px;
  height:150px;

  border-radius:50%;
  object-fit:cover;

  border:3px solid #222;

  margin-bottom:15px;
}

.callerName{
  font-size:22px;
  font-weight:700;
  margin-bottom:6px;
}

.callerMeta{
  font-size:14px;
  color:#aaa;
  margin-bottom:28px;
}

.callButtons{
  display:flex;
  justify-content:center;
  gap:35px;
}

.callButton{
  width:70px;
  height:70px;

  border-radius:50%;
  border:none;

  color:#fff;
  font-size:26px;

  cursor:pointer;
}

.declineButton{
  background:#e00000;
}

.answerButton{
  background:#16c964;
}

/* RED LIVE VIDEO */

#liveSoundPage{
  display:none;
  position:relative;

  width:100%;
  min-height:100vh;

  background:#000;
}

#liveSoundVideo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  background:#000;
}

.redLiveTop{
  position:absolute;
  top:15px;
  left:15px;

  z-index:30;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px 9px;

  border-radius:4px;

  background:#e00000;

  color:#fff;

  font-size:12px;
  font-weight:700;
}

.redLiveDot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;

  animation:liveBlink 1s infinite;
}

/* BLACK SECOND CALL */

#blackLivePage{
  display:none;
  position:relative;

  min-height:100vh;

  background:#000;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.blackLiveTop{
  position:absolute;
  top:15px;
  left:15px;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px 9px;

  background:#e00000;

  border-radius:4px;

  font-size:12px;
  font-weight:700;
}

.blackLiveDot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;

  animation:liveBlink 1s infinite;
}

.blackLoading{
  font-size:18px;
  color:#fff;
}

.blackLoadingSmall{
  margin-top:10px;
  font-size:13px;
  color:#777;
}

/* INSUFFICIENT */

#insufficientPage{
  display:none;

  min-height:100vh;

  background:#000;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:25px;
}

.insufficientBox{
  width:100%;
  max-width:350px;
}

.insufficientTitle{
  font-size:25px;
  font-weight:700;

.insufficientText{

@media(max-width:700px){

    font-size:20px;
  }

}

@media(min-width:701px){

  .photosGrid{
    grid-template-columns:repeat(4,1fr);
  }

}

<script>

const GITHUB_OWNER = "agnesweb2026";

const MAX_PHOTOS = 24;

const PHOTOS_DURATION = 20000;
const BACKGROUND_SOUND_DURATION = 5000;
const INSUFFICIENT_DURATION = 2000;
const BUSY_CHANGE_DURATION = 300000;
const SECOND_CALL_SOUND_DURATION = 5000;

const PAYMENT_PAGE_URL = "payment.html";


/*
 * IMPORTANT:

 * Once the first red LIVE video has been
 * shown, reloading/reopening the website
 * will NOT show it again in this browser.
 */

const RED_LIVE_KEY = "redLiveVideoSeen";

let redLiveShownThisVisit =

const welcomeScreen =
  document.getElementById("welcomeScreen");

const photosPage =
  document.getElementById("photosPage");

const photosGrid =
  document.getElementById("photosGrid");

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =

const callerName =
  document.getElementById("callerName");

const callerMeta =
  document.getElementById("callerMeta");

const answerButton =
  document.getElementById("answerButton");

const declineButton =
  document.getElementById("declineButton");

const liveSoundPage =
  document.getElementById("liveSoundPage");

const liveSoundVideo =
  document.getElementById("liveSoundVideo");

const blackLivePage =
  document.getElementById("blackLivePage");

const insufficientPage =
  document.getElementById("insufficientPage");

const backgroundSound =
  document.getElementById("backgroundSound");

const onlineNumber =
  document.getElementById("onlineNumber");


let photosTimer = null;
let backgroundSoundTimer = null;
let busyTimer = null;
let blackLiveTimer = null;

let photos = [];
let busyIndexes = [];


const names = [

  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Ashley",
  "Mary",
  "Cindy",

const ages = [

];


const countries = [

  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},

  {country:"Tanzania",flag:"🇹🇿"},
  {country:"Tanzania",flag:"🇹🇿"},

];
  function hideAllPages(){

  welcomeScreen.style.display = "none";
  photosPage.style.display = "none";
  incomingCall.style.display = "none";
  liveSoundPage.style.display = "none";
  blackLivePage.style.display = "none";
  insufficientPage.style.display = "none";

}


function clearAllTimers(){

  if(photosTimer){
    clearTimeout(photosTimer);
    photosTimer = null;
  }

  if(backgroundSoundTimer){
    clearTimeout(backgroundSoundTimer);
    backgroundSoundTimer = null;
  }

  if(busyTimer){
    clearInterval(busyTimer);
    busyTimer = null;
  }

  if(blackLiveTimer){
    clearTimeout(blackLiveTimer);
    blackLiveTimer = null;
  }

}


function stopBackgroundSound(){

  try{

    backgroundSound.pause();
    backgroundSound.currentTime = 0;

  }catch(e){}

  if(backgroundSoundTimer){

    clearTimeout(
      backgroundSoundTimer
    );

    backgroundSoundTimer = null;

  }

}


function stopLiveVideo(){

  try{

    liveSoundVideo.pause();
    liveSoundVideo.currentTime = 0;

  }catch(e){}

}


function shuffleArray(array){

  const copy = [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


function getRandomBusyIndexes(){

  const indexes =
    Array.from(
      {length:MAX_PHOTOS},
      (_,i)=>i
    );

  return shuffleArray(indexes)
    .slice(0,5);

}


async function getGitHubContents(
  path = ""
){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/contents/` +
    `${path}?ref=${GITHUB_BRANCH}`;

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error(
      "GitHub request failed"
    );

  }

  return await response.json();

}


async function collectImages(
  path = "",
  result = []
){

  try{

    const items =
      await getGitHubContents(path);

    for(const item of items){

      if(item.type === "dir"){

        await collectImages(
          item.path,
          result
        );

      }else if(
        item.type === "file" &&
        isImageFile(item.name)
      ){

        result.push({

          name:item.name,

          path:item.path,

          url:getFileUrl(item.path)

        });

      }

    }

  }catch(error){

    console.error(
      "Image collection error:",
      error
    );

  }

  return result;

}


function getFileUrl(path){

  return (
    `https://raw.githubusercontent.com/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `${GITHUB_BRANCH}/` +
    path
  );

}


function isImageFile(name){

  return /\.(jpg|jpeg|png|gif|webp)$/i
    .test(name);

  }
  async function loadPhotos(){

  const images =
    await collectImages();

  const selected =
    shuffleArray(images)
      .slice(0,MAX_PHOTOS);


  photos =
    selected.map(
      (photo,index)=>{

        const country =
          countries[index] || {
            country:"Kenya",
            flag:"🇰🇪"
          };


        return {

          url:photo.url,

          name:
            names[index] ||
            `User ${index + 1}`,

          age:
            ages[index] ||
            25,

          country:
            country.country,

          flag:
            country.flag,

          originalIndex:index

        };

      }
    );

}


function renderPhotos(){

  photosGrid.innerHTML = "";

  busyIndexes =
    getRandomBusyIndexes();


  const displayPhotos =
    shuffleArray(photos);


  displayPhotos.forEach(
    (photo)=>{

      const card =
        document.createElement("div");

      card.className =
        "photoCard";


      const img =
        document.createElement("img");

      img.src =
        photo.url;

      img.alt =
        photo.name;

      img.loading =
        "lazy";


      card.appendChild(img);


      /*
       * CENTER PLAY BUTTON
       */

      const videoIcon =
        document.createElement("div");

      videoIcon.className =
        "videoPlayIcon";

      videoIcon.innerHTML =
        "▶";

      card.appendChild(
        videoIcon
      );


      const isBusy =
        busyIndexes.includes(
          photo.originalIndex
        );


      if(isBusy){

        const offlineLabel =
          document.createElement("div");

        offlineLabel.className =
          "offlineLabel";

        offlineLabel.textContent =
          "OFFLINE";

        card.appendChild(
          offlineLabel
        );


        const closed =
          document.createElement("div");

        closed.className =
          "roomClosed";

        closed.textContent =
          "ROOM CLOSED";

        card.appendChild(
          closed
        );


      }else{

        const liveLabel =
          document.createElement("div");

        liveLabel.className =
          "liveLabel";

        liveLabel.innerHTML =
          `<span class="liveSmallDot"></span> LIVE`;

        card.appendChild(
          liveLabel
        );


        card.addEventListener(
          "click",
          ()=>{

            window.location.href =
              PAYMENT_PAGE_URL;

          }
        );

      }


      const info =
        document.createElement("div");

      info.className =
        "photoInfo";


      const nameElement =
        document.createElement("div");

      nameElement.className =
        "photoName";

      nameElement.textContent =
        photo.name;


      const metaElement =
        document.createElement("div");

      metaElement.className =
        "photoMeta";

      metaElement.textContent =
        `${photo.flag} ${photo.age} yrs`;


      info.appendChild(
        nameElement
      );

      info.appendChild(
        metaElement
      );

      card.appendChild(
        info
      );


      photosGrid.appendChild(
        card
      );

    }
  );

}


function updateOnlineNumber(){

  if(!onlineNumber){
    return;
  }

  const number =
    21 +
    Math.floor(
      Math.random() * 6
    );

  onlineNumber.textContent =
    `${number} online`;

}


function startBusyRoomRotation(){

  if(busyTimer){

    clearInterval(
      busyTimer
    );

  }


  busyTimer =
    setInterval(
      ()=>{

        if(
          photosPage.style.display !==
          "none"
        ){

          renderPhotos();

        }

      },
      BUSY_CHANGE_DURATION
    );

  }
  function playLivePhotosSound(){

  stopBackgroundSound();


  try{

    backgroundSound.currentTime = 0;

    backgroundSound.volume = .45;

    const playPromise =
      backgroundSound.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  backgroundSoundTimer =
    setTimeout(
      ()=>{

        try{

          backgroundSound.pause();
          backgroundSound.currentTime = 0;

        }catch(e){}

      },
      BACKGROUND_SOUND_DURATION
    );

}


/*
 * After Live Photos have been shown
 * for 20 seconds, show another call.
 */

function scheduleIncomingCall(){

  if(photosTimer){

    clearTimeout(
      photosTimer
    );

  }


  photosTimer =
    setTimeout(
      ()=>{

        showIncomingCall();

      },
      PHOTOS_DURATION
    );

}


/*
 * LIVE PHOTOS
 */

function showLivePhotos(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  photosPage.style.display =
    "block";


  updateOnlineNumber();

  renderPhotos();

  playLivePhotosSound();

  startBusyRoomRotation();

  /*
   * Subsequent calls happen after
   * 20 seconds in Live Photos.
   */

  scheduleIncomingCall();

}


/*
 * INCOMING CALL
 */

function showIncomingCall(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  incomingCall.style.display =
    "flex";


  if(photos.length === 0){

    return;

  }


  const caller =
    photos[
      Math.floor(
        Math.random() *
        photos.length

    ];


  callerPhoto.src =
    caller.url;

  callerName.textContent =
    caller.name;

  callerMeta.textContent =
    `${caller.flag} ${caller.age} yrs`;

}


/*
 * FIRST RED LIVE VIDEO
 */

function showLiveSound(){

  clearAllTimers();

  stopBackgroundSound();

  hideAllPages();

  liveSoundPage.style.display =
    "block";


  try{

    liveSoundVideo.currentTime = 0;

    liveSoundVideo.muted = false;

    liveSoundVideo.volume = 1;

    const playPromise =
      liveSoundVideo.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  photosTimer =
    setTimeout(
      ()=>{

        showInsufficient(false);

      },
      PHOTOS_DURATION
    );

}


/*
 * If video reaches the end
 */

liveSoundVideo.addEventListener(
  "ended",
  ()=>{

    showInsufficient(false);

  }
);
  /*
 * SECOND CALL BLACK SCREEN
 */

function showBlackLive(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  blackLivePage.style.display =
    "flex";


  try{

    backgroundSound.currentTime = 0;

    backgroundSound.volume = 1;

    const playPromise =
      backgroundSound.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  backgroundSoundTimer =
    setTimeout(
      ()=>{

        stopBackgroundSound();

        showInsufficient(true);

      },
      SECOND_CALL_SOUND_DURATION
    );

}


/*
 * INSUFFICIENT MINUTES
 */

function showInsufficient(
  openPayment = false
){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  insufficientPage.style.display =
    "flex";


  photosTimer =
    setTimeout(
      ()=>{

        if(openPayment){

          /*
           * Save the return state.
           */

          sessionStorage.setItem(
            "returnToLivePhotos",
            "yes"
          );


          /*
           * IMPORTANT:
           * replace() removes the
           * insufficient page from
           * browser history.
           */

          window.location.replace(
            PAYMENT_PAGE_URL
          );


        }else{

          showLivePhotos();

        }

      },
      INSUFFICIENT_DURATION
    );

}


/*
 * ANSWER INCOMING CALL
 */

function answerIncomingCall(){

  clearAllTimers();

  stopBackgroundSound();


  /*
   * RED LIVE VIDEO HAS NEVER
   * BEEN SHOWN IN THIS BROWSER.
   */

  if(!redLiveShownThisVisit){

    redLiveShownThisVisit =
      true;


    /*
     * PERMANENTLY REMEMBER IT
     * FOR THIS BROWSER.
     */

    localStorage.setItem(
      RED_LIVE_KEY,
      "yes"
    );


    showLiveSound();


  }else{

    /*
     * Every later call goes
     * to the black LIVE screen.
     */

    showBlackLive();

  }

}


/*
 * DECLINE CALL
 */

function declineIncomingCall(){

  showLivePhotos();

}


/*
 * BUTTONS
 */

answerButton.addEventListener(
  "click",
  answerIncomingCall
);

declineButton.addEventListener(
  "click",
  declineIncomingCall
);


/*
 * PAYMENT RETURN
 */

function checkPaymentReturn(){

  const returning =
    sessionStorage.getItem(
      "returnToLivePhotos"
    );


  if(returning === "yes"){

    sessionStorage.removeItem(
      "returnToLivePhotos"
    );


    /*
     * Do NOT reset the red video.
     * localStorage already remembers
     * whether it has been shown.
     */

    redLiveShownThisVisit =
      localStorage.getItem(
        RED_LIVE_KEY
      ) === "yes";


    setTimeout(
      ()=>{

        showLivePhotos();

      },
      100
    );


    return true;

  }


  return false;

}


/*
 * START WEBSITE
 */

function startWebsite(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();


  /*
   * If returning from payment,
   * go directly to Live Photos.
   */

  if(checkPaymentReturn()){

    return;

  }


  hideAllPages();

  welcomeScreen.style.display =
    "flex";


  const startedAt =
    Date.now();


  loadPhotos()
    .finally(
      ()=>{

        const elapsed =
          Date.now() -
          startedAt;


        const remaining =
          Math.max(
            0,
            3000 - elapsed
          );


        setTimeout(
          ()=>{

            welcomeScreen.style.display =
              "none";


            /*
             * FIRST CALL IS NOW
             * IMMEDIATELY AFTER WELCOME.
             */

            showIncomingCall();

          },
          remaining
        );

      }
    );

  }
  /*
 * ONLINE NUMBER UPDATE
 */

setInterval(
  ()=>{

    if(
      photosPage.style.display !==
      "none"
    ){

      updateOnlineNumber();

    }

  },
  10000
);


/*
 * PREPARE VIDEO
 */

function prepareVideo(){

  try{

    liveSoundVideo.preload =
      "auto";

    liveSoundVideo.load();

  }catch(e){}

}


/*
 * PREPARE AUDIO
 */

function prepareAudio(){

  try{

    backgroundSound.preload =
      "auto";

    backgroundSound.load();

  }catch(e){}

}


/*
 * PAGE VISIBILITY
 */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopBackgroundSound();

    }else{

      if(
        photosPage.style.display !==
        "none"
      ){

        playLivePhotosSound();

      }

    }

  }
);


/*
 * BROWSER PAGESHOW
 *
 * This does NOT reset the red
 * video state.
 */

window.addEventListener(
  "pageshow",
  ()=>{

    stopBackgroundSound();
    stopLiveVideo();

  }
);


/*
 * START WEBSITE
 */

window.addEventListener(
  "load",
  ()=>{

    prepareVideo();
    prepareAudio();

    startWebsite();

  }
);

</script>

</body>
</html>
