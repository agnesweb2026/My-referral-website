/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

  const arr =
    [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================
   GITHUB CONTENTS
========================= */

async function getGitHubContents(
  path = ""
){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `contents/${path}?ref=${GITHUB_BRANCH}`;


  const response =
    await fetch(url);


  if(!response.ok){

    throw new Error(
      "GitHub request failed"
    );

  }


  return await response.json();

}


/* =========================
   IMAGE CHECK
========================= */

function isImageFile(name){

  return /\.(jpg|jpeg|png|webp|gif)$/i
    .test(name);

}


/* =========================
   COLLECT IMAGES
========================= */

async function collectImages(
  path = "",
  result = []
){

  const items =
    await getGitHubContents(
      path
    );


  for(
    const item of items
  ){

    if(
      item.type === "file" &&
      isImageFile(item.name)
    ){

      result.push(
        item.path
      );

    }


    if(
      item.type === "dir"
    ){

      await collectImages(
        item.path,
        result
      );

    }


    if(
      result.length >=
      MAX_PHOTOS
    ){

      break;

    }

  }


  return result;

}


/* =========================
   FILE URL
========================= */

function getFileUrl(path){

  return (
    "https://raw.githubusercontent.com/" +
    GITHUB_OWNER + "/" +
    GITHUB_REPO + "/" +
    GITHUB_BRANCH + "/" +
    path
  );

}


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos(){

  let imagePaths = [];


  try{

    imagePaths =
      await collectImages(
        "",
        []
      );

  }catch(error){

    console.error(
      "Photo loading error:",
      error
    );

    return;

  }


  imagePaths =
    imagePaths.slice(
      0,
      MAX_PHOTOS
    );


  photosData =
    imagePaths.map(
      (path,index)=>({

        path:path,

        url:
          getFileUrl(path),

        name:
          names[index] ||
          `User ${index + 1}`,

        age:
          ages[index] ||
          25,

        country:
          countries[index] ||
          {
            name:"Kenya",
            flag:"🇰🇪"
          }

      })
    );

}


/* =========================
   BUSY USERS
========================= */

function getRandomBusyIndexes(){

  const indexes = [];


  for(
    let i = 0;
    i < MAX_PHOTOS;
    i++
  ){

    indexes.push(i);

  }


  return shuffleArray(
    indexes
  ).slice(0,5);

}


/* =========================
   RENDER PHOTOS
========================= */

function renderPhotos(){

  photoGrid.innerHTML = "";


  if(!photosData.length){

    photoGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
        color:#aaa;
      ">
        Loading photos...
      </div>
    `;

    return;

  }


  const displayPhotos =
    shuffleArray(
      photosData
    );


  const busyIndexes =
    getRandomBusyIndexes();


  displayPhotos.forEach(
    (photo,index)=>{

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "photoCard";


      const img =
        document.createElement(
          "img"
        );

      img.src =
        photo.url;

      img.alt =
        photo.name;

      img.loading =
        "lazy";

      card.appendChild(img);


      const isBusy =
        busyIndexes.includes(
          index
        );


      const status =
        document.createElement(
          "div"
        );

      status.className =
        "statusBadge";


      if(isBusy){

        status.classList.add(
          "offlineBadge"
        );

        status.textContent =
          "OFFLINE";


        const closed =
          document.createElement(
            "div"
          );

        closed.className =

          "ROOM CLOSED";

        card.appendChild(
          closed
        );

      }else{

        status.classList.add(
          "liveBadge"
        );


        const dot =
          document.createElement(
            "span"
          );

        dot.className =
          "liveDot";


        status.appendChild(
          dot
        );


        status.appendChild(

        card.addEventListener(

          "div"

          "div"

        </div>

          ${photo.country.flag}

/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

  const arr =
    [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================

========================= */

async function getGitHubContents(
  path=""
){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/${GITHUB_REPO}` +
    `/contents/${path}?ref=${GITHUB_BRANCH}`;

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error(
      "GitHub request failed"
    );

  }

  return await response.json();

}


/* =========================
   IMAGE CHECK
========================= */

function isImageFile(name){

  return /\.(jpg|jpeg|png|webp|gif)$/i
    .test(name);

}


/* =========================
   COLLECT IMAGES
========================= */

async function collectImages(
  path="",
  result=[]
){

  const items =
    await getGitHubContents(
      path
    );

  for(
    const item of items
  ){

    if(
      item.type === "file" &&
      isImageFile(item.name)
    ){

      result.push(
        item.path
      );

    }

    if(item.type === "dir"){

      await collectImages(
        item.path,
        result
      );

    }

    if(
      result.length >=
      MAX_PHOTOS
    ){

      break;

    }

  }

  return result;

}


/* =========================

/* =========================
   SWIPE
========================= */

function enableSwipe(
  element,
  direction,
  action
){

  let startX = 0;
  let startY = 0;


  element.addEventListener(
    "touchstart",
    function(e){

      if(
        !e.touches.length
      ){

        return;

      }


      startX =
        e.touches[0].clientX;

      startY =
        e.touches[0].clientY;

    },
    {passive:true}
  );


  element.addEventListener(
    "touchend",
    function(e){

      if(
        !e.changedTouches.length
      ){

        return;

      }


      const endX =
        e.changedTouches[0].clientX;

      const endY =
        e.changedTouches[0].clientY;


      const dx =
        endX - startX;

      const dy =
        endY - startY;


      /*
        Ignore vertical movement.
      */

      if(
        Math.abs(dy) >
        Math.abs(dx)
      ){

        return;

      }


      /*
        Minimum swipe distance.
      */

      if(
        Math.abs(dx) < 80
      ){

        return;

      }


      if(
        direction === "left" &&
        dx < 0
      ){

        action();

      }


      if(
        direction === "right" &&
        dx > 0
      ){

        action();

      }

    },
    {passive:true}
  );

}
