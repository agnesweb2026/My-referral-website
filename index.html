<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

.card {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}

/* SAMPLE */

#samplePage {
  display: none;
  width: 100%;
  min-height: calc(100vh - 30px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.sample-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.sample-subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 15px;
}

#sampleVideo {
  width: 100%;
  max-width: 450px;
  max-height: 70vh;
  display: block;
  background: #111;
  border-radius: 14px;
  object-fit: contain;
}

.sample-timer {
  margin-top: 12px;
  color: #aaa;
  font-size: 13px;
}

/* INSUFFICIENT */

#insufficientPage {
  display: none;
  width: 100%;
  min-height: calc(100vh - 30px);
  align-items: center;
  justify-content: center;
  text-align: center;
}

.insufficient-box {
  width: 100%;
  background: #111;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 30px 20px;
}

.insufficient-title {
  font-size: 25px;
  font-weight: bold;
  color: #ff5252;
  margin-bottom: 10px;
}

.insufficient-text {
  color: #aaa;
  font-size: 14px;
  line-height: 1.5;
}

/* PHOTOS */

#photosPage {
  display: none;
}

.top-bar {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 15px;
}

.online-box {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: #111;
  border: 1px solid #292929;
  color: #fff;
  padding: 7px 11px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.online-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  animation: onlineBlink 1.2s infinite;
}

@keyframes onlineBlink {

  50% {
    opacity: .35;
  }

}

h1 {
  margin: 8px 0 5px;
  font-size: 25px;
}

.subtitle {
  color: #aaa;
  margin: 0 0 15px;
  font-size: 14px;
}

#livePhotos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 15px;
}

.live-photo {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #111;
  cursor: pointer;
  min-height: 250px;
  padding-bottom: 45px;
  border: 1px solid #1e1e1e;
}

.live-photo:active {
  transform: scale(.98);
}

.live-photo img {
  display: block;
  width: 100%;
  height: 205px;
  object-fit: cover;
  background: #111;
}

.photo-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 5px;
  background: #111;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
}

.live-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 5;
  background: #f0184c;
  color: #fff;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: bold;
}

.live-badge::before {
  content: "●";
  margin-right: 4px;
}

.live-status {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,0,0,.82);
  padding: 5px 7px;
  border-radius: 7px;
  font-size: 10px;
}

.live-dot {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #22c55e;
  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {

  50% {
    opacity: .35;
  }

}

.loading {
  grid-column: 1 / -1;
  padding: 45px 20px;
  color: #aaa;
  text-align: center;
}

.error {
  grid-column: 1 / -1;
  padding: 35px 15px;
  color: #ff6b6b;
  text-align: center;
  line-height: 1.5;
}

/* INCOMING CALL */

#incomingCall {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background:
    radial-gradient(
      circle at center,
      #202020 0%,
      #080808 55%,
      #000 100%
    );
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.call-box {
  width: 100%;
  max-width: 360px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 22px;
  padding: 28px 20px 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}

.call-avatar {
  width: 105px;
  height: 105px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: linear-gradient(135deg,#333,#111);
  border: 3px solid #22c55e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.call-incoming {
  color: #22c55e;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.call-name {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 7px;
}

.call-type {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 25px;
}

.call-buttons {
  display: flex;
  justify-content: center;
  gap: 35px;
}

.call-action {
  border: none;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  color: #fff;
  font-size: 27px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.call-answer {
  background: #22c55e;
}

.call-end {
  background: #ef4444;
  transform: rotate(135deg);
}

@media (max-width: 380px) {

  body {
    padding: 12px;
  }

  #livePhotos {
    gap: 10px;
  }

  .live-photo {
    min-height: 215px;
  }

  .live-photo img {
    height: 170px;
  }

  .photo-name {
    font-size: 12px;
  }

}

</style>
</head>
<body>

<div class="card">

  <!-- SAMPLE VIDEO PAGE -->

  <div id="samplePage">

    <div class="sample-title">
      Live Video
    </div>

    <div class="sample-subtitle">
      join💦💦💦🫦
    </div>

    <video
      id="sampleVideo"
      muted
      playsinline
      preload="auto"
    >

      <source
        src="preview_20_seconds.mp4"
        type="video/mp4"
      >

      Your browser does not support video.

    </video>

    <div
      class="sample-timer"
      id="sampleTimer"
    >
      Sample: 20 seconds
    </div>

  </div>


  <!-- INSUFFICIENT MINUTES PAGE -->

  <div id="insufficientPage">

    <div class="insufficient-box">

      <div class="insufficient-title">
        Insufficient minutes
      </div>

      <div class="insufficient-text">
        buy more minutes!
        <br>
        Opening live video call...
      </div>

    </div>

  </div>


  <!-- PHOTOS PAGE -->

  <div id="photosPage">

    <div class="top-bar">

      <div class="online-box">

        <span class="online-dot"></span>

        <span>
          21 online
        </span>

      </div>

    </div>


    <h1>
      Welcome
    </h1>


    <p class="subtitle">
      People live now
    </p>


    <div id="livePhotos">

      <div class="loading">
        Loading live now...
      </div>

    </div>

  </div>

</div>


<!-- INCOMING VIDEO CALL -->

<div id="incomingCall">

  <div class="call-box">

    <div class="call-avatar">
      📹
    </div>


    <div class="call-incoming">
      INCOMING VIDEO CALL
    </div>


    <div class="call-name">
      Live Video
    </div>


    <div class="call-type">
      Someone wants to start a video call
    </div>


    <div class="call-buttons">

      <button
        class="call-action call-end"
        id="rejectCall"
        aria-label="Reject call"
      >
        ☎
      </button>


      <button
        class="call-action call-answer"
        id="answerCall"
        aria-label="Answer call"
      >
        📹
      </button>

    </div>

  </div>

</div>


<script>

/* ==========================================
   WEBSITE SETTINGS
========================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";

const MAX_PHOTOS =
  24;


/* ==========================================
   PHOTO NAMES
========================================== */

const PHOTO_NAMES = [

  "Cute 😍❤️",

  "Becky 💦❤️‍🔥",

  "Dorry 🔥✅",

  "Jenny 💦❤️‍🔥",

  "Caro 💦❤️‍🔥❤️",

  "Juck 💦❤️‍🔥",

  "Bella 🥀👄",

  "Faith 🌟",

  "Chepto 😜🔥",

  "Shelley",

  "Phapy 🥰😍",

  "Chris 💖💘",

  "Juphio 😴💦💦",

  "Judy 💖",

  "Kandy 💦😴",

  "Jennifer ❤️‍🔥🔥",

  "Pento 🥀👄",

  "Shallow ❤️‍🔥🔥🥀",

  "Grees 🌟",

  "Betty 🔥❤️‍🔥",

  "Maria 🌟🥀💦",

  "Kitty 💦❤️",

  "Sweetgy 😍🥰",

  "Fellow 💦❤️"

];


/* ==========================================
   GET HTML ELEMENTS
========================================== */

const samplePage =
  document.getElementById(
    "samplePage"
  );


const insufficientPage =
  document.getElementById(
    "insufficientPage"
  );


const photosPage =
  document.getElementById(
    "photosPage"
  );


const sampleVideo =
  document.getElementById(
    "sampleVideo"
  );


const sampleTimer =
  document.getElementById(
    "sampleTimer"
  );


const livePhotos =
  document.getElementById(
    "livePhotos"
  );


const incomingCall =
  document.getElementById(
    "incomingCall"
  );


const answerCall =
  document.getElementById(
    "answerCall"
  );


const rejectCall =
  document.getElementById(
    "rejectCall"
  );


/* ==========================================
   SAMPLE STORAGE
========================================== */

const SAMPLE_STORAGE_KEY =
  "myReferralSampleWatched";


let sampleFinished =
  localStorage.getItem(
    SAMPLE_STORAGE_KEY
  ) === "true";


let sampleRunning =
  false;


let secondsLeft =
  20;


let sampleTimerInterval =
  null;


/* ==========================================
   START SAMPLE
========================================== */

function startSample() {

  if (sampleRunning) {
    return;
  }


  sampleRunning =
    true;


  secondsLeft =
    20;


  sampleTimer.textContent =
    "Sample: 20 seconds";


  samplePage.style.display =
    "flex";


  photosPage.style.display =
    "none";


  insufficientPage.style.display =
    "none";


  sampleVideo.currentTime =
    0;


  sampleVideo.muted =
    true;


  sampleVideo.play()
    .catch(function(error) {

      console.log(
        "Autoplay blocked:",
        error
      );

    });


  clearInterval(
    sampleTimerInterval
  );


  sampleTimerInterval =
    setInterval(
      function() {

        secondsLeft--;


        if (
          secondsLeft > 0
        ) {

          sampleTimer.textContent =
            "Sample: " +
            secondsLeft +
            " seconds";

        }


        if (
          secondsLeft <= 0
        ) {

          clearInterval(
            sampleTimerInterval
          );


          finishSample();

        }

      },
      1000
    );

}
  /* ==========================================
   FINISH SAMPLE
========================================== */

function finishSample() {

  if (!sampleRunning) {
    return;
  }


  sampleRunning =
    false;


  clearInterval(
    sampleTimerInterval
  );


  sampleVideo.pause();


  /*
    Remember that the sample
    has already been watched.
  */

  localStorage.setItem(
    SAMPLE_STORAGE_KEY,
    "true"
  );


  sampleFinished =
    true;


  samplePage.style.display =
    "none";


  /*
    Show insufficient minutes
    for 2 seconds.
  */

  insufficientPage.style.display =
    "flex";


  setTimeout(
    function() {

      insufficientPage.style.display =
        "none";


      photosPage.style.display =
        "block";


      loadPhotos();


      /*
        After the sample flow,
        show the incoming call.
      */

      scheduleNextIncomingCall();

    },
    2000
  );

}


/* ==========================================
   VIDEO ENDED
========================================== */

sampleVideo.addEventListener(
  "ended",
  function() {

    finishSample();

  }
);


/* ==========================================
   SHOW INCOMING CALL
========================================== */

function showIncomingCall() {

  incomingCall.style.display =
    "flex";

}


/* ==========================================
   HIDE INCOMING CALL
========================================== */

function hideIncomingCall() {

  incomingCall.style.display =
    "none";

}


/* ==========================================
   FIRST INCOMING CALL
========================================== */

function scheduleFirstIncomingCall() {

  setTimeout(
    function() {

      showIncomingCall();

    },
    1000
  );

}


/* ==========================================
   NEXT INCOMING CALL
========================================== */

function scheduleNextIncomingCall() {

  setTimeout(
    function() {

      showIncomingCall();

    },
    1000
  );

}


/* ==========================================
   ANSWER CALL
========================================== */

answerCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();


    /*
      If the visitor has NOT watched
      the sample yet, start it.
    */

    if (
      !sampleFinished &&
      localStorage.getItem(
        SAMPLE_STORAGE_KEY
      ) !== "true"
    ) {

      startSample();

      return;

    }


    /*
      If the sample was already watched,
      do NOT play it again.

      Instead show insufficient minutes.
    */

    showInsufficientDirectly();

  }
);


/* ==========================================
   REJECT CALL
========================================== */

rejectCall.addEventListener(
  "click",
  function() {

    hideIncomingCall();

  }
);


/* ==========================================
   SHOW INSUFFICIENT DIRECTLY
========================================== */

function showInsufficientDirectly() {

  photosPage.style.display =
    "none";


  samplePage.style.display =
    "none";


  insufficientPage.style.display =
    "flex";


  setTimeout(
    function() {

      insufficientPage.style.display =
        "none";


      photosPage.style.display =
        "block";


      loadPhotos();

    },
    2000
  );

}


/* ==========================================
   SHUFFLE PHOTOS
========================================== */

function shuffleArray(
  array
) {

  const shuffled =
    [...array];


  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];

  }


  return shuffled;

}


/* ==========================================
   LOAD PHOTOS
========================================== */

async function loadPhotos() {

  livePhotos.innerHTML = `

    <div class="loading">
      Loading photos...
    </div>

  `;


  const apiUrl =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/?ref=" +
    GITHUB_BRANCH;


  try {

    const response =
      await fetch(
        apiUrl,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub HTTP " +
        response.status
      );

    }


    const files =
      await response.json();


    if (
      !Array.isArray(files)
    ) {

      throw new Error(
        "GitHub did not return a file list."
      );

    }


    const imageFiles =
      files.filter(
        function(file) {

          return (
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
              .test(file.name)
          );

        }
      );


    if (
      imageFiles.length === 0
    ) {

      livePhotos.innerHTML = `

        <div class="error">

          No photos found.

          <br><br>

          Put your image files
          in the main GitHub folder.

        </div>

      `;


      return;

    }


    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    const photos =
      selectedFiles.map(
        function(
          file,
          index
        ) {

          return {

            name:
              PHOTO_NAMES[index] ||
              "Photo",

            photo:
              file.download_url

          };

        }
      );


    const shuffledPhotos =
      shuffleArray(
        photos
      );


    createGallery(
      shuffledPhotos
    );


  } catch (error) {

    console.error(
      "PHOTO ERROR:",
      error
    );


    livePhotos.innerHTML = `

      <div class="error">

        Unable to load photos.

        <br><br>

        ${error.message}

      </div>

    `;

  }

  }
  /* ==========================================
   CREATE PHOTO GALLERY
========================================== */

function createGallery(
  photos
) {

  livePhotos.innerHTML =
    "";


  photos.forEach(
    function(person) {

      /* Create photo box */

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "live-photo";


      /* LIVE badge */

      const badge =
        document.createElement(
          "span"
        );


      badge.className =
        "live-badge";


      badge.textContent =
        "LIVE";


      /* Live status */

      const status =
        document.createElement(
          "span"
        );


      status.className =
        "live-status";


      /* Green live dot */

      const dot =
        document.createElement(
          "span"
        );


      dot.className =
        "live-dot";


      status.appendChild(
        dot
      );


      status.appendChild(
        document.createTextNode(
          "Live"
        )
      );


      /* Photo */

      const image =
        document.createElement(
          "img"
        );


      image.src =
        person.photo;


      image.alt =
        person.name;


      image.loading =
        "lazy";


      /*
        If an image cannot load,
        hide the broken image.
      */

      image.onerror =
        function() {

          image.style.display =
            "none";


          box.style.background =
            "#171717";

        };


      /* Photo name */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "photo-name";


      name.textContent =
        person.name;


      /* Put everything together */

      box.appendChild(
        badge
      );


      box.appendChild(
        status
      );


      box.appendChild(
        image
      );


      box.appendChild(
        name
      );


      /*
        When a photo is tapped,
        open payment page.
      */

      box.addEventListener(
        "click",
        function() {

          window.location.href =
            "payment.html";

        }
      );


      livePhotos.appendChild(
        box
      );

    }
  );

}


/* ==========================================
   PAGE START
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
      Check whether the sample
      was already watched.
    */

    const alreadyWatched =
      localStorage.getItem(
        SAMPLE_STORAGE_KEY
      ) === "true";


    /*
      FIRST VISIT
    */

    if (!alreadyWatched) {

      sampleFinished =
        false;


      startSample();


      return;

    }


    /*
      SAMPLE WAS ALREADY WATCHED
    */

    sampleFinished =
      true;


    samplePage.style.display =
      "none";


    insufficientPage.style.display =
      "none";


    photosPage.style.display =
      "block";


    loadPhotos();


    /*
      Show incoming call again
      without replaying the sample.
    */

    scheduleFirstIncomingCall();

  });


/* ==========================================
   PREVENT VIDEO FROM RESTARTING
========================================== */

sampleVideo.addEventListener(
  "play",
  function() {

    if (
      sampleFinished &&
      !sampleRunning
    ) {

      sampleVideo.pause();

    }

  });


/* ==========================================
   SAFETY CHECK
========================================== */

window.addEventListener(
  "beforeunload",
  function() {

    clearInterval(
      sampleTimerInterval
    );

  });
  </script>

</body>

</html>
