<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LiveX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.hidden{
  display:none!important;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#welcomeScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
    radial-gradient(circle at 50% 35%,#2b0010 0,#090006 35%,#000 75%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.welcome-content{
  width:90%;
  max-width:420px;
}

.logo{
  font-size:44px;
  font-weight:900;
  letter-spacing:-2px;
  color:#ff1744;
  text-shadow:0 0 25px rgba(255,23,68,.45);
}

.welcome-title{
  margin-top:18px;
  font-size:24px;
  font-weight:800;
}

.welcome-text{
  margin-top:10px;
  color:#aaa;
  font-size:14px;
}

.loading-line{
  width:220px;
  height:4px;
  margin:28px auto 0;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}

.loading-line span{
  display:block;
  width:35%;
  height:100%;
  background:#ff1744;
  animation:loading 1.4s infinite ease-in-out;
}

@keyframes loading{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(400%)}
}

#photosPage{
  min-height:100vh;
  padding-bottom:30px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 13px;
  background:rgba(0,0,0,.94);
  border-bottom:1px solid #242424;
  backdrop-filter:blur(12px);
}

.brand{
  color:#ff1744;
  font-size:24px;
  font-weight:900;
}

.online-box{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  color:#ddd;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22e56b;
  box-shadow:0 0 9px rgba(34,229,107,.8);
}

.live-pill{
  padding:6px 9px;
  border-radius:8px;
  background:#ff1744;
  color:white;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}

.page-title{
  padding:18px 14px 7px;
  font-size:21px;
  font-weight:900;
}

.page-subtitle{
  padding:0 14px 15px;
  color:#888;
  font-size:13px;
}

.photos-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding:0 8px;
}

.photo-card{
  min-width:0;
  background:#101010;
  border:1px solid #222;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#151515;
  overflow:hidden;
}

.photo-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.status-dot{
  position:absolute;
  top:7px;
  right:7px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#22e56b;
  border:2px solid rgba(0,0,0,.8);
  box-shadow:0 0 9px rgba(34,229,107,.9);
}

.status-dot.offline{
  background:#777;
  box-shadow:none;
}

.photo-live{
  position:absolute;
  left:7px;
  top:7px;
  padding:4px 6px;
  border-radius:5px;
  background:#ff1744;
  font-size:9px;
  font-weight:900;
}

.video-icon{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:43px;
  height:43px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  border:2px solid rgba(255,255,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(1)
  }
  50%{
    transform:translate(-50%,-50%) scale(1.08)
  }
}

.photo-info{
  padding:9px 8px 7px;
}

.photo-name{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.photo-meta{
  margin-top:4px;
  color:#aaa;
  font-size:11px;
}

.country{
  margin-right:3px;
}

.activity-label{
  margin-top:5px;
  color:#777;
  font-size:9px;
}

.social-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:0 7px 7px;
}

.social-btn{
  min-width:0;
  padding:7px 2px;
  border:1px solid #2a2a2a;
  border-radius:8px;
  background:#191919;
  color:#ddd;
  font-size:9px;
  font-weight:700;
}

.social-btn:active{
  transform:scale(.96);
}

.social-btn.active{
  border-color:#ff1744;
  color:#ff496b;
  background:#21070d;
}

.chat-section{
  margin:0 7px 8px;
  border-top:1px solid #252525;
  padding-top:7px;
}

.chat-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#aaa;
  font-size:10px;
  margin-bottom:5px;
}

.demo-label{
  color:#666;
  font-size:8px;
}

.chat-comments{
  height:115px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:4px 2px;
  scrollbar-width:thin;
}

.comment{
  margin-bottom:6px;
  padding:6px 7px;
  border-radius:8px;
  background:#181818;
  font-size:10px;
  line-height:1.35;
  color:#ddd;
}

.comment-name{
  color:#ff6680;
  font-weight:800;
  margin-right:4px;
}

.comment-time{
  display:block;
  margin-top:2px;
  color:#555;
  font-size:8px;
}

.comment-form{
  display:flex;
  gap:5px;
  margin-top:5px;
}

.comment-input{
  min-width:0;
  flex:1;
  height:32px;
  padding:0 8px;
  border:1px solid #303030;
  border-radius:8px;
  outline:none;
  background:#0d0d0d;
  color:#fff;
  font-size:10px;
}

.comment-input:focus{
  border-color:#ff1744;
}

.comment-send{
  width:42px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#ff1744;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

#incomingCall{
  position:fixed;
  inset:0;
  z-index:2000;
  background:#030303;
  display:flex;
  align-items:center;
  justify-content:center;
}

.call-box{
  width:90%;
  max-width:390px;
  text-align:center;
}

.call-photo{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #ff1744;
  box-shadow:0 0 35px rgba(255,23,68,.45);
}

.call-live{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border-radius:6px;
  background:#ff1744;
  font-size:11px;
  font-weight:900;
}

.call-title{
  margin-top:14px;
  font-size:23px;
  font-weight:900;
}

.call-name{
  margin-top:7px;
  color:#bbb;
}

.call-actions{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:28px;
}

.call-btn{
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  color:white;
  font-size:25px;
}

.answer-btn{
  background:#20c96b;
}

.reject-btn{
  background:#ed1743;
}

#firstVideoPage{
  position:fixed;
  inset:0;
  z-index:2100;
  background:#000;
}

#firstVideo{
  width:100%;
  height:100%;

  background:#000;

.video-live-label{
  position:absolute;
  top:18px;
  left:18px;
  z-index:5;
  padding:6px 9px;
  border-radius:6px;
  background:#ff1744;
  font-size:11px;
  font-weight:900;

#insufficientPage{

  inset:0;

@media(max-width:380px){
  .photos-grid{

    padding:0 5px;
  }

  .photo-info{
    padding-left:6px;
    padding-right:6px;
  }

  .social-row{
    padding-left:5px;
    padding-right:5px;
  }

  .chat-section{
    margin-left:5px;
    margin-right:5px;
  }

  .social-btn{
    font-size:8px;
  }
}
</style>
</head>

function $(id){

}


function readStorage(key,fallback){

  try{

    const raw =
      localStorage.getItem(key);

    if(!raw){
      return fallback;
    }

    return JSON.parse(raw);

  }catch(error){

    return fallback;

  }

}


function writeStorage(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.warn(
      "Storage error",
      error
    );

  }

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function profileId(index){

  return "profile_" + index;

}


/*
  The starting counts are
  presentation/demo values.
  User actions are saved locally.
*/

function initializeDemoCounts(){

  const likes =
    readStorage(
      LIKE_KEY,
      {}
    );

  const loves =
    readStorage(
      LOVE_KEY,
      {}
    );


  profiles.forEach(
    function(profile,index){

      const id =
        profileId(index);


      if(
        typeof likes[id] !==
        "number"
      ){

        likes[id] =
          profile.likes;

      }


      if(
        typeof loves[id] !==
        "number"
      ){

        loves[id] =
          profile.loves;

      }

    }
  );


  writeStorage(
    LIKE_KEY,
    likes
  );

  writeStorage(
    LOVE_KEY,
    loves
  );

}


function getNumber(
  data,
  id,
  base
){

  if(
    typeof data[id] !==
    "number"
  ){

    data[id] =
      base;

  }

  return data[id];

}

function getReferral(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return {

    ref:
      params.get("ref") || "",

    employee:
      params.get("employee") || ""

  };

}


function buildPaymentUrl(index){

  const referral =
    getReferral();

  const params =
    new URLSearchParams();


  params.set(
    "profile",
    profiles[index].name
  );


  const employee =
    referral.employee ||
    referral.ref ||
    "";


  if(employee){

    params.set(
      "employee",
      employee
    );

  }


  return (
    PAYMENT_PAGE_URL +
    "?" +
    params.toString()
  );

}


function openPayment(index){

  window.location.href =
    buildPaymentUrl(index);

}

========================= */

function getUserComments(index){

  const data =
    readStorage(
      COMMENT_KEY,
      {}
    );

  const id =
    profileId(index);


  if(
    !Array.isArray(
      data[id]
    )
  ){

    data[id] = [];

  }


  return data[id];

}


function saveUserComments(
  index,
  comments
){

  const data =
    readStorage(
      COMMENT_KEY,
      {}
    );

  data[
    profileId(index)
  ] =
    comments;

  writeStorage(
    COMMENT_KEY,
    data
  );

    }
  function renderComments(index){

  const box =
    document.getElementById(
      "comments-" + index
    );

  if(!box){
    return;
  }


  const profile =
    profiles[index];


  const demoComments =
    profile.chats || [];


  const userComments =
    getUserComments(index);


  let html = "";


  demoComments.forEach(
    function(item){

      html += `
        <div class="comment">
          <span class="comment-name">
            ${escapeHtml(item[0])}
          </span>
          ${escapeHtml(item[1])}
          <span class="comment-time">
            demo chat
          </span>
        </div>
      `;

    }
  );


  userComments.forEach(
    function(item){

      html += `
        <div class="comment">
          <span class="comment-name">
            ${escapeHtml(item.name)}
          </span>
          ${escapeHtml(item.text)}
          <span class="comment-time">
            just now
          </span>
        </div>
      `;

    }
  );


  box.innerHTML =
    html;


  scrollChatToBottom(
    index
  );

}


function addComment(
  index,
  input
){

  if(!input){
    return;
  }


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const comments =
    getUserComments(index);


  comments.push({

    name:"You",

    text:text,

    time:Date.now()

  });


  saveUserComments(
    index,
    comments
  );


  input.value = "";


  renderComments(
    index
  );


  showReaction(
    index,
    "Comment added ❤️"
  );

}


function scrollChatToBottom(index){

  const box =
    document.getElementById(
      "comments-" + index
    );

  if(!box){
    return;
  }


  requestAnimationFrame(
    function(){

      box.scrollTop =
        box.scrollHeight;

    }
  );

}

function updateLikeButton(index){

  const data =
    readStorage(
      LIKE_KEY,
      {}
    );

  const id =
    profileId(index);


  const button =
    document.getElementById(
      "like-" + index
    );


  const count =
    getNumber(
      data,
      id,
      profiles[index].likes
    );


  const liked =
    data[
      id + "_me"
    ] === true;


  if(button){

    button.textContent =
      "👍 " +
      count.toLocaleString();

    button.classList.toggle(
      "active",
      liked
    );

  }


  writeStorage(
    LIKE_KEY,
    data
  );

}


function toggleLike(
  index,
  event
){

  if(event){

    event.preventDefault();
    event.stopPropagation();

  }


  const data =
    readStorage(
      LIKE_KEY,
      {}
    );

  const id =
    profileId(index);


  const count =
    getNumber(
      data,
      id,
      profiles[index].likes
    );


  const liked =
    data[
      id + "_me"
    ] === true;


  if(liked){

    data[id] =
      Math.max(
        0,
        count - 1
      );

    data[
      id + "_me"
    ] =
      false;

  }else{

    data[id] =
      count + 1;

    data[
      id + "_me"
    ] =
      true;

  }


  writeStorage(
    LIKE_KEY,
    data
  );


  updateLikeButton(
    index
  );

}

      );

    }

  }

  index,
  message
){

  const button =
    document.getElementById(
      "chat-" + index
    );


  if(!button){
    return;
  }


  const oldText =
    button.textContent;


  button.textContent =
    message;


  setTimeout(
    function(){

      if(
        document.body.contains(
          button
        )
      ){

        button.textContent =
          oldText;

      }

    },
    1000
  );

}

========================= */

function updateOnlineNumber(){

  const number =
    Math.floor(
      Math.random() * 16
    ) + 15;


  const element =
    $("onlineNumber");


  if(element){

    element.textContent =
      number +
      " online";

  }

}


/* =========================
   OFFLINE PROFILES
========================= */

let offlineProfiles =
  new Set();


function refreshOfflineProfiles(){

  offlineProfiles =
    new Set();


  const total =
    Math.min(
      profiles.length,
      MAX_PHOTOS
    );


  const count =
    Math.min(
      5,
      Math.max(
        0,
        total - 1
      )
    );


  while(
    offlineProfiles.size <
    count
  ){

    const random =
      Math.floor(
        Math.random() *
        total
      );

    offlineProfiles.add(
      random
    );

  }


  profiles.forEach(
    function(_,index){

      const card =
        document.querySelector(
          "#photosGrid .photo-card:nth-child(" +
          (index + 1) +
          ")"
        );


      if(!card){
        return;
      }


      const dot =
        card.querySelector(
          ".status-dot"
        );


      const live =
        card.querySelector(
          ".photo-live"
        );


      if(
        offlineProfiles.has(
          index
        )
      ){

        if(dot){

          dot.classList.add(
            "offline"
          );

        }

        if(live){

          live.textContent =
            "OFFLINE";

          live.style.background =
            "#555";

        }

      }

    }
  );

      }
  /* =========================
   CALL SYSTEM
========================= */

let currentCallerIndex =
  0;

let callTimer =
  null;


function chooseCaller(){

  const available =
    profiles
      .map(
        function(_,index){
          return index;
        }
      )
      .filter(
        function(index){

          return !offlineProfiles.has(
            index
          );

        }
      );


  if(!available.length){

    return 0;

  }


  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}


function showIncomingCall(){

  clearTimeout(
    callTimer
  );


  currentCallerIndex =
    chooseCaller();


  const profile =
    profiles[
      currentCallerIndex
    ];


  const photo =
    $("callPhoto");

  const name =
    $("callName");


  if(photo){

    photo.src =
      IMAGE_BASE +
      profile.image;

    photo.alt =
      profile.name;

  }


  if(name){

    name.textContent =
      profile.name +
      " is calling you...";

  }


  hide("photosPage");

  hide("firstVideoPage");

  hide("insufficientPage");

  show("incomingCall");


  callTimer =
    setTimeout(
      function(){

        rejectIncomingCall();

      },
      CALL_RING_DURATION
    );

}


function rejectIncomingCall(){

  clearTimeout(
    callTimer
  );

  hide("incomingCall");

  showPhotos();

}


function answerIncomingCall(){

  clearTimeout(
    callTimer
  );

  hide("incomingCall");

  playFirstVisitorVideo();

}


/* =========================
   SAMPLE / VIDEO
========================= */

function hasWatchedSample(){

  try{

    return (
      localStorage.getItem(
        SAMPLE_STORAGE_KEY
      ) === "true"
    );

  }catch(error){

    return false;

  }

}


function markSampleWatched(){

  try{

    localStorage.setItem(
      SAMPLE_STORAGE_KEY,
      "true"
    );

  }catch(error){}

}


function playFirstVisitorVideo(){

  if(
    hasWatchedSample()
  ){

    showInsufficient();

    return;

  }


  markSampleWatched();


  const page =
    $("firstVideoPage");

  const video =
    $("firstVideo");


  if(!page || !video){

    showInsufficient();

    return;

  }


  video.src =
    VIDEO_URL;

  video.currentTime =
    0;

  video.muted =
    false;


  hide("photosPage");

  hide("incomingCall");

  hide("insufficientPage");

  show("firstVideoPage");


  let finished =
    false;


  let timer =
    null;


  function finish(){

    if(finished){
      return;
    }


    finished =
      true;


    clearTimeout(
      timer
    );


    try{

      video.pause();

    }catch(error){}


    video.removeEventListener(
      "ended",
      finish
    );


    hide(
      "firstVideoPage"
    );


    showInsufficient();

  }


  video.addEventListener(
    "ended",
    finish
  );


  timer =
    setTimeout(
      finish,
      FIRST_VIDEO_DURATION
    );


  const promise =
    video.play();


  if(
    promise &&
    typeof promise.catch ===
    "function"
  ){

    promise.catch(
      function(){

        /*
          Browser may require
          a user gesture before
          playing sound.
        */

      }
    );

  }

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(){

  hide("welcomeScreen");

  hide("photosPage");

  hide("incomingCall");

  hide("firstVideoPage");

  show("insufficientPage");


  setTimeout(
    function(){

      showPhotos();

    },
    INSUFFICIENT_DURATION
  );

}

    if(

          "index.html"
        )
      ||

);

   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",

    if(!document.hidden){

      refreshAllSocialData();

    }

  }
);


/* =========================
   SOCIAL EVENT PROTECTION
========================= */

document.addEventListener(
  "click",
  function(event){

    const social =
      event.target.closest(
        ".social-btn"
      );


    if(social){

      event.stopPropagation();

    }


    const chat =
      event.target.closest(
        ".chat-section"
      );


    if(chat){

      event.stopPropagation();

    }

  },
  true
);


/* =========================
   CALL BUTTONS
========================= */

const answerButton =
  $("answerCall");


if(answerButton){

  answerButton.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();

      answerIncomingCall();

    }
  );

}


const rejectButton =
  $("rejectCall");


if(rejectButton){

  rejectButton.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();

      rejectIncomingCall();

    }
  );

}

   FINAL SAFETY CHECKS
========================= */
