<style>
*{
  box-sizing:border-box;

  padding:0;
}

html,body{
  width:100%;

  color:#fff;
  font-family:Arial,sans-serif;

body{
  overflow-x:hidden;
}

/* =========================
   WELCOME
========================= */

#welcomeScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#welcomeScreen h1{
  font-size:42px;
  letter-spacing:3px;
  margin-bottom:15px;
}

#welcomeScreen p{
  font-size:18px;
  color:#aaa;
}

/* =========================
   LIVE PHOTOS
========================= */

#photosPage{
  display:none;
  width:100%;
  min-height:100vh;
  background:#000;
}

.topBar{
  width:100%;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#080808;
  border-bottom:1px solid #222;
}

.onlineText{
  font-size:14px;
  color:#ddd;
}

.onlineNumber{
  color:#00ff66;
  font-weight:bold;
}

.liveTitle{
  font-size:17px;
  font-weight:bold;
}

.liveDot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#00ff66;
  border-radius:50%;
  margin-right:5px;
  animation:blinkDot 1s infinite;
}

@keyframes blinkDot{
  0%,100%{opacity:1;}
  50%{opacity:.25;}
}

.photoGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:3px;
}

.photoCard{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#111;
  overflow:hidden;
  cursor:pointer;
}

.photoCard img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photoCard:active{
  transform:scale(.98);
}

.liveBadge{
  position:absolute;
  top:8px;
  left:8px;
  background:#f00;
  color:#fff;
  padding:4px 8px;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
  z-index:3;
}

.onlineLiveDot{
  display:inline-block;
  width:6px;
  height:6px;
  background:#00ff66;
  border-radius:50%;
  margin-right:3px;
}

.photoInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:25px 8px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
}

.photoName{
  font-size:14px;
  font-weight:bold;
}

.photoMeta{
  font-size:11px;
  color:#ccc;
  margin-top:3px;
}

.playIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  z-index:2;
}
  /* =========================
   OFFLINE ROOMS
========================= */

.photo-offline{
  position:absolute;
  top:8px;
  left:8px;
  background:#333;
  color:#ddd;
  padding:4px 8px;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
  z-index:3;
}

.photo-red-dot{
  display:inline-block;
  width:6px;
  height:6px;
  background:#f00;
  border-radius:50%;
  margin-right:3px;
}

.closedOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.58);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:4;
}

.closedText{
  background:rgba(0,0,0,.8);
  padding:10px 15px;
  border-radius:5px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  display:none;
  position:fixed;
  inset:0;
  background:#050505;
  z-index:8000;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.incomingLabel{
  position:absolute;
  top:35px;
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;
}

.callerPhoto{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #f00;
}

.callerName{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
}

.callButtons{
  position:absolute;
  bottom:45px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:45px;
}

.callButton{
  width:65px;
  height:65px;
  border-radius:50%;
  border:none;
  color:#fff;
  font-size:28px;
  cursor:pointer;
}

.answerButton{
  background:#00b83d;
}

.declineButton{
  background:#e00000;
}

/* =========================
   RED LIVE VIDEO
========================= */

#liveSoundPage{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:8500;
}

#liveSoundVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.redLiveTop{
  position:absolute;
  top:15px;
  left:15px;
  z-index:10;
  background:#f00000;
  color:#fff;
  padding:6px 10px;
  border-radius:4px;
  font-size:13px;
  font-weight:bold;
}

.redLiveDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00ff66;
  margin-right:4px;

/* =========================
   SECOND CALL BLACK SCREEN
========================= */

.blackLiveBadge{

.blackLoading{

}

.loadingDots{
  margin-top:10px;
  font-size:14px;
  color:#999;
}

/* =========================
   INSUFFICIENT
========================= */

#insufficientPage{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:8700;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.insufficientBox{
  width:90%;
  max-width:360px;
  border:1px solid #333;
  background:#111;
  padding:30px 20px;
  border-radius:8px;
}

.insufficientBox h2{
  color:#ff3030;

  margin-bottom:12px;
}

.insufficientBox p{
  color:#bbb;
  font-size:15px;
  line-height:1.5;
}
</style>

<script>
  /* =========================
   SETTINGS
========================= */

const GITHUB_OWNER = "agnesweb2026";
const GITHUB_REPO = "My-referral-website";
const GITHUB_BRANCH = "main";

const PHOTOS_DURATION = 20000;
const BACKGROUND_SOUND_DURATION = 5000;
const INSUFFICIENT_DURATION = 2000;
const BUSY_CHANGE_DURATION = 300000;
const SECOND_CALL_SOUND_DURATION = 5000;

/* =========================
   VISIT STATE
========================= */

/*
  IMPORTANT:

  This variable resets when the website
  is opened/reloaded.

  Therefore the red LIVE video can only
  appear ONCE during one visit.
*/

let redLiveShownThisVisit = false;

let photosTimer = null;
let backgroundSoundTimer = null;
let busyTimer = null;
let blackLiveTimer = null;

let photos = [];
let busyIndexes = [];

/* =========================
   24 NAMES
========================= */

const names = [
  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Ashley",
  "Mary",
  "Cindy",
  "Mercy",
  "Linda",
  "Sharon",
  "Brenda",

  "Betty",
  "Nancy",
  "Winnie",

  "Carol",

  "Fellow"
];

/* =========================
   24 AGES
========================= */

const ages = [
  19,23,25,18,24,24,
  26,30,27,23,29,33,
  25,25,31,25,23,19,
  22,24,23,27,28,21
];

/* =========================
   24 COUNTRIES
========================= */

const countries = [
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},
  {country:"Kenya",flag:"🇰🇪"},

  {country:"Tanzania",flag:"🇹🇿"},
  {country:"Tanzania",flag:"🇹🇿"},
  {country:"Tanzania",flag:"🇹🇿"},
  {country:"Tanzania",flag:"🇹🇿"},

  {country:"Nigeria",flag:"🇳🇬"},
  {country:"Nigeria",flag:"🇳🇬"},
  {country:"Nigeria",flag:"🇳🇬"},
  {country:"Nigeria",flag:"🇳🇬"},

  {country:"Congo",flag:"🇨🇩"},
  {country:"Congo",flag:"🇨🇩"},
  {country:"Congo",flag:"🇨🇩"},
  {country:"Congo",flag:"🇨🇩"},
  {country:"Congo",flag:"🇨🇩"},

  {country:"Canada",flag:"🇨🇦"},
  {country:"Canada",flag:"🇨🇦"},

  {country:"South Africa",flag:"🇿🇦"},
  {country:"South Africa",flag:"🇿🇦"},

  {country:"USA",flag:"🇺🇸"},
  {country:"USA",flag:"🇺🇸"}
];
  /* =========================
   DOM
========================= */

const welcomeScreen =
  document.getElementById("welcomeScreen");

const photosPage =
  document.getElementById("photosPage");

const photoGrid =
  document.getElementById("photoGrid");

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerName =
  document.getElementById("callerName");

const answerButton =
  document.getElementById("answerButton");

const declineButton =
  document.getElementById("declineButton");

const liveSoundPage =
  document.getElementById("liveSoundPage");

const liveSoundVideo =
  document.getElementById("liveSoundVideo");

const blackLivePage =
  document.getElementById("blackLivePage");

const insufficientPage =
  document.getElementById("insufficientPage");

const backgroundSound =
  document.getElementById("backgroundSound");

const onlineNumber =
  document.getElementById("onlineNumber");


/* =========================
   HIDE ALL PAGES
========================= */

function hideAllPages(){

  welcomeScreen.style.display = "none";

  photosPage.style.display = "none";

  incomingCall.style.display = "none";

  liveSoundPage.style.display = "none";

  blackLivePage.style.display = "none";

  insufficientPage.style.display = "none";
}


/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

  const copy = [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];
  }

  return copy;
}


/* =========================
   GITHUB PHOTOS
========================= */

async function loadPhotos(){

  try{

    const apiUrl =
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

    const response =
      await fetch(apiUrl);

    if(!response.ok){
      throw new Error("GitHub request failed");
    }

    const data =
      await response.json();

    const imageFiles =
      data.tree
        .filter(item => {

          if(item.type !== "blob"){
            return false;
          }

          const lower =
            item.path.toLowerCase();

          return (
            lower.endsWith(".jpg") ||
            lower.endsWith(".jpeg") ||
            lower.endsWith(".png") ||
            lower.endsWith(".webp")
          );
        })
        .slice(0,24);

    photos =
      imageFiles.map((item,index) => {

        return {
          src:
            `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${item.path}`,

          name:
            names[index] || `User ${index + 1}`,

          age:
            ages[index] || 25,

          country:
            countries[index] ||
            {
              country:"Kenya",
              flag:"🇰🇪"
            }
        };

      });

  }catch(error){

    console.error(
      "Photo loading error:",
      error
    );

  }
                 }
  /* =========================
   CREATE 5 OFFLINE ROOMS
========================= */

function createBusyIndexes(){

  busyIndexes = [];

  while(busyIndexes.length < 5){

    const randomIndex =
      Math.floor(
        Math.random() * photos.length
      );

    if(
      !busyIndexes.includes(randomIndex)
    ){

      busyIndexes.push(randomIndex);

    }
  }
}


/* =========================
   RENDER PHOTOS
========================= */

function renderPhotos(){

  clearTimeout(busyTimer);

  if(!photos.length){
    return;
  }

  photoGrid.innerHTML = "";

  const shuffledPhotos =
    shuffleArray(photos);

  createBusyIndexes();

  shuffledPhotos.forEach((person,index) => {

    const card =
      document.createElement("div");

    card.className = "photoCard";

    const isBusy =
      busyIndexes.includes(index);

    const image =
      document.createElement("img");

    image.src = person.src;

    image.alt = person.name;

    image.loading = "lazy";

    card.appendChild(image);


    const playIcon =
      document.createElement("div");

    playIcon.className = "playIcon";

    playIcon.innerHTML = "▶";

    card.appendChild(playIcon);


    if(isBusy){

      const offline =
        document.createElement("div");

      offline.className =
        "photo-offline";

      offline.innerHTML =
        '<span class="photo-red-dot"></span>OFFLINE';

      card.appendChild(offline);


      const closedOverlay =
        document.createElement("div");

      closedOverlay.className =
        "closedOverlay";

      closedOverlay.innerHTML =
        '<div class="closedText">ROOM CLOSED</div>';

      card.appendChild(closedOverlay);


      const info =
        document.createElement("div");

      info.className = "photoInfo";

      info.innerHTML = `
        <div class="photoName">
          ${person.name}
        </div>

        <div class="photoMeta">
          ${person.country.flag} ${person.age} yrs
        </div>
      `;

      card.appendChild(info);


      /*
        OFFLINE ROOM:
        Do NOT open payment.
      */

      card.addEventListener(
        "click",
        function(){

          closedOverlay.querySelector(
            ".closedText"
          ).textContent =
            "ROOM CLOSED";

        }
      );

    }else{

      const liveBadge =
        document.createElement("div");

      liveBadge.className =
        "liveBadge";

      liveBadge.innerHTML =
        '<span class="onlineLiveDot"></span>LIVE';

      card.appendChild(liveBadge);


      const info =
        document.createElement("div");

      info.className = "photoInfo";

      info.innerHTML = `
        <div class="photoName">
          ${person.name}
        </div>

        <div class="photoMeta">
          ${person.country.flag} ${person.age} yrs
        </div>
      `;

      card.appendChild(info);


      /*
        ANY TAP ON LIVE ROOM:
        GO TO PAYMENT PAGE.
      */

      card.addEventListener(
        "click",
        function(){

          window.location.href =
            "payment.html";

        }
      );

    }

    photoGrid.appendChild(card);

  });


  /*
    Exactly 5 rooms change every 5 minutes.
  */

  busyTimer =
    setTimeout(() => {

      if(
        photosPage.style.display !== "none"
      ){

        renderPhotos();

      }

    }, BUSY_CHANGE_DURATION);
}


/* =========================
   ONLINE NUMBER
========================= */

function updateOnlineNumber(){

  const number =
    Math.floor(
      Math.random() * 5
    ) + 19;

  onlineNumber.textContent =
    number;
}
  /* =========================
   PLAY 5 SECOND BACKGROUND
   SOUND ON LIVE PHOTOS
========================= */

function playLivePhotosSound(){

  clearTimeout(
    backgroundSoundTimer
  );

  try{

    backgroundSound.pause();

    backgroundSound.currentTime = 0;

    backgroundSound.volume = 0.45;

    const promise =
      backgroundSound.play();

    if(promise){

      promise.catch(() => {

        /*
          Chrome may block sound until
          the visitor interacts with the page.
          The interaction listener below
          will try again.
        */

      });

    }

  }catch(error){

    console.log(
      "Background sound:",
      error
    );

  }


  backgroundSoundTimer =
    setTimeout(() => {

      backgroundSound.pause();

      backgroundSound.currentTime = 0;

    }, BACKGROUND_SOUND_DURATION);
}


/* =========================
   ENABLE SOUND AFTER
   FIRST USER INTERACTION
========================= */

function enableSound(){

  try{

    if(
      photosPage.style.display !== "none"
    ){

      playLivePhotosSound();

    }

  }catch(error){

    console.log(error);

  }

}


document.addEventListener(
  "click",
  enableSound,
  {once:false}
);

document.addEventListener(
  "touchstart",
  enableSound,
  {once:false}
);


/* =========================
   SHOW LIVE PHOTOS
========================= */

function showLivePhotos(){

  clearTimeout(photosTimer);

  clearTimeout(backgroundSoundTimer);

  clearTimeout(busyTimer);

  clearTimeout(blackLiveTimer);

  hideAllPages();

  photosPage.style.display = "block";

  updateOnlineNumber();

  renderPhotos();

  /*
    Every time Live Photos appears,
    background sound plays for 5 seconds.
  */

  playLivePhotosSound();


  /*
    Incoming call after 20 seconds.
  */

  photosTimer =
    setTimeout(() => {

      if(
        photosPage.style.display !== "none"
      ){

        showIncomingCall();

      }

    }, PHOTOS_DURATION);

}


/* =========================
   SHOW INCOMING CALL
========================= */

function showIncomingCall(){

  clearTimeout(photosTimer);

  clearTimeout(backgroundSoundTimer);

  clearTimeout(busyTimer);

  hideAllPages();

  incomingCall.style.display =
    "flex";


  if(!photos.length){

    callerPhoto.style.display =
      "none";

    callerName.textContent =
      "Incoming Video Call";

    return;

  }


  const randomCaller =
    photos[
      Math.floor(
        Math.random() * photos.length
      )
    ];


  callerPhoto.style.display =
    "block";

  callerPhoto.src =
    randomCaller.src;

  callerName.textContent =
    randomCaller.name;

}
  /* =========================
   FIRST RED LIVE VIDEO
========================= */

function showLiveSound(){

  clearTimeout(photosTimer);

  clearTimeout(backgroundSoundTimer);

  clearTimeout(busyTimer);

  clearTimeout(blackLiveTimer);

  hideAllPages();

  liveSoundPage.style.display =
    "block";


  /*
    Stop background sound so we don't
    hear two copies at once.
  */

  backgroundSound.pause();

  backgroundSound.currentTime = 0;


  liveSoundVideo.currentTime = 0;

  liveSoundVideo.muted = false;

  liveSoundVideo.volume = 1;


  /*
    Play red LIVE video with sound.
  */

  const playPromise =
    liveSoundVideo.play();

  if(playPromise){

    playPromise.catch(() => {

      /*
        If Chrome blocks autoplay,
        the video can still start after
        the user's answer tap.
      */

    });

  }


  /*
    Maximum red LIVE video time.
    It will continue until the video
    ends, but we also prevent it from
    getting stuck forever.
  */

  setTimeout(() => {

    if(
      liveSoundPage.style.display !==
      "none"
    ){

      liveSoundVideo.pause();

      showInsufficient();

    }

  }, 20000);

}


/* =========================
   RED LIVE VIDEO ENDED
========================= */

liveSoundVideo.addEventListener(
  "ended",
  function(){

    if(
      liveSoundPage.style.display !==
      "none"
    ){

      showInsufficient();

    }

  }
);


/* =========================
   SECOND CALL BLACK SCREEN
========================= */

function showBlackLive(){

  clearTimeout(photosTimer);

  clearTimeout(backgroundSoundTimer);

  clearTimeout(busyTimer);

  clearTimeout(blackLiveTimer);

  hideAllPages();

  blackLivePage.style.display =
    "flex";


  /*
    Same sound as red LIVE,
    but NO video is displayed.
  */

  backgroundSound.pause();

  backgroundSound.currentTime = 0;

  backgroundSound.volume = 1;


  const playPromise =
    backgroundSound.play();

  if(playPromise){

    playPromise.catch(() => {

      /*
        Browser autoplay restriction.
        The user has already tapped Answer,
        so normally playback should be allowed.
      */

    });

  }


  /*
    Sound + black LIVE screen:
    exactly 5 seconds.
  */

  blackLiveTimer =
    setTimeout(() => {

      backgroundSound.pause();

      backgroundSound.currentTime = 0;

      showInsufficient();

    }, SECOND_CALL_SOUND_DURATION);

}


/* =========================
   INSUFFICIENT MINUTES
========================= */

function showInsufficient(){

  clearTimeout(photosTimer);

  clearTimeout(backgroundSoundTimer);

  clearTimeout(busyTimer);

  clearTimeout(blackLiveTimer);

  hideAllPages();

  insufficientPage.style.display =
    "flex";


  setTimeout(() => {

    showLivePhotos();

  }, INSUFFICIENT_DURATION);

}
  
  /* =========================
   ANSWER BUTTON
========================= */

answerButton.addEventListener(
  "click",
  function(){

    /*
      FIRST ANSWERED CALL:
      Red LIVE video.

      AFTER THAT:
      Black screen + LIVE + sound.
    */

    if(!redLiveShownThisVisit){

      /*
        Mark it immediately.

        This means even if the video
        has a loading problem, another
        incoming call during this visit
        will NOT show the red video again.
      */

      redLiveShownThisVisit = true;

      showLiveSound();

    }else{

      /*
        Second and later answered calls:
        black screen + red LIVE + sound.
      */

      showBlackLive();

    }

  }
);


/* =========================
   DECLINE BUTTON
========================= */

declineButton.addEventListener(
  "click",
  function(){

    /*
      Declining does NOT use the
      red LIVE video.

      Return directly to Live Photos.
    */

    showLivePhotos();

  }
);


/* =========================
   START WEBSITE
========================= */

function startWebsite(){

  hideAllPages();

  welcomeScreen.style.display =
    "flex";


  const startedAt =
    Date.now();


  /*
    Load photos while the Welcome
    screen is already counting.
  */

  loadPhotos().finally(() => {

    const elapsed =
      Date.now() - startedAt;

    const remaining =
      Math.max(
        0,
        3000 - elapsed
      );


    setTimeout(() => {

      welcomeScreen.style.display =
        "none";

      showLivePhotos();

    }, remaining);

  });

}


/* =========================
   ONLINE NUMBER UPDATE
========================= */

setInterval(() => {

  if(
    photosPage.style.display !== "none"
  ){

    updateOnlineNumber();

  }

}, 10000);
  /* =========================
   START
========================= */

startWebsite();

</script>
