/* =========================
   DOM HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}


function show(id){
  const element = $(id);

  if(element){
    element.classList.remove("hidden");
  }
}


function hide(id){
  const element = $(id);

  if(element){
    element.classList.add("hidden");
  }
}


function readStorage(key, fallback){
  try{
    const raw = localStorage.getItem(key);

    if(!raw){
      return fallback;
    }

    const parsed = JSON.parse(raw);

    return parsed;

  }catch(error){

    return fallback;

  }
}


function writeStorage(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.warn(
      "Storage error:",
      error
    );

  }
}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   PROFILE ID
========================= */

function profileId(index){

  return "profile_" + index;

}


/* =========================
   REFERRAL
========================= */

function getReferral(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const ref =
    params.get("ref");

  const employee =
    params.get("employee");

  return {
    ref: ref || "",
    employee: employee || ""
  };

}


function buildPaymentUrl(index){

  const referral =
    getReferral();

  const params =
    new URLSearchParams();

  params.set(
    "profile",
    profiles[index].name
  );

  params.set(
    "employee",
    referral.employee ||
    referral.ref ||
    ""
  );

  return PAYMENT_PAGE_URL +
    "?" +
    params.toString();

}


/* =========================
   OPEN PAYMENT
========================= */

function openPayment(index){

  const url =
    buildPaymentUrl(index);

  window.location.href = url;

  }
  /* =========================
   COMMENTS
========================= */

function getComments(index){

  const allComments =
    readStorage(
      COMMENT_KEY,
      {}
    );

  const id =
    profileId(index);

  if(
    !Array.isArray(
      allComments[id]
    )
  ){

    allComments[id] = [];

  }

  return allComments[id];

}


function saveComments(index,comments){

  const allComments =
    readStorage(
      COMMENT_KEY,
      {}
    );

  const id =
    profileId(index);

  allComments[id] =
    comments;

  writeStorage(
    COMMENT_KEY,
    allComments
  );

}


function renderComments(index){

  const box =
    document.getElementById(
      "comments-" + index
    );

  if(!box){
    return;
  }

  const comments =
    getComments(index);

  if(!comments.length){

    box.innerHTML =
      '<div class="empty-comments">No comments yet. Be the first 💬</div>';

    return;

  }

  box.innerHTML =
    comments.map(
      comment => {

        return `
          <div class="comment">
            <span class="comment-name">
              ${escapeHtml(comment.name)}
            </span>
            ${escapeHtml(comment.text)}
          </div>
        `;

      }
    ).join("");

}


function addComment(index,input){

  if(!input){
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const comments =
    getComments(index);

  comments.push({

    name:"You",

    text:text,

    time:Date.now()

  });

  saveComments(
    index,
    comments
  );

  input.value = "";

  renderComments(index);

  scrollChatToBottom(index);

}

function getNumber(data,id,base){

  if(
    typeof data[id] !==
    "number"
  ){

    data[id] = base;

  }

  return data[id];

}


/* =========================

function updateLikeButton(index){

  const data =
    readStorage(
      LIKE_KEY,
      {}
    );

  const id =
    profileId(index);

  const button =
    document.getElementById(
      "like-" + index
    );

  const count =
    getNumber(
      data,
      id,
      0
    );

  const liked =
    data[id + "_me"] === true;

  if(button){

    button.innerHTML =
      "👍 " + count;

    button.classList.toggle(
      "active",
      liked
    );

  }

  writeStorage(
    LIKE_KEY,
    data
  );

}


function toggleLike(index,event){

  if(event){

    event.preventDefault();
    event.stopPropagation();

  }

  const data =
    readStorage(
      LIKE_KEY,
      {}
    );

  const id =
    profileId(index);

  const count =
    getNumber(
      data,
      id,
      0
    );

  const liked =
    data[id + "_me"] === true;

  if(liked){

    data[id] =
      Math.max(
        0,
        count - 1
      );

    data[id + "_me"] =
      false;

  }else{

    data[id] =
      count + 1;

    data[id + "_me"] =
      true;

  }

  writeStorage(
    LIKE_KEY,
    data
  );

  updateLikeButton(index);

  showReaction(
    index,
    liked ? "Like removed" : "Liked ❤️"
  );

}

    data[id + "_me"] === true;

  if(loved){

    data[id] =
      Math.max(
        0,
        count - 1
      );

    data[id + "_me"] =
      false;

  }else{

    data[id] =
      count + 1;

    data[id + "_me"] =
      true;

  }

  writeStorage(
    LOVE_KEY,
    data
  );

  updateLoveButton(index);

  showReaction(
    index,
    loved ? "Love removed" : "Loved ❤️"
  );

      }

    profileId(index);

  );

  if(!section){

  const hidden =
    section.classList.contains(
      "hidden"

      "hidden"

          );

        if(input){

    );

  }

}

/* =========================
   OFFLINE PROFILES
========================= */

let offlineProfiles =
  new Set();


function refreshOfflineProfiles(){

  offlineProfiles =
    new Set();


  const total =
    profiles.length;

  const offlineCount =
    Math.min(
      5,
      Math.max(
        0,
        total - 1
      )
    );


  const indexes =
    profiles.map(
      (_,index) =>
        index
    );


  while(
    offlineProfiles.size <
    offlineCount
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        indexes.length
      );

    offlineProfiles.add(
      indexes[randomIndex]
    );

  }


  profiles.forEach(
    (_,index) => {

      const dot =
        document.querySelector(
          "#photosGrid .photo-card:nth-child(" +
          (index + 1) +
          ") .status-dot"
        );

      const live =
        document.querySelector(
          "#photosGrid .photo-card:nth-child(" +
          (index + 1) +
          ") .photo-live"
        );


      if(
        offlineProfiles.has(
          index
        )
      ){

        if(dot){

          dot.classList.add(
            "offline"
          );

        }

        if(live){

          live.textContent =
            "OFFLINE";

          live.style.background =
            "#555";

        }

      }

    }
  );

  }
 /* =========================
   CALL SYSTEM
========================= */

let currentCallerIndex = 0;

let callTimer = null;


function chooseCaller(){

  const available =
    profiles
      .map(
        (_,index) =>
          index
      )
      .filter(
        index =>
          !offlineProfiles.has(
            index
          )
      );


  if(!available.length){

    return 0;

  }


  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}

/* =========================
   FIRST VIDEO
========================= */

function playFirstVisitorVideo(){

  if(hasWatchedSample()){

    showInsufficient();

    return;

  }


  markSampleWatched();


  const page =
    $("firstVideoPage");

  const video =
    $("firstVideo");


  if(!page || !video){

    showInsufficient();

    return;

  }


  video.src =
    VIDEO_URL;

  video.currentTime =
    0;

  video.muted =
    false;


  hide("photosPage");

  hide("incomingCall");

  hide("insufficientPage");

  show("firstVideoPage");


  let finished =
    false;


  function finish(){

    if(finished){
      return;
    }

    finished = true;

    clearTimeout(
      timer
    );


    try{

      video.pause();

    }catch(error){}


    video.removeEventListener(
      "ended",
      finish
    );


    hide("firstVideoPage");

    showInsufficient();

  }


  video.addEventListener(
    "ended",
    finish
  );


  const timer =
    setTimeout(
      finish,
      FIRST_VIDEO_DURATION
    );


  const playPromise =
    video.play();


  if(
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ){

    playPromise.catch(
      function(){

        /*
          If browser blocks
          autoplay with sound,
          show the video page.
          User can press the
          browser video play control.
        */

      }
    );

  }

}
