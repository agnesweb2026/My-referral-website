========================= */

.online-box{

.live-header{

#photoGrid{

  padding:4px;
  background:#000;
}

.photoCard{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#111;
  border-radius:5px;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:0.72;
  overflow:hidden;
  background:#111;
}

.profile-photo{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.photo-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.62);
  border:2px solid rgba(255,255,255,.9);
  font-size:21px;
  color:#fff;
  animation:playPulse 1.5s infinite;
}

@keyframes playPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.08);
  }
}

.live-badge{
  position:absolute;
  left:6px;
  top:6px;
  padding:4px 7px;
  border-radius:5px;
  background:#e90000;
  color:#fff;
  font-size:10px;

}

  color:#fff;

.photo-info{

  background:#0b0b0b;

.photo-name{

  font-weight:700;
  color:#fff;

  overflow:hidden;
  text-overflow:ellipsis;

.photo-meta{

  font-size:11px;

/* =====================================

===================================== */

function loadReferral() {

  const params =
    new URLSearchParams(window.location.search);

  const fromURL =
    params.get("employee") ||
    params.get("ref");

  if (
    fromURL &&
    VALID_REFERRALS[fromURL]
  ) {

    referralCode = fromURL;

    referralEmployee =
      VALID_REFERRALS[fromURL];

    localStorage.setItem(
      REFERRAL_STORAGE_KEY,
      referralCode
    );

    return;
  }

  const saved =
    localStorage.getItem(
      REFERRAL_STORAGE_KEY
    );

  if (
    saved &&
    VALID_REFERRALS[saved]
  ) {

    referralCode = saved;

  }
}

/* =====================================

function addTimer(callback, delay) {

  const timer =
    setTimeout(callback, delay);

  timers.push(timer);

  return timer;
}


function clearTimers() {

  timers.forEach(timer => {
    clearTimeout(timer);
  });

  timers = [];
}

/* =====================================
   BUILD PHOTO GRID
===================================== */

function buildPhotoGrid() {

  photoGrid.innerHTML = "";

  PROFILES.forEach((profile, index) => {

    const card =
      document.createElement("div");

    card.className = "photoCard";

    card.innerHTML = `
      <div class="photo-image-wrap">

        <img
          class="profile-photo"
          src="${IMAGE_BASE}${encodeURIComponent(profile.image)}"
          alt="${profile.name}"
          loading="lazy"
        >

        <div class="live-badge">
          LIVE
        </div>

        <div class="photo-play">
          ▶
        </div>

      </div>

      <div class="photo-info">

        <div class="photo-name">
          ${profile.name}
        </div>

        <div class="photo-meta">
          ${profile.flag} ${profile.country} · ${profile.age}
        </div>

      </div>
    `;

    const image =
      card.querySelector(".profile-photo");

    image.addEventListener(
      "error",
      () => {

        const baseName =
          profile.image.replace(
            /\.[^/.]+$/,
            ""
          );

        const extensions = [
          ".png",
          ".webp",
          ".jpeg"
        ];

        const current =
          image.dataset.fallbackIndex
            ? Number(image.dataset.fallbackIndex)
            : 0;

        if (
          current < extensions.length
        ) {

          image.dataset.fallbackIndex =
            String(current + 1);

          image.src =
            IMAGE_BASE +
            encodeURIComponent(
              baseName + extensions[current]
            );

        } else {

          image.style.background =
            "#171717";

        }
      }
    );

    card.addEventListener(
      "click",
      () => {

        openPaymentPage();

      }
    );

    photoGrid.appendChild(card);

  });
}

}


/* =====================================
   RED LIVE VIDEO
===================================== */

function showRedLiveVideo() {

  hideAllScreens();

  redLiveVideoPage.style.display =
    "flex";

  try {

    redLiveVideo.currentTime = 0;

    const playPromise =
      redLiveVideo.play();

    if (
      playPromise &&
      typeof playPromise.catch === "function"
    ) {

      playPromise.catch(() => {});

    }

  } catch (error) {}

  addTimer(() => {

    try {

      redLiveVideo.pause();

      redLiveVideo.currentTime = 0;

    } catch (error) {}

    showBlackLive();

  }, RED_LIVE_DURATION);
}


/* =====================================
   BLACK LIVE
===================================== */

function showBlackLive() {

  clearTimers();

  hideAllScreens();

  blackLivePage.style.display =
    "flex";

  try {

    blackLiveSoundVideo.currentTime = 0;

    blackLiveSoundVideo.muted = false;

    blackLiveSoundVideo.volume = 1;

    const playPromise =
      blackLiveSoundVideo.play();

    if (
      playPromise &&
      typeof playPromise.catch === "function"
    ) {

      playPromise.catch(() => {});

    }

  } catch (error) {}

  addTimer(() => {

    stopBlackLiveSound();

    showInsufficient();

  }, BLACK_LIVE_DURATION);
}


/* =====================================
   STOP BLACK LIVE SOUND
===================================== */

function stopBlackLiveSound() {

  try {

    blackLiveSoundVideo.pause();

    blackLiveSoundVideo.currentTime = 0;

  } catch (error) {}

  try {

    blackLiveAudio.pause();

    blackLiveAudio.currentTime = 0;

  } catch (error) {}
}


/* =====================================
   INSUFFICIENT MINUTES
===================================== */

function showInsufficient() {

  clearTimers();

  hideAllScreens();

  insufficientPage.style.display =
    "flex";

  let seconds = 2;

  insufficientTimer.textContent =
    seconds;

  const countdown =
    setInterval(() => {

      seconds--;

      if (seconds <= 0) {

        clearInterval(countdown);

        insufficientTimer.textContent =
          "0";

      } else {

        insufficientTimer.textContent =
          seconds;

      }

    }, 1000);

  addTimer(() => {

    showLivePhotos();

  }, INSUFFICIENT_DURATION);
}


/* =====================================
   OPEN PAYMENT PAGE
===================================== */

function openPaymentPage() {

  sessionStorage.setItem(
    "returnToLivePhotos",
    "1"
  );

  let url =
    PAYMENT_PAGE_URL;

  if (referralCode) {

    url +=
      "?employee=" +
      encodeURIComponent(
        referralCode
      );

  }

  window.location.href = url;
}

declineButton.addEventListener(

  declineCall
);

answerButton.addEventListener(
  "click",
  answerCall
);

loadReferral();

showWelcome();
