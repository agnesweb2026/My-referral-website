<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Profiles</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font-family:Arial,sans-serif;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.hidden{
  display:none !important;
}

.page{
  width:100%;
  min-height:100vh;
}


/* =========================
   WELCOME
========================= */

#welcomeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

.welcome-box{
  padding:25px;
}

.welcome-box h1{
  font-size:30px;
  margin-bottom:12px;
}

.welcome-box p{
  color:#aaa;
  font-size:15px;
}


/* =========================
   PHOTOS PAGE
========================= */

#photosPage{
  min-height:100vh;
  background:#000;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#080808;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:13px;
  color:#fff;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#19e66b;
  margin-right:5px;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}


/* =========================
   PHOTO GRID
========================= */

#photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:4px;
}

.photoCard{
  position:relative;
  background:#111;
  border-radius:7px;
  overflow:hidden;
  cursor:pointer;
  min-width:0;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.78;
  overflow:hidden;
  background:#151515;
}

.profile-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================
   LIVE BADGE
========================= */

.live-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#e00000;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}

.offline-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#555;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}


/* =========================
   VIDEO ICON
========================= */

.photo-play{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:45px;
  height:45px;

  border-radius:50%;

  background:rgba(0,0,0,.72);

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:6;

  animation:videoZoom 1.4s ease-in-out infinite;
}

.photo-play::after{
  content:"▶";

  color:#fff;

  font-size:19px;

  margin-left:3px;
}

@keyframes videoZoom{

  0%{
    transform:translate(-50%,-50%) scale(.82);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.16);
  }

  100%{
    transform:translate(-50%,-50%) scale(.82);
  }

}


/* =========================
   PHOTO INFO
========================= */

.photo-info{
  padding:7px 7px 8px;
  background:#101010;
}

.photo-name{
  display:flex;
  align-items:center;
  gap:5px;

  font-size:13px;
  font-weight:bold;

  margin-bottom:4px;
}

.name-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#19e66b;

  display:inline-block;
  flex:none;

  animation:nameBlink 1s infinite;
}

@keyframes nameBlink{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.2;
    transform:scale(.75);
  }

}

.photo-meta{
  font-size:11px;
  color:#aaa;
}


/* =========================
   SOCIAL BUTTONS
========================= */

.social-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  margin-top:7px;
}

.social-btn{
  min-width:0;
  border:1px solid #292929;
  background:#181818;
  color:#ddd;
  border-radius:5px;
  padding:6px 2px;

  font-size:10px;
  line-height:1.15;

  cursor:pointer;
  transition:.15s;
}

.social-btn:active{
  transform:scale(.94);
}

.social-btn.like.active{
  color:#ff4d67;
  border-color:#ff4d67;
  background:#211116;
}

.social-btn.love.active{
  color:#ff4fd8;
  border-color:#ff4fd8;
  background:#211326;
}

.social-btn.follow.active{
  color:#19e66b;
  border-color:#19e66b;
  background:#102015;
}

.social-btn.chat.active{
  color:#5bb8ff;
  border-color:#5bb8ff;
  background:#101d28;
}

.social-count{
  display:block;
  font-size:9px;
  color:#aaa;
  margin-top:2px;
}
  /* =========================
   CHAT SECTION
========================= */

.chat-section{
  display:none;
  margin-top:7px;
  padding:7px;

  background:#080808;
  border:1px solid #292929;
  border-radius:7px;
}

.chat-section.open{
  display:block;
}

.chat-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:11px;
  font-weight:bold;

  margin-bottom:6px;
}

.chat-live{
  color:#19e66b;
  font-size:9px;
}

.chat-comments{
  height:110px;
  overflow-y:auto;
  overflow-x:hidden;

  padding:5px;

  background:#050505;
  border-radius:5px;

  border:1px solid #1f1f1f;

  scroll-behavior:smooth;
}

.chat-comments::-webkit-scrollbar{
  width:4px;
}

.chat-comments::-webkit-scrollbar-track{
  background:#090909;
}

.chat-comments::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}

.chat-comment{
  padding:5px 6px;
  margin-bottom:4px;

  background:#151515;
  border-radius:5px;

  font-size:10px;
  line-height:1.3;

  word-break:break-word;
}

.chat-comment:last-child{
  margin-bottom:0;
}

.chat-comment-user{
  color:#6dbbff;
  font-weight:bold;
  margin-right:4px;
}

.chat-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:#777;
  font-size:10px;
  padding:10px;
}

.chat-form{
  display:flex;
  gap:4px;
  margin-top:5px;
}

.chat-input{
  flex:1;
  min-width:0;

  background:#151515;
  color:#fff;

  border:1px solid #333;
  border-radius:5px;

  padding:8px;

  outline:none;

  font-size:10px;
}

.chat-input:focus{
  border-color:#777;
}

.chat-send{
  border:none;
  border-radius:5px;

  background:#1683ff;
  color:#fff;

  padding:0 9px;

  font-size:10px;
  font-weight:bold;

  cursor:pointer;
}

.chat-send:active{
  transform:scale(.94);
}


/* =========================
   REACTION ANIMATION
========================= */

.reaction-pop{
  position:fixed;
  z-index:2000;

  pointer-events:none;

  font-size:25px;

  animation:reactionFloat 900ms ease-out forwards;
}

@keyframes reactionFloat{

  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }

  100%{
    opacity:0;
    transform:translateY(-80px) scale(1.35);
  }

}


/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  position:fixed;
  inset:0;

  z-index:1000;

  background:#050505;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.call-label{
  color:#aaa;
  font-size:14px;
  margin-bottom:20px;
}

#callerImage{
  width:145px;
  height:145px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid #e00000;

  margin-bottom:18px;
}

#callerName{
  font-size:25px;
  font-weight:bold;
  margin-bottom:8px;
}

.call-status{
  color:#aaa;
  font-size:14px;
  margin-bottom:45px;
}

.call-buttons{
  display:flex;

  gap:35px;

  align-items:center;
  justify-content:center;
}

.call-btn{
  width:75px;
  height:75px;

  border:none;

  border-radius:50%;

  color:#fff;

  font-size:28px;

  cursor:pointer;
}

.decline{
  background:#e00000;
}

.answer{
  background:#16a34a;
}


/* =========================
   LIVE VIDEO
========================= */

#redLiveVideoPage{
  position:fixed;
  inset:0;

  z-index:900;

  background:#000;
}

.live-video{
  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.red-live-label{
  position:absolute;

  top:15px;
  left:15px;

  z-index:20;

  background:#e00000;

  color:#fff;

  font-size:13px;
  font-weight:bold;

  padding:6px 10px;

  border-radius:4px;
}


/* =========================
   INSUFFICIENT PAGE
========================= */

#insufficientPage{
  position:fixed;
  inset:0;

  z-index:800;

  background:#000;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.insufficient-box{
  width:90%;
  max-width:390px;

  background:#111;

  border:1px solid #333;

  border-radius:12px;

  padding:30px 20px;
}

.insufficient-box h2{
  color:#ff3333;
  margin-bottom:12px;
}

.insufficient-box p{
  color:#aaa;
  font-size:14px;
}

#insufficientTimer{
  margin-top:18px;
  color:#fff;
  font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #photoGrid{
    grid-template-columns:repeat(3,1fr);
  }

  .photo-play{
    width:40px;
    height:40px;
  }

  .photo-play::after{
    font-size:17px;
  }

  .photo-name{
    font-size:12px;
  }

  .photo-meta{
    font-size:10px;
  }

  .social-btn{
    font-size:9px;
    padding:6px 1px;
  }

  .social-count{
    font-size:8px;
  }

  #callerImage{
    width:130px;
    height:130px;
  }

}

</style>
</head>

<script>

/* =========================

========================= */

/* =========================

========================= */

const imageFiles = [

  "photo1.jpg",
  "photo2.jpg",
  "photo4.jpg",
  "photo5.jpg",

  "1785179340825.jpg",
  "1785179340825 (1).jpg",
  "1785179362758.jpg",
  "1785179915649.jpg",

  "Screenshot_20260731-045343.png"

];
  /* =========================
   PROFILES
========================= */

const profiles = [

  ["Cute",24,"Kenya","🇰🇪"],
  ["Becky",22,"Kenya","🇰🇪"],
  ["Dorry",26,"Kenya","🇰🇪"],
  ["Sharon",23,"Kenya","🇰🇪"],
  ["Lilian",27,"Kenya","🇰🇪"],

  ["Asha",25,"Tanzania","🇹🇿"],
  ["Neema",23,"Tanzania","🇹🇿"],
  ["Zawadi",28,"Tanzania","🇹🇿"],
  ["Rehema",24,"Tanzania","🇹🇿"],

  ["Blessing",22,"Nigeria","🇳🇬"],
  ["Favour",26,"Nigeria","🇳🇬"],
  ["Peace",25,"Nigeria","🇳🇬"],
  ["Joy",27,"Nigeria","🇳🇬"],

  ["Grace",24,"Congo","🇨🇩"],
  ["Mimi",23,"Congo","🇨🇩"],
  ["Nadia",26,"Congo","🇨🇩"],
  ["Bella",25,"Congo","🇨🇩"],
  ["Princess",28,"Congo","🇨🇩"],

  ["Emily",24,"Canada","🇨🇦"],
  ["Sophie",27,"Canada","🇨🇦"],

  ["Thandi",25,"South Africa","🇿🇦"],
  ["Lerato",29,"South Africa","🇿🇦"],

  ["Ashley",23,"USA","🇺🇸"],
  ["Jessica",26,"USA","🇺🇸"]

];


/* =========================
   LOCAL STORAGE
========================= */

const LIKE_KEY =
  "liveProfileLikes";

const LOVE_KEY =
  "liveProfileLoves";

const FOLLOW_KEY =
  "liveProfileFollows";

const COMMENT_KEY =
  "liveProfileComments";


function readStorage(key){

  try{

    return JSON.parse(
      localStorage.getItem(key) || "{}"
    );

  }catch(error){

    return {};

  }

}


function writeStorage(key,data){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}


let likeData =
  readStorage(LIKE_KEY);

let loveData =
  readStorage(LOVE_KEY);

let followData =
  readStorage(FOLLOW_KEY);

let commentData =
  readStorage(COMMENT_KEY);


/* =========================
   PROFILE ID
========================= */

function profileId(index){

  return "profile_" + index;

}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   COMMENTS
========================= */

function getComments(index){

  const id =
    profileId(index);

  if(
    !Array.isArray(
      commentData[id]
    )
  ){

    commentData[id] = [];

  }

  return commentData[id];

}


function saveComments(){

  writeStorage(
    COMMENT_KEY,
    commentData
  );

}


function renderComments(index){

  const list =
    document.getElementById(
      "comments-" + index
    );

  if(!list){
    return;
  }


  const comments =
    getComments(index);


  list.innerHTML =
    "";


  if(comments.length === 0){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "chat-empty";

    empty.textContent =
      "No comments yet. Start the conversation.";

    list.appendChild(
      empty
    );

    return;

  }


  comments.forEach(
    comment=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "chat-comment";


      const user =
        document.createElement(
          "span"
        );

      user.className =
        "chat-comment-user";

      user.textContent =
        "You:";


      const message =
        document.createElement(
          "span"
        );

      message.textContent =
        comment;


      item.appendChild(
        user
      );

      item.appendChild(
        message
      );


      list.appendChild(
        item
      );

    }
  );


  list.scrollTop =
    list.scrollHeight;

}


/* =========================
   ADD COMMENT
========================= */

function addComment(index,input){

  const value =
    input.value.trim();


  if(!value){
    return;
  }


  const comments =
    getComments(index);


  comments.push(
    value
  );


  saveComments();


  input.value =
    "";


  renderComments(index);


  const list =
    document.getElementById(
      "comments-" + index
    );


  if(list){

    list.scrollTop =
      list.scrollHeight;

  }

      }
  /* =========================
   LIKE
========================= */

function getNumber(data,index,base){

  const id =
    profileId(index);


  if(
    typeof data[id] !== "number"
  ){

    data[id] =
      base;

  }


  return data[id];

}


function updateLikeButton(index){

  const button =
    document.getElementById(
      "like-" + index
    );

  const count =
    document.getElementById(
      "like-count-" + index
    );


  if(!button || !count){
    return;
  }


  const id =
    profileId(index);


  const active =
    !!likeData[
      id + "_active"
    ];


  const number =
    getNumber(
      likeData,
      id,
      0
    );


  count.textContent =
    number;


  button.classList.toggle(
    "active",
    active
  );

}


function toggleLike(index,event){

  event.stopPropagation();


  const id =
    profileId(index);


  const active =
    !!likeData[
      id + "_active"
    ];


  if(active){

    likeData[
      id + "_active"
    ] = false;

    likeData[id] =
      Math.max(
        0,
        getNumber(
          likeData,
          id,
          0
        ) - 1
      );

  }else{

    likeData[
      id + "_active"
    ] = true;

    likeData[id] =
      getNumber(
        likeData,
        id,
        0
      ) + 1;


    showReaction(
      event,
      "❤️"
    );

  }


  writeStorage(
    LIKE_KEY,
    likeData
  );


  updateLikeButton(
    index
  );

}


/* =========================
   LOVE
========================= */

function updateLoveButton(index){

  const button =
    document.getElementById(
      "love-" + index
    );

  const count =
    document.getElementById(
      "love-count-" + index
    );


  if(!button || !count){
    return;
  }


  const id =
    profileId(index);


  const active =
    !!loveData[
      id + "_active"
    ];


  const number =
    getNumber(
      loveData,
      id,
      0
    );


  count.textContent =
    number;


  button.classList.toggle(
    "active",
    active
  );

}


function toggleLove(index,event){

  event.stopPropagation();


  const id =
    profileId(index);


  const active =
    !!loveData[
      id + "_active"
    ];


  if(active){

    loveData[
      id + "_active"
    ] = false;

    loveData[id] =
      Math.max(
        0,
        getNumber(
          loveData,
          id,
          0
        ) - 1
      );

  }else{

    loveData[
      id + "_active"
    ] = true;

    loveData[id] =
      getNumber(
        loveData,
        id,
        0
      ) + 1;


    showReaction(
      event,
      "💕"
    );

  }


  writeStorage(
    LOVE_KEY,
    loveData
  );


  updateLoveButton(
    index
  );

}

let offlinePeople =
  new Set();

const OFFLINE_TIME =
  5 * 60 * 1000;


function shuffle(array){

  const result =
    [...array];


  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


function chooseFiveOffline(){

  offlinePeople =
    new Set(
      shuffle(
        profiles.map(
          (_,i)=>i
        )
      ).slice(
        0,
        5
      )
    );


  updateStatuses();

}


function updateStatuses(){

  profiles.forEach(
    (_,index)=>{

      const badge =
        document.getElementById(
          "badge-" + index
        );

      const dot =
        document.getElementById(
          "dot-" + index
        );


      if(!badge || !dot){
        return;
      }


      if(
        offlinePeople.has(
          index
        )
      ){

        badge.textContent =
          "OFFLINE";

        badge.className =
          "offline-badge";

        dot.style.background =
          "#777";

        dot.style.animation =
          "none";

      }else{

        badge.textContent =
          "● LIVE";

        badge.className =
          "live-badge";

        dot.style.background =
          "#19e66b";

        dot.style.animation =
          "nameBlink 1s infinite";

      }

    }
  );

}

/* =========================

========================= */

function playFirstVisitorVideo(){

  redLiveVideoPage.classList.remove(
    "hidden"
  );


  redLiveVideo.src =
    VIDEO_URL;


  try{

    redLiveVideo.currentTime =
      0;

  }catch(error){}


  redLiveVideo.muted =
    false;

  redLiveVideo.volume =
    1;


  function startVideo(){

    try{

      redLiveVideo.currentTime =
        0;

    }catch(error){}


    redLiveVideo
      .play()
      .catch(
        ()=>{
          /*
            Some mobile browsers
            block autoplay with sound.
          */
        }
      );

  }


  if(
    redLiveVideo.readyState >= 1
  ){

    startVideo();

  }else{

    redLiveVideo.addEventListener(
      "loadedmetadata",
      startVideo,
      {once:true}
    );

  }


  /*
    40 seconds
  */

  setTimeout(
    ()=>{

      redLiveVideo.pause();


      redLiveVideo.removeAttribute(
        "src"
      );


      redLiveVideo.load();


      redLiveVideoPage.classList.add(
        "hidden"
      );


      showInsufficient();

    },
    FIRST_CALL_DURATION
  );

}

}
