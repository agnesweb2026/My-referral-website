<!-- INCOMING VIDEO CALL -->

<div id="incomingCall" style="
  position:fixed;
  inset:0;
  z-index:90000;
  display:flex;
  overflow:hidden;
  color:white;
  text-align:center;
  background:#17161b;
">

  <div style="
    position:absolute;
    inset:0;
    background:linear-gradient(
      135deg,
      #4b4545,
      #18171b
    );
    filter:blur(18px);
    transform:scale(1.1);
  "></div>

  <div style="
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  ">

    <div style="
      width:220px;
      height:220px;
      border-radius:50%;
      border:2px solid #7650c9;
      display:flex;
      align-items:center;
      justify-content:center;
    ">

      <div style="
        width:180px;
        height:180px;
        border-radius:50%;
        border:3px solid #7650c9;
        background:#29252d;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:70px;
      ">
        M
      </div>

    </div>

    <div style="
      margin-top:18px;
      font-size:42px;
    ">
      Maya
    </div>

    <div style="
      margin-top:8px;
      font-size:18px;
      color:#aaa;
      letter-spacing:1px;
    ">
      INCOMING VIDEO CALL
    </div>

    <div style="
      margin-top:25px;
      color:#b98cff;
      font-size:20px;
    ">
      <span style="color:#a66cff;">●</span>
      Ringing...
    </div>


    <!-- BUTTONS -->

    <div style="
      position:absolute;
      bottom:105px;
      left:0;
      right:0;
      display:flex;
      justify-content:center;
      gap:100px;
    ">


      <!-- RED -->

      <div>

        <button
          id="declineCall"
          type="button"
          style="
            width:105px;
            height:105px;
            border-radius:50%;
            border:4px solid rgba(255,255,255,.15);
            background:#ed3b3b;
            color:white;
            font-size:42px;
            cursor:pointer;
          "
        >
          ☎
        </button>

        <div style="
          margin-top:10px;
          font-size:18px;
          color:#ccc;
        ">
          Decline
        </div>

      </div>


      <!-- GREEN -->

      <div>

        <button
          id="answerCall"
          type="button"
          style="
            width:105px;
            height:105px;
            border-radius:50%;
            border:4px solid rgba(255,255,255,.15);
            background:#14a94b;
            color:white;
            font-size:42px;
            cursor:pointer;
          "
        >
          ☎
        </button>

        <div style="
          margin-top:10px;
          font-size:18px;
          color:#ccc;
        ">
          Answer
        </div>

      </div>

    </div>

    <div style="
      position:absolute;
      bottom:45px;
      color:rgba(255,255,255,.3);
      font-size:14px;
      letter-spacing:1px;
    ">
      SWIPE UP TO MESSAGE
    </div>

  </div>

</div>


<!-- SAMPLE VIDEO -->

<div id="videoPreview" style="
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:89999;
  display:none;
  align-items:center;
  justify-content:center;
">

  <video
    id="previewVideo"
    muted
    playsinline
    style="
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    "
  >

    <source
      src="/preview_20_seconds.mp4"
      type="video/mp4"
    >

  </video>

</div>


<!-- INSUFFICIENT MINUTES -->

<div id="insufficientMinutes" style="
  position:fixed;
  inset:0;
  z-index:89998;
  display:none;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
  text-align:center;
">

  <div>

    <div style="
      font-size:55px;
      margin-bottom:15px;
    ">
      ⏱️
    </div>

    <div style="
      font-size:30px;
      font-weight:bold;
    ">
      INSUFFICIENT MINUTES
    </div>

  </div>

</div>


<script>

const incomingCall =
  document.getElementById("incomingCall");

const answerCall =
  document.getElementById("answerCall");

const declineCall =
  document.getElementById("declineCall");

const videoPreview =
  document.getElementById("videoPreview");

const previewVideo =
  document.getElementById("previewVideo");

const insufficientMinutes =
  document.getElementById("insufficientMinutes");

const livePhotos =
  document.getElementById("livePhotos");


/* ==========================
   GREEN ANSWER
========================== */

answerCall.addEventListener("click", function() {

  /* Hide call */

  incomingCall.style.display = "none";


  /* Show video */

  videoPreview.style.display = "flex";


  /* Start sample ONLY after answer */

  previewVideo.currentTime = 0;

  previewVideo.play().catch(function(error) {

    console.log(
      "Video could not autoplay:",
      error
    );

  });

});


/* ==========================
   RED DECLINE
========================== */

declineCall.addEventListener("click", function() {

  incomingCall.style.display = "none";

  videoPreview.style.display = "none";

  insufficientMinutes.style.display = "none";

});


/* ==========================
   VIDEO ENDS
========================== */

previewVideo.addEventListener("ended", function() {

  /* Hide video */

  videoPreview.style.display = "none";


  /* Show insufficient minutes */

  insufficientMinutes.style.display = "flex";


  /* After 1 second show photos */

  setTimeout(function() {

    insufficientMinutes.style.display = "none";

    livePhotos.style.display = "grid";

  }, 1000);

});


/* ==========================
   PHOTO → PAYMENT
========================== */

document.querySelectorAll(".live-photo").forEach(function(photo) {

  photo.style.cursor = "pointer";

  photo.addEventListener("click", function() {

    window.location.href = "payment.html";

  });

});

</script>
