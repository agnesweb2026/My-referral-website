<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Referral Website</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =========================
   LIVE PHOTOS
========================= */

#photosPage{
  display:none;
  width:100%;
  min-height:100vh;
  background:#000;
}

.photos-top{
  position:sticky;
  top:0;
  z-index:20;
  width:100%;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#111;
  border-bottom:1px solid #222;
}

.photos-title{
  font-size:16px;
  font-weight:bold;
}

.online-box{
  font-size:13px;
  color:#fff;
}

.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:5px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 8px #00ff66;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}


#photosGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:3px;
}


.photo-card{
  position:relative;
  width:100%;
  aspect-ratio:0.72;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}


.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


.photo-dark{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.22);
}


.photo-live{
  position:absolute;
  top:8px;
  left:8px;
  display:flex;
  align-items:center;
  gap:4px;
  background:rgba(0,0,0,.65);
  padding:5px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
  z-index:5;
}


.photo-green-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 6px #00ff66;
  animation:greenBlink 1.2s infinite;
}


.photo-green-dot:nth-child(2){
  animation-delay:.2s;
}


.photo-green-dot:nth-child(3){
  animation-delay:.4s;
}


@keyframes greenBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}


.photo-video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  z-index:5;
}


.photo-name{
  position:absolute;
  bottom:8px;
  left:8px;
  z-index:5;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}


/* =========================
   BUSY
========================= */

.busy-label{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:10;

  background:rgba(0,0,0,.88);
  color:#fff;

  padding:10px 18px;
  border-radius:8px;

  font-size:18px;
  font-weight:bold;

  box-shadow:0 0 15px rgba(255,255,255,.25);
}


/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
  background:#000;
}


#callBackground{
  position:absolute;
  inset:-20px;
  background-position:center;
  background-size:cover;
  filter:blur(25px);
  transform:scale(1.1);
  opacity:.55;
}


.call-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
}


.call-content{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}


.incoming-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:25px;
}


.caller-photo{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 0 25px rgba(255,255,255,.3);
}


.caller-name{
  margin-top:16px;
  font-size:24px;
  font-weight:bold;
}


.ringing-text{
  margin-top:8px;
  font-size:14px;
  opacity:.8;
  animation:ringText 1s infinite;
}


@keyframes ringText{

  0%,100%{
    opacity:.35;
  }

  50%{
    opacity:1;
  }

}


.call-buttons{
  position:absolute;
  bottom:55px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:55px;
}


.call-button{
  width:70px;
  height:70px;
  border:none;
  border-radius:50%;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}


.decline-button{
  background:#f22;
  box-shadow:0 0 20px rgba(255,0,0,.5);
}


.answer-button{
  background:#19d45b;
  box-shadow:0 0 20px rgba(0,255,100,.5);
}


/* =========================
   FIRST LIVE VIDEO
========================= */

#liveSoundScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}


#liveSoundVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(3px) brightness(.65);
}


.live-top{
  position:absolute;
  top:18px;
  left:18px;
  z-index:5;
  background:red;
  padding:7px 11px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
  animation:liveBlink 1s infinite;
}


.live-red-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#fff;
}


@keyframes liveBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.55;
  }

}


/* =========================
   INSUFFICIENT
========================= */

#insufficientPage{
  display:none;
  position:fixed;
  inset:0;
  z-index:150;
  background:#000;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}


.insufficient-box{
  width:90%;
  max-width:350px;
  padding:25px 20px;
  border:1px solid #333;
  border-radius:12px;
  background:#111;
}


.insufficient-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:12px;
}


.insufficient-text{
  font-size:14px;
  color:#ccc;
}

</style>

</head>

<body>

<div id="photosPage">

  <div class="photos-top">

    <div class="photos-title">
      LIVE PHOTOS
    </div>

    <div class="online-box">

      <span class="live-dot"></span>

      <span id="onlineNumber">
        20 online
      </span>

    </div>

  </div>

  <div id="photosGrid"></div>

</div>


<div id="incomingCall">

  <div id="callBackground"></div>

  <div class="call-overlay"></div>

  <div class="call-content">

    <div class="incoming-title">
      INCOMING VIDEO CALL
    </div>

    <img
      id="callerPhoto"
      class="caller-photo"
      src=""
      alt="Caller"
    >

    <div
      id="callerName"
      class="caller-name">
    </div>

    <div class="ringing-text">
      Ringing...
    </div>

    <div class="call-buttons">

      <button
        id="declineButton"
        class="call-button decline-button">
        ✕
      </button>

      <button
        id="answerButton"
        class="call-button answer-button">
        ✓
      </button>

    </div>

  </div>

</div>


<div id="insufficientPage">

  <div class="insufficient-box">

    <div class="insufficient-title">
      Insufficient Minutes
    </div>

    <div class="insufficient-text">
      You don't have enough minutes
      to continue this video call.
    </div>

  </div>

</div>


<div id="liveSoundScreen">

  <video
    id="liveSoundVideo"
    playsinline
    preload="auto">

    <source
      src="preview_20_seconds.mp4"
      type="video/mp4">

  </video>

  <div class="live-top">

    <span class="live-red-dot"></span>

    LIVE

  </div>

</div>
<script>

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";


const FIRST_LIVE_DURATION =
  7000;


/*
  Next incoming call after
  20 seconds of Live Photos.
*/
const PHOTOS_DURATION =
  20000;


const PHOTOS_SOUND_DURATION =
  5000;


const INSUFFICIENT_DURATION =
  2000;


const BUSY_CHANGE_DURATION =
  5000;


const BUSY_MESSAGE_DURATION =
  3000;


const photosPage =
  document.getElementById(
    "photosPage"
  );


const photosGrid =
  document.getElementById(
    "photosGrid"
  );


const incomingCall =
  document.getElementById(
    "incomingCall"
  );


const callBackground =
  document.getElementById(
    "callBackground"
  );


const callerPhoto =
  document.getElementById(
    "callerPhoto"
  );


const callerName =
  document.getElementById(
    "callerName"
  );


const answerButton =
  document.getElementById(
    "answerButton"
  );


const declineButton =
  document.getElementById(
    "declineButton"
  );


const liveSoundScreen =
  document.getElementById(
    "liveSoundScreen"
  );


const liveSoundVideo =
  document.getElementById(
    "liveSoundVideo"
  );


const insufficientPage =
  document.getElementById(
    "insufficientPage"
  );


const onlineNumber =
  document.getElementById(
    "onlineNumber"
  );


let photos = [];

let currentCaller = null;

let photosTimer = null;

let photosSoundTimer = null;

let busyTimer = null;


/*
  RED LIVE + VIDEO + SOUND
  appears only once on this phone/browser.

  localStorage means:
  - reload does not reset it
  - closing browser does not reset it
  - reopening does not reset it
*/


let firstLiveCallAvailable =
  localStorage.getItem(
    "redLiveShown"
  ) !== "true";


const photoNames = [

  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Ashley",
  "Mary",
  "Cindy",
  "Mercy",
  "Linda",
  "Sharon",
  "Brenda",
  "Diana",
  "Faith",
  "Joy",
  "Lucy",
  "Angela",
  "Betty",
  "Nancy",
  "Winnie",
  "Ann",
  "Carol",
  "Irene",
  "Rose",
  "Fellow"

];


function hideAllPages(){

  photosPage.style.display =
    "none";

  incomingCall.style.display =
    "none";

  liveSoundScreen.style.display =
    "none";

  insufficientPage.style.display =
    "none";

}


function shuffleArray(array){

  const copy =
    [...array];


  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}
  async function loadPhotos(){

  try{

    const treeUrl =
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      "/git/trees/" +
      GITHUB_BRANCH +
      "?recursive=1";


    const response =
      await fetch(treeUrl);


    if(!response.ok){

      throw new Error(
        "GitHub request failed"
      );

    }


    const data =
      await response.json();


    const imageFiles =
      (data.tree || [])
      .filter(file => {

        if(
          file.type !== "blob"
        ){

          return false;

        }


        const name =
          file.path.toLowerCase();


        return (

          name.endsWith(".jpg") ||

          name.endsWith(".jpeg") ||

          name.endsWith(".png") ||

          name.endsWith(".webp")

        );

      });


    photos =
      imageFiles.map(
        (file,index) => ({

          url:
            "https://raw.githubusercontent.com/" +
            GITHUB_OWNER +
            "/" +
            GITHUB_REPO +
            "/" +
            GITHUB_BRANCH +
            "/" +
            file.path,


          name:
            photoNames[
              index %
              photoNames.length
            ]

        })
      );


    console.log(
      "Photos loaded:",
      photos.length
    );


  }catch(error){

    console.log(
      "Photo loading error:",
      error
    );


    photos = [];

  }

}


/*
  Create a new random BUSY selection.
*/
function createBusyIndexes(
  total
){

  const busyIndexes =
    new Set();


  if(total <= 0){

    return busyIndexes;

  }


  const busyCount =
    Math.min(
      total,
      Math.floor(
        Math.random() * 3
      ) + 2
    );


  while(
    busyIndexes.size <
    busyCount
  ){

    busyIndexes.add(

      Math.floor(
        Math.random() * total
      )

    );

  }


  return busyIndexes;

}


function renderPhotos(){

  clearTimeout(
    busyTimer
  );


  photosGrid.innerHTML =
    "";


  const shuffled =
    shuffleArray(
      photos
    );


  const busyIndexes =
    createBusyIndexes(
      shuffled.length
    );


  shuffled.forEach(
    (photo,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "photo-card";


      const isBusy =
        busyIndexes.has(
          index
        );


      card.innerHTML = `

        <img
          src="${photo.url}"
          alt="${photo.name}"
          loading="lazy"
        >

        <div class="photo-dark"></div>

        <div class="photo-live">

          <span
            class="photo-green-dot">
          </span>

          <span
            class="photo-green-dot">
          </span>

          <span
            class="photo-green-dot">
          </span>

          LIVE

        </div>

        <div class="photo-video">
          ▷
        </div>

        <div class="photo-name">
          ${photo.name}
        </div>

        ${
          isBusy
          ? `
            <div class="busy-label">
              BUSY
            </div>
          `
          : ""
        }

      `;


      card.addEventListener(
        "click",
        () => {

          if(isBusy){

            const nameElement =
              card.querySelector(
                ".photo-name"
              );


            nameElement.textContent =
              "BUSY";


            setTimeout(
              () => {

                nameElement.textContent =
                  photo.name;

              },
              BUSY_MESSAGE_DURATION
            );


            return;

          }


          window.location.href =
            "payment.html";

        }
      );


      photosGrid.appendChild(
        card
      );

    }
  );


  /*
    Every 5 seconds the BUSY
    photos are randomly changed.
  */

  busyTimer =
    setTimeout(
      () => {

        if(
          photosPage.style.display !==
          "none"
        ){

          renderPhotos();

        }

      },
      BUSY_CHANGE_DURATION
    );

  }
  function chooseCaller(){

  if(!photos.length){

    return null;

  }


  let available =
    photos;


  if(currentCaller){

    available =
      photos.filter(
        photo => {

          return (
            photo.url !==
            currentCaller.url
          );

        }
      );

  }


  if(!available.length){

    available =
      photos;

  }


  const caller =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  currentCaller =
    caller;


  return caller;

}


function startCallVibration(){

  if(
    "vibrate" in navigator
  ){

    navigator.vibrate([
      500,
      300,
      500,
      300
    ]);

  }

}


function stopCallVibration(){

  if(
    "vibrate" in navigator
  ){

    navigator.vibrate(0);

  }

}


function showIncomingCall(){

  clearTimeout(
    photosTimer
  );


  clearTimeout(
    photosSoundTimer
  );


  clearTimeout(
    busyTimer
  );


  stopCallVibration();


  if(!photos.length){

    setTimeout(
      showIncomingCall,
      1000
    );

    return;

  }


  const caller =
    chooseCaller();


  if(!caller){

    return;

  }


  callerPhoto.src =
    caller.url;


  callerName.textContent =
    caller.name;


  callBackground.style.backgroundImage =
    `url("${caller.url}")`;


  hideAllPages();


  incomingCall.style.display =
    "flex";


  startCallVibration();

}


function showLivePhotos(){

  clearTimeout(
    photosTimer
  );


  clearTimeout(
    photosSoundTimer
  );


  clearTimeout(
    busyTimer
  );


  stopCallVibration();


  hideAllPages();


  renderPhotos();


  photosPage.style.display =
    "block";


  updateOnlineNumber();


  playPhotosBackgroundSound();


  /*
    Next call after 20 seconds.
  */

  photosTimer =
    setTimeout(
      () => {

        showIncomingCall();

      },
      PHOTOS_DURATION
    );

}
  function playPhotosBackgroundSound(){

  liveSoundVideo.pause();


  liveSoundVideo.currentTime =
    0;


  liveSoundVideo.muted =
    false;


  liveSoundVideo.volume =
    1;


  liveSoundScreen.style.display =
    "none";


  liveSoundVideo.play().catch(
    error => {

      console.log(
        "Background sound blocked:",
        error
      );

    }
  );


  photosSoundTimer =
    setTimeout(
      () => {

        liveSoundVideo.pause();


        liveSoundVideo.currentTime =
          0;


        liveSoundVideo.muted =
          true;

      },
      PHOTOS_SOUND_DURATION
    );

}


async function playFirstLiveCall(){

  hideAllPages();


  liveSoundScreen.style.display =
    "flex";


  try{

    liveSoundVideo.pause();


    liveSoundVideo.currentTime =
      0;


    liveSoundVideo.muted =
      false;


    liveSoundVideo.volume =
      1;


    await liveSoundVideo.play();


  }catch(error){

    console.log(
      "LIVE sound blocked:",
      error
    );

  }


  await new Promise(
    resolve => {

      setTimeout(
        resolve,
        FIRST_LIVE_DURATION
      );

    }
  );


  liveSoundVideo.pause();


  liveSoundVideo.currentTime =
    0;


  liveSoundVideo.muted =
    true;


  liveSoundScreen.style.display =
    "none";

}


function showInsufficientMinutes(){

  hideAllPages();


  insufficientPage.style.display =
    "flex";


  setTimeout(
    () => {

      showLivePhotos();

    },
    INSUFFICIENT_DURATION
  );

}


answerButton.addEventListener(
  "click",
  async () => {

    stopCallVibration();


    /*
      The special RED LIVE call
      can happen only once.
    */

    if(
      firstLiveCallAvailable
    ){

      firstLiveCallAvailable =
        false;


      localStorage.setItem(
        "redLiveShown",
        "true"
      );


      await playFirstLiveCall();


      showInsufficientMinutes();


      return;

    }


    /*
      All later calls skip
      RED LIVE + sound.
    */

    showInsufficientMinutes();

  }
);
  declineButton.addEventListener(
  "click",
  () => {

    stopCallVibration();

    showLivePhotos();

  }
);


function updateOnlineNumber(){

  const numbers = [
    15,
    17,
    18,
    19,
    20,
    21,
    22
  ];


  const number =
    numbers[
      Math.floor(
        Math.random() *
        numbers.length
      )
    ];


  onlineNumber.textContent =
    number +
    " online";

}


async function startWebsite(){

  await loadPhotos();

  showIncomingCall();

}


startWebsite();


setInterval(
  updateOnlineNumber,
  5000
);


</script>

</body>
</html>
