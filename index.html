<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

.card {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}


/* =====================================================
   SAMPLE VIDEO PAGE
===================================================== */

#samplePage {
  width: 100%;
  min-height: calc(100vh - 30px);

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.sample-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.sample-subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 15px;
}

#sampleVideo {
  width: 100%;
  max-width: 450px;
  max-height: 70vh;

  display: block;

  background: #111;

  border-radius: 14px;

  object-fit: contain;
}

.sample-timer {
  margin-top: 12px;

  color: #aaa;

  font-size: 13px;
}


/* =====================================================
   INSUFFICIENT MINUTES
===================================================== */

#insufficientPage {
  display: none;

  width: 100%;
  min-height: calc(100vh - 30px);

  align-items: center;
  justify-content: center;

  text-align: center;
}

.insufficient-box {
  width: 100%;

  background: #111;

  border: 1px solid #292929;

  border-radius: 14px;

  padding: 30px 20px;
}

.insufficient-title {
  font-size: 25px;

  font-weight: bold;

  color: #ff5252;

  margin-bottom: 10px;
}

.insufficient-text {
  color: #aaa;

  font-size: 14px;

  line-height: 1.5;
}


/* =====================================================
   PHOTOS PAGE
===================================================== */

#photosPage {
  display: none;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {
  width: 100%;

  display: flex;

  justify-content: flex-start;

  align-items: center;

  margin-bottom: 15px;
}

.online-box {
  display: inline-flex;

  align-items: center;

  gap: 7px;

  background: #111;

  border: 1px solid #292929;

  color: #fff;

  padding: 7px 11px;

  border-radius: 8px;

  font-size: 13px;

  font-weight: bold;
}

.online-dot {
  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #22c55e;

  animation: onlineBlink 1.2s infinite;
}

@keyframes onlineBlink {

  50% {
    opacity: .35;
  }

}


/* =====================================================
   HEADER
===================================================== */

h1 {
  margin: 8px 0 5px;

  font-size: 25px;
}

.subtitle {
  color: #aaa;

  margin: 0 0 15px;

  font-size: 14px;
}


/* =====================================================
   GALLERY
===================================================== */

#livePhotos {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 14px;

  margin-top: 15px;
}

.live-photo {
  position: relative;

  overflow: hidden;

  border-radius: 12px;

  background: #111;

  cursor: pointer;

  min-height: 250px;

  padding-bottom: 45px;

  border: 1px solid #1e1e1e;

  -webkit-tap-highlight-color: transparent;
}

.live-photo:active {
  transform: scale(.98);
}

.live-photo img {
  display: block;

  width: 100%;

  height: 205px;

  object-fit: cover;

  background: #111;
}


/* =====================================================
   PHOTO NAME
===================================================== */

.photo-name {
  position: absolute;

  left: 0;

  right: 0;

  bottom: 0;

  min-height: 45px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 7px 5px;

  background: #111;

  color: #fff;

  font-size: 13px;

  font-weight: bold;

  line-height: 1.2;

  text-align: center;
}


/* =====================================================
   LIVE BADGE
===================================================== */

.live-badge {
  position: absolute;

  top: 7px;

  left: 7px;

  z-index: 5;

  background: #f0184c;

  color: #fff;

  padding: 6px 9px;

  border-radius: 7px;

  font-size: 11px;

  font-weight: bold;
}

.live-badge::before {
  content: "●";

  margin-right: 4px;
}


/* =====================================================
   LIVE STATUS
===================================================== */

.live-status {
  position: absolute;

  top: 7px;

  right: 7px;

  z-index: 5;

  display: flex;

  align-items: center;

  gap: 5px;

  background: rgba(0,0,0,.82);

  padding: 5px 7px;

  border-radius: 7px;

  font-size: 10px;

  white-space: nowrap;
}

.live-dot {
  width: 8px;

  height: 8px;

  flex-shrink: 0;

  border-radius: 50%;

  background: #22c55e;

  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {

  50% {
    opacity: .35;
  }

}


/* =====================================================
   LOADING
===================================================== */

.loading {
  grid-column: 1 / -1;

  padding: 45px 20px;

  color: #aaa;

  text-align: center;
}


/* =====================================================
   ERROR
===================================================== */

.error {
  grid-column: 1 / -1;

  padding: 35px 15px;

  color: #ff6b6b;

  text-align: center;

  line-height: 1.5;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 380px) {

  body {
    padding: 12px;
  }

  #livePhotos {
    gap: 10px;
  }

  .live-photo {
    min-height: 215px;
  }

  .live-photo img {
    height: 170px;
  }

  .photo-name {
    font-size: 12px;
  }

}

</style>
</head>


<body>


<div class="card">


  <!-- =================================================
       20 SECOND SAMPLE VIDEO
  ================================================== -->

  <div id="samplePage">

    <div class="sample-title">
      
    </div>

    <div class="sample-subtitle">
      join💦💦💦🫦
    </div>

    <video
      id="sampleVideo"
      muted
      playsinline
      preload="live video page"
    >

      <source
        src="preview_20_seconds.mp4"
        type="video/mp4"
      >

      Your browser does not support video.

    </video>

    <div
      class="sample-timer"
      id="sampleTimer"
    >
      Sample: 20 seconds
    </div>

  </div>


  <!-- =================================================
       INSUFFICIENT MINUTES PAGE
  ================================================== -->

  <div id="insufficientPage">

    <div class="insufficient-box">

      <div class="insufficient-title">
        Insufficient minutes
      </div>

      <div class="insufficient-text">
        buy more minutes! 
        <br>
        Opening live video call...
      </div>

    </div>

  </div>


  <!-- =================================================
       LIVE PHOTOS PAGE
  ================================================== -->

  <div id="photosPage">


    <!-- =================================================
         21 ONLINE
    ================================================== -->

    <div class="top-bar">

      <div class="online-box">

        <span class="online-dot"></span>

        <span>21 online</span>

      </div>

    </div>


    <!-- =================================================
         HEADER
    ================================================== -->

    <h1>
      Welcome
    </h1>

    <p class="subtitle">
      People live now
    </p>


    <!-- =================================================
         PHOTOS
    ================================================== -->

    <div id="livePhotos">

      <div class="loading">
        Loading live now...
      </div>

    </div>


  </div>


</div>


<script>


/* =====================================================
   GITHUB SETTINGS
===================================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";

const MAX_PHOTOS =
  24;


/* =====================================================
   PHOTO NAMES
===================================================== */

const PHOTO_NAMES = [

  "Cute 😍❤️",

  "Becky 💦❤️‍🔥",

  "Dorry 🔥✅",

  "Jenny 💦❤️‍🔥",

  "Caro 💦❤️‍🔥❤️",

  "Juck 💦❤️‍🔥",

  "Bella 🥀👄",

  "Faith 🌟",

  "Chepto 😜🔥",

  "Shelley",

  "Phapy 🥰😍",

  "Chris 💖💘",

  "Juphio 😴💦💦",

  "Judy 💖",

  "Kandy 💦😴",

  "Jennifer ❤️‍🔥🔥",

  "Pento 🥀👄",

  "Shallow ❤️‍🔥🔥🥀",

  "Grees 🌟",

  "Betty 🔥❤️‍🔥",

  "Maria 🌟🥀💦",

  "Kitty 💦❤️",

  "Sweetgy 😍🥰",

  "Fellow 💦❤️"

];


/* =====================================================
   ELEMENTS
===================================================== */

const samplePage =
  document.getElementById(
    "samplePage"
  );

const insufficientPage =
  document.getElementById(
    "insufficientPage"
  );

const photosPage =
  document.getElementById(
    "photosPage"
  );

const sampleVideo =
  document.getElementById(
    "sampleVideo"
  );

const sampleTimer =
  document.getElementById(
    "sampleTimer"
  );

const livePhotos =
  document.getElementById(
    "livePhotos"
  );


/* =====================================================
   SAMPLE CONTROL
===================================================== */

let sampleFinished =
  false;

let secondsLeft =
  20;


/* =====================================================
   START 20 SECOND SAMPLE
===================================================== */

function startSample() {

  secondsLeft = 20;

  sampleTimer.textContent =
    "Sample: 20 seconds";


  try {

    sampleVideo.currentTime = 0;

  } catch (e) {}


  sampleVideo.muted = true;


  const playPromise =
    sampleVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      function() {

        sampleVideo.muted = true;

        sampleVideo.play()
          .catch(function() {});

      }
    );

  }


  const timer =
    setInterval(
      function() {

        secondsLeft--;


        if (
          secondsLeft > 0
        ) {

          sampleTimer.textContent =
            "Sample: " +
            secondsLeft +
            " seconds";

        }


        if (
          secondsLeft <= 0
        ) {

          clearInterval(timer);

          finishSample();

        }

      },
      1000
    );

}


/* =====================================================
   FINISH SAMPLE
===================================================== */

function finishSample() {

  if (sampleFinished) {
    return;
  }

  sampleFinished = true;


  sampleVideo.pause();


  samplePage.style.display =
    "none";


  insufficientPage.style.display =
    "flex";


  /*
    Show "Insufficient minutes"
    for 2 seconds, then open
    the photos page.
  */

  setTimeout(
    function() {

      insufficientPage.style.display =
        "none";

      photosPage.style.display =
        "block";

      loadPhotos();

    },
    2000
  );

}


/* =====================================================
   VIDEO END EVENT
===================================================== */

sampleVideo.addEventListener(
  "ended",
  function() {

    finishSample();

  }
);


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array) {

  const shuffled =
    [...array];


  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      shuffled[i],
      shuffled[j]
    ] = [
      shuffled[j],
      shuffled[i]
    ];

  }


  return shuffled;

}


/* =====================================================
   LOAD PHOTOS
===================================================== */

async function loadPhotos() {

  livePhotos.innerHTML = `

    <div class="loading">
      Loading photos...
    </div>

  `;


  const apiUrl =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/?ref=" +
    GITHUB_BRANCH;


  try {

    const response =
      await fetch(
        apiUrl,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub HTTP " +
        response.status
      );

    }


    const files =
      await response.json();


    if (!Array.isArray(files)) {

      throw new Error(
        "GitHub did not return a file list."
      );

    }


    /* ================================================
       FIND IMAGES
    ================================================ */

    const imageFiles =
      files.filter(
        function(file) {

          return (
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
              .test(file.name)
          );

        }
      );


    if (
      imageFiles.length === 0
    ) {

      livePhotos.innerHTML = `

        <div class="error">

          No photos found.

          <br><br>

          Put your image files in the
          main folder of your GitHub repository.

        </div>

      `;

      return;

    }


    /* ================================================
       FIRST 24 PHOTOS
    ================================================ */

    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    /* ================================================
       CREATE PHOTO OBJECTS
    ================================================ */

    const photos =
      selectedFiles.map(
        function(file, index) {

          return {

            name:
              PHOTO_NAMES[index] ||
              "Photo",

            photo:
              file.download_url

          };

        }
      );


    /* ================================================
       SHUFFLE
    ================================================ */

    const shuffledPhotos =
      shuffleArray(
        photos
      );


    /* ================================================
       DISPLAY
    ================================================ */

    createGallery(
      shuffledPhotos
    );


  } catch (error) {

    console.error(
      "PHOTO ERROR:",
      error
    );


    livePhotos.innerHTML = `

      <div class="error">

        Unable to load photos.

        <br><br>

        ${error.message}

        <br><br>

        Check that the repository is public
        and the images are in the main folder.

      </div>

    `;

  }

}


/* =====================================================
   CREATE GALLERY
===================================================== */

function createGallery(
  photos
) {

  livePhotos.innerHTML = "";


  photos.forEach(
    function(person) {


      /* ==============================================
         PHOTO BOX
      ============================================== */

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "live-photo";


      /* ==============================================
         LIVE BADGE
      ============================================== */

      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "live-badge";

      badge.textContent =
        "LIVE";


      /* ==============================================
         LIVE STATUS
      ============================================== */

      const status =
        document.createElement(
          "span"
        );

      status.className =
        "live-status";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "live-dot";


      status.appendChild(
        dot
      );


      status.appendChild(
        document.createTextNode(
          "Live"
        )
      );


      /* ==============================================
         IMAGE
      ============================================== */

      const image =
        document.createElement(
          "img"
        );

      image.src =
        person.photo;

      image.alt =
        person.name;

      image.loading =
        "lazy";


      /* ==============================================
         IMAGE ERROR
      ============================================== */

      image.onerror =
        function() {

          image.style.display =
            "none";

          box.style.background =
            "#171717";

        };


      /* ==============================================
         NAME
      ============================================== */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "photo-name";

      name.textContent =
        person.name;


      /* ==============================================
         BUILD PHOTO
      ============================================== */

      box.appendChild(
        badge
      );

      box.appendChild(
        status
      );

      box.appendChild(
        image
      );

      box.appendChild(
        name
      );


      /* ==============================================
         PHOTO CLICK
      ============================================== */

      box.addEventListener(
        "click",
        function() {

          window.location.href =
            "payment.html";

        }
      );


      livePhotos.appendChild(
        box
      );

    }
  );

}


/* =====================================================
   START WEBSITE
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    startSample();

  }
);


</script>

</body>
</html>
