   PHOTO GRID
========================= */

.photosGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  padding:5px;
}

.photoCard{
  position:relative;
  width:100%;
  aspect-ratio:0.78;
  overflow:hidden;
  background:#111;
  border-radius:5px;
  cursor:pointer;
}

.photoCard img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   CENTER VIDEO PLAY SIGN
========================= */

.videoPlayIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:22px;
  line-height:1;

  z-index:8;
  pointer-events:none;

  animation:videoPulse 1.5s infinite;
}

@keyframes videoPulse{
  0%{
    transform:translate(-50%,-50%) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.12);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}

   LIVE LABEL
========================= */

  left:7px;

/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

  const copy = [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i],copy[j]] =
      [copy[j],copy[i]];

  }

  return copy;
}

  return shuffleArray(indexes).slice(0,5);

/* =========================
   GITHUB CONTENTS
========================= */

async function getGitHubContents(path = ""){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/${GITHUB_REPO}/contents/` +
    `${path}?ref=${GITHUB_BRANCH}`;

  const response =
    await fetch(url);

  if(!response.ok){
    throw new Error(
      "GitHub request failed"
    );
  }

  return await response.json();

}


/* =========================
   COLLECT IMAGES
========================= */

async function collectImages(
  path = "",
  result = []
){

  try{

    const items =
      await getGitHubContents(path);

    for(const item of items){

      if(item.type === "dir"){

        await collectImages(
          item.path,
          result
        );

      }else if(
        item.type === "file" &&
        isImageFile(item.name)
      ){

        result.push({
          name:item.name,
          path:item.path,
          url:getFileUrl(item.path)
        });

      }

    }

  }catch(error){

    console.error(
      "Image collection error:",
      error
    );

  }

  return result;

}


/* =========================
   FILE URL
========================= */

function getFileUrl(path){

  return (
    `https://raw.githubusercontent.com/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `${GITHUB_BRANCH}/` +
    path
  );

}


/* =========================
   IMAGE FILE CHECK
========================= */

function isImageFile(name){

  return /\.(jpg|jpeg|png|gif|webp)$/i
    .test(name);

    }

  const images =
    await collectImages();

  const selected =

  photos =
    selected.map((photo,index)=>{

      const country =

      return {

        age:
          ages[index] ||
          25,

        country:
          country.country,

        flag:
          country.flag,

        originalIndex:index

      };

    });

}

      const img =

      if(isBusy){

        liveLabel.innerHTML =
          `<span class="liveSmallDot"></span> LIVE`;

        card.appendChild(

function startBusyRoomRotation(){

  if(busyTimer){
    clearInterval(busyTimer);
  }

  busyTimer =
    setInterval(
      ()=>{

        if(
          photosPage.style.display !==
          "none"
        ){

          renderPhotos();

        }

      },
      BUSY_CHANGE_DURATION
    );

        }
    /* =========================
   LIVE PHOTOS SOUND
========================= */

function playLivePhotosSound(){

  stopBackgroundSound();

  if(!backgroundSound){
    return;
  }

  try{

    backgroundSound.currentTime = 0;

    backgroundSound.volume = 0.45;

    const playPromise =
      backgroundSound.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  backgroundSoundTimer =
    setTimeout(
      ()=>{

        try{
          backgroundSound.pause();
          backgroundSound.currentTime = 0;
        }catch(e){}

      },
      BACKGROUND_SOUND_DURATION
    );

}


/* =========================
   INCOMING CALL TIMER
========================= */

function scheduleIncomingCall(){

  if(photosTimer){
    clearTimeout(photosTimer);
  }

  photosTimer =
    setTimeout(
      ()=>{

        showIncomingCall();

      },
      PHOTOS_DURATION
    );

}


/* =========================
   SHOW LIVE PHOTOS
========================= */

function showLivePhotos(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  photosPage.style.display =
    "block";


  updateOnlineNumber();

  renderPhotos();

  playLivePhotosSound();

  startBusyRoomRotation();

  scheduleIncomingCall();

}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  incomingCall.style.display =
    "flex";


  if(photos.length === 0){
    return;
  }


  const caller =
    photos[
      Math.floor(
        Math.random() * photos.length
      )
    ];


  callerPhoto.src =
    caller.url;

  callerName.textContent =
    caller.name;

  callerMeta.textContent =
    `${caller.flag} ${caller.age} yrs`;

}


/* =========================
   FIRST RED LIVE VIDEO
========================= */

function showLiveSound(){

  clearAllTimers();

  stopBackgroundSound();

  hideAllPages();

  liveSoundPage.style.display =
    "block";


  try{

    liveSoundVideo.currentTime = 0;

    liveSoundVideo.muted = false;

    liveSoundVideo.volume = 1;

    const playPromise =
      liveSoundVideo.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  /* Safety timeout */

  photosTimer =
    setTimeout(
      ()=>{

        showInsufficient(false);

      },
      PHOTOS_DURATION
    );

}


/* =========================
   RED VIDEO ENDED
========================= */

liveSoundVideo.addEventListener(
  "ended",
  ()=>{

    showInsufficient(false);

  }
);
    /* =========================
   SECOND CALL BLACK SCREEN
========================= */

function showBlackLive(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  blackLivePage.style.display =
    "flex";


  /* Use same video file for sound */

  try{

    backgroundSound.currentTime = 0;

    backgroundSound.volume = 1;

    const playPromise =
      backgroundSound.play();

    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        ()=>{}
      );

    }

  }catch(e){}


  backgroundSoundTimer =
    setTimeout(
      ()=>{

        stopBackgroundSound();

        showInsufficient(true);

      },
      SECOND_CALL_SOUND_DURATION
    );

}


/* =========================
   INSUFFICIENT
========================= */

function showInsufficient(
  openPayment = false
){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  insufficientPage.style.display =
    "flex";


  photosTimer =
    setTimeout(
      ()=>{

        if(openPayment){

          /*
           * IMPORTANT:
           * Save return state first.
           * replace() prevents the
           * insufficient page from
           * remaining in history.
           */

          sessionStorage.setItem(
            "returnToLivePhotos",
            "yes"
          );


          window.location.replace(
            PAYMENT_PAGE_URL
          );


        }else{

          showLivePhotos();

        }

      },
      INSUFFICIENT_DURATION
    );

}


/* =========================
   ANSWER CALL
========================= */

function answerIncomingCall(){

  clearAllTimers();

  stopBackgroundSound();

  /*
   * First answered call:
   * show red LIVE video once.
   */

  if(!redLiveShownThisVisit){

    redLiveShownThisVisit =
      true;

    showLiveSound();

  }else{

    /*
     * Second and later calls:
     * black LIVE page
     */

    showBlackLive();

  }

}


/* =========================
   DECLINE CALL
========================= */

function declineIncomingCall(){

  showLivePhotos();

}


/* =========================
   BUTTONS
========================= */

answerButton.addEventListener(
  "click",
  answerIncomingCall
);

declineButton.addEventListener(
  "click",
  declineIncomingCall
);


/* =========================
   TOUCH / CLICK
   FOR SOUND
========================= */

document.addEventListener(
  "click",
  ()=>{

    /*
     * If Live Photos are visible,
     * retry the 5-second sound.
     */

    if(
      photosPage.style.display !==
      "none"
    ){

      if(
        backgroundSound.paused
      ){

        playLivePhotosSound();

      }

    }

  },
  {passive:true}
);


/* =========================
   PAYMENT RETURN
========================= */

function checkPaymentReturn(){

  const returning =
    sessionStorage.getItem(
      "returnToLivePhotos"
    );


  if(returning === "yes"){

    sessionStorage.removeItem(
      "returnToLivePhotos"
    );


    /*
     * Red LIVE has already
     * been used during this visit.
     */

    redLiveShownThisVisit =
      true;


    setTimeout(
      ()=>{

        showLivePhotos();

      },
      100
    );


    return true;

  }


  return false;

}


/* =========================
   START WEBSITE
========================= */

function startWebsite(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();


  /*
   * If returning from payment,
   * skip WELCOME.
   */

  if(checkPaymentReturn()){

    return;

  }


  hideAllPages();

  welcomeScreen.style.display =
    "flex";


  const startedAt =
    Date.now();


  loadPhotos()
    .finally(
      ()=>{

        const elapsed =
          Date.now() -
          startedAt;


        const remaining =
          Math.max(
            0,
            3000 - elapsed
          );


        setTimeout(
          ()=>{

            welcomeScreen.style.display =
              "none";

            showLivePhotos();

          },
          remaining
        );

      }
    );

}
    /* =========================
   PERIODIC ONLINE UPDATE
========================= */

setInterval(
  ()=>{

    if(
      photosPage.style.display !==
      "none"
    ){

      updateOnlineNumber();

    }

  },
  10000
);


/* =========================
   PREPARE VIDEO
========================= */

function prepareVideo(){

  try{

    liveSoundVideo.preload =
      "auto";

    liveSoundVideo.load();

  }catch(e){}

}


/* =========================
   PREPARE AUDIO
========================= */

function prepareAudio(){

  try{

    backgroundSound.preload =
      "auto";

    backgroundSound.load();

  }catch(e){}

}


/* =========================
   PAGE VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopBackgroundSound();

    }else{

      if(
        photosPage.style.display !==
        "none"
      ){

        playLivePhotosSound();

      }

    }

  }
);


/* =========================
   BROWSER BACK / PAGESHOW
========================= */

window.addEventListener(
  "pageshow",
  ()=>{
    
    /*
     * Do not restart WELCOME here.
     * startWebsite() handles the
     * payment return state.
     */

    stopBackgroundSound();
    stopLiveVideo();

  }
);


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  ()=>{

    prepareVideo();
    prepareAudio();

    startWebsite();

  }
);

</script>

</body>
</html>
