  width:100%;

========================= */

.welcome-box p{
  color:#aaa;
  font-size:15px;
}


/* =========================
   PHOTOS PAGE
========================= */

  min-height:100vh;
  background:#000;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#080808;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:13px;
  color:#fff;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#19e66b;
  margin-right:5px;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}


/* =========================
   PHOTO GRID
========================= */

#photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:4px;
}

.photoCard{
  position:relative;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.78;
  overflow:hidden;
  background:#151515;
}

.profile-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================
   LIVE BADGE
========================= */

.live-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#e00000;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}


/* =========================
   OFFLINE BADGE
========================= */

.offline-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;

  background:#555;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}


/* =========================
   VIDEO ICON
========================= */

.photo-play{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:45px;
  height:45px;

  border-radius:50%;

  background:rgba(0,0,0,.72);

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:6;

  animation:videoZoom 1.4s ease-in-out infinite;
}

.photo-play::after{
  content:"▶";

  color:#fff;

  font-size:19px;

  margin-left:3px;
}

@keyframes videoZoom{

  0%{
    transform:translate(-50%,-50%) scale(.82);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.16);
  }

  100%{
    transform:translate(-50%,-50%) scale(.82);
  }

}


/* =========================
   PHOTO INFO
========================= */

.photo-info{
  padding:7px 7px 9px;
  background:#101010;
}

.photo-name{
  display:flex;
  align-items:center;

  gap:5px;

  font-size:13px;
  font-weight:bold;

.name-dot{

  flex:none;

@keyframes nameBlink{

  0%,100%{
    opacity:1;

  }

  50%{
    opacity:.2;
    transform:scale(.75);
  }

.photo-meta{

  color:#aaa;

.call-label{

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  const copy =
    [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}

    redLiveVideo.readyState >= 1
  ){

    startVideo();

  }

  else{

      "loadedmetadata",
      startVideo,
      {once:true}
    );

  }

    Black screen.
    No sound.
    No video.
    2 seconds.
  */

  setTimeout(
    ()=>{

      blackLivePage.classList.add(
        "hidden"
      );


      showInsufficient();

    },
    2000
  );

}


/* =====================================================
   INSUFFICIENT MINUTES
===================================================== */

function showInsufficient(){

  insufficientPage.classList.remove(
    "hidden"
  );


  let seconds =
    2;


  insufficientTimer.textContent =
    "Continuing...";


  const timer =
    setInterval(
      ()=>{

        seconds--;


        if(seconds <= 0){

          clearInterval(timer);


          insufficientPage.classList.add(
            "hidden"
          );


          callActive =
            false;


          showPhotos();

        }

      },
      1000
    );

}


/* =====================================================
   CLEAN VIDEO WHEN LEAVING
===================================================== */

window.addEventListener(
  "pagehide",
  ()=>{

    try{
      redLiveVideo.pause();
    }
    catch(e){}

    try{
      blackLiveSoundVideo.pause();
    }
    catch(e){}

  }
);

</script>
