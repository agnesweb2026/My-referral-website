@keyframes blinkDot{

     function hideAllPages(){

function shuffleArray(array){
  const result = [...array];

  for(let i = result.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
      [result[j], result[i]];
  }

  return result;
}

function getRandomBusyIndexes(){
  const indexes = [];

  while(indexes.length < 5){
    const randomIndex =
      Math.floor(Math.random() * photos.length);

    if(!indexes.includes(randomIndex)){
      indexes.push(randomIndex);
    }
  }

  return indexes;
}

function getFileUrl(path){
  return "https://raw.githubusercontent.com/" +
    GITHUB_OWNER + "/" +
    GITHUB_REPO + "/" +
    GITHUB_BRANCH + "/" +
    path;
}

function isImageFile(name){
  const lower = name.toLowerCase();

  return (
    lower.endsWith(".jpg") ||
    lower.endsWith(".jpeg") ||
    lower.endsWith(".png") ||
    lower.endsWith(".webp") ||
    lower.endsWith(".gif")
  );
}

async function getGitHubContents(path = ""){
  const url =
    "https://api.github.com/repos/" +
    GITHUB_OWNER + "/" +
    GITHUB_REPO +
    "/contents/" +
    path +
    "?ref=" +
    GITHUB_BRANCH;

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("GitHub request failed");
  }

  return await response.json();
}

async function collectImages(path = "", result = []){
  if(result.length >= MAX_PHOTOS){
    return result;
  }

  const contents = await getGitHubContents(path);

  for(const item of contents){
    if(result.length >= MAX_PHOTOS){
      break;
    }

    if(item.type === "file" && isImageFile(item.name)){
      result.push({
        name: item.name,
        path: item.path,
        url: getFileUrl(item.path)
      });
    }

    if(item.type === "dir"){
      await collectImages(item.path, result);
    }
  }

  return result;
  }
      async function loadPhotos(){
  try{
    const images = await collectImages("");

    photos = images.slice(0, MAX_PHOTOS);

    photos = photos.map((photo, index) => ({
      ...photo,
      personName: names[index] || "Live",
      age: ages[index] || 25,
      country: countries[index] || {
        name: "Kenya",
        flag: "🇰🇪"
      }
    }));

  }catch(error){
    console.log("Photo loading error:", error);

    photos = [];
  }
}

function renderPhotos(){
  photosGrid.innerHTML = "";

  if(photos.length === 0){
    photosGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px 15px;
        color:#aaa;
      ">
        Loading live rooms...
      </div>
    `;

    return;
  }

  busyIndexes = getRandomBusyIndexes();

  const shuffledPhotos = shuffleArray(photos);

  shuffledPhotos.forEach((photo, index) => {
    const originalIndex = photos.indexOf(photo);

    const isBusy =
      busyIndexes.includes(originalIndex);

    const card = document.createElement("div");

    card.className = "photoCard";

    if(isBusy){
      card.innerHTML = `
        <img
          src="${photo.url}"
          alt="${photo.personName}"
        >

        <div class="offlineBadge">
          OFFLINE
        </div>

        <div class="closedOverlay">
          <div class="closedText">
            ROOM CLOSED
          </div>
        </div>

        <div class="photoInfo">
          <div class="photoName">
            ${photo.personName}
          </div>

          <div class="photoCountry">
            ${photo.country.flag} ${photo.age} yrs
          </div>
        </div>
      `;
    }else{
      card.innerHTML = `
        <img
          src="${photo.url}"
          alt="${photo.personName}"
        >

        <div class="liveBadge">
          LIVE
        </div>

        <div class="photoInfo">
          <div class="photoName">
            ${photo.personName}
          </div>

          <div class="photoCountry">
            ${photo.country.flag} ${photo.age} yrs
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        window.location.href = PAYMENT_PAGE_URL;
      });
    }

    photosGrid.appendChild(card);
  });
}

    liveSoundVideo.volume = 1;

    }
  }catch(error){}

  liveSoundVideo._safetyTimer =
    setTimeout(() => {
      if(liveSoundPage.style.display !== "none"){
        showInsufficient(false);
      }
    }, 20000);

    }else{

    }

  }, INSUFFICIENT_DURATION);

function answerIncomingCall(){

  if(!redLiveShownThisVisit){

    redLiveShownThisVisit = true;

    showLiveSound();

  }else{

        photosPage.style.display === "block"

        playLivePhotosSound();
      }

    }
  }
);

function startWebsite(){

  clearAllTimers();

  stopBackgroundSound();
  stopLiveVideo();

  hideAllPages();

  welcomeScreen.style.display = "flex";

  const startedAt = Date.now();

  loadPhotos().finally(() => {

    const elapsed =
      Date.now() - startedAt;

    const remaining =
      Math.max(
        0,
        3000 - elapsed
      );

    setTimeout(() => {

      welcomeScreen.style.display =
        "none";

      showLivePhotos();

    }, remaining);

  });
}
   setInterval(() => {

  if(
    photosPage.style.display === "block"
  ){
    updateOnlineNumber();
  }

}, 10000);

function protectSecondCallFlow(){

  /*
    The first answered call uses
    the real red LIVE video.

    The second answered call uses
    the black LIVE screen.

    After the second call's
    Insufficient Minutes screen,
    payment.html opens.
  */

  answerButton.onclick = null;
  declineButton.onclick = null;

  answerButton.addEventListener(
    "click",
    () => {
      answerIncomingCall();
    }
  );

  declineButton.addEventListener(
    "click",
    () => {
      declineIncomingCall();
    }
  );
}

function prepareVideo(){

  try{
    liveSoundVideo.preload = "auto";
    liveSoundVideo.playsInline = true;
  }catch(error){}
}

function prepareAudio(){

  try{
    backgroundSound.preload = "auto";
  }catch(error){}
}

prepareVideo();
prepareAudio();

protectSecondCallFlow();

window.addEventListener(
  "load",
  () => {
    startWebsite();
  }
);   
      </script>
