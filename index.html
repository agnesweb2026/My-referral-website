@keyframes welcomeLoad{

/* LIVE VIDEO PAGE */

.topbar{

.brand{

}

.online-count{

.live-status{

.live-dot{

@keyframes blinkDot{

.photos-grid{

.profile-image{

  height:100%;

.offline-label{

.profile-info{

@keyframes chatIn{

  /* =========================

function showOnly(section){

  videoPage.classList.add("hidden");

/* =========================
   PAYMENT
========================= */

function getPaymentUrl(profile){

  const params =
    new URLSearchParams();

  params.set(
    "profile",
    profile.name
  );

  params.set(
    "age",
    profile.age
  );

  params.set(
    "country",
    profile.country
  );

  const ref =
    new URLSearchParams(
      window.location.search
    ).get("ref");

  if(ref){
    params.set("ref",ref);
  }

  return PAYMENT_PAGE +
    "?" +
    params.toString();
}


function openPayment(profile){

  window.location.href =
    getPaymentUrl(profile);

}


/* =========================
   OFFLINE PROFILES
========================= */

function chooseOffline(){

  const indexes = [];

  const amount =
    Math.min(3,profiles.length);

  while(indexes.length < amount){

    const randomIndex =
      Math.floor(
        Math.random() * profiles.length
      );

    if(!indexes.includes(randomIndex)){
      indexes.push(randomIndex);
    }
  }

  return indexes;
}


let offlineIndexes =
  chooseOffline();


/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

  const shuffled = [...array];

  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i+1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];
  }

  return shuffled;
}


/* =========================
   PHOTO CHAT
========================= */

function startPhotoChat(
  profile,
  originalIndex
){

  const chatBox =
    document.getElementById(
      "photoChat-" + originalIndex
    );

  if(!chatBox){
    return;
  }

  let messageIndex =
    Math.floor(
      Math.random() *
      profile.messages.length
    );

  let intervalTimer = null;

  function showNextMessage(){

    if(!chatBox.isConnected){

      if(intervalTimer){
        clearInterval(intervalTimer);
        intervalTimer = null;
      }

      return;
    }

    chatBox.innerHTML = "";

    const message =
      document.createElement("div");

    message.className =
      "photo-chat-message";

    message.textContent =
      profile.messages[
        messageIndex %
        profile.messages.length
      ];

    chatBox.appendChild(message);

    messageIndex++;
  }

  const firstDelay =
    500 +
    Math.floor(
      Math.random() * 5000
    );

  setTimeout(()=>{

    if(!chatBox.isConnected){
      return;
    }

    showNextMessage();

    const nextDelay =
      3500 +
      Math.floor(
        Math.random() * 5000
      );

    intervalTimer =
      setInterval(
        showNextMessage,
        nextDelay
      );

  },firstDelay);
      }
  /* =========================

  const shuffledProfiles =
    shuffleArray(profiles);

  shuffledProfiles.forEach(profile=>{

        <button class="social-btn follow-btn">
          + Follow
        </button>

        <button class="social-btn chat-btn">
          💬 Chat

    `;

/* =========================

========================= */

function startOfflineRotation(){

  if(photoOfflineTimer){

    clearInterval(
      photoOfflineTimer
    );
  }

  photoOfflineTimer =
    setInterval(()=>{

      offlineIndexes =
        chooseOffline();

      renderPhotos();

    },5 * 60 * 1000);
}
  /* =========================
   RETURNING VISITOR CALL
========================= */

function openIncomingCall(){

  const available =
    profiles.filter(
      (profile,index)=>
        !offlineIndexes.includes(index)
    );

  if(!available.length){
    return;
  }

  currentCallProfile =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];

  callAvatar.src =
    currentCallProfile.image;

  callName.textContent =
    currentCallProfile.name +
    " is calling you";

  showOnly(incomingCall);

  if(callTimer){
    clearTimeout(callTimer);
  }

  /*
    Call screen stays for 15 seconds.
    If visitor does not answer or reject,
    it returns to Live Videos.
  */

  callTimer =
    setTimeout(()=>{

      if(
        !incomingCall.classList.contains(
          "hidden"
        )
      ){

        showOnly(photosPage);

      }

    },15000);
}


/* =========================
   RETURNING VISITOR
   ANSWER
========================= */

function answerIncomingCall(){

  if(callTimer){

    clearTimeout(callTimer);

    callTimer = null;
  }

  /*
    IMPORTANT:
    Returning visitor does NOT play
    the video again.

    Answer ->
    2 seconds Connecting ->
    Insufficient Minutes ->
    Live Videos
  */

  showOnly(returnLoading);

  if(returnLoadingTimer){

    clearTimeout(
      returnLoadingTimer
    );
  }

  returnLoadingTimer =
    setTimeout(()=>{

      showOnly(insufficientPage);

      if(insufficientTimer){

        clearTimeout(
          insufficientTimer
        );
      }

      insufficientTimer =
        setTimeout(()=>{

          showOnly(photosPage);

        },2000);

    },2000);
}


/* =========================
   FIRST VISITOR VIDEO
========================= */

function startLiveVideo(profile){

  /*
    If no profile was supplied,
    choose an available profile.
  */

  if(!profile){

    const available =
      profiles.filter(
        (item,index)=>
          !offlineIndexes.includes(index)
      );

    if(available.length){

      profile =
        available[
          Math.floor(
            Math.random() *
            available.length
          )
        ];

    }else{

      profile = profiles[0];

    }
  }


  /*
    Mark visitor immediately.

    This means:
    first visit = automatic video.

    After this:
    reload/returning visit =
    incoming call.
  */

  localStorage.setItem(
    FIRST_VIDEO_KEY,
    "1"
  );


  currentCallProfile =
    profile;


  videoName.textContent =
    currentCallProfile.name +
    " • LIVE";


  liveVideo.src =
    VIDEO_FILE;


  videoChat.innerHTML = "";


  showOnly(videoPage);


  startVideoChat();


  /*
    Mobile browsers may block autoplay
    with sound. We try normal playback
    first.
  */

  liveVideo.muted = false;
  liveVideo.volume = 1;


  const playPromise =
    liveVideo.play();

  if(playPromise){

    playPromise.catch(error=>{

      console.log(
        "Video play error:",
        error
      );

      /*
        If browser blocks sound autoplay,
        retry muted so the video can still
        start automatically.
      */

      liveVideo.muted = true;

      liveVideo.play().catch(
        retryError=>{
          console.log(
            "Muted video play error:",
            retryError
          );
        }
      );

    });

  }


  if(videoTimer){

    clearTimeout(videoTimer);
  }


  videoTimer =
    setTimeout(
      ()=>{
        finishLiveVideo();
      },
      40000
    );
        }
  /* =========================
   VIDEO CHAT
========================= */

function startVideoChat(){

  const messages = [

    "Hi ❤️",

    "Can you see me?",

    "I am happy you are here 😊",

    "Let's talk ❤️",

    "You are cute 😘"

  ];


  messages.forEach(
    (message,index)=>{

      const delay =
        1800 +
        index * 5500 +
        Math.floor(
          Math.random() * 1800
        );


      setTimeout(()=>{

        if(
          videoPage.classList.contains(
            "hidden"
          )
        ){
          return;
        }


        const item =
          document.createElement("div");


        item.className =
          "video-chat-msg";


        item.textContent =
          message;


        videoChat.appendChild(item);


        while(
          videoChat.children.length > 3
        ){

          videoChat.removeChild(
            videoChat.firstChild
          );

        }

      },delay);

    }
  );
}


/* =========================
   FINISH FIRST VIDEO
========================= */

function finishLiveVideo(){

  if(videoTimer){

    clearTimeout(videoTimer);

    videoTimer = null;
  }


  liveVideo.pause();

  try{

    liveVideo.currentTime = 0;

  }catch(error){

    console.log(error);

  }


  showOnly(insufficientPage);


  if(insufficientTimer){

    clearTimeout(
      insufficientTimer
    );
  }


  insufficientTimer =
    setTimeout(()=>{

      showOnly(photosPage);

    },2000);
}


/* =========================
   VIDEO LIKE
========================= */

document
  .getElementById("videoLike")
  .addEventListener(
    "click",
    function(){

      this.classList.toggle(
        "active"
      );

      this.textContent =
        this.classList.contains(
          "active"
        )
        ? "❤️ Liked"
        : "❤️ Like";

    }
  );


/* =========================
   VIDEO FOLLOW
========================= */

document
  .getElementById("videoFollow")
  .addEventListener(
    "click",
    function(){

      this.classList.toggle(
        "active"
      );

      this.textContent =
        this.classList.contains(
          "active"
        )
        ? "✓ Following"
        : "+ Follow";

    }
  );


/* =========================
   ANSWER BUTTON
========================= */

document
  .getElementById("answerCall")
  .addEventListener(
    "click",
    ()=>{
      answerIncomingCall();
    }
  );


/* =========================
   REJECT BUTTON
========================= */

document
  .getElementById("rejectCall")
  .addEventListener(
    "click",
    ()=>{

      if(callTimer){

        clearTimeout(
          callTimer
        );

        callTimer = null;
      }

      showOnly(photosPage);

    }
  );
  /* =========================
   VIDEO ENDED
========================= */

liveVideo.addEventListener(
  "ended",
  ()=>{

    finishLiveVideo();

  }
);


/* =========================
   40 SECOND PROTECTION
========================= */

liveVideo.addEventListener(
  "timeupdate",
  ()=>{

    if(
      liveVideo.currentTime >= 40
    ){

      finishLiveVideo();

    }

  }
);


/* =========================
   PAGE VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden &&
      !videoPage.classList.contains(
        "hidden"
      )
    ){

      liveVideo.pause();

    }

  }
);


/* =========================
   CLEAR OLD TIMERS
========================= */

function clearAllTimers(){

  if(videoTimer){

    clearTimeout(
      videoTimer
    );

    videoTimer = null;
  }


  if(callTimer){

    clearTimeout(
      callTimer
    );

    callTimer = null;
  }


  if(returnLoadingTimer){

    clearTimeout(
      returnLoadingTimer
    );

    returnLoadingTimer = null;
  }


  if(insufficientTimer){

    clearTimeout(
      insufficientTimer
    );

    insufficientTimer = null;
  }

}


/* =========================
   START OFFLINE ROTATION
========================= */

startOfflineRotation();


/* =========================
   DETERMINE VISITOR TYPE
========================= */

function isReturningVisitor(){

  return (
    localStorage.getItem(
      FIRST_VIDEO_KEY
    ) === "1"
  );

}


/* =========================
   START VISITOR FLOW
========================= */

function startVisitorFlow(){

  const returning =
    isReturningVisitor();


  /*
    Every visit starts with
    Welcome for 3 seconds.
  */

  setTimeout(()=>{

    showOnly(photosPage);

    renderPhotos();


    /*
      Give Live Photos time to appear.
    */

    setTimeout(()=>{

      if(returning){

        /*
          RETURNING VISITOR:

          Live Photos
          ↓
          Incoming Video Call
          ↓
          Answer
          ↓
          2 sec Loading
          ↓
          Insufficient Minutes
          ↓
          Live Photos
        */

        openIncomingCall();

      }else{

        /*
          NEW VISITOR:

          Live Photos
          ↓
          Automatic Live Video
          ↓
          Insufficient Minutes
          ↓
          Live Photos
        */

        startLiveVideo();

      }

    },3500);

  },3000);

}
  /* =========================
   INITIAL SCREEN
========================= */

showOnly(welcomeScreen);


/* =========================
   START WEBSITE
========================= */

startVisitorFlow();


/* =========================
   EXTRA SAFETY
========================= */

/*
  If the browser reloads while the video
  is playing, the localStorage flag is
  already "1".

  Therefore the next page load is treated
  as a returning visitor.
*/


window.addEventListener(
  "beforeunload",
  ()=>{

    if(videoTimer){

      clearTimeout(
        videoTimer
      );

      videoTimer = null;
    }

    if(callTimer){

      clearTimeout(
        callTimer
      );

      callTimer = null;
    }

  }
);


/* =========================
   PREVENT DOUBLE VIDEO FINISH
========================= */

let videoFinished = false;


function safeStartVideo(profile){

  videoFinished = false;

  startLiveVideo(profile);

}


/* =========================
   REDEFINE VIDEO FINISH SAFELY
========================= */

function finaliseVideoOnce(){

  if(videoFinished){

    return;
  }

  videoFinished = true;

  finishLiveVideo();

}


/* =========================
   VIDEO END SAFETY
========================= */

liveVideo.addEventListener(
  "ended",
  ()=>{

    finaliseVideoOnce();

  }
);


/* =========================
   VIDEO TIME SAFETY
========================= */

liveVideo.addEventListener(
  "timeupdate",
  ()=>{

    if(
      liveVideo.currentTime >= 40
    ){

      finaliseVideoOnce();

    }

  }
);


/* =========================
   RESET FINISH FLAG
   WHEN NEW VIDEO STARTS
========================= */

const originalStartLiveVideo =
  startLiveVideo;


/*
  The existing startLiveVideo function
  remains the actual video starter.

  This listener resets the protection
  whenever a new video element begins.
*/

liveVideo.addEventListener(
  "play",
  ()=>{

    videoFinished = false;

  }
);


/* =========================
   FINAL RETURNING FLOW
========================= */

function returningVisitorAnswer(){

  clearAllTimers();

  showOnly(returnLoading);


  returnLoadingTimer =
    setTimeout(()=>{

      showOnly(insufficientPage);


      insufficientTimer =
        setTimeout(()=>{

          showOnly(photosPage);

          renderPhotos();

        },2000);

    },2000);

}


/*
  Keep the main Answer button connected
  to the exact returning-visitor flow.
*/

document
  .getElementById("answerCall")
  .onclick = function(){

    returningVisitorAnswer();

  };


/* =========================
   FINAL REJECT FLOW
========================= */

document
  .getElementById("rejectCall")
  .onclick = function(){

    clearAllTimers();

    showOnly(photosPage);

    renderPhotos();

  };
  /* =========================
   FINAL PAGE START
========================= */

/*
  IMPORTANT:

  New visitor:
  localStorage key is absent.

  Therefore:
  Welcome
  -> Live Photos
  -> Automatic Video
  -> Insufficient Minutes
  -> Live Photos


  Returning visitor / reload:
  localStorage key is already "1".

  Therefore:
  Welcome
  -> Live Photos
  -> Incoming Video Call
  -> Answer
  -> 2 seconds Connecting
  -> Insufficient Minutes
  -> Live Photos
*/


console.log(
  "LiveX visitor type:",
  isReturningVisitor()
    ? "RETURNING VISITOR"
    : "NEW VISITOR"
);


/* =========================
   END
========================= */

</script>
