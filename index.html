<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referral Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.page{
  display:none;
  width:100%;
  min-height:100vh;
  background:#000;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* WELCOME */
#welcomeScreen{
  display:flex;
  text-align:center;
}

#welcomeScreen h1{
  font-size:30px;
  margin-bottom:15px;
}

#welcomeScreen p{
  font-size:18px;
}

/* PHOTOS */
#photosPage{
  display:none;
  align-items:stretch;
  justify-content:flex-start;
  padding:10px;
}

.photoGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.photoCard{
  position:relative;
  overflow:hidden;
  background:#111;
  border-radius:6px;
  cursor:pointer;
}

.photoCard img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.photoCard.offline{
  cursor:default;
}

.photoStatus{
  position:absolute;
  top:6px;
  left:6px;
  padding:4px 7px;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
  z-index:3;
}

.liveStatus{
  background:#e00000;
  color:#fff;
}

.offlineStatus{
  background:#555;
  color:#fff;
}

.closedOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  z-index:2;
}

.videoPlayIcon{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(220,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#fff;
  z-index:4;
  pointer-events:none;
  animation:pulsePlay 1.2s infinite;
}

@keyframes pulsePlay{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.12);
  }
}

.photoInfo{
  padding:6px 4px 8px;
  text-align:center;
  background:#080808;
}

.photoName{
  font-size:14px;
  font-weight:bold;
}

.photoMeta{
  margin-top:3px;
  font-size:11px;
  color:#bbb;
}
  /* INCOMING CALL */
#incomingCall{
  background:#050505;
  text-align:center;
}

#incomingCall img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:15px;
  border:3px solid #e00000;
}

#incomingCall h2{
  font-size:24px;
  margin-bottom:8px;
}

#incomingCall p{
  color:#bbb;
  margin-bottom:25px;
}

.callButtons{
  display:flex;
  gap:25px;
}

.callButton{
  width:65px;
  height:65px;
  border-radius:50%;
  border:none;
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

.declineButton{
  background:#e00000;
}

.answerButton{
  background:#00a83b;
}

/* BLACK LIVE */
#blackLivePage{
  background:#000;
  text-align:center;
}

.liveBadge{
  background:#e00000;
  color:#fff;
  padding:8px 18px;
  border-radius:6px;
  font-size:22px;
  font-weight:bold;
  animation:livePulse 1s infinite;
}

@keyframes livePulse{
  0%,100%{opacity:1;}
  50%{opacity:.55;}
}

.liveLoading{
  margin-top:20px;
  font-size:18px;
}

/* RED LIVE VIDEO */
#liveSoundPage{
  background:#000;
  position:relative;
}

#liveSoundVideo{
  width:100%;
  height:100vh;
  object-fit:cover;
  background:#000;
}

.redLiveBadge{
  position:absolute;
  top:18px;
  left:18px;
  z-index:10;
  background:#e00000;
  color:#fff;
  padding:8px 15px;
  border-radius:5px;
  font-weight:bold;
  font-size:18px;
}

/* NO ANSWER */
#noAnswerPage{
  background:#e00000;
  text-align:center;
}

#noAnswerPage h1{
  font-size:32px;
  font-weight:bold;
}

/* INSUFFICIENT */
#insufficientPage{
  background:#000;
  text-align:center;
}

#insufficientPage h1{
  font-size:28px;
}
</style>
</head>

<body>

<div id="welcomeScreen" class="page">
  <h1>WELCOME</h1>
  <p>Loading...</p>
</div>

<div id="photosPage" class="page">
  <div id="photoGrid" class="photoGrid"></div>
</div>

<div id="incomingCall" class="page">
  <img id="callerPhoto" src="" alt="Caller">

  <h2 id="callerName">
    Incoming Video Call
  </h2>

  <p id="callerDetails"></p>

  <div class="callButtons">
    <button
      id="declineButton"
      class="callButton declineButton">
      ✕
    </button>

    <button
      id="answerButton"
      class="callButton answerButton">
      ✓
    </button>
  </div>
</div>

<div id="liveSoundPage" class="page">

  <div class="redLiveBadge">
    🔴 LIVE
  </div>

  <video
    id="liveSoundVideo"
    playsinline
    preload="auto">

    <source
      src="preview_20_seconds.mp4"
      type="video/mp4">

  </video>

</div>

<div id="blackLivePage" class="page">

  <div class="liveBadge">
    🔴 LIVE
  </div>

  <div class="liveLoading">
    Loading...
  </div>

</div>

<div id="noAnswerPage" class="page">
  <h1>NO ANSWER</h1>
</div>

<div id="insufficientPage" class="page">
  <h1>INSUFFICIENT MINUTES</h1>
</div>

<audio
  id="backgroundSound"
  preload="auto">

  <source
    src="preview_20_seconds.mp4"
    type="video/mp4">

</audio>
<script>
const GITHUB_OWNER = "agnesweb2026";
const GITHUB_REPO = "My-referral-website";
const GITHUB_BRANCH = "main";

const MAX_PHOTOS = 24;

/* FIRST CALL */
const FIRST_WELCOME_DURATION = 3000;

/* NEXT CALL RINGS AFTER 7 SECONDS */
const PHOTOS_DURATION = 7000;

/* BACKGROUND SOUND */
const BACKGROUND_SOUND_DURATION = 5000;

/* OFFLINE ROOMS CHANGE EVERY 5 MINUTES */
const BUSY_CHANGE_DURATION = 300000;

/* SECOND BLACK LIVE SOUND */
const SECOND_CALL_SOUND_DURATION = 5000;

/* NO ANSWER SCREEN */
const NO_ANSWER_DURATION = 3000;

const PAYMENT_PAGE_URL = "payment.html";

/* RED LIVE VIDEO IS SHOWN ONLY ONCE */
const RED_LIVE_KEY = "redLiveVideoSeen";

let redLiveShownThisVisit =
  localStorage.getItem(RED_LIVE_KEY) === "yes";

let websiteStarted = false;

let photosData = [];
let currentCaller = null;

let photoTimer = null;
let incomingTimer = null;
let busyRotationTimer = null;
let soundTimer = null;
let liveVideoSafetyTimer = null;
let noAnswerTimer = null;

const welcomeScreen =
  document.getElementById("welcomeScreen");

const photosPage =
  document.getElementById("photosPage");

const photoGrid =
  document.getElementById("photoGrid");

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerName =
  document.getElementById("callerName");

const callerDetails =
  document.getElementById("callerDetails");

const answerButton =
  document.getElementById("answerButton");

const declineButton =
  document.getElementById("declineButton");

const liveSoundPage =
  document.getElementById("liveSoundPage");

const liveSoundVideo =
  document.getElementById("liveSoundVideo");

const blackLivePage =
  document.getElementById("blackLivePage");

const noAnswerPage =
  document.getElementById("noAnswerPage");

const insufficientPage =
  document.getElementById("insufficientPage");

const backgroundSound =
  document.getElementById("backgroundSound");
  const names = [
  "Cute",
  "Becky",
  "Dorry",
  "Jenny",
  "Ashley",
  "Mary",
  "Cindy",
  "Mercy",
  "Linda",
  "Sharon",
  "Brenda",
  "Diana",
  "Faith",
  "Joy",
  "Lucy",
  "Angela",
  "Betty",
  "Nancy",
  "Winnie",
  "Ann",
  "Carol",
  "Irene",
  "Rose",
  "Fellow"
];

const ages = [
  19,23,25,18,24,24,
  26,30,27,23,29,33,
  25,25,31,25,23,19,
  22,24,23,27,28,21
];

const countries = [
  "🇰🇪","🇰🇪","🇰🇪","🇰🇪","🇰🇪",
  "🇹🇿","🇹🇿","🇹🇿","🇹🇿",
  "🇳🇬","🇳🇬","🇳🇬","🇳🇬",
  "🇨🇩","🇨🇩","🇨🇩","🇨🇩","🇨🇩",
  "🇨🇦","🇨🇦",
  "🇿🇦","🇿🇦",
  "🇺🇸","🇺🇸"
];

function hideAllPages(){
  welcomeScreen.style.display = "none";
  photosPage.style.display = "none";
  incomingCall.style.display = "none";
  liveSoundPage.style.display = "none";
  blackLivePage.style.display = "none";
  noAnswerPage.style.display = "none";
  insufficientPage.style.display = "none";
}

function clearAllTimers(){
  clearTimeout(photoTimer);
  clearTimeout(incomingTimer);
  clearTimeout(busyRotationTimer);
  clearTimeout(soundTimer);
  clearTimeout(liveVideoSafetyTimer);
  clearTimeout(noAnswerTimer);

  photoTimer = null;
  incomingTimer = null;
  busyRotationTimer = null;
  soundTimer = null;
  liveVideoSafetyTimer = null;
  noAnswerTimer = null;
}

function stopBackgroundSound(){
  try{
    backgroundSound.pause();
    backgroundSound.currentTime = 0;
  }catch(e){}
}

function stopLiveVideo(){
  try{
    liveSoundVideo.pause();
    liveSoundVideo.currentTime = 0;
  }catch(e){}
}

function shuffleArray(array){
  const arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }

  return arr;
}

function getRandomBusyIndexes(total,count){
  const indexes = [];

  while(indexes.length < count){
    const index =
      Math.floor(Math.random() * total);

    if(!indexes.includes(index)){
      indexes.push(index);
    }
  }

  return indexes;
}
  async function getGitHubContents(path = ""){
  const url =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("GitHub files could not be loaded");
  }

  return await response.json();
}

async function collectImages(path = "", result = []){
  const items = await getGitHubContents(path);

  for(const item of items){

    if(item.type === "dir"){
      await collectImages(item.path,result);
    }

    else if(
      item.type === "file" &&
      isImageFile(item.name)
    ){
      result.push(item.path);
    }

    if(result.length >= MAX_PHOTOS){
      break;
    }
  }

  return result;
}

function getFileUrl(path){
  return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
}

function isImageFile(name){
  return /\.(jpg|jpeg|png|webp|gif)$/i.test(name);
}

async function loadPhotos(){

  try{

    let imagePaths = [];

    imagePaths =
      await collectImages("",[]);

    imagePaths =
      imagePaths.slice(0,MAX_PHOTOS);

    photosData = imagePaths.map(
      (path,index) => ({
        image:getFileUrl(path),
        name:names[index],
        age:ages[index],
        country:countries[index]
      })
    );

  }catch(error){

    console.error(error);

    photosData = [];

  }
}

function getRandomCaller(){

  if(!photosData.length){
    return {
      image:"",
      name:"Incoming Call",
      age:"",
      country:""
    };
  }

  const index =
    Math.floor(Math.random() * photosData.length);

  return photosData[index];
}

function getBusyIndexes(){
  return getRandomBusyIndexes(
    photosData.length,
    Math.min(5,photosData.length)
  );
      }
  function renderPhotos(){

  photoGrid.innerHTML = "";

  const displayData =
    shuffleArray(photosData);

  const busyIndexes =
    getBusyIndexes();

  displayData.forEach((person,index)=>{

    const card =
      document.createElement("div");

    card.className = "photoCard";

    const isOffline =
      busyIndexes.includes(index);

    if(isOffline){
      card.classList.add("offline");
    }

    const status =
      document.createElement("div");

    status.className =
      "photoStatus " +
      (isOffline
        ? "offlineStatus"
        : "liveStatus");

    status.textContent =
      isOffline ? "OFFLINE" : "LIVE";

    card.appendChild(status);

    const image =
      document.createElement("img");

    image.src = person.image;
    image.alt = person.name;

    card.appendChild(image);

    const play =
      document.createElement("div");

    play.className = "videoPlayIcon";
    play.textContent = "▶";

    card.appendChild(play);

    if(isOffline){

      const closed =
        document.createElement("div");

      closed.className =
        "closedOverlay";

      closed.textContent =
        "ROOM CLOSED";

      card.appendChild(closed);

    }else{

      card.addEventListener(
        "click",
        ()=>{
          window.location.href =
            PAYMENT_PAGE_URL;
        }
      );
    }

    const info =
      document.createElement("div");

    info.className = "photoInfo";

    const name =
      document.createElement("div");

    name.className = "photoName";
    name.textContent = person.name;

    const meta =
      document.createElement("div");

    meta.className = "photoMeta";
    meta.textContent =
      `${person.country} ${person.age} yrs`;

    info.appendChild(name);
    info.appendChild(meta);

    card.appendChild(info);

    photoGrid.appendChild(card);
  });
}

function startBusyRoomRotation(){

  clearTimeout(busyRotationTimer);

  busyRotationTimer =
    setTimeout(
      ()=>{
        if(
          photosPage.style.display !== "none"
        ){
          renderPhotos();
        }

        startBusyRoomRotation();

      },
      BUSY_CHANGE_DURATION
    );
}

function playLivePhotosSound(){

  stopBackgroundSound();

  try{

    backgroundSound.currentTime = 0;
    backgroundSound.volume = 0.45;

    const playPromise =
      backgroundSound.play();

    if(playPromise){
      playPromise.catch(()=>{});
    }

    clearTimeout(soundTimer);

    soundTimer =
      setTimeout(
        ()=>{
          stopBackgroundSound();
        },
        BACKGROUND_SOUND_DURATION
      );

  }catch(e){}
      }
  function scheduleIncomingCall(){

  clearTimeout(incomingTimer);

  incomingTimer =
    setTimeout(
      ()=>{
        showIncomingCall();
      },
      PHOTOS_DURATION
    );
}

function showLivePhotos(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  photosPage.style.display = "flex";

  renderPhotos();

  playLivePhotosSound();

  startBusyRoomRotation();

  /*
    Every time Live Photos appears,
    the next incoming call rings after 7 seconds.
  */
  scheduleIncomingCall();
}

function showIncomingCall(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  currentCaller =
    getRandomCaller();

  callerPhoto.src =
    currentCaller.image;

  callerName.textContent =
    currentCaller.name;

  callerDetails.textContent =
    `${currentCaller.country} ${currentCaller.age} yrs`;

  incomingCall.style.display =
    "flex";

  /*
    If nobody answers within 7 seconds,
    show NO ANSWER.
  */
  incomingTimer =
    setTimeout(
      ()=>{
        showNoAnswer();
      },
      PHOTOS_DURATION
    );
}

function showLiveSound(){

  clearAllTimers();

  stopBackgroundSound();

  hideAllPages();

  liveSoundPage.style.display =
    "flex";

  try{

    liveSoundVideo.currentTime = 0;
    liveSoundVideo.muted = false;
    liveSoundVideo.volume = 1;

    const playPromise =
      liveSoundVideo.play();

    if(playPromise){
      playPromise.catch(()=>{
        liveSoundVideo.muted = true;
        liveSoundVideo.play().catch(()=>{});
      });
    }

  }catch(e){}

  /*
    When the first red LIVE video ends,
    go directly to Live Photos.
  */
  liveSoundVideo.onended =
    ()=>{
      showLivePhotos();
    };

  /*
    Safety fallback in case the video
    does not send the ended event.
  */
  liveVideoSafetyTimer =
    setTimeout(
      ()=>{
        showLivePhotos();
      },
      22000
    );
}

function showBlackLive(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  blackLivePage.style.display =
    "flex";

  try{

    backgroundSound.currentTime = 0;
    backgroundSound.volume = 1;

    const playPromise =
      backgroundSound.play();

    if(playPromise){
      playPromise.catch(()=>{});
    }

    soundTimer =
      setTimeout(
        ()=>{
          stopBackgroundSound();
        },
        SECOND_CALL_SOUND_DURATION
      );

  }catch(e){}
}

function showNoAnswer(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  noAnswerPage.style.display =
    "flex";

  noAnswerTimer =
    setTimeout(
      ()=>{
        showLivePhotos();
      },
      NO_ANSWER_DURATION
    );
}

function showInsufficient(){

  clearAllTimers();

  stopLiveVideo();
  stopBackgroundSound();

  hideAllPages();

  insufficientPage.style.display =
    "flex";
}
  function answerIncomingCall(){

  clearAllTimers();

  /*
    FIRST CALL:
    Answer -> red LIVE video.
  */
  if(!redLiveShownThisVisit){

    redLiveShownThisVisit = true;

    localStorage.setItem(
      RED_LIVE_KEY,
      "yes"
    );

    showLiveSound();

  }else{

    /*
      NEXT CALL:
      Answer -> black LIVE screen
      with sound.
    */
    showBlackLive();
  }
}

function declineIncomingCall(){

  clearAllTimers();

  /*
    If the first call is declined,
    simply return to Live Photos.
  */
  if(!redLiveShownThisVisit){

    showLivePhotos();

  }else{

    /*
      If the next call is declined,
      show NO ANSWER for 3 seconds.
    */
    showNoAnswer();
  }
}

answerButton.addEventListener(
  "click",
  answerIncomingCall
);

declineButton.addEventListener(
  "click",
  declineIncomingCall
);

/*
  When payment.html opens, remember that
  returning should go directly to Live Photos.
*/
function markPaymentReturn(){

  try{
    sessionStorage.setItem(
      "returnToLivePhotos",
      "yes"
    );
  }catch(e){}
}

document.addEventListener(
  "click",
  (event)=>{
    const card =
      event.target.closest(".photoCard");

    if(
      card &&
      !card.classList.contains("offline")
    ){
      markPaymentReturn();
    }
  }
);

/*
  Return from payment page.
*/
function checkPaymentReturn(){

  try{

    if(
      sessionStorage.getItem(
        "returnToLivePhotos"
      ) === "yes"
    ){

      sessionStorage.removeItem(
        "returnToLivePhotos"
      );

      redLiveShownThisVisit =
        localStorage.getItem(
          RED_LIVE_KEY
        ) === "yes";

      websiteStarted = true;

      setTimeout(
        ()=>{
          showLivePhotos();
        },
        50
      );

      return true;
    }

  }catch(e){}

  return false;
}

/*
  Handles browser/phone Back and bfcache.
*/
window.addEventListener(
  "pageshow",
  ()=>{
    if(!websiteStarted){
      return;
    }

    try{

      if(
        sessionStorage.getItem(
          "returnToLivePhotos"
        ) === "yes"
      ){

        sessionStorage.removeItem(
          "returnToLivePhotos"
        );

        redLiveShownThisVisit =
          localStorage.getItem(
            RED_LIVE_KEY
          ) === "yes";

        setTimeout(
          ()=>{
            showLivePhotos();
          },
          50
        );
      }

    }catch(e){}
  }
);

async function startWebsite(){

  /*
    If returning from payment,
    skip Welcome.
  */
  if(checkPaymentReturn()){
    return;
  }

  websiteStarted = true;

  hideAllPages();

  welcomeScreen.style.display =
    "flex";

  await loadPhotos();

  setTimeout(
    ()=>{
      /*
        After Welcome, FIRST incoming call
        appears immediately.
      */
      showIncomingCall();
    },
    FIRST_WELCOME_DURATION
  );
}

window.addEventListener(
  "load",
  ()=>{
    startWebsite();
  }
);

</script>

</body>
</html>
