<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referral Website</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding:20px 12px;
  text-align:center;
}

h1{margin:10px 0}
p{color:#ccc}

/* AGE */
#ageGate{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.ageBox{
  max-width:380px;
}

.ageIcon{
  font-size:60px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 22px;
  margin:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.enter{
  background:#22c55e;
}

.exit{
  background:#666;
}

/* CALL */
#incomingCall{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  background:#151419;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.callBg{
  position:absolute;
  inset:-30px;
  background:radial-gradient(circle,#5d5050,#302b2e,#101014);
  filter:blur(20px);
  transform:scale(1.1);
}

.callDark{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
}

.callContent{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.profile{
  width:150px;
  height:150px;
  border-radius:50%;
  border:3px solid #8b5cf6;
  object-fit:cover;
  background:#222;
}

.callerName{
  font-size:27px;
  font-weight:bold;
  margin-top:15px;
}

.callTitle{
  color:#aaa;
  font-size:13px;
  margin-top:5px;
  letter-spacing:1px;
}

.ringing{
  margin-top:15px;
  color:#b98cff;
}

.ringDot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.2}
}

.callButtons{
  display:flex;
  gap:70px;
  margin-top:100px;
}

.callButton{
  width:78px;
  height:78px;
  border-radius:50%;
  font-size:30px;
}

.red{
  background:#ed3b3b;
}

.green{
  background:#14a94b;
}

/* SAMPLE */
#sample{
  position:fixed;
  inset:0;
  z-index:9500;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
}

#sample video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.counter{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  color:white;
}

/* GALLERY */
#gallery{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:25px;
}

.photo{
  position:relative;
  height:230px;
  background:#111;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.live{
  position:absolute;
  top:9px;
  left:9px;
  background:#f0184c;
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.status{
  position:absolute;
  bottom:9px;
  left:9px;
  right:9px;
  background:rgba(0,0,0,.8);
  padding:7px;
  border-radius:8px;
  text-align:left;
  font-size:12px;
}

.liveDot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  margin-right:5px;
  animation:blink 1s infinite;
}

.loading{
  grid-column:1/-1;
  padding:30px;
  color:#aaa;
}

@media(max-width:400px){

  #gallery{
    gap:12px;
  }

  .photo{
    height:190px;
  }

  .callButtons{
    gap:45px;
  }

  .callButton{
    width:70px;
    height:70px;
  }
}
</style>
</head>

<body>

<!-- AGE -->
<div id="ageGate">

  <div class="ageBox">

    <div class="ageIcon">🔞</div>

    <h1>18+ ONLY</h1>

    <p>You must be 18 years or older to enter.</p>

    <button
      class="enter"
      onclick="enterSite()">
      I AM 18+ — ENTER
    </button>

    <button
      class="exit"
      onclick="leaveSite()">
      EXIT
    </button>

  </div>

</div>


<!-- INCOMING CALL -->
<div id="incomingCall">

  <div class="callBg"></div>

  <div class="callDark"></div>

  <div class="callContent">

    <img
      id="callerPhoto"
      class="profile">

    <div
      id="callerName"
      class="callerName">
      Caller
    </div>

    <div class="callTitle">
      INCOMING VIDEO CALL
    </div>

    <div class="ringing">

      <span class="ringDot"></span>

      Ringing...

    </div>

    <div class="callButtons">

      <div>

        <button
          class="callButton red"
          onclick="startSample()">
          ☎
        </button>

        <div>
          Decline
        </div>

      </div>


      <div>

        <button
          class="callButton green"
          onclick="startSample()">
          ☎
        </button>

        <div>
          Answer
        </div>

      </div>

    </div>

  </div>

</div>


<!-- SAMPLE -->
<div id="sample">

  <video
    id="sampleVideo"
    playsinline
    preload="auto"
    muted>

    <source
      src="172687-849651731.mp4"
      type="video/mp4">

  </video>

  <div class="counter">

    Sample:

    <span id="counter">
      20
    </span>

    seconds

  </div>

</div>


<h1>
  Welcome
</h1>

<p>
  Welcome to my referral website.
</p>


<!-- GALLERY -->
<div id="gallery">

  <div class="loading">
    Loading photos...
  </div>

</div>


<script>

/* =========================
   GITHUB SETTINGS
========================= */

const OWNER = "agnesweb2026";
const REPO = "My-referral-website";
const BRANCH = "main";

const MAX_PHOTOS = 24;


/* =========================
   ELEMENTS
========================= */

const ageGate =
  document.getElementById("ageGate");

const incomingCall =
  document.getElementById("incomingCall");

const callerPhoto =
  document.getElementById("callerPhoto");

const callerName =
  document.getElementById("callerName");

const sample =
  document.getElementById("sample");

const sampleVideo =
  document.getElementById("sampleVideo");

const counter =
  document.getElementById("counter");

const gallery =
  document.getElementById("gallery");


let photos = [];


/* =========================
   RANDOMIZE
========================= */

function shuffle(array){

  const result = [...array];

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =========================
   GITHUB IMAGE URL
========================= */

function imageURL(filename){

  return (
    "https://raw.githubusercontent.com/" +
    OWNER +
    "/" +
    REPO +
    "/" +
    BRANCH +
    "/" +
    encodeURIComponent(filename)
  );

}


/* =========================
   LOAD ALL IMAGES
========================= */

async function loadPhotos(){

  gallery.innerHTML =
    '<div class="loading">Loading 24 photos...</div>';

  try{

    const url =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

    const response =
      await fetch(url);

    if(!response.ok){

      throw new Error(
        "GitHub loading failed"
      );

    }

    const files =
      await response.json();


    photos =
      files.filter(file =>

        file.type === "file" &&

        /\.(jpg|jpeg|png|webp|gif)$/i
          .test(file.name)

      );


    if(!photos.length){

      throw new Error(
        "No photos found"
      );

    }


    photos =
      shuffle(photos)
      .slice(0,MAX_PHOTOS);


    showGallery();

    chooseCaller();

  }

  catch(error){

    console.error(error);

    gallery.innerHTML =
      `
      <div class="loading">
        Photos could not load.<br><br>
        Please refresh the page.
      </div>
      `;

  }

}


/* =========================
   SHOW 24 PHOTOS
========================= */

function showGallery(){

  gallery.innerHTML = "";

  photos.forEach((file,index)=>{

    const box =
      document.createElement("div");

    box.className = "photo";


    const img =
      document.createElement("img");

    img.src =
      imageURL(file.name);

    img.alt =
      "Photo " + (index + 1);

    img.loading = "lazy";


    img.onerror = function(){

      this.style.display = "none";

    };


    const live =
      document.createElement("div");

    live.className = "live";

    live.textContent =
      "● LIVE";


    const status =
      document.createElement("div");

    status.className = "status";

    status.innerHTML =
      `
      <span class="liveDot"></span>
      Live now
      `;


    box.appendChild(img);

    box.appendChild(live);

    box.appendChild(status);


    box.onclick = function(){

      window.location.href =
        "mpesa.html";

    };


    gallery.appendChild(box);

  });


  gallery.style.display =
    "grid";

}


/* =========================
   RANDOM CALLER
========================= */

function chooseCaller(){

  if(!photos.length)
    return;


  const person =
    photos[
      Math.floor(
        Math.random() * photos.length
      )
    ];


  callerPhoto.src =
    imageURL(person.name);


  callerName.textContent =
    person.name
      .replace(/\.[^/.]+$/,"")
      .replace(/[-_]+/g," ");


  incomingCall.style.display =
    "flex";

}


/* =========================
   ENTER
========================= */

function enterSite(){

  ageGate.style.display =
    "none";

  loadPhotos();

}


/* =========================
   EXIT
========================= */

function leaveSite(){

  window.location.href =
    "https://www.google.com";

}


/* =========================
   SAMPLE
========================= */

function startSample(){

  incomingCall.style.display =
    "none";

  sample.style.display =
    "flex";


  sampleVideo.currentTime =
    0;


  sampleVideo.play()
    .catch(error => {

      console.log(
        "Video play waiting for interaction",
        error
      );

    });

}


/* =========================
   SAMPLE TIMER
========================= */

sampleVideo.addEventListener(
  "timeupdate",
  function(){

    const remaining =
      Math.max(
        0,
        Math.ceil(
          20 -
          sampleVideo.currentTime
        )
      );


    counter.textContent =
      remaining;


    if(
      sampleVideo.currentTime >= 20
    ){

      sampleVideo.pause();

      sample.style.display =
        "none";

      gallery.style.display =
        "grid";

    }

  }
);

</script>

</body>
</html>
