  margin-right:5px;
  animation:onlineBlink 1s infinite;
}

@keyframes onlineBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

========================= */

#photoGrid{

  padding:4px;
}

.photoCard{
  position:relative;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
}

.photo-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:.78;
  overflow:hidden;
  background:#151515;
}

.profile-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

========================= */

.live-badge{

  color:#fff;

========================= */

  left:7px;
  z-index:5;

  background:#555;
  color:#fff;

  font-size:10px;
  font-weight:bold;

  padding:4px 7px;

  border-radius:4px;
}

   VIDEO ICON
========================= */

.photo-play{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:45px;
  height:45px;

  border-radius:50%;

  background:rgba(0,0,0,.72);

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:6;

  animation:videoZoom 1.4s ease-in-out infinite;
}

.photo-play::after{
  content:"▶";

  color:#fff;

  font-size:19px;

  margin-left:3px;
}

@keyframes videoZoom{

  0%{
    transform:translate(-50%,-50%) scale(.82);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.16);
  }

  100%{
    transform:translate(-50%,-50%) scale(.82);
  }

}

   CALL BUTTON TOUCH SUPPORT
===================================================== */

declineButton.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    declineCall();

  },
  {
    passive:false
  }
);


answerButton.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    answerCall();

  },
  {
    passive:false
  }
);


/* =====================================================
   START FIRST CALL
===================================================== */

function startFirstCall(){

  if(firstCallShown){
    return;
  }

  firstCallShown = true;

  showIncomingCall();

}


/* =====================================================
   WELCOME FLOW
===================================================== */

function startWelcomeFlow(){

  welcomeScreen.classList.remove("hidden");

  photosPage.classList.add("hidden");

  incomingCall.classList.add("hidden");

  redLiveVideoPage.classList.add("hidden");

  blackLivePage.classList.add("hidden");

  insufficientPage.classList.add("hidden");

  if(welcomeTimer){
    clearTimeout(welcomeTimer);
  }

  welcomeTimer =
    setTimeout(
      function(){

        startFirstCall();

      },
      3000
    );

}


/* =====================================================
   FALLBACK IF VIDEO CANNOT PLAY
===================================================== */

redLiveVideo.addEventListener(
  "error",
  function(){

    if(redLiveVideoPage.classList.contains("hidden")){
      return;
    }

    redLiveVideo.pause();

    showBlackLive(3000);

  }
);


blackLiveSoundVideo.addEventListener(
  "error",
  function(){

    if(blackLivePage.classList.contains("hidden")){
      return;
    }

    blackLiveSoundVideo.pause();

    showInsufficient();

  }
);


/* =====================================================
   VIDEO ENDED FALLBACK
===================================================== */

redLiveVideo.addEventListener(
  "ended",
  function(){

    if(
      !redLiveVideoPage.classList.contains(
        "hidden"
      )
    ){

      showBlackLive(5000);

    }

  }
);


/* =====================================================
   STOP VIDEO WHEN PAGE HIDDEN
===================================================== */

document.addEventListener(
  "visibilitychange",
  function(){

    if(document.hidden){

      if(
        redLiveVideo &&
        !redLiveVideo.paused
      ){

        redLiveVideo.pause();

      }

      if(
        blackLiveSoundVideo &&
        !blackLiveSoundVideo.paused
      ){

        blackLiveSoundVideo.pause();

      }

    }

  }
);
  /* =====================================================
   OFFLINE PROFILE SYSTEM
===================================================== */

const OFFLINE_COUNT = 5;

let offlineIndexes = [];


function chooseOfflineProfiles(){

  offlineIndexes = [];

  while(
    offlineIndexes.length <
    OFFLINE_COUNT
  ){

    const index =
      Math.floor(
        Math.random() *
        imageFiles.length
      );

    if(
      !offlineIndexes.includes(index)
    ){

      offlineIndexes.push(index);

    }

  }

}


/* =====================================================
   APPLY OFFLINE STATUS
===================================================== */

function applyOfflineStatus(){

  const cards =
    document.querySelectorAll(
      ".photoCard"
    );

  cards.forEach(
    function(card,index){

      const imageWrap =
        card.querySelector(
          ".photo-image-wrap"
        );

      const existing =
        card.querySelector(
          ".offline-badge"
        );

      if(existing){
        existing.remove();
      }

      const liveBadge =
        card.querySelector(
          ".live-badge"
        );

      if(
        offlineIndexes.includes(index)
      ){

        if(liveBadge){
          liveBadge.remove();
        }

        const badge =
          document.createElement("div");

        badge.className =
          "offline-badge";

        badge.textContent =
          "OFFLINE";

        imageWrap.appendChild(
          badge
        );

      }

    }
  );

}


/* =====================================================
   REFRESH OFFLINE PROFILES
===================================================== */

function refreshOfflineProfiles(){

  chooseOfflineProfiles();

  applyOfflineStatus();

}


/* =====================================================
   START OFFLINE ROTATION
===================================================== */

function startOfflineRotation(){

  refreshOfflineProfiles();

  if(offlineTimer){
    clearInterval(offlineTimer);
  }

  offlineTimer =
    setInterval(
      function(){

        refreshOfflineProfiles();

      },
      5 * 60 * 1000
    );

}


/* =====================================================
   PHOTO GRID AFTER CREATION
===================================================== */

const originalCreatePhotos =
  createPhotos;

function rebuildPhotos(){

  originalCreatePhotos();

  startOfflineRotation();

}


/* =====================================================
   OVERRIDE SHOW PHOTOS
===================================================== */

function displayPhotos(){

  welcomeScreen.classList.add("hidden");

  incomingCall.classList.add("hidden");

  redLiveVideoPage.classList.add("hidden");

  blackLivePage.classList.add("hidden");

  insufficientPage.classList.add("hidden");

  photosPage.classList.remove("hidden");

  rebuildPhotos();

  startOnlineCounter();

}
  /* =====================================================
   REPLACE PHOTO DISPLAY FUNCTION
===================================================== */

function showLivePhotos(){

  welcomeScreen.classList.add("hidden");

  incomingCall.classList.add("hidden");

  redLiveVideoPage.classList.add("hidden");

  blackLivePage.classList.add("hidden");

  insufficientPage.classList.add("hidden");

  photosPage.classList.remove("hidden");

  createPhotos();

  chooseOfflineProfiles();

  applyOfflineStatus();

  startOnlineCounter();

}


/* =====================================================
   MAKE PHOTO CARDS CLICKABLE AGAIN
===================================================== */

function refreshPhotoClicks(){

  const cards =
    document.querySelectorAll(
      ".photoCard"
    );

  cards.forEach(
    function(card){

      card.onclick =
        function(){

          openPaymentPage();

        };

    }
  );

}


/* =====================================================
   FIX OFFLINE AFTER PHOTO CREATION
===================================================== */

const oldCreatePhotos =
  createPhotos;

function createPhotosAndStatus(){

  oldCreatePhotos();

  chooseOfflineProfiles();

  applyOfflineStatus();

  refreshPhotoClicks();

}


/* =====================================================
   FINAL PHOTO FUNCTION
===================================================== */

function finalShowPhotos(){

  welcomeScreen.classList.add("hidden");

  incomingCall.classList.add("hidden");

  redLiveVideoPage.classList.add("hidden");

  blackLivePage.classList.add("hidden");

  insufficientPage.classList.add("hidden");

  photosPage.classList.remove("hidden");

  oldCreatePhotos();

  chooseOfflineProfiles();

  applyOfflineStatus();

  refreshPhotoClicks();

  startOnlineCounter();

}


/* =====================================================
   UPDATE FUNCTIONS THAT RETURN TO PHOTOS
===================================================== */

function goToPhotos(){

  finalShowPhotos();

}


/* =====================================================
   FINAL INSUFFICIENT FLOW
===================================================== */

function finishInsufficient(){

  if(insufficientTimeout){

    clearInterval(
      insufficientTimeout
    );

  }

  insufficientPage.classList.add(
    "hidden"
  );

  finalShowPhotos();

}


/* =====================================================
   SECONDARY CALL TIMER
===================================================== */

function scheduleNextCall(){

  if(callTimer){
    clearTimeout(callTimer);
  }

  const delay =
    25000 +
    Math.floor(
      Math.random() * 25000
    );

  callTimer =
    setTimeout(
      function(){

        showIncomingCall();

      },
      delay
    );

}


/* =====================================================
   KEEP CALL IMAGE CORRECT
===================================================== */

function setCaller(index){

  if(
    index < 0 ||
    index >= imageFiles.length
  ){

    index = 0;

  }

  const profile =
    getProfile(index);

  callerName.textContent =
    profile.name;

  callerImage.src =
    IMAGE_BASE +
    encodeURIComponent(
      imageFiles[index]
    );

  currentCallerIndex =
    index;

}
  /* =====================================================
   IMAGE ERROR HANDLING
===================================================== */

function addImageErrorHandling(){

  const images =
    document.querySelectorAll(
      ".profile-photo"
    );

  images.forEach(
    function(img){

      img.addEventListener(
        "error",
        function(){

          img.style.background =
            "#151515";

          img.alt =
            "Live profile";

        }
      );

    }
  );

}


/* =====================================================
   CALLER IMAGE ERROR
===================================================== */

callerImage.addEventListener(
  "error",
  function(){

    callerImage.style.background =
      "#151515";

  }
);


/* =====================================================
   REFRESH ALL PHOTO UI
===================================================== */

function refreshPhotoUI(){

  oldCreatePhotos();

  chooseOfflineProfiles();

  applyOfflineStatus();

  refreshPhotoClicks();

  addImageErrorHandling();

}


/* =====================================================
   PHOTO CLICK HANDLER
===================================================== */

photoGrid.addEventListener(
  "click",
  function(event){

    const card =
      event.target.closest(
        ".photoCard"
      );

    if(!card){
      return;
    }

    const index =
      Number(
        card.dataset.index
      );

    if(
      Number.isInteger(index)
    ){

      currentLiveImage =
        imageFiles[index];

    }

    openPaymentPage();

  }
);


/* =====================================================
   OPEN PAYMENT WITH CURRENT REF
===================================================== */

function openPaymentPage(){

  let url =
    "payment.html";

  if(employee){

    url +=
      "?employee=" +
      encodeURIComponent(
        employee
      );

  }
  else if(ref){

    url +=
      "?ref=" +
      encodeURIComponent(
        ref
      );

  }

  window.location.href =
    url;

}


/* =====================================================
   START PAGE
===================================================== */

function initializePage(){

  refreshPhotoUI();

  startOnlineCounter();

  startOfflineRotation();

  startWelcomeFlow();

}


/* =====================================================
   PAGE READY
===================================================== */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initializePage
  );

}
else{

  initializePage();

}
  /* =====================================================
   EXTRA MOBILE TOUCH BEHAVIOUR
===================================================== */

let touchStartTime = 0;


photoGrid.addEventListener(
  "touchstart",
  function(){

    touchStartTime =
      Date.now();

  },
  {
    passive:true
  }
);


/* =====================================================
   PREVENT ACCIDENTAL DOUBLE ACTION
===================================================== */

let lastPaymentOpen = 0;


function safeOpenPayment(){

  const now =
    Date.now();

  if(
    now - lastPaymentOpen <
    800
  ){

    return;

  }

  lastPaymentOpen =
    now;

  openPaymentPage();

}


/* =====================================================
   CALL BUTTON SAFETY
===================================================== */

let callActionLocked = false;


function lockCallAction(){

  if(callActionLocked){
    return true;
  }

  callActionLocked = true;

  setTimeout(
    function(){

      callActionLocked = false;

    },
    1200
  );

  return false;

}


/* =====================================================
   SAFE ANSWER
===================================================== */

function safeAnswerCall(){

  if(lockCallAction()){
    return;
  }

  answerCall();

}


/* =====================================================
   SAFE DECLINE
===================================================== */

function safeDeclineCall(){

  if(lockCallAction()){
    return;
  }

  declineCall();

}


/* =====================================================
   REASSIGN BUTTONS
===================================================== */

answerButton.onclick =
  safeAnswerCall;

declineButton.onclick =
  safeDeclineCall;


/* =====================================================
   DISABLE DRAGGING OF IMAGES
===================================================== */

document.addEventListener(
  "dragstart",
  function(event){

    if(
      event.target.tagName ===
      "IMG"
    ){

      event.preventDefault();

    }

  }
);


/* =====================================================
   PREVENT CONTEXT MENU ON PHOTO CARDS
===================================================== */

photoGrid.addEventListener(
  "contextmenu",
  function(event){

    event.preventDefault();

  }
);


/* =====================================================
   KEEP SCREEN BLACK WHILE LOADING
===================================================== */

window.addEventListener(
  "load",
  function(){

    document.body.style.background =
      "#000";

    setTimeout(
      function(){

        document.body.style.background =
          "#000";

      },
      100
    );

  }
);
  /* =====================================================
   FINAL FLOW CONTROL
===================================================== */

function returnToLivePhotos(){

  if(
    insufficientTimeout
  ){

    clearInterval(
      insufficientTimeout
    );

  }

  if(
    sampleTimer
  ){

    clearTimeout(
      sampleTimer
    );

  }

  if(
    callTimer
  ){

    clearTimeout(
      callTimer
    );

  }

  if(
    redLiveVideo
  ){

    redLiveVideo.pause();

  }

  if(
    blackLiveSoundVideo
  ){

    blackLiveSoundVideo.pause();

  }

  finalShowPhotos();

}


/* =====================================================
   WHEN INSUFFICIENT PAGE FINISHES
===================================================== */

function runInsufficientCountdown(){

  let seconds = 2;

  insufficientTimer.textContent =
    "Continuing in " +
    seconds +
    "...";

  if(insufficientTimeout){

    clearInterval(
      insufficientTimeout
    );

  }

  insufficientTimeout =
    setInterval(
      function(){

        seconds--;

        if(seconds <= 0){

          clearInterval(
            insufficientTimeout
          );

          insufficientTimer.textContent =
            "Loading...";

          setTimeout(
            function(){

              returnToLivePhotos();

            },
            150
          );

        }
        else{

          insufficientTimer.textContent =
            "Continuing in " +
            seconds +
            "...";

        }

      },
      1000
    );

}


/* =====================================================
   REPLACE INSUFFICIENT FUNCTION
===================================================== */

function showInsufficient(){

  hideAllScreens();

  insufficientPage.classList.remove(
    "hidden"
  );

  runInsufficientCountdown();

}


/* =====================================================
   SAMPLE COMPLETE FLOW
===================================================== */

function completeSampleFlow(){

  if(
    redLiveVideo
  ){

    redLiveVideo.pause();

    redLiveVideo.removeAttribute(
      "src"
    );

    redLiveVideo.load();

  }

  showBlackLive(5000);

}


/* =====================================================
   SAMPLE VIDEO START
===================================================== */

function playSampleFromCall(){

  hideAllScreens();

  redLiveVideoPage.classList.remove(
    "hidden"
  );

  redLiveVideo.src =
    VIDEO_URL;

  redLiveVideo.currentTime =
    10;

  redLiveVideo.muted =
    false;

  redLiveVideo.volume =
    1;

  const promise =
    redLiveVideo.play();

  if(promise){

    promise.catch(
      function(){

        redLiveVideo.controls =
          true;

      }
    );

  }

  if(sampleTimer){

    clearTimeout(
      sampleTimer
    );

  }

  sampleTimer =
    setTimeout(
      completeSampleFlow,
      7000
    );

}


/* =====================================================
   FINAL ANSWER CALL FLOW
===================================================== */

function answerCallFinal(){

  if(lockCallAction()){

    return;

  }

  incomingCall.classList.add(
    "hidden"
  );

  const watched =
    localStorage.getItem(
      SAMPLE_KEY
    );

  if(!watched){

    localStorage.setItem(
      SAMPLE_KEY,
      "1"
    );

    playSampleFromCall();

  }
  else{

    showBlackLive(2000);

  }

}


/* =====================================================
   FINAL DECLINE FLOW
===================================================== */

function declineCallFinal(){

  if(lockCallAction()){

    return;

  }

  incomingCall.classList.add(
    "hidden"
  );

  returnToLivePhotos();

}


/* =====================================================
   FINAL BUTTON ASSIGNMENT
===================================================== */

answerButton.onclick =
  answerCallFinal;

declineButton.onclick =
  declineCallFinal;
  /* =====================================================
   FINAL CHECK
===================================================== */

function finalCheck(){

  /*
    There must be exactly 32 image files.
  */

  if(
    imageFiles.length !== 32
  ){

    console.warn(
      "Expected 32 images but found:",
      imageFiles.length
    );

  }

  /*
    Build all 32 cards.
  */

  oldCreatePhotos();

  chooseOfflineProfiles();

  applyOfflineStatus();

  refreshPhotoClicks();

  addImageErrorHandling();

}


/* =====================================================
   INITIAL PAGE SETUP
===================================================== */

function bootWebsite(){

  finalCheck();

  updateOnlineNumber();

  startOnlineCounter();

  startOfflineRotation();

  welcomeScreen.classList.remove(
    "hidden"
  );

  photosPage.classList.add(
    "hidden"
  );

  incomingCall.classList.add(
    "hidden"
  );

  redLiveVideoPage.classList.add(
    "hidden"
  );

  blackLivePage.classList.add(
    "hidden"
  );

  insufficientPage.classList.add(
    "hidden"
  );

  setTimeout(
    function(){

      showIncomingCall();

    },
    3000
  );

}


/* =====================================================
   SAFETY: DO NOT START TWICE
===================================================== */

let websiteStarted = false;


function startWebsiteOnce(){

  if(websiteStarted){

    return;

  }

  websiteStarted = true;

  bootWebsite();

}


/* =====================================================
   START
===================================================== */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    startWebsiteOnce
  );

}
else{

  startWebsiteOnce();

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(callTimer){

      clearTimeout(
        callTimer
      );

    }

    if(onlineTimer){

      clearInterval(
        onlineTimer
      );

    }

    if(offlineTimer){

      clearInterval(
        offlineTimer
      );

    }

    if(welcomeTimer){

      clearTimeout(
        welcomeTimer
      );

    }

    if(sampleTimer){

      clearTimeout(
        sampleTimer
      );

    }

    if(insufficientTimeout){

      clearInterval(
        insufficientTimeout
      );

    }

  }
);

</script>

</body>
</html>
