<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Referral Website</title>

<style>

/* ==========================================
   BASIC
========================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

.card {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}


/* ==========================================
   SAMPLE PAGE
========================================== */

#samplePage {

  display: none;

  width: 100%;
  min-height: calc(100vh - 30px);

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.sample-title {

  font-size: 22px;
  font-weight: bold;

  margin-bottom: 15px;
}

.sample-subtitle {

  color: #aaa;

  font-size: 14px;

  margin-bottom: 15px;
}

#sampleVideo {

.sample-timer {
  display: none !important;
}

  width: 100%;
  max-width: 450px;

  max-height: 70vh;

  display: block;

  background: #111;

  border-radius: 14px;

  object-fit: contain;

}

.sample-timer {

  margin-top: 12px;

  color: #aaa;

  font-size: 13px;

.sample-timer {
  display: none !important;
}

}


/* ==========================================
   INSUFFICIENT PAGE
========================================== */

#insufficientPage {

  display: none;

  width: 100%;

  min-height: calc(100vh - 30px);

  align-items: center;

  justify-content: center;

  text-align: center;
}

.insufficient-box {

  width: 100%;

  background: #111;

  border: 1px solid #292929;

  border-radius: 14px;

  padding: 30px 20px;
}

.insufficient-title {

  font-size: 25px;

  font-weight: bold;

  color: #ff5252;

  margin-bottom: 10px;
}

.insufficient-text {

  color: #aaa;

  font-size: 14px;

  line-height: 1.5;
}


/* ==========================================
   PHOTOS PAGE
========================================== */

#photosPage {

  display: none;

  width: 100%;
}

.top-bar {

  width: 100%;

  display: flex;

  justify-content: flex-start;

  align-items: center;

  margin-bottom: 15px;
}

.online-box {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  background: #111;

  border: 1px solid #292929;

  color: #fff;

  padding: 7px 11px;

  border-radius: 8px;

  font-size: 13px;

  font-weight: bold;
}

.online-dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #22c55e;

  animation: onlineBlink 1.2s infinite;
}

@keyframes onlineBlink {

  50% {
    opacity: .35;
  }

}

h1 {

  margin: 8px 0 5px;

  font-size: 25px;
}

.subtitle {

  color: #aaa;

  margin: 0 0 15px;

  font-size: 14px;
}

#livePhotos {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 14px;

  margin-top: 15px;
}

.live-photo {

  position: relative;

  overflow: hidden;

  border-radius: 12px;

  background: #111;

  cursor: pointer;

  min-height: 250px;

  padding-bottom: 45px;

  border: 1px solid #1e1e1e;

  transition: transform .15s ease;
}

.live-photo:active {

  transform: scale(.98);
}

.live-photo img {

  display: block;

  width: 100%;

  height: 205px;

  object-fit: cover;

  background: #111;
}

.photo-name {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 0;

  min-height: 45px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 7px 5px;

  background: #111;

  color: #fff;

  font-size: 13px;

  font-weight: bold;

  text-align: center;
}

.live-badge {

  position: absolute;

  top: 7px;

  left: 7px;

  z-index: 5;

  background: #f0184c;

  color: #fff;

  padding: 6px 9px;

  border-radius: 7px;

  font-size: 11px;

  font-weight: bold;
}

.live-badge::before {

  content: "●";

  margin-right: 4px;
}

.live-status {

  position: absolute;

  top: 7px;

  right: 7px;

  z-index: 5;

  display: flex;

  align-items: center;

  gap: 5px;

  background: rgba(0,0,0,.82);

  padding: 5px 7px;

  border-radius: 7px;

  font-size: 10px;
}

.live-dot {

  width: 8px;

  height: 8px;

  flex-shrink: 0;

  border-radius: 50%;

  background: #22c55e;

  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {

  50% {
    opacity: .35;
  }

}

.loading {

  grid-column: 1 / -1;

  padding: 45px 20px;

  color: #aaa;

  text-align: center;
}

.error {

  grid-column: 1 / -1;

  padding: 35px 15px;

  color: #ff6b6b;

  text-align: center;

  line-height: 1.5;
}


/* ==========================================
   INCOMING CALL
========================================== */

#incomingCall {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 99999;

  background:
    radial-gradient(
      circle at center,
      #202020 0%,
      #080808 55%,
      #000 100%
    );

  align-items: center;

  justify-content: center;

  padding: 20px;

  text-align: center;
}

.call-box {

  width: 100%;

  max-width: 360px;

  background: #111;

  border: 1px solid #292929;

  border-radius: 22px;

  padding: 28px 20px 25px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.8);

.call-avatar {

  width: 115px;

  height: 115px;

  margin: 0 auto 18px;

  border-radius: 50%;

  overflow: hidden;

  background: #222;

  border: 3px solid #22c55e;

  display: flex;

  align-items: center;

  justify-content: center;
}

.call-avatar img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;
}

.call-incoming {

  color: #22c55e;

  font-size: 14px;

  font-weight: bold;

  margin-bottom: 8px;
}

.call-name {

  font-size: 23px;

  font-weight: bold;

  margin-bottom: 7px;
}

.call-type {

  color: #aaa;

  font-size: 13px;

  margin-bottom: 25px;
}

.call-buttons {

  display: flex;

  justify-content: center;

  gap: 35px;
}

.call-action {

  border: none;

  width: 65px;

  height: 65px;

  border-radius: 50%;

  color: #fff;

  font-size: 27px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;
}

.call-answer {

  background: #22c55e;
}

.call-end {

  background: #ef4444;

  transform: rotate(135deg);

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 380px) {

  body {

    padding: 12px;

  }

  #livePhotos {

    gap: 10px;

  }

  .live-photo {

    min-height: 215px;

  }

  .live-photo img {

    height: 170px;

  }

  .photo-name {

    font-size: 12px;

  }

}

  <script>
/* ==========================================
   LOCAL STORAGE
========================================== */

/*
  We use localStorage only to remember
  that the visitor has already entered
  the first sample flow.

  This prevents the initial call/sample
  sequence from restarting from the
  beginning after a normal reload.
*/

const FLOW_STORAGE_KEY =
  "myReferralFlowStarted";


/* ==========================================
   BASIC PAGE HELPERS
========================================== */

function hideAllPages() {

  samplePage.style.display =
    "none";

  insufficientPage.style.display =
    "none";

  photosPage.style.display =
    "none";

  incomingCall.style.display =
    "none";

}


/* ==========================================
   SHOW SAMPLE PAGE
========================================== */

function showSamplePage() {

  hideAllPages();

  samplePage.style.display =
    "flex";

}


/* ==========================================
   SHOW PHOTOS PAGE
========================================== */

function showPhotosPage() {

  hideAllPages();

  photosPage.style.display =
    "block";

}


/* ==========================================
   SHOW INSUFFICIENT PAGE
========================================== */

function showInsufficientPage() {

  hideAllPages();

  insufficientPage.style.display =
    "flex";

}


/* ==========================================
   CLEAR ALL TIMERS
========================================== */

function clearAllTimers() {

  clearInterval(
    sampleTimerInterval
  );

  clearTimeout(
    insufficientTimer
  );

  clearTimeout(
    photoWaitTimer
  );

  sampleTimerInterval =
    null;

  insufficientTimer =
    null;

  photoWaitTimer =
    null;

}


/* ==========================================
   STOP SAMPLE VIDEO
========================================== */

function stopSampleVideo() {

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (error) {

    console.log(
      "Video reset error:",
      error
    );

  }

}


/* ==========================================
   IMAGE URL
========================================== */

function getImageUrl(fileName) {

  return (
    "https://raw.githubusercontent.com/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/" +
    GITHUB_BRANCH +
    "/" +
    encodeURIComponent(fileName)
  );

}


/* ==========================================
   LOAD PHOTOS FROM GITHUB
========================================== */

async function loadPhotos() {

  livePhotos.innerHTML = "";

  const loading =
    document.createElement("div");

  loading.className =
    "loading";

  loading.textContent =
    "Loading live now...";

  livePhotos.appendChild(
    loading
  );

  try {

    const response =
      await fetch(
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPO +
        "/contents?ref=" +
        GITHUB_BRANCH
      );

    if (!response.ok) {

      throw new Error(
        "GitHub request failed: " +
        response.status
      );

    }

    const files =
      await response.json();

    if (!Array.isArray(files)) {

      throw new Error(
        "GitHub did not return a file list."
      );

    }


    /* ================================
       FIND IMAGE FILES
    ================================= */

    const imageFiles =
      files.filter(
        function(file) {

          if (
            !file ||
            !file.name
          ) {

            return false;

          }

          const name =
            file.name.toLowerCase();

          return (
            name.endsWith(".jpg") ||
            name.endsWith(".jpeg") ||
            name.endsWith(".png") ||
            name.endsWith(".webp") ||
            name.endsWith(".gif")
          );

        }
      );


    /*
      Save the photos globally so
      incoming calls can use them.
    */

    availablePhotos =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    livePhotos.innerHTML = "";


    /* ================================
       NO PHOTOS
    ================================= */

    if (
      availablePhotos.length === 0
    ) {

      livePhotos.innerHTML =
        '<div class="error">' +
        'No photos were found in the repository.' +
        '<br><br>' +
        'Make sure your image files are in the main repository folder.' +
        '</div>';

      return;

    }


    /* ================================
       CREATE PHOTO CARDS
    ================================= */

    availablePhotos.forEach(
      function(file, index) {

        createPhotoCard(
          file,
          index
        );

      }
    );


    photosLoaded =
      true;


    /*
      Make sure every new photo
      has a click event.
    */

    attachPhotoClickEvents();


  } catch (error) {

    console.error(
      "Photo loading error:",
      error
    );

    livePhotos.innerHTML =
      '<div class="error">' +
      'Unable to load live photos right now.' +
      '<br><br>' +
      'Please try again.' +
      '</div>';

  }

}


/* ==========================================
   CREATE PHOTO CARD
========================================== */

function createPhotoCard(
  file,
  index
) {

  const card =
    document.createElement("div");

  card.className =
    "live-photo";


  /* ================================
     IMAGE
  ================================= */

  const image =
    document.createElement("img");

  image.loading =
    "lazy";

  image.alt =
    PHOTO_NAMES[index] ||
    "Live photo";

  image.src =
    file.download_url ||
    getImageUrl(file.name);


  image.onerror =
    function() {

      image.alt =
        "Photo unavailable";

    };


  /* ================================
     LIVE BADGE
  ================================= */

  const badge =
    document.createElement("div");

  badge.className =
    "live-badge";

  badge.textContent =
    "LIVE";


  /* ================================
     LIVE STATUS
  ================================= */

  const status =
    document.createElement("div");

  status.className =
    "live-status";

  status.innerHTML =
    '<span class="live-dot"></span>' +
    '<span>Live now</span>';


  /* ================================
     PHOTO NAME
  ================================= */

  const name =
    document.createElement("div");

  name.className =
    "photo-name";

  name.textContent =
    PHOTO_NAMES[index] ||
    "Live";


  /* ================================
     BUILD CARD
  ================================= */

  card.appendChild(
    image
  );

  card.appendChild(
    badge
  );

  card.appendChild(
    status
  );

  card.appendChild(
    name
  );


  livePhotos.appendChild(
    card
  );

}


/* ==========================================
   PHOTO CLICK
========================================== */

function handlePhotoClick(card) {

  if (!card) {

    return;

  }


  /*
    IMPORTANT:
    Tapping any live photo goes
    directly to the payment page.

    It does NOT open another
    incoming call.
  */

  openPaymentPage();

}


/* ==========================================
   ATTACH PHOTO CLICK EVENTS
========================================== */

function attachPhotoClickEvents() {

  const cards =
    document.querySelectorAll(
      ".live-photo"
    );


  cards.forEach(
    function(card) {

      if (
        card.dataset.clickAttached ===
        "true"
      ) {

        return;

      }


      card.dataset.clickAttached =
        "true";


      card.addEventListener(
        "click",
        function() {

          handlePhotoClick(
            card
          );

        }
      );

    }
  );

}


/* ==========================================
   PAYMENT PAGE
========================================== */

function openPaymentPage() {

  /*
    Stop the 10-second timer.
  */

  clearTimeout(
    photoWaitTimer
  );


  /*
    Open your existing payment page.
  */

  window.location.href =
    PAYMENT_PAGE_URL;

}
  /* ==========================================
   GET NEXT UNIQUE INCOMING-CALL PHOTO
========================================== */

function getNextIncomingPhoto() {

  if (
    !availablePhotos ||
    availablePhotos.length === 0
  ) {

    return null;

  }


  /*
    Always move forward.

    When we reach the end,
    start again from the beginning.
  */

  const photo =
    availablePhotos[
      incomingPhotoIndex %
      availablePhotos.length
    ];


  incomingPhotoIndex++;


  return photo;

}


/* ==========================================
   SHOW INCOMING CALL
========================================== */

function showIncomingCall() {

  clearTimeout(
    photoWaitTimer
  );


  /*
    Get a new photo for every
    incoming call.
  */

  const photo =
    getNextIncomingPhoto();


  if (
    photo
  ) {

    callPhoto.src =
      photo.download_url ||
      getImageUrl(photo.name);

  } else {

    callPhoto.src =
      "";

  }


  /*
    Get a matching name.
  */

  const photoIndex =
    Math.max(
      0,
      incomingPhotoIndex - 1
    );


  callName.textContent =
    PHOTO_NAMES[
      photoIndex %
      PHOTO_NAMES.length
    ] ||
    "Live Video";


  /*
    Show the incoming call.
  */

  incomingCall.style.display =
    "flex";

}


/* ==========================================
   HIDE INCOMING CALL
========================================== */

function hideIncomingCall() {

  incomingCall.style.display =
    "none";

}


/* ==========================================
   SHOW FIRST INCOMING CALL
========================================== */

function showFirstIncomingCall() {

  currentFlow =
    "FIRST_CALL";

  showIncomingCall();

}


/* ==========================================
   INSUFFICIENT MINUTES
========================================== */

function insufficientThen(
  callback
) {

  clearTimeout(
    insufficientTimer
  );


  showInsufficientPage();


  insufficientTimer =
    setTimeout(
      function() {

        if (
          typeof callback ===
          "function"
        ) {

          callback();

        }

      },
      INSUFFICIENT_DURATION
    );

}


/* ==========================================
   START SAMPLE
========================================== */

function startSample() {

  /*
    Prevent duplicate starts.
  */

  if (
    sampleRunning
  ) {

    return;

  }


  /*
    Mark the sample as started.

    This state survives a normal
    page reload.
  */

  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-seen"
  );


  clearAllTimers();


  currentFlow =
    "SAMPLE";


  sampleRunning =
    true;


  secondsLeft =
    SAMPLE_DURATION;


  updateSampleTimer();


  showSamplePage();


  /*
    Reset video.
  */

  try {

    sampleVideo.pause();

    sampleVideo.currentTime =
      0;

  } catch (error) {

    console.log(
      "Sample video reset error:",
      error
    );

  }


  /*
    Start video.
  */

  const playPromise =
    sampleVideo.play();


  if (
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ) {

    playPromise.catch(
      function(error) {

        console.log(
          "Autoplay was blocked:",
          error
        );

      }
    );

  }


  /*
    Start the 20-second countdown.
  */

  sampleTimerInterval =
    setInterval(
      function() {

        if (
          !sampleRunning
        ) {

          return;

        }


        secondsLeft--;


        if (
          secondsLeft > 0
        ) {

          updateSampleTimer();

        }


        if (
          secondsLeft <= 0
        ) {

          finishSample();

        }

      },
      1000
    );

}


/* ==========================================
   UPDATE SAMPLE TIMER
========================================== */

function updateSampleTimer() {

  sampleTimer.textContent =
    "Sample: " +
    secondsLeft +
    " seconds";

}


/* ==========================================
   FINISH SAMPLE
========================================== */

function finishSample() {

  if (
    !sampleRunning
  ) {

    return;

  }


  sampleRunning =
    false;


  clearInterval(
    sampleTimerInterval
  );


  sampleTimerInterval =
    null;


  try {

    sampleVideo.pause();

  } catch (error) {

    console.log(
      error
    );

  }


  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-completed"
  );


  currentFlow =
    "AFTER_SAMPLE";


  insufficientThen(
    function() {

      currentFlow =
        "SECOND_CALL";

      showIncomingCall();

    }
  );

}
            /* ==========================================
   FIRST CALL PHOTO FALLBACK
========================================== */

function updateIncomingCallPhoto() {

  const photo =
    getNextIncomingPhoto();

  if (!photo) {

    callPhoto.removeAttribute(
      "src"
    );

    callName.textContent =
      "Live Video";

    return;

  }

  const imageUrl =
    photo.download_url ||
    getImageUrl(
      photo.name
    );

  callPhoto.src =
    imageUrl;

  const index =
    availablePhotos.indexOf(
      photo
    );

  callName.textContent =
    PHOTO_NAMES[index] ||
    "Live Video";

}


/* ==========================================
   SHOW NEW INCOMING CALL
========================================== */

function showNewIncomingCall() {

  hideIncomingCall();

  updateIncomingCallPhoto();

  incomingCall.style.display =
    "flex";

}


/* ==========================================
   FIRST CALL OVERRIDE
========================================== */

function showFirstIncomingCall() {

  currentFlow =
    "FIRST_CALL";

  showNewIncomingCall();

}


/* ==========================================
   SECOND CALL OVERRIDE
========================================== */

function showSecondIncomingCall() {

  currentFlow =
    "SECOND_CALL";

  showNewIncomingCall();

}


/* ==========================================
   LATER CALL OVERRIDE
========================================== */

function showLaterIncomingCall() {

  currentFlow =
    "LATER_CALL";

  showNewIncomingCall();

}


/* ==========================================
   ANSWER FLOW
========================================== */

answerCall.onclick =
  function() {

    clearTimeout(
      photoWaitTimer
    );

    hideIncomingCall();


    /* FIRST CALL */

    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      currentFlow =
        "SAMPLE";

      startSample();

      return;

    }


    /* SECOND CALL */

    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      currentFlow =
        "SECOND_CALL_ANSWERED";

      insufficientThen(
        function() {

          enterPhotosPage();

        }
      );

      return;

    }


    /* LATER CALL */

    if (
      currentFlow ===
      "LATER_CALL"
    ) {

      currentFlow =
        "LATER_CALL_ANSWERED";

      insufficientThen(
        function() {

          enterPhotosPage();

        }
      );

      return;

    }

  };


/* ==========================================
   REJECT FLOW
========================================== */

rejectCall.onclick =
  function() {

    clearTimeout(
      photoWaitTimer
    );

    hideIncomingCall();


    if (
      currentFlow ===
      "LATER_CALL"
    ) {

      enterPhotosPage();

      return;

    }


    if (
      currentFlow ===
      "FIRST_CALL"
    ) {

      showFirstIncomingCall();

      return;

    }


    if (
      currentFlow ===
      "SECOND_CALL"
    ) {

      showSecondIncomingCall();

      return;

    }

  };


/* ==========================================
   INSUFFICIENT PAGE COMPLETE
========================================== */

function showInsufficientThenPhotos() {

  insufficientThen(
    function() {

      enterPhotosPage();

    }
  );

}


/* ==========================================
   SAMPLE COMPLETE FLOW
========================================== */

function afterSampleComplete() {

  currentFlow =
    "AFTER_SAMPLE";


  insufficientThen(
    function() {

      showSecondIncomingCall();

    }
  );

}
            /* ==========================================
   FIRST CALL PHOTO FALLBACK
========================================== */

function updateIncomingCallPhoto() {

  const photo =
    getNextIncomingPhoto();

  if (!photo) {

    callPhoto.removeAttribute(
      "src"
    );

    callName.textContent =
      "Live Video";

    return;

  }

  const imageUrl =
    photo.download_url ||
    getImageUrl(

    );

  callPhoto.src =
    imageUrl;

  const index =
    availablePhotos.indexOf(
      photo
    );

  callName.textContent =
    PHOTO_NAMES[index] ||
    "Live Video";

}


/* ==========================================
   SHOW NEW INCOMING CALL
========================================== */

function showNewIncomingCall() {

  hideIncomingCall();

  updateIncomingCallPhoto();

  incomingCall.style.display =
    "flex";

/* ==========================================
   FIRST CALL OVERRIDE
========================================== */

function showFirstIncomingCall() {

  currentFlow =
    "FIRST_CALL";

  showNewIncomingCall();

/* ==========================================
   SECOND CALL OVERRIDE
========================================== */

function showSecondIncomingCall() {

  currentFlow =

function showLaterIncomingCall() {

  currentFlow =

  showNewIncomingCall();

  sampleRunning =
    false;

    sampleTimerInterval

  sampleTimerInterval =
    null;

    page reload does NOT send the
    visitor back to the beginning
    of the sample flow.

  localStorage.setItem(
    FLOW_STORAGE_KEY,
    "sample-completed"
  );

  /*
    First sample ends with
    Insufficient minutes.

  currentFlow =
    "AFTER_SAMPLE";

  insufficientThen(
    function() {

      /*
        After insufficient minutes,
        show the SECOND incoming call.

        A new photo is automatically
        selected.
      */

      currentFlow =
        "SECOND_CALL";

      showIncomingCall();

    }
  );

}
