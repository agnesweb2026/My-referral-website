<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Referral Website</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

body {
  padding: 20px 15px;
}

.card {
  width: 100%;
  max-width: 450px;
  margin: auto;
}

h1 {
  margin-top: 10px;
}

p {
  color: #ccc;
}


/* =====================================================
   AGE GATE
===================================================== */

#ageGate {
  position: fixed;
  inset: 0;

  z-index: 999999;

  width: 100%;
  height: 100%;

  background: #111;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.age-box {
  width: 100%;
  max-width: 380px;

  text-align: center;
}

.age-icon {
  font-size: 60px;
  margin-bottom: 10px;
}

.age-box h1 {
  font-size: 42px;

  margin: 10px 0 25px;

  color: #fff;
}

.age-box p {
  font-size: 18px;

  color: #ccc;

  margin-bottom: 30px;
}

.age-box button {
  border: 0;

  border-radius: 10px;

  padding: 14px 22px;

  margin: 8px;

  color: #fff;

  font-weight: bold;

  font-size: 15px;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}

.enter-button {
  background: #22c55e;
}

.exit-button {
  background: #666;
}

.age-box button:active {
  transform: scale(.97);
}


/* =====================================================
   INCOMING CALL
===================================================== */

#incomingCall {
  position: fixed;
  inset: 0;

  z-index: 90000;

  display: none;

  width: 100%;
  height: 100%;

  background: #17161b;

  overflow: hidden;
}

.call-background {
  position: absolute;
  inset: -30px;

  background:
    radial-gradient(
      circle at center,
      #5d5050 0%,
      #302b2e 45%,
      #101014 100%
    );

  filter: blur(20px);

  transform: scale(1.1);
}

.call-dark-overlay {
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,.5);
}

.call-content {
  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;
}

.profile-ring {
  width: 155px;
  height: 155px;

  border-radius: 50%;

  border: 2px solid rgba(125,80,210,.75);

  display: flex;

  align-items: center;
  justify-content: center;

  box-shadow:
    0 0 0 7px rgba(125,80,210,.08);
}

.profile-photo {
  width: 125px;
  height: 125px;

  border-radius: 50%;

  border: 3px solid #7650c9;

  object-fit: cover;

  background: #211d26;
}

.caller-name {
  margin-top: 12px;

  font-size: 28px;
}

.call-title {
  margin-top: 5px;

  font-size: 13px;

  letter-spacing: 1px;

  color: rgba(255,255,255,.65);
}

.ringing {
  margin-top: 16px;

  color: #b98cff;
}

.ringing-dot {
  display: inline-block;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #a66cff;

  margin-right: 6px;

  animation: ringBlink 1s infinite;
}

@keyframes ringBlink {

  50% {
    opacity: .2;
  }

}

.call-buttons {
  position: absolute;

  left: 0;
  right: 0;

  bottom: 95px;

  display: flex;

  justify-content: center;

  gap: 70px;
}

.call-option {
  display: flex;

  flex-direction: column;

  align-items: center;
}

.call-button {
  width: 78px;
  height: 78px;

  border: 3px solid rgba(255,255,255,.18);

  border-radius: 50%;

  color: #fff;

  font-size: 30px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  touch-action: manipulation;
}

.decline-button {
  background: #ed3b3b;
}

.answer-button {
  background: #14a94b;
}

.call-label {
  margin-top: 8px;

  color: rgba(255,255,255,.72);
}

.swipe-message {
  position: absolute;

  bottom: 38px;

  color: rgba(255,255,255,.3);

  font-size: 12px;
}


/* =====================================================
   VIDEO
===================================================== */

#videoPreview {
  position: fixed;
  inset: 0;

  z-index: 80000;

  display: none;

  width: 100%;
  height: 100%;

  background: #000;

  align-items: center;
  justify-content: center;
}

#previewVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;
}

.preview-counter {
  position: absolute;

  bottom: 20px;

  left: 0;
  right: 0;

  color: #fff;

  text-shadow: 0 1px 3px #000;
}


/* =====================================================
   INSUFFICIENT MINUTES
===================================================== */

#insufficientMinutes {
  position: fixed;
  inset: 0;

  z-index: 85000;

  display: none;

  width: 100%;
  height: 100%;

  background: #111;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.insufficient-box {
  max-width: 350px;
}


/* =====================================================
   GALLERY
===================================================== */

#livePhotos {
  display: none;

  grid-template-columns: 1fr 1fr;

  gap: 18px;

  margin-top: 25px;
}

.live-photo {
  position: relative;

  overflow: hidden;

  border-radius: 12px;

  background: #111;

  cursor: pointer;

  min-height: 255px;

  padding-bottom: 45px;
}

.live-photo img {
  display: block;

  width: 100%;
  height: 210px;

  object-fit: cover;

  background: #111;
}


/* =====================================================
   NAME BELOW PHOTO
===================================================== */

.photo-name {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 45px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 8px 5px;

  background: #111;

  color: #fff;

  font-size: 14px;

  font-weight: bold;

  line-height: 1.2;

  text-align: center;
}


/* =====================================================
   LIVE BADGE
===================================================== */

.live-badge {
  position: absolute;

  top: 8px;
  left: 8px;

  z-index: 5;

  background: #f0184c;

  color: #fff;

  padding: 7px 10px;

  border-radius: 8px;

  font-size: 12px;

  font-weight: bold;
}

.live-badge::before {
  content: "●";

  margin-right: 5px;
}


/* =====================================================
   LIVE STATUS
===================================================== */

.live-status {
  position: absolute;

  top: 8px;
  right: 8px;

  z-index: 5;

  display: flex;

  align-items: center;

  gap: 6px;

  background: rgba(0,0,0,.82);

  padding: 6px 8px;

  border-radius: 8px;

  font-size: 11px;

  white-space: nowrap;
}

.live-dot {
  width: 10px;
  height: 10px;

  flex-shrink: 0;

  border-radius: 50%;

  background: #22c55e;

  animation: liveBlink 1s infinite;
}

@keyframes liveBlink {

  50% {
    opacity: .2;
  }

}

.loading {
  grid-column: 1 / -1;

  padding: 30px;

  color: #aaa;
}

.error {
  grid-column: 1 / -1;

  padding: 30px;

  color: #ff6b6b;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 380px) {

  #livePhotos {
    gap: 12px;
  }

  .live-photo {
    min-height: 215px;
  }

  .live-photo img {
    height: 170px;
  }

  .call-buttons {
    gap: 55px;
  }

  .call-button {
    width: 70px;
    height: 70px;
  }

  .photo-name {
    font-size: 13px;
  }

}

</style>
</head>


<body>

<!-- =====================================================
     MAIN WEBSITE
===================================================== -->

<div class="card">

  <h1>
    Welcome
  </h1>

    Welcome to my referral website.
  </p>


  <div id="livePhotos">

    <div class="loading">
      Loading photos...
    </div>

  </div>

</div>


<script>


/* =====================================================
   GITHUB
===================================================== */

const GITHUB_OWNER =
  "agnesweb2026";

const GITHUB_REPO =
  "My-referral-website";

const GITHUB_BRANCH =
  "main";


const MAX_PHOTOS =
  24;


/* =====================================================
   YOUR 24 PHOTO NAMES
===================================================== */

const PHOTO_NAMES = [

  "Cute 😍❤️",

  "Becky 💦❤️‍🔥",

  "Dorry 🔥✅",

  "Jenny 💦❤️‍🔥",

  "Caro 💦❤️‍🔥❤️",

  "Juck 💦❤️‍🔥",

  "Bella 🥀👄",

  "Faith 🌟",

  "Chepto 😜🔥",

  "Shelley",

  "Phapy 🥰😍",

  "Chris 💖💘",

  "Juphio 😴💦💦",

  "Judy 💖",

  "Kandy 💦😴",

  "Jennifer ❤️‍🔥🔥",

  "Pento 🥀👄",

  "Shallow ❤️‍🔥🔥🥀",

  "Grees 🌟",

  "Betty 🔥❤️‍🔥",

  "Maria 🌟🥀💦",

  "Kitty 💦❤️",

  "Sweetgy 😍🥰",

  "Fellow 💦❤️"

];


/* =====================================================
   SAMPLE
===================================================== */

const SAMPLE_LINK_ID =
  "referral-001";

const SAMPLE_WATCHED_KEY =
  "sampleWatched_" +
  SAMPLE_LINK_ID;


/* =====================================================
   VARIABLES
===================================================== */

let callers = [];

let lastCaller = -1;


/* =====================================================
   ELEMENTS
===================================================== */

const ageGate =
  document.getElementById(
    "ageGate"
  );

const incomingCall =
  document.getElementById(
    "incomingCall"
  );

const callerPhoto =
  document.getElementById(
    "callerPhoto"
  );

const callerName =
  document.getElementById(
    "callerName"
  );

const videoPreview =
  document.getElementById(
    "videoPreview"
  );

const previewVideo =
  document.getElementById(
    "previewVideo"
  );

const previewSeconds =
  document.getElementById(
    "previewSeconds"
  );

const insufficientMinutes =
  document.getElementById(
    "insufficientMinutes"
  );

const livePhotos =
  document.getElementById(
    "livePhotos"
  );

const answerCall =
  document.getElementById(
    "answerCall"
  );

const declineCall =
  document.getElementById(
    "declineCall"
  );


/* =====================================================
   AGE GATE - DIRECT FUNCTIONS
===================================================== */

function openWebsite() {

  /*
   * Hide the age gate immediately.
   */

  ageGate.style.display =
    "none";

  ageGate.style.visibility =
    "hidden";

  ageGate.style.pointerEvents =
    "none";


  /*
   * If a caller is ready,
   * show incoming call.
   */

  if (callers.length > 0) {

    showRandomCaller();

  } else {

    /*
     * If photos are still loading,
     * show the main page.
     */

    livePhotos.style.display =
      "grid";

  }

}


function exitWebsite() {

  window.location.href =
    "https://www.google.com";

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array) {

  const shuffled =
    [...array];

  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];

  }

  return shuffled;

}


/* =====================================================
   LOAD PHOTOS FROM GITHUB
===================================================== */

async function loadPhotos() {

  livePhotos.innerHTML = `

    <div class="loading">
      Loading photos...
    </div>

  `;


  const apiUrl =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/?ref=" +
    GITHUB_BRANCH;


  try {

    const response =
      await fetch(
        apiUrl,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub error: HTTP " +
        response.status
      );

    }


    const files =
      await response.json();


    if (!Array.isArray(files)) {

      throw new Error(
        "GitHub did not return files."
      );

    }


    /*
     * FIND IMAGE FILES ONLY
     */

    const imageFiles =
      files.filter(
        function(file) {

          return (
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
              .test(file.name)
          );

        }
      );


    /*
     * FIRST 24 IMAGES
     */

    const selectedFiles =
      imageFiles.slice(
        0,
        MAX_PHOTOS
      );


    if (
      selectedFiles.length === 0
    ) {

      livePhotos.innerHTML = `

        <div class="error">

          No photos found.

          <br><br>

          Make sure your images are
          in the main GitHub repository.

        </div>

      `;

      return;

    }


    /*
     * CONNECT NAME TO PHOTO
     */

    callers =
      selectedFiles.map(
        function(file, index) {

          return {

            name:
              PHOTO_NAMES[index] ||
              "Photo",

            photo:
              file.download_url

          };

        }
      );


    /*
     * Shuffle complete objects.
     *
     * This keeps each name attached
     * to its correct photo.
     */

    callers =
      shuffleArray(
        callers
      );


    /*
     * Create gallery.
     */

    createGallery();


    /*
     * Prepare incoming call.
     */

    showRandomCaller();


  } catch (error) {

    console.error(
      "Gallery error:",
      error
    );


    livePhotos.innerHTML = `

      <div class="error">

        Unable to load photos.

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


/* =====================================================
   CREATE GALLERY
===================================================== */

function createGallery() {

  livePhotos.innerHTML =
    "";


  const randomPhotos =
    shuffleArray(
      callers
    );


  randomPhotos.forEach(
    function(person) {


      const box =
        document.createElement(
          "div"
        );


      box.className =
        "live-photo";


      /* =================================
         LIVE BADGE
      ================================= */

      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "live-badge";

      badge.textContent =
        "LIVE";


      /* =================================
         LIVE STATUS
      ================================= */

      const status =
        document.createElement(
          "span"
        );

      status.className =
        "live-status";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "live-dot";


      status.appendChild(
        dot
      );


      status.appendChild(
        document.createTextNode(
          "Live"
        )
      );


      /* =================================
         PHOTO
      ================================= */

      const image =
        document.createElement(
          "img"
        );

      image.src =
        person.photo;

      image.alt =
        person.name;

      image.loading =
        "lazy";


      /* =================================
         NAME BELOW PHOTO
      ================================= */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "photo-name";

      name.textContent =
        person.name;


      /* =================================
         ADD TO PHOTO BOX
      ================================= */

      box.appendChild(
        badge
      );

      box.appendChild(
        status
      );

      box.appendChild(
        image
      );

      box.appendChild(
        name
      );


      /* =================================
         PHOTO CLICK
      ================================= */

      box.addEventListener(
        "click",
        function() {

          window.location.href =
            "payment.html";

        }
      );


      livePhotos.appendChild(
        box
      );

    }
  );

}


/* =====================================================
   RANDOM CALLER
===================================================== */

function showRandomCaller() {

  if (!callers.length) {

    return;

  }


  let randomIndex;


  do {

    randomIndex =
      Math.floor(
        Math.random() *
        callers.length
      );

  } while (
    callers.length > 1 &&
    randomIndex === lastCaller
  );


  lastCaller =
    randomIndex;


  const caller =
    callers[randomIndex];


  callerPhoto.src =
    caller.photo;


  callerPhoto.alt =
    caller.name;


  callerName.textContent =
    caller.name;


  /*
   * Do not force it over the
   * age gate.
   *
   * It is ready behind the gate.
   */

}


/* =====================================================
   SAMPLE CHECK
===================================================== */

function hasWatchedSample() {

  return (
    localStorage.getItem(
      SAMPLE_WATCHED_KEY
    ) === "yes"
  );

}


function markSampleAsWatched() {

  localStorage.setItem(
    SAMPLE_WATCHED_KEY,
    "yes"
  );

}


/* =================================================
