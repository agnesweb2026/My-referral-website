<!DOCTYPE html>
<html lang="en">

<head>

<title>My Referral Website</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.page{
  display:none;
  width:100%;
  min-height:100vh;
  background:#000;
}


/* =========================
   WELCOME
========================= */

#welcomeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:#000;
}

.welcomeTitle{
  font-size:32px;
  font-weight:bold;
  margin-bottom:20px;
}

.loadingText{
  font-size:18px;
  color:#aaa;
}


/* =========================
   LIVE PHOTOS
========================= */

#photosPage{
  padding:12px;
  background:#000;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 4px 14px;
}

.onlineText{
  font-size:14px;
  color:#ddd;
}

.onlineDot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#20e070;
  margin-right:5px;
  animation:blinkGreen 1s infinite;
}

@keyframes blinkGreen{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }
}

.liveTitle{
  font-size:20px;
  font-weight:bold;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.photoCard{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:#111;
  min-height:240px;
  cursor:pointer;
}

.photoCard img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.statusBadge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
  z-index:10;
}

.liveBadge{
  background:#e00000;
  color:#fff;
}

.offlineBadge{
  background:#555;
  color:#fff;
}

.liveDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#25e66d;
  margin-right:4px;
  animation:blinkGreen 1s infinite;
}

.roomClosed{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.62);
  font-size:18px;
  font-weight:bold;
  z-index:7;
}

.photoInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:25px 10px 9px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
  z-index:9;
}

.photoName{
  font-size:16px;
  font-weight:bold;
}

.photoAge{
  margin-top:3px;
  font-size:12px;
  color:#ddd;
}


/* =========================
   VIDEO PLAY ICON
========================= */

.videoPlayIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:22px;
  z-index:8;
  pointer-events:none;
  animation:videoPulse 1.5s infinite;
}

@keyframes videoPulse{

  0%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }

  50%{
    transform:translate(-50%,-50%) scale(1.12);
    opacity:.72;
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }

}


/* =========================
   MODERN INCOMING CALL
========================= */

.incoming-screen{

  position:relative;

  width:100%;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:flex-start;

  flex-direction:column;

  text-align:center;

  padding:
    45px
    18px
    25px;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 50% 15%,
      rgba(50,80,180,.35),
      transparent 38%
    ),

    radial-gradient(
      circle at 50% 70%,
      rgba(0,180,90,.08),
      transparent 45%
    ),

    linear-gradient(
      180deg,
      #080b14 0%,
      #030407 100%
    );
}


/* soft animated background */

.incoming-screen::before{

  content:"";

  position:absolute;

  width:260px;
  height:260px;

  top:-100px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    rgba(70,110,255,.12);

  filter:blur(30px);

  animation:
    incomingGlow 3s
    ease-in-out
    infinite;

}

@keyframes incomingGlow{

  0%,100%{
    opacity:.45;
    transform:
      translateX(-50%)
      scale(1);
  }

  50%{
    opacity:.9;
    transform:
      translateX(-50%)
      scale(1.18);
  }

}


/* LIVE badge */

.incoming-live{

  position:relative;

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:
    7px
    12px;

  border-radius:20px;

  background:
    rgba(220,0,0,.15);

  border:
    1px solid
    rgba(255,50,50,.45);

  color:#fff;

  font-size:12px;

  font-weight:bold;

  letter-spacing:.7px;

  z-index:5;

  box-shadow:
    0 0 18px
    rgba(255,0,0,.15);

}


/* red live dot */

.incoming-live-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#ff3030;

  box-shadow:
    0 0 8px
    rgba(255,30,30,.9);

  animation:
    incomingLivePulse
    1s infinite;

}

@keyframes incomingLivePulse{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.35;
    transform:scale(.72);
  }

}


/* caller photo outer ring */

.caller-photo-wrap{

  position:relative;

  width:190px;
  height:190px;

  margin-top:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:3;

}


/* animated rings */

.caller-photo-wrap::before,
.caller-photo-wrap::after{

  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:
    1px solid
    rgba(90,150,255,.55);

  animation:
    callerRing
    2.2s
    ease-out
    infinite;

}

.caller-photo-wrap::after{

  animation-delay:
    1.1s;

}

@keyframes callerRing{

  0%{
    transform:scale(.82);
    opacity:.9;
  }

  100%{
    transform:scale(1.25);
    opacity:0;
  }

}


/* caller image */

.incoming-photo{

  position:relative;

  width:158px;
  height:158px;

  object-fit:cover;

  border-radius:50%;

  border:
    3px solid
    rgba(255,255,255,.9);

  box-shadow:

    0 0 0 5px
    rgba(80,130,255,.10),

    0 0 35px
    rgba(70,120,255,.45);

  z-index:4;

}


/* caller name */

.incoming-name{

  position:relative;

  margin-top:23px;

  font-size:30px;

  font-weight:700;

  letter-spacing:.2px;

  z-index:5;

  text-shadow:
    0 2px 12px
    rgba(0,0,0,.7);

}


/* incoming text */

.incoming-text{

  position:relative;

  margin-top:8px;

  color:#b9c0d0;

  font-size:15px;

  z-index:5;

}


/* small video icon */

.incoming-camera{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:22px;
  height:22px;

  margin-right:5px;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

  font-size:12px;

}


/* ringing indicator */

.ringing-status{

  position:relative;

  margin-top:18px;

  display:flex;

  align-items:center;

  gap:7px;

  color:#8e98ad;

  font-size:13px;

  z-index:5;

}

.ringing-bars{

  display:flex;

  align-items:flex-end;

  gap:3px;

  height:15px;

}

.ringing-bars span{

  width:3px;

  border-radius:3px;

  background:#42df85;

  animation:
    ringingBar
    .9s
    ease-in-out
    infinite;

}

.ringing-bars span:nth-child(1){
  height:7px;
  animation-delay:0s;
}

.ringing-bars span:nth-child(2){
  height:12px;
  animation-delay:.15s;
}

.ringing-bars span:nth-child(3){
  height:9px;
  animation-delay:.3s;
}

.ringing-bars span:nth-child(4){
  height:14px;
  animation-delay:.45s;
}

@keyframes ringingBar{

  0%,100%{
    transform:scaleY(.45);
    opacity:.45;
  }

  50%{
    transform:scaleY(1);
    opacity:1;
  }

}


/* =========================
   CALL ACTION AREA
========================= */

.swipe-area{

  position:relative;

  width:100%;
  max-width:390px;

  margin-top:auto;

  padding-bottom:12px;

  display:flex;

  flex-direction:column;

  gap:12px;

  z-index:10;

}


/* swipe bar */

.swipe-bar{

  height:64px;

  width:100%;

  border-radius:34px;

  position:relative;

  display:flex;

  align-items:center;

  overflow:hidden;

  user-select:none;

  touch-action:pan-y;

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}

.swipe-bar:active{

  transform:scale(.98);

}


/* decline */

.decline-swipe{

  background:
    linear-gradient(
      90deg,
      rgba(200,25,40,.25),
      rgba(25,28,38,.82)
    );

  border:
    1px solid
    rgba(255,55,70,.38);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

}


/* answer */

.answer-swipe{

  background:
    linear-gradient(
      90deg,
      rgba(25,28,38,.82),
      rgba(0,165,80,.25)
    );

  border:
    1px solid
    rgba(35,230,120,.38);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

}


/* swipe button */

.swipe-icon{

  position:absolute;

  width:54px;
  height:54px;

  top:5px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:22px;

  font-weight:bold;

  z-index:3;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.45);

}


/* decline icon */

.decline-swipe .swipe-icon{

  left:5px;

  background:
    linear-gradient(
      145deg,
      #ff3948,
      #d80018
    );

}


/* answer icon */

.answer-swipe .swipe-icon{

  right:5px;

  background:
    linear-gradient(
      145deg,
      #29e978,
      #0ab94e
    );

}


/* labels */

.swipe-label{

  position:absolute;

  width:100%;

  text-align:center;

  font-size:14px;

  font-weight:600;

  color:#d9deea;

  pointer-events:none;

}


/* arrows */

.swipe-arrows{

  position:absolute;

  font-size:22px;

  font-weight:bold;

  opacity:.9;

  pointer-events:none;

  letter-spacing:-3px;

}

.decline-swipe .swipe-arrows{

  left:78px;

  color:#ff5260;

}

.answer-swipe .swipe-arrows{

  right:78px;

  color:#42eb8a;

}


/* hint */

.swipe-hint{

  margin-top:2px;

  color:#697386;

  font-size:11px;

}


/* =========================
   LIVE VIDEO
========================= */

#liveSoundPage{

  position:relative;

  background:#000;

  min-height:100vh;

  align-items:center;

  justify-content:center;

}

.liveBadgeTop{

  position:absolute;

  top:15px;

  left:15px;

  background:#e00000;

  color:#fff;

  padding:7px 11px;

  border-radius:5px;

  font-size:13px;

  font-weight:bold;

  z-index:20;

}

.greenLiveDot{

  display:inline-block;

  width:8px;

  height:8px;

  border-radius:50%;

  background:#20e070;

  margin-right:5px;

  animation:blinkGreen 1s infinite;

}

#liveSoundVideo{

  width:100%;

  max-height:100vh;

  object-fit:contain;

  background:#000;

}


/* =========================
   BLACK LIVE
========================= */

#blackLivePage{

  position:relative;

  min-height:100vh;

  background:#000;

  align-items:center;

  justify-content:center;

  flex-direction:column;

}

.blackLiveText{

  color:#aaa;

  font-size:18px;

}


/* =========================
   INSUFFICIENT
========================= */

#insufficientPage{

  min-height:100vh;

  background:#000;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:25px;

}

.insufficientTitle{

  font-size:23px;

  font-weight:bold;

  margin-bottom:12px;

}

.insufficientText{

  color:#aaa;

  font-size:14px;

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:360px){

  .photoGrid{
    gap:6px;
  }

  .photoCard{
    min-height:210px;
  }

  .photoCard img{
    height:155px;
  }

  .caller-photo-wrap{
    width:170px;
    height:170px;
    margin-top:24px;
  }

  .incoming-photo{
    width:142px;
    height:142px;
  }

  .incoming-name{
    font-size:24px;
  }

  .swipe-bar{
    height:60px;
  }

  .swipe-icon{
    width:50px;
    height:50px;
  }

  .swipe-label{
    font-size:13px;
  }

}

</style>

  }

  if(photoTimer){
    clearTimeout(photoTimer);
    photoTimer = null;
  }

  if(onlineTimer){
    clearInterval(onlineTimer);
    onlineTimer = null;
  }

  if(audioTimer){
    clearTimeout(audioTimer);
    audioTimer = null;
  }
}


function stopVideo(video){

  if(!video) return;

  try{
    video.pause();
    video.currentTime = 0;
  }catch(e){}
}


function stopAudio(){

  if(!blackLiveAudio) return;

  try{
    blackLiveAudio.pause();
    blackLiveAudio.currentTime = 0;
  }catch(e){}
}


/* =========================
   ONLINE NUMBER
========================= */

function updateOnline(){

  if(!onlineCount) return;

  const number =
    Math.floor(
      Math.random() * 8
    ) + 18;

  onlineCount.textContent =
    number;
}


/* =========================
   WELCOME
========================= */

function startWebsite(){

  hideAllScreens();
  clearTimers();

  if(welcomeScreen)
    welcomeScreen.style.display = "flex";

  setTimeout(() => {

    showIncomingCall();

  }, 3000);
}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(){

  clearTimers();

  callInProgress = true;

  hideAllScreens();

  if(incomingCall)
    incomingCall.style.display = "flex";

  const index =
    currentCaller %
    PHOTO_NAMES.length;

  if(callerName){

    callerName.textContent =
      PHOTO_NAMES[index];
  }

  if(callerImage){

    const imageName =
      PHOTO_NAMES[index]
        .toLowerCase()
        .replace(/\s+/g,"");

    callerImage.src =
      IMAGE_BASE +
      imageName +
      ".jpg";

    callerImage.onerror = () => {

      callerImage.src =
        IMAGE_BASE +
        imageName +
        ".png";
    };
  }

  if(answerSwipe)
    answerSwipe.style.transform =
      "translateX(0)";

  if(declineSwipe)
    declineSwipe.style.transform =
      "translateX(0)";

  /*
     Ring for 7 seconds.
     If nobody answers, return
     to live photos.
  */

  callTimer = setTimeout(() => {

    if(callInProgress){

      callInProgress = false;

      showLivePhotos();

    }

  }, 7000);
}


/* =========================
   ANSWER CALL
========================= */

function answerCall(){

  if(!callInProgress)
    return;

  callInProgress = false;

  clearTimers();

  answeredFirstCall = true;

  /*
     First answered call:
     show red LIVE video only once.
  */

  const redSeen =
    localStorage.getItem(
      RED_LIVE_STORAGE_KEY
    );

  if(!redSeen){

    localStorage.setItem(
      RED_LIVE_STORAGE_KEY,
      "1"
    );

    showRedLiveVideo();

  }else{

    showBlackLive();

  }
}


/* =========================
   DECLINE CALL
========================= */

function declineCall(){

  callInProgress = false;

  clearTimers();

  showLivePhotos();
}


/* =========================
   RED LIVE VIDEO
========================= */

function showRedLiveVideo(){

  clearTimers();

  hideAllScreens();

  if(redLiveVideo){

    redLiveVideo.style.display =
      "flex";

    try{

      redLiveVideo.currentTime = 0;

      const playPromise =
        redLiveVideo.play();

      if(
        playPromise &&
        playPromise.catch
      ){
        playPromise.catch(
          () => {}
        );
      }

    }catch(e){}
  }

  /*
     Red LIVE video is shown
     only once.
  */

  callTimer = setTimeout(() => {

    stopVideo(redLiveVideo);

    showBlackLive();

  }, 5000);
}


/* =========================
   BLACK LIVE
========================= */

function showBlackLive(){

  clearTimers();

  hideAllScreens();

  if(blackLive)
    blackLive.style.display =
      "flex";

  playLiveAudio();

  callTimer = setTimeout(() => {

    stopAudio();

    showInsufficient();

  }, BLACK_LIVE_DURATION);
}


/* =========================
   LIVE AUDIO
========================= */

function playLiveAudio(){

  if(!blackLiveAudio)
    return;

  try{

    blackLiveAudio.currentTime = 0;

    const p =
      blackLiveAudio.play();

    if(
      p &&
      p.catch
    ){
      p.catch(
        () => {}
      );
    }

  }catch(e){}
}


/* =========================
   INSUFFICIENT MINUTES
========================= */

function showInsufficient(){

  clearTimers();

  hideAllScreens();

  if(insufficientPage)
    insufficientPage.style.display =
      "flex";

  let seconds = 2;

  if(insufficientTimer)
    insufficientTimer.textContent =
      seconds;

  const interval =
    setInterval(() => {

      seconds--;

      if(insufficientTimer)
        insufficientTimer.textContent =
          seconds;

      if(seconds <= 0){

        clearInterval(interval);

        showLivePhotos();
      }

    },1000);
}


/* =========================
   LIVE PHOTOS
========================= */

function showLivePhotos(){

  clearTimers();

  callInProgress = false;

  hideAllScreens();

  if(photosPage)
    photosPage.style.display =
      "block";

  buildPhotoGrid();

  updateOnline();

  onlineTimer =
    setInterval(
      updateOnline,
      10000
    );

  /*
     Wait before next incoming call.
  */

  photoTimer =
    setTimeout(() => {

      currentCaller++;

      showIncomingCall();

    }, PHOTO_WAIT_DURATION);
}


/* =========================
   PHOTO GRID
========================= */

function buildPhotoGrid(){

  if(!livePhotos)
    return;

  livePhotos.innerHTML = "";

  /*
     Five random profiles
     appear offline.
  */

  const offlineIndexes =
    new Set();

  while(
    offlineIndexes.size < 5 &&
    offlineIndexes.size <
      PHOTO_NAMES.length
  ){

    offlineIndexes.add(
      Math.floor(
        Math.random() *
        PHOTO_NAMES.length
      )
    );
  }

  PHOTO_NAMES.forEach(
    (name,index) => {

      const card =
        document.createElement("div");

      card.className =
        "photo-card";

      const offline =
        offlineIndexes.has(index);

      const country =
        PHOTO_COUNTRIES[index] ||
        "🌍";

      const age =
        PHOTO_AGES[index] ||
        21;

      const imageName =
        name
          .toLowerCase()
          .replace(/\s+/g,"");

      card.innerHTML = `

        <div class="photo-image-wrap">

          <img
            class="profile-photo"
            src="${IMAGE_BASE}${imageName}.jpg"
            alt="${name}"
            loading="lazy"
          >

          <div class="photo-play">
            ▶
          </div>

          <div class="${
            offline
              ? "offline-badge"
              : "live-badge"
          }">

            <span></span>

            ${
              offline
                ? "OFFLINE"
                : "LIVE"
            }

          </div>

        </div>

        <div class="photo-info">

          <div class="photo-name">
            ${name}
          </div>

          <div class="photo-meta">
            ${country} ${age}
          </div>

        </div>
      `;

      const img =
        card.querySelector(
          ".profile-photo"
        );

      if(img){

        img.onerror = () => {

          img.src =
            `${IMAGE_BASE}${imageName}.png`;

          img.onerror = () => {

            img.src =
              `${IMAGE_BASE}${imageName}.webp`;

          };

        };
      }

      /*
         Tapping any photo opens
         payment.html and carries
         the correct employee referral.
      */

      card.addEventListener(
        "click",
        () => {

          openPaymentPage();

        }
      );

      livePhotos.appendChild(
        card
      );
    }
  );
}


/* =========================
   PAYMENT LINK
========================= */

function openPaymentPage(){

  /*
     Save return state so that
     Back/loading can return
     to live photos.
  */

  sessionStorage.setItem(
    "returnToLivePhotos",
    "1"
  );

  let url =
    PAYMENT_PAGE_URL;

  if(referralEmployeeId){

    url +=
      "?employee=" +
      encodeURIComponent(
        referralEmployeeId
      );
  }

  window.location.href =
    url;
}


/* =========================
   ANSWER / DECLINE BUTTONS
========================= */

if(answerSwipe){

  answerSwipe.addEventListener(
    "click",
    answerCall
  );
}

if(declineSwipe){

  declineSwipe.addEventListener(
    "click",
    declineCall
  );
}


/* =========================
   SWIPE SUPPORT
========================= */

function enableSwipe(
  element,
  callback
){

  if(!element)
    return;

  let startX = 0;
  let currentX = 0;
  let dragging = false;

  element.addEventListener(
    "touchstart",
    (e) => {

      if(!e.touches[0])
        return;

      startX =
        e.touches[0].clientX;

      currentX =
        startX;

      dragging = true;

    },
    {passive:true}
  );

  element.addEventListener(
    "touchmove",
    (e) => {

      if(!dragging)
        return;

      if(!e.touches[0])
        return;

      currentX =
        e.touches[0].clientX;

      const distance =
        currentX - startX;

      if(
        Math.abs(distance) >
        10
      ){

        element.style.transform =
          `translateX(${distance}px)`;
      }

    },
    {passive:true}
  );

  element.addEventListener(
    "touchend",
    () => {

      if(!dragging)
        return;

      dragging = false;

      const distance =
        currentX - startX;

      element.style.transform =
        "translateX(0)";

      if(
        Math.abs(distance) >
        80
      ){

        callback();

      }

    }
  );
}


enableSwipe(
  answerSwipe,
  answerCall
);

enableSwipe(
  declineSwipe,
  declineCall
);


/* =========================
   RETURN FROM PAYMENT
========================= */

window.addEventListener(
  "pageshow",
  () => {

    /*
       If payment page sends
       the visitor back here,
       immediately show photos.
    */

    if(
      sessionStorage.getItem(
        "returnToLivePhotos"
      ) === "1"
    ){

      sessionStorage.removeItem(
        "returnToLivePhotos"
      );

      showLivePhotos();
    }

  }
);


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    startWebsite();

  }
);
</script>
