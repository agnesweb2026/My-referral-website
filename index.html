*{

  padding:0;

html,body{

  color:#fff;

body{

button{

}

.hidden{

/* WELCOME */
#welcomeScreen{

  background:

  align-items:center;
  justify-content:center;
  z-index:9999;
}

.welcome-box{
  width:90%;
  max-width:420px;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;

}

.logo span{

}

.welcome-title{
  margin-top:18px;
  font-size:24px;
  font-weight:800;
}

.welcome-sub{
  margin-top:10px;
  color:#aaa;
  font-size:14px;
}

.loading-line{
  width:100%;
  height:4px;
  background:#242424;
  border-radius:20px;
  margin-top:30px;
  overflow:hidden;
}

.loading-progress{
  width:0;
  height:100%;
  background:#ff1744;
  border-radius:20px;
  animation:welcomeLoad 3s linear forwards;
}

@keyframes welcomeLoad{
  from{width:0}
  to{width:100%}
}

/* PHOTOS */
#photosPage{
  min-height:100vh;
  background:#080808;
  padding-bottom:30px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(5,5,5,.96);

}

.brand{
  font-size:25px;
  font-weight:900;
}

.brand span{
  color:#ff1744;
}

.online-count{
  color:#ddd;
  font-size:13px;
}

.live-status{

  align-items:center;
  gap:6px;
  color:#fff;
  font-size:12px;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#00e676;
  animation:blinkDot 1s infinite;
}

@keyframes blinkDot{
  0%,100%{opacity:1}
  50%{opacity:.25}
}

.photos-title{
  padding:16px 14px 10px;
  font-size:18px;
  font-weight:800;
}

.photos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:0 7px;
}

.profile-card{
  position:relative;
  min-width:0;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #252525;
}

.profile-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:0.72;
  overflow:hidden;
  background:#181818;
}

.profile-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.online-big-dot{
  position:absolute;
  right:7px;
  top:7px;
  width:13px;
  height:13px;
  border-radius:50%;

  z-index:3;
}

.offline-label{
  position:absolute;
  top:7px;
  right:7px;
  padding:3px 6px;
  border-radius:8px;
  background:#555;
  color:#ddd;
  font-size:9px;
  z-index:3;
}

.play-icon{
  position:absolute;
  left:50%;
  top:50%;

  height:42px;
  border-radius:50%;

  align-items:center;
  justify-content:center;
  font-size:18px;
  padding-left:3px;

.profile-info{

.profile-name{

.profile-meta{

  font-size:10px;

@keyframes chatIn{
  from{

    transform:translateY(8px);

  to{

  /* =========================
   UTILITY
========================= */

function showOnly(section){
  welcomeScreen.classList.add("hidden");
  photosPage.classList.add("hidden");
  incomingCall.classList.add("hidden");
  videoPage.classList.add("hidden");
  insufficientPage.classList.add("hidden");

  if(section){
    section.classList.remove("hidden");
  }
}

function getPaymentUrl(profile){
  const params = new URLSearchParams();

  params.set("profile", profile.name);
  params.set("age", profile.age);
  params.set("country", profile.country);

  const ref =
    new URLSearchParams(window.location.search).get("ref");

  if(ref){
    params.set("ref", ref);
  }

  return PAYMENT_PAGE + "?" + params.toString();
}

function openPayment(profile){
  window.location.href = getPaymentUrl(profile);
}

/* =========================
   RANDOM OFFLINE PEOPLE
========================= */

function chooseOffline(){
  const indexes = [];

  while(indexes.length < 5){
    const randomIndex =
      Math.floor(Math.random() * profiles.length);

    if(!indexes.includes(randomIndex)){
      indexes.push(randomIndex);
    }
  }

  return indexes;
}

let offlineIndexes = chooseOffline();

/* =========================
   RENDER PHOTOS
========================= */

function renderPhotos(){

  photosGrid.innerHTML = "";

  onlineCount.textContent =
    String(profiles.length - offlineIndexes.length);

  profiles.forEach((profile,index)=>{

    const offline = offlineIndexes.includes(index);

    const card = document.createElement("article");
    card.className = "profile-card";

    card.innerHTML = `
      <div class="profile-image-wrap">

        <img
          class="profile-image"
          src="${profile.image}"
          alt="${profile.name}"
          loading="lazy"
        >

        ${
          offline
          ? `<div class="offline-label">OFFLINE</div>`
          : `<div class="online-big-dot"></div>`
        }

        <div class="play-icon">▶</div>

        <div
          class="photo-chat-box"
          id="photoChat-${index}">
        </div>

      </div>

      <div class="profile-info">
        <div class="profile-name">
          ${profile.name}
        </div>

        <div class="profile-meta">
          ${profile.flag} ${profile.age} • ${profile.country}
        </div>
      </div>

      <div class="social-row">

        <button class="social-btn like-btn">
          ❤️ Like
        </button>

        <button class="social-btn love-btn">
          💕 Love
        </button>

        <button class="social-btn follow-btn">
          + Follow
        </button>

        <button class="social-btn chat-btn">
          💬 Chat
        </button>

      </div>
    `;

    const image =
      card.querySelector(".profile-image");

    const play =
      card.querySelector(".play-icon");

    const like =
      card.querySelector(".like-btn");

    const love =
      card.querySelector(".love-btn");

    const follow =
      card.querySelector(".follow-btn");

    const chat =
      card.querySelector(".chat-btn");

    image.addEventListener("click",()=>{
      openPayment(profile);
    });

    play.addEventListener("click",()=>{
      openPayment(profile);
    });

    chat.addEventListener("click",()=>{
      openPayment(profile);
    });

    like.addEventListener("click",(event)=>{
      event.stopPropagation();
      like.classList.toggle("active");
    });

    love.addEventListener("click",(event)=>{
      event.stopPropagation();
      love.classList.toggle("active");
    });

    follow.addEventListener("click",(event)=>{
      event.stopPropagation();
      follow.classList.toggle("active");
    });

    photosGrid.appendChild(card);

    startPhotoChat(profile,index);
  });
        }

    document.getElementById("photoChat-"+index);

  if(!box) return;

  profile.messages.forEach((message,messageIndex)=>{

    const delay =
      1200 +
      Math.floor(Math.random()*5000) +
      messageIndex*3500;

    setTimeout(()=>{

      const item =
        document.createElement("div");

      item.className =
        "photo-chat-message";

      item.textContent =
        message;

      box.appendChild(item);

      while(box.children.length > 2){
        box.removeChild(box.firstChild);
      }

    },delay);

  });
}

/* =========================
   CHANGE 5 OFFLINE PEOPLE
   EVERY 5 MINUTES
========================= */

function startOfflineRotation(){

  if(photoOfflineTimer){
    clearInterval(photoOfflineTimer);
  }

  photoOfflineTimer =
    setInterval(()=>{

      offlineIndexes =
        chooseOffline();

      renderPhotos();

    },5*60*1000);
}

/* =========================
   INCOMING CALL
========================= */

function openIncomingCall(){

  if(localStorage.getItem(FIRST_VIDEO_KEY)){
    return;
  }

  const available =
    profiles.filter((profile,index)=>{
      return !offlineIndexes.includes(index);
    });

  if(!available.length){
    return;
  }

  currentCallProfile =
    available[
      Math.floor(Math.random()*available.length)
    ];

  callAvatar.src =
    currentCallProfile.image;

  callName.textContent =
    currentCallProfile.name +
    " is calling you";

  showOnly(incomingCall);

  if(callTimer){
    clearTimeout(callTimer);
  }

  callTimer =
    setTimeout(()=>{

      if(!incomingCall.classList.contains("hidden")){
        showOnly(photosPage);
      }

    },15000);
}

/* =========================
   CAMERA PERMISSION
========================= */

async function requestCameraPermission(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){
    return true;
  }

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });

    cameraStream.getTracks().forEach(track=>{
      track.stop();
    });

    cameraStream = null;

    return true;

  }catch(error){

    console.log("Camera permission:",error);

    return false;
  }
}

/* =========================
   ANSWER CALL
========================= */

async function answerIncomingCall(){

  if(callTimer){
    clearTimeout(callTimer);
  }

  const allowed =
    await requestCameraPermission();

  /*
    Camera permission is requested first.
    The uploaded video remains the video shown
    on the page.
  */

  startLiveVideo();
}
  /* =========================
   START LIVE VIDEO
========================= */

function startLiveVideo(){

  if(!currentCallProfile){
    currentCallProfile =
      profiles[0];
  }

  localStorage.setItem(
    FIRST_VIDEO_KEY,
    "1"
  );

  videoName.textContent =
    currentCallProfile.name +
    " • LIVE";

  liveVideo.src = VIDEO_FILE;

  liveVideo.currentTime = 0;

  /*
    Sound is deliberately ON.
    We call play after the user presses Answer,
    so browser autoplay restrictions are avoided.
  */

  liveVideo.muted = false;
  liveVideo.volume = 1;

  videoChat.innerHTML = "";

  showOnly(videoPage);

  startVideoChat();

  liveVideo.play()
    .catch(error=>{
      console.log(
        "Video play error:",
        error
      );
    });

  if(videoTimer){
    clearTimeout(videoTimer);
  }

  videoTimer =
    setTimeout(()=>{
      finishLiveVideo();
    },40000);
}

/* =========================
   VIDEO CHAT
========================= */

function startVideoChat(){

  const messages = [
    "Hi ❤️",
    "Can you see me?",
    "I am happy you answered 😊",
    "Let's talk ❤️",
    "You are cute 😘"
  ];

  messages.forEach((message,index)=>{

    const delay =
      1800 +
      index*5500 +
      Math.floor(Math.random()*1800);

    setTimeout(()=>{

      if(videoPage.classList.contains("hidden")){
        return;
      }

      const item =
        document.createElement("div");

      item.className =
        "video-chat-msg";

      item.textContent =
        message;

      videoChat.appendChild(item);

      while(videoChat.children.length > 3){
        videoChat.removeChild(
          videoChat.firstChild
        );
      }

    },delay);

  });
}

/* =========================
   END VIDEO
========================= */

function finishLiveVideo(){

  if(videoTimer){
    clearTimeout(videoTimer);
    videoTimer = null;
  }

  liveVideo.pause();

  liveVideo.currentTime = 0;

  showOnly(insufficientPage);

  setTimeout(()=>{

    showOnly(photosPage);

  },2000);
}

/* =========================
   VIDEO BUTTONS
========================= */

document
  .getElementById("videoLike")
  .addEventListener("click",function(){

    this.classList.toggle("active");

    this.textContent =
      this.classList.contains("active")
      ? "❤️ Liked"
      : "❤️ Like";

  });

document
  .getElementById("videoFollow")
  .addEventListener("click",function(){

    this.classList.toggle("active");

    this.textContent =
      this.classList.contains("active")
      ? "✓ Following"
      : "+ Follow";

  });
  /* =========================
   CALL BUTTONS
========================= */

document
  .getElementById("answerCall")
  .addEventListener("click",()=>{

    answerIncomingCall();

  });

document
  .getElementById("rejectCall")
  .addEventListener("click",()=>{

    if(callTimer){
      clearTimeout(callTimer);
    }

    showOnly(photosPage);

  });

/* =========================
   VIDEO ENDED
========================= */

liveVideo.addEventListener(
  "ended",
  ()=>{

    finishLiveVideo();

  }
);

/* =========================
   PROTECTION AGAINST
   VIDEO LONGER THAN 40 SEC
========================= */

liveVideo.addEventListener(
  "timeupdate",
  ()=>{

    if(
      liveVideo.currentTime >= 40
    ){
      finishLiveVideo();
    }

  }
);

/* =========================
   STOP VIDEO IF PAGE HIDDEN
========================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden &&
      !videoPage.classList.contains("hidden")
    ){
      liveVideo.pause();
    }

  }
);

/* =========================
   REFRESH OFFLINE PEOPLE
========================= */

startOfflineRotation();
  /* =========================
   START WEBSITE
========================= */

function startWebsite(){

  /*
    Welcome stays for approximately 3 seconds.
  */

  setTimeout(()=>{

    showOnly(photosPage);

    renderPhotos();

    /*
      First incoming call appears after
      the visitor reaches the live photos.
    */

    setTimeout(()=>{

      openIncomingCall();

    },3500);

  },3000);
}

/* =========================
   INITIAL STATE
========================= */

showOnly(welcomeScreen);

/* =========================
   START
========================= */

startWebsite();

</script>
