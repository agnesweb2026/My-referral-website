<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      margin-bottom: 8px;
    }

    .ref {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
      font-size: 24px;
      letter-spacing: 5px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
    }

    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .photos img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Welcome to my website</h1>
    <p>You've been invited.</p>

    <div class="ref" id="refCode">Loading...</div>

    <button onclick="copyCode()">Copy referral code</button>

    <h2>Photo Preview</h2>

    <div class="photos">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500" alt="Photo">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Photo">
    </div>
  </div><div id="accessGate" style="margin-top:25px;padding:20px;border-radius:15px;background:#f3f3f3;">
  <h2>Access Countdown</h2>
  <p>Please wait 60 seconds.</p>
  <div id="countdown" style="font-size:42px;font-weight:bold;margin:15px;">60</div>

  <div id="packages" style="display:none;">
    <h2>Choose Your Access</h2>
    <button onclick="selectPackage(85,20)">KSh 85 — 20 minutes</button>
    <button onclick="selectPackage(155,40)">KSh 155 — 40 minutes</button>
    <button onclick="selectPackage(230,80)">KSh 230 — 80 minutes</button>
    <button onclick="selectPackage(310,120)">KSh 310 — 120 minutes</button>
    <p id="selectedPackage"></p>
  </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("ref") || "GB3HLT";

    document.getElementById("refCode").textContent = code;

    function copyCode() {
      navigator.clipboard.writeText(code);
      alert("Referral code copied!");
    }
  </script>
</body>
</html>
