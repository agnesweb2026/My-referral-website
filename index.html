<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Referral Website</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }


    /* ==========================================
       SAMPLE PAGE
    ========================================== */

    #samplePage {
      display: none;

      width: 100%;
      min-height: calc(100vh - 30px);

      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .sample-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .sample-subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    #sampleVideo {
      width: 100%;
      max-width: 450px;
      max-height: 70vh;

      display: block;

      background: #111;
      border-radius: 14px;

      object-fit: contain;
    }

    .sample-timer {
      display: none !important;
    }


    /* ==========================================
       INSUFFICIENT PAGE
    ========================================== */

    #insufficientPage {
      display: none;

      width: 100%;
      min-height: calc(100vh - 30px);

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .insufficient-box {
      width: 100%;

      background: #111;

      border: 1px solid #292929;

      border-radius: 14px;

      padding: 30px 20px;
    }

    .insufficient-title {
      font-size: 25px;
      font-weight: bold;

      color: #ff5252;

      margin-bottom: 10px;
    }

    .insufficient-text {
      color: #aaa;

      font-size: 14px;

      line-height: 1.5;
    }


    /* ==========================================
       PHOTOS PAGE
    ========================================== */

    #photosPage {
      display: none;
      width: 100%;
    }

    .top-bar {
      width: 100%;

      display: flex;

      justify-content: flex-start;
      align-items: center;

      margin-bottom: 15px;
    }

    .online-box {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      background: #111;

      border: 1px solid #292929;

      color: #fff;

      padding: 7px 11px;

      border-radius: 8px;

      font-size: 13px;

      font-weight: bold;
    }

    .online-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #22c55e;

      animation: onlineBlink 1.2s infinite;
    }

    @keyframes onlineBlink {

      50% {
        opacity: .35;
      }

    }

    h1 {
      margin: 8px 0 5px;
      font-size: 25px;
    }

    .subtitle {
      color: #aaa;

      margin: 0 0 15px;

      font-size: 14px;
    }

    #livePhotos {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 14px;

      margin-top: 15px;
    }

    .live-photo {
      position: relative;

      overflow: hidden;

      border-radius: 12px;

      background: #111;

      cursor: pointer;

      min-height: 250px;

      padding-bottom: 45px;

      border: 1px solid #1e1e1e;

      transition:
        transform .2s ease,
        opacity .4s ease;
    }

    .live-photo:active {
      transform: scale(.98);
    }

    .live-photo img {
      display: block;

      width: 100%;
      height: 205px;

      object-fit: cover;

      background: #111;

      transition:
        opacity .4s ease,
        transform .4s ease;
    }


    /* ==========================================
       PHOTO NAME
    ========================================== */

    .photo-name {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      min-height: 45px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 7px 5px;

      background: #111;

      color: #fff;

      font-size: 13px;

      font-weight: bold;

      text-align: center;
    }


    /* ==========================================
       LIVE BADGE
    ========================================== */

    .live-badge {
      position: absolute;

      top: 7px;
      left: 7px;

      z-index: 5;

      background: #f0184c;

      color: #fff;

      padding: 6px 9px;

      border-radius: 7px;

      font-size: 11px;

      font-weight: bold;
    }

    .live-badge::before {
      content: "●";
      margin-right: 4px;
    }


    .live-status {
      position: absolute;

      top: 7px;
      right: 7px;

      z-index: 5;

      display: flex;

      align-items: center;

      gap: 5px;

      background: rgba(0,0,0,.82);

      padding: 5px 7px;

      border-radius: 7px;

      font-size: 10px;
    }

    .live-dot {
      width: 8px;
      height: 8px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #22c55e;

      animation: liveBlink 1s infinite;
    }


    /* ==========================================
       FLAG BUTTON
    ========================================== */

    .flag-button {
      position: absolute;

      bottom: 6px;
      right: 6px;

      z-index: 10;

      border: none;

      border-radius: 6px;

      padding: 4px 7px;

      background: rgba(255,255,255,.12);

      color: #fff;

      font-size: 10px;

      cursor: pointer;
    }

    .flag-button:active {
      transform: scale(.95);
    }


    /* ==========================================
       LOADING / ERROR
    ========================================== */

    .loading {
      grid-column: 1 / -1;

      padding: 45px 20px;

      color: #aaa;

      text-align: center;
    }

    .error {
      grid-column: 1 / -1;

      padding: 35px 15px;

      color: #ff6b6b;

      text-align: center;

      line-height: 1.5;
    }


    /* ==========================================
       INCOMING CALL LOADING
    ========================================== */

    .call-loading {
      display: none;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-bottom: 20px;
    }

    .call-loading-spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #333;

      border-top: 4px solid #22c55e;

      border-radius: 50%;

      animation:
        callSpin 1s linear infinite;
    }

    @keyframes callSpin {

      to {
        transform: rotate(360deg);
      }

    }

    .call-loading-text {
      color: #aaa;
      font-size: 13px;
    }


    /* ==========================================
       INCOMING CALL
    ========================================== */

    #incomingCall {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 99999;

      background:
        radial-gradient(
          circle at center,
          #202020 0%,
          #080808 55%,
          #000 100%
        );

      align-items: center;

      justify-content: center;

      padding: 20px;

      text-align: center;
    }

    .call-box {
      width: 100%;
      max-width: 370px;

      background: #111;

      border: 1px solid #292929;

      border-radius: 24px;

      padding: 30px 20px 28px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.85);
    }


    /* ==========================================
       LARGE ROUND CALLER PHOTO
    ========================================== */

    .call-avatar {
      width: 165px;
      height: 165px;

      margin: 0 auto 20px;

      border-radius: 50%;

      overflow: hidden;

      background: #222;

      border: 4px solid #22c55e;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 0 0 8px rgba(34,197,94,.08),
        0 10px 35px rgba(0,0,0,.6);
    }

    .call-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transform-origin: center;

      animation:
        slowCallerZoom 5s ease-in-out infinite;
    }

    @keyframes slowCallerZoom {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.10);
      }

      100% {
        transform: scale(1);
      }

    }


    .call-incoming {
      color: #22c55e;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 8px;

      letter-spacing: .3px;
    }

    .call-name {
      font-size: 24px;

      font-weight: bold;

      margin-bottom: 25px;
    }


    /* ==========================================
       CALL BUTTONS
    ========================================== */

    .call-buttons {
      display: flex;

      justify-content: center;

      gap: 45px;
    }

    .call-action {
      border: none;

      width: 68px;
      height: 68px;

      border-radius: 50%;

      color: #fff;

      font-size: 27px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 8px 20px rgba(0,0,0,.4);
    }

    .call-answer {
      background: #22c55e;
    }

    .call-end {
      background: #ef4444;

      transform: rotate(135deg);
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 380px) {

      body {
        padding: 12px;
      }

      #livePhotos {
        gap: 10px;
      }

      .live-photo {
        min-height: 215px;
      }

      .live-photo img {
        height: 170px;
      }

      .photo-name {
        font-size: 12px;
      }

      .call-avatar {
        width: 145px;
        height: 145px;
      }

    }

  </style>

</head>
<body>

  <div class="card">


    <!-- =================================
         SAMPLE PAGE
    ================================== -->

    <div id="samplePage">

      <div class="sample-title">
        ❤️🥰🥰😍😍😍😍😍😍😍😍😍😍🫦🫦🫦💖🔥🔥🔥
      </div>

      <div class="sample-subtitle">
        Welcome 🤗 💦💦💦💦❤️‍🔥❤️‍🔥
      </div>


      <video
        id="sampleVideo"
        playsinline
        preload="auto"
        controls
      >

        <source
          src="preview_20_seconds.mp4"
          type="video/mp4"
        >

        Your browser does not support video.

      </video>


      <div
        id="sampleTimer"
        class="sample-timer"
      ></div>

    </div>


    <!-- =================================
         INSUFFICIENT PAGE
    ================================== -->

    <div id="insufficientPage">

      <div class="insufficient-box">

        <div class="insufficient-title">
          Insufficient minutes
        </div>

        <div class="insufficient-text">
          Buy more minutes!
        </div>

      </div>

    </div>


    <!-- =================================
         PHOTOS PAGE
    ================================== -->

    <div id="photosPage">

      <div class="top-bar">

        <div class="online-box">

          <span class="online-dot"></span>

          <span>
            21 online
          </span>

        </div>

      </div>


      <h1>
        Welcome
      </h1>


      <p class="subtitle">
        People live now
      </p>


      <div id="livePhotos"></div>

    </div>

  </div>


  <!-- =================================
       SIMULATED INCOMING VIDEO CALL
  ================================== -->

  <div
    id="incomingCall"
    aria-hidden="true"
  >

    <div class="call-box">


      <!-- Loading before call -->

      <div
        class="call-loading"
        id="callLoading"
      >

        <div class="call-loading-spinner"></div>

        <div class="call-loading-text">
          Incoming video call...
        </div>

      </div>


      <!-- Caller photo -->

      <div class="call-avatar">

        <img
          id="callPhoto"
          src=""
          alt="Caller profile"
        >

      </div>


      <div class="call-incoming">
        INCOMING VIDEO CALL
      </div>


      <div
        class="call-name"
        id="callName"
      >
        Live Video
      </div>


  


      <div class="call-buttons">


        <!-- Reject -->

        <button
          class="call-action call-end"
          id="rejectCall"
          type="button"
          aria-label="Close call"
        >
          ☎
        </button>


        <!-- Continue -->

        <button
          class="call-action call-answer"
          id="answerCall"
          type="button"
          aria-label="Continue"
        >
          📞
        </button>

      </div>

    </div>

  </div>

<script>

  /* ==========================================
     WEBSITE SETTINGS
  ========================================== */

  const GITHUB_OWNER =
    "agnesweb2026";

  const GITHUB_REPO =
    "My-referral-website";

  const GITHUB_BRANCH =
    "main";

  const MAX_PHOTOS =
    24;


  /* ==========================================
     PAYMENT PAGE
  ========================================== */

  const PAYMENT_PAGE_URL =
    "payment.html";


  /* ==========================================
     PHOTO NAMES
  ========================================== */

  const PHOTO_NAMES = [

    "Cute 😍❤️",
    "Becky 💦❤️‍🔥",
    "Dorry 🔥✅",
    "Jenny 💦❤️‍🔥",
    "Caro 💦❤️‍🔥❤️",
    "Juck 💦❤️‍🔥",
    "Bella 🥀👄",
    "Faith 🌟",
    "Chepto 😜🔥",
    "Shelley",
    "Phapy 🥰😍",
    "Chris 💖💘",
    "Juphio 😴💦💦",
    "Judy 💖",
    "Kandy 💦😴",
    "Jennifer ❤️‍🔥🔥",
    "Pento 🥀👄",
    "Shallow ❤️‍🔥🔥🥀",
    "Grees 🌟",
    "Betty 🔥❤️‍🔥",
    "Maria 🌟🥀💦",
    "Kitty 💦❤️",
    "Sweetgy 😍🥰",
    "Fellow 💦❤️"

  ];


  /* ==========================================
     ELEMENTS
  ========================================== */

  const samplePage =
    document.getElementById(
      "samplePage"
    );

  const insufficientPage =
    document.getElementById(
      "insufficientPage"
    );

  const photosPage =
    document.getElementById(
      "photosPage"
    );

  const livePhotos =
    document.getElementById(
      "livePhotos"
    );

  const sampleVideo =
    document.getElementById(
      "sampleVideo"
    );

  const incomingCall =
    document.getElementById(
      "incomingCall"
    );

  const callLoading =
    document.getElementById(
      "callLoading"
    );

  const callPhoto =
    document.getElementById(
      "callPhoto"
    );

  const callName =
    document.getElementById(
      "callName"
    );

  const answerCall =
    document.getElementById(
      "answerCall"
    );

  const rejectCall =
    document.getElementById(
      "rejectCall"
    );


  /* ==========================================
     FLOW SETTINGS
  ========================================== */

  const SAMPLE_DURATION =
    20;

  const INSUFFICIENT_DURATION =
    2000;

  const PHOTO_WAIT_DURATION =
    10000;

  const CALL_LOADING_DURATION =
    2500;

  const PHOTO_INTERCHANGE_DURATION =
    4000;


  /* ==========================================
     STORAGE
  ========================================== */

  const FLOW_STORAGE_KEY =
    "myReferralFlowStarted";


  /* ==========================================
     STATE
  ========================================== */

  let flowRunning =
    false;

  let photosLoaded =
    false;

  let callVisible =
    false;

  let currentPhotoIndex =
    0;


  /* ==========================================
     TIMERS
  ========================================== */

  let sampleTimer =
    null;

  let insufficientTimer =
    null;

  let photoWaitTimer =
    null;

  let callLoadingTimer =
    null;

  let photoRotationTimer =
    null;


  /* ==========================================
     PAGE CONTROL
  ========================================== */

  function hideAllPages() {

    samplePage.style.display =
      "none";

    insufficientPage.style.display =
      "none";

    photosPage.style.display =
      "none";

  }


  function showSamplePage() {

    hideAllPages();

    samplePage.style.display =
      "flex";

  }


  function showInsufficientPage() {

    hideAllPages();

    insufficientPage.style.display =
      "flex";

  }


  function showPhotosPage() {

    hideAllPages();

    photosPage.style.display =
      "block";

  }


  /* ==========================================
     TIMER CLEANUP
  ========================================== */

  function clearTimers() {

    if (sampleTimer !== null) {

      clearTimeout(
        sampleTimer
      );

      sampleTimer = null;

    }


    if (
      insufficientTimer !== null
    ) {

      clearTimeout(
        insufficientTimer
      );

      insufficientTimer = null;

    }


    if (
      photoWaitTimer !== null
    ) {

      clearTimeout(
        photoWaitTimer
      );

      photoWaitTimer = null;

    }


    if (
      callLoadingTimer !== null
    ) {

      clearTimeout(
        callLoadingTimer
      );

      callLoadingTimer = null;

    }

  }


  /* ==========================================
     PAYMENT
  ========================================== */

  function openPaymentPage() {

    clearTimers();

    stopPhotoInterchange();

    window.location.href =
      PAYMENT_PAGE_URL;

  }


  /* ==========================================
     SAMPLE VIDEO
  ========================================== */

  function startSample() {

    clearTimers();

    showSamplePage();


    if (!sampleVideo) {

      finishSample();

      return;

    }


    try {

      sampleVideo.currentTime =
        0;

    } catch (error) {

      console.warn(
        "Could not reset video.",
        error
      );

    }


    const playPromise =
      sampleVideo.play();


    if (
      playPromise &&
      typeof playPromise.catch ===
        "function"
    ) {

      playPromise.catch(
        () => {

          /*
            Mobile browsers may block
            autoplay. The visitor can
            press the play button.
          */

        }
      );

    }


    sampleTimer =
      setTimeout(
        finishSample,
        SAMPLE_DURATION * 1000
      );

  }


  function finishSample() {

    if (
      sampleTimer !== null
    ) {

      clearTimeout(
        sampleTimer
      );

      sampleTimer = null;

    }


    if (sampleVideo) {

      sampleVideo.pause();

    }


    showInsufficientPage();


    insufficientTimer =
      setTimeout(
        () => {

          insufficientTimer =
            null;

          showPhotosPage();

          loadPhotos();

        },
        INSUFFICIENT_DURATION
      );

  }
  /* ==========================================
     LOAD PHOTOS FROM GITHUB
  ========================================== */

  async function loadPhotos() {

    if (photosLoaded) {
      startPhotoInterchange();
      startIncomingCallTimer();
      return;
    }


    livePhotos.innerHTML = `
      <div class="loading">
        Loading photos...
      </div>
    `;


    const apiUrl =
      `https://api.github.com/repos/` +
      `${GITHUB_OWNER}/${GITHUB_REPO}` +
      `/contents/?ref=${GITHUB_BRANCH}`;


    try {

      const response =
        await fetch(apiUrl);


      if (!response.ok) {

        throw new Error(
          `GitHub API error: ${response.status}`
        );

      }


      const files =
        await response.json();


      if (!Array.isArray(files)) {

        throw new Error(
          "Invalid GitHub response."
        );

      }


      const imageFiles =
        files
          .filter(
            file => {

              if (
                !file ||
                !file.name
              ) {
                return false;
              }


              return /\.(jpg|jpeg|png|webp|gif)$/i
                .test(file.name);

            }
          )
          .slice(
            0,
            MAX_PHOTOS
          );


      if (
        imageFiles.length === 0
      ) {

        livePhotos.innerHTML = `
          <div class="error">
            No photos found.
          </div>
        `;

        return;
      }


      livePhotos.innerHTML = "";


      imageFiles.forEach(
        (file, index) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "live-photo";


          /* ==========================
             PHOTO
          ========================== */

          const image =
            document.createElement(
              "img"
            );


          image.src =
            file.download_url ||
            `https://raw.githubusercontent.com/` +
            `${GITHUB_OWNER}/` +
            `${GITHUB_REPO}/` +
            `${GITHUB_BRANCH}/` +
            `${encodeURIComponent(
              file.name
            )}`;


          image.alt =
            PHOTO_NAMES[index] ||
            `Photo ${index + 1}`;


          image.loading =
            "lazy";


          /* ==========================
             LIVE BADGE
          ========================== */

          const liveBadge =
            document.createElement(
              "div"
            );


          liveBadge.className =
            "live-badge";


          liveBadge.textContent =
            "LIVE";


          /* ==========================
             LIVE STATUS
          ========================== */

          const liveStatus =
            document.createElement(
              "div"
            );


          liveStatus.className =
            "live-status";


          const liveDot =
            document.createElement(
              "span"
            );


          liveDot.className =
            "live-dot";


          const liveText =
            document.createElement(
              "span"
            );


          liveText.textContent =
            "Live now";


          liveStatus.appendChild(
            liveDot
          );


          liveStatus.appendChild(
            liveText
          );


          /* ==========================
             PHOTO NAME
          ========================== */

          const photoName =
            document.createElement(
              "div"
            );


          photoName.className =
            "photo-name";


          photoName.textContent =
            PHOTO_NAMES[index] ||
            `Photo ${index + 1}`;


          /* ==========================
             FLAG
          ========================== */

          const flagButton =
            document.createElement(
              "button"
            );


          flagButton.className =
            "flag-button";


          flagButton.type =
            "button";


          flagButton.textContent =
            "🚩 Flag";


          flagButton.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              alert(
                "Thanks. This photo has been flagged."
              );

            }
          );


          /* ==========================
             ADD CARD CONTENT
          ========================== */

          card.appendChild(
            image
          );


          card.appendChild(
            liveBadge
          );


          card.appendChild(
            liveStatus
          );


          card.appendChild(
            photoName
          );


          card.appendChild(
            flagButton
          );


          /* ==========================
             PHOTO CLICK
          ========================== */

          card.addEventListener(
            "click",
            () => {

              openPaymentPage();

            }
          );


          livePhotos.appendChild(
            card
          );

        }
      );


      photosLoaded =
        true;


      /* ==========================
         START PHOTO INTERCHANGE
      ========================== */

      startPhotoInterchange();


      /* ==========================
         START INCOMING CALL
      ========================== */

      startIncomingCallTimer();

    } catch (error) {

      console.error(
        "Photo loading error:",
        error
      );


      photosLoaded =
        false;


      livePhotos.innerHTML = `
        <div class="error">
          Unable to load photos.<br>
          Please try again later.
        </div>
      `;

    }

  }


  /* ==========================================
     PHOTO INTERCHANGE
  ========================================== */

 function startPhotoInterchange() {

  stopPhotoInterchange();

  photoRotationTimer = setInterval(() => {

    const container =
      document.getElementById("livePhotos");

    const cards = Array.from(
      container.querySelectorAll(".live-photo")
    );

    if (cards.length < 2) {
      return;
    }

    // Pick two random photos
    const firstIndex =
      Math.floor(Math.random() * cards.length);

    let secondIndex =
      Math.floor(Math.random() * cards.length);

    while (secondIndex === firstIndex) {
      secondIndex =
        Math.floor(Math.random() * cards.length);
    }

    const firstCard =
      cards[firstIndex];

    const secondCard =
      cards[secondIndex];

    // Fade during the swap
    firstCard.style.opacity = "0.3";
    secondCard.style.opacity = "0.3";

    setTimeout(() => {

      const reference =
        firstCard.nextSibling === secondCard
          ? secondCard
          : firstCard;

      if (firstCard.nextSibling === secondCard) {

        container.insertBefore(
          secondCard,
          firstCard
        );

      } else {

        const firstNext =
          firstCard.nextSibling;

        container.insertBefore(
          firstCard,
          secondCard
        );

        container.insertBefore(
          secondCard,
          firstNext
        );

      }

      firstCard.style.opacity = "1";
      secondCard.style.opacity = "1";

    }, 500);

  }, 4000);

  } 


  function stopPhotoInterchange() {

    if (
      photoRotationTimer !== null
    ) {

      clearInterval(
        photoRotationTimer
      );

      photoRotationTimer =
        null;

    }

  }


  /* ==========================================
     INCOMING CALL TIMER
  ========================================== */

  function startIncomingCallTimer() {

    if (
      photoWaitTimer !== null
    ) {

      clearTimeout(
        photoWaitTimer
      );

    }


    photoWaitTimer =
      setTimeout(
        () => {

          photoWaitTimer =
            null;


          showCallLoading();


          callLoadingTimer =
            setTimeout(
              () => {

                callLoadingTimer =
                  null;

                showIncomingCall();

              },

              CALL_LOADING_DURATION

            );

        },

        PHOTO_WAIT_DURATION

      );

  }


  /* ==========================================
     CALL LOADING
  ========================================== */

  function showCallLoading() {

    if (
      callVisible
    ) {
      return;
    }


    incomingCall.style.display =
      "flex";


    incomingCall.setAttribute(
      "aria-hidden",
      "false"
    );


    callLoading.style.display =
      "flex";


    callPhoto.style.display =
      "none";


    callName.style.display =
      "none";

  }


  function hideCallLoading() {

    callLoading.style.display =
      "none";


    callPhoto.style.display =
      "block";


    callName.style.display =
      "block";

  }


  /* ==========================================
     SHOW INCOMING CALL
  ========================================== */

  function showIncomingCall() {

    const images =
      document.querySelectorAll(
        ".live-photo img"
      );


    if (
      !images ||
      images.length === 0
    ) {

      closeIncomingCall();

      return;

    }


    const randomIndex =
      Math.floor(
        Math.random() *
        images.length
      );


    const selectedImage =
      images[randomIndex];


    callPhoto.src =
      selectedImage.src;


    callName.textContent =
      PHOTO_NAMES[randomIndex] ||
      "Live Video";


    hideCallLoading();


    callVisible =
      true;


    incomingCall.style.display =
      "flex";


    incomingCall.setAttribute(
      "aria-hidden",
      "false"
    );

  }


  /* ==========================================
     CLOSE CALL
  ========================================== */

  function closeIncomingCall() {

    callVisible =
      false;


    if (
      callLoadingTimer !== null
    ) {

      clearTimeout(
        callLoadingTimer
      );

      callLoadingTimer =
        null;

    }


    incomingCall.style.display =
      "none";


    incomingCall.setAttribute(
      "aria-hidden",
      "true"
    );


    callLoading.style.display =
      "none";


    callPhoto.style.display =
      "block";


    callName.style.display =
      "block";

  }


  /* ==========================================
     ANSWER / CONTINUE
  ========================================== */

  answerCall.addEventListener(
    "click",
    () => {

      closeIncomingCall();

      openPaymentPage();

    }
  );


  /* ==========================================
     REJECT / CLOSE
  ========================================== */

  rejectCall.addEventListener(
    "click",
    () => {

      closeIncomingCall();

      showPhotosPage();

      startPhotoInterchange();

    }
  );
  /* ==========================================
     VIDEO EVENTS
  ========================================== */

  if (sampleVideo) {

    sampleVideo.addEventListener(
      "ended",
      () => {

        finishSample();

      }
    );

  }


  /* ==========================================
     START WEBSITE
  ========================================== */

  function startWebsite() {

    if (flowRunning) {
      return;
    }


    flowRunning =
      true;


    const alreadyStarted =
      localStorage.getItem(
        FLOW_STORAGE_KEY
      );


    /*
      Returning visitor:
      skip the preview and show photos.
    */

    if (
      alreadyStarted === "true"
    ) {

      showPhotosPage();

      loadPhotos();

      return;

    }


    /*
      First visit:
      remember the flow.
    */

    localStorage.setItem(
      FLOW_STORAGE_KEY,
      "true"
    );


    startSample();

  }


  /* ==========================================
     PAGE START
  ========================================== */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      hideAllPages();

      closeIncomingCall();

      startWebsite();

    }
  );


  /* ==========================================
     PAGE CLEANUP
  ========================================== */

  window.addEventListener(
    "pagehide",
    () => {

      clearTimers();

      stopPhotoInterchange();


      if (sampleVideo) {

        sampleVideo.pause();

      }

    }
  );


  /* ==========================================
     ESCAPE KEY
  ========================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        callVisible
      ) {

        closeIncomingCall();

        showPhotosPage();

      }

    }
  );


</script>


</body>
</html>
