<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding:12px;
}

.page{
  width:100%;
  max-width:450px;
  min-height:calc(100vh - 24px);
  margin:auto;
}

/* WELCOME */
#welcomePage{
  min-height:calc(100vh - 24px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.welcome-box{
  width:100%;
  padding:25px 18px;
  border-radius:20px;
  background:#111;
  border:1px solid #292929;
}

.welcome-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:12px;
}

.welcome-text{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

.welcome-loader{
  width:42px;
  height:42px;
  border:4px solid #333;
  border-top-color:#22c55e;
  border-radius:50%;
  margin:25px auto 0;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* PHOTOS */
#photosPage{
  display:none;
  width:100%;
}

.top-bar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  margin-bottom:12px;
}

.online-box{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  background:#111;
  border:1px solid #292929;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  50%{opacity:.3;}
}

.page-title{
  font-size:25px;
  margin:8px 0 4px;
}

.page-subtitle{
  color:#999;
  font-size:13px;
  margin:0 0 14px;
}

#livePhotos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.live-photo{
  position:relative;
  overflow:hidden;
  background:#111;
  border:1px solid #222;
  border-radius:13px;
}

.live-photo img{
  width:100%;
  height:205px;
  display:block;
  object-fit:cover;
  background:#181818;
}

.live-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;
  background:#ef1749;
  color:#fff;
  border-radius:7px;
  padding:5px 8px;
  font-size:10px;
  font-weight:bold;
}

.live-badge::before{
  content:"●";
  margin-right:4px;
}

.status{
  position:absolute;
  top:7px;
  right:7px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 7px;
  border-radius:7px;
  background:rgba(0,0,0,.75);
  font-size:9px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
}

.status.offline .status-dot{
  background:#777;
  animation:none;
}

.play-icon{
  position:absolute;
  top:102px;
  left:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
  border:2px solid #fff;
  font-size:20px;
  pointer-events:none;
}

.photo-info{
  padding:8px;
  background:#111;
}

.name-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
}

.photo-name{
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.age-country{
  color:#999;
  font-size:9px;
  white-space:nowrap;
}

.comment-preview{
  margin-top:6px;
  padding:6px 7px;
  background:#191919;
  border-radius:7px;
  color:#ccc;
  font-size:9px;
  min-height:27px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-top:6px;
}

.action-btn{
  border:1px solid #292929;
  background:#171717;
  color:#fff;
  border-radius:7px;
  padding:6px 2px;
  font-size:9px;
  font-weight:bold;
}

.action-btn.active{
  border-color:#22c55e;
  color:#22c55e;
}

/* CALL */
#incomingCall{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  background:radial-gradient(circle,#222 0%,#080808 60%,#000 100%);

  justify-content:center;
  padding:18px;

.call-box{

  border-radius:22px;
  text-align:center;

.call-avatar{

  border-radius:50%;

  border:3px solid #22c55e;

}

.call-avatar img{

  height:100%;

.incoming-text{

  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.call-name{
  font-size:23px;
  font-weight:bold;
  margin-bottom:7px;
}

.call-description{
  color:#999;
  font-size:12px;
  margin-bottom:24px;
}

.call-buttons{
  display:flex;
  justify-content:center;
  gap:35px;
}

.call-btn{
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:25px;
}

.reject{
  background:#ef4444;
}

.answer{
  background:#22c55e;
}

/* CHAT */
#chatModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100000;
  background:rgba(0,0,0,.8);
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.chat-box{
  width:100%;
  max-width:450px;
  max-height:80vh;
  background:#111;
  border:1px solid #292929;
  border-radius:18px 18px 10px 10px;
  padding:14px;
}

.chat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.chat-title{
  font-size:17px;
  font-weight:bold;
}

.close-chat{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:#fff;
  font-size:18px;
}

.chat-list{
  max-height:52vh;
  overflow:auto;
}

.chat-message{
  margin:6px 0;
  padding:8px 9px;
  border-radius:10px;
  background:#1b1b1b;
  font-size:11px;
  line-height:1.35;
}

.chat-note{
  margin-top:8px;
  color:#666;
  text-align:center;
  font-size:9px;
}

@media(max-width:380px){
  .live-photo img{
    height:175px;
  }

  .play-icon{
    top:87px;
  }

  #livePhotos{
    gap:9px;
  }
}
</style>

/* =========================================
   STORAGE
========================================= */

function getStorage(name){

  try{

    return JSON.parse(
      localStorage.getItem(name) || "{}"
    );

  }catch(error){

    return {};

  }

}


function saveStorage(name,data){

  try{

    localStorage.setItem(
      name,
      JSON.stringify(data)
    );

  }catch(error){

  }

}


/* =========================================
   RANDOM
========================================= */

function randomItem(array){

  if(!array || !array.length){

    return "";

  }

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


function randomNumber(min,max){

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;

}
  /* =========================================
   IMAGE URL
========================================= */

function imageURL(index){

  const file =
    IMAGE_FILES[
      index % IMAGE_FILES.length
    ];

  return "./" +
    encodeURIComponent(file);

}


/* =========================================

========================================= */

/* =========================================

  const number =
    randomNumber(15,30);

  onlineNumber.textContent =

}


/* =========================================
   PROFILE STATUS
========================================= */

let offlineProfiles = new Set();


function chooseOfflineProfiles(){

  offlineProfiles.clear();

  const indexes = [];

  while(indexes.length < 5){

    const index =
      randomNumber(
        0,
        PROFILES.length - 1
      );

    if(!indexes.includes(index)){

      indexes.push(index);

    }

  }

  indexes.forEach(index => {

    offlineProfiles.add(index);

  });

  renderProfileStatuses();

}


function renderProfileStatuses(){

  document
    .querySelectorAll(".live-photo")
    .forEach(card => {

      const index =
        Number(
          card.dataset.profileIndex
        );

      const status =
        card.querySelector(".status");

      if(!status){

        return;

      }

      if(offlineProfiles.has(index)){

        status.classList.add("offline");

        status.innerHTML =
          '<span class="status-dot"></span>OFFLINE';

      }else{

        status.classList.remove("offline");

        status.innerHTML =
          '<span class="status-dot"></span>LIVE';

      }

    });

}


/* =========================================
   SOCIAL STORAGE
========================================= */

function getProfileState(){

  return {

    likes:
      getStorage("liveProfileLikes"),

    loves:
      getStorage("liveProfileLoves"),

    follows:
      getStorage("liveProfileFollows")

  };

}


function toggleProfileState(
  storageName,
  profileIndex
){

  const data =
    getStorage(storageName);

  const key =
    String(profileIndex);

  data[key] =
    !data[key];

  saveStorage(
    storageName,
    data
  );

  return Boolean(data[key]);

}


/* =========================================
   COMMENT DATA
========================================= */

function getComments(profileIndex){

  const data =
    getStorage(
      "liveProfileComments"
    );

  const key =
    String(profileIndex);

  if(
    Array.isArray(data[key]) &&
    data[key].length
  ){

    return data[key];

  }

  return [

    COMMENTS[
      profileIndex %
      COMMENTS.length
    ],

    COMMENTS[
      (profileIndex + 3) %
      COMMENTS.length
    ],

    COMMENTS[
      (profileIndex + 7) %
      COMMENTS.length
    ]

  ];

}


function saveComments(
  profileIndex,
  comments
){

  const data =
    getStorage(
      "liveProfileComments"
    );

  data[
    String(profileIndex)
  ] = comments;

  saveStorage(
    "liveProfileComments",
    data
  );

               }
  /* =========================================
   BUILD PHOTO CARD
========================================= */

function createPhotoCard(
  profile,
  index
){

  const card =
    document.createElement("div");

  card.className =
    "live-photo";

  card.dataset.profileIndex =
    index;

  const comments =
    getComments(index);

  const previewComment =
    comments[
      comments.length - 1
    ] || "Say hello 👋";

  const state =
    getProfileState();

  const liked =
    Boolean(
      state.likes[String(index)]
    );

  const loved =
    Boolean(
      state.loves[String(index)]
    );

  const following =
    Boolean(
      state.follows[String(index)]
    );

  const flag =
    FLAGS[profile.country] || "🌍";

  card.innerHTML = `

    <div
      class="live-badge"
    >
      LIVE
    </div>

    <div class="status">
      <span class="status-dot"></span>
      LIVE
    </div>

    <img
      src="${imageURL(profile.image)}"
      alt="${profile.name}"
      loading="lazy"
    >

    <div class="play-icon">
      ▶
    </div>

    <div class="photo-info">

      <div class="name-row">

        <div class="photo-name">
          ${profile.name}
        </div>

        <div class="age-country">
          ${flag} ${profile.age}
        </div>

      </div>

      <div class="comment-preview">
        💬 ${previewComment}
      </div>

      <div class="actions">

        <button
          class="action-btn ${liked ? "active" : ""}"
          data-action="like"
          type="button"
        >
          ❤️ Like
        </button>

        <button
          class="action-btn ${loved ? "active" : ""}"
          data-action="love"
          type="button"
        >
          💕 Love
        </button>

        <button
          class="action-btn ${following ? "active" : ""}"
          data-action="follow"
          type="button"
        >
          ${following ? "Following" : "Follow"}
        </button>

        <button
          class="action-btn"
          data-action="chat"
          type="button"
        >
          💬 Chat
        </button>

      </div>

    </div>
  `;


  /* =====================================
     IMAGE CLICK
  ===================================== */

  card
    .querySelector("img")
    .addEventListener(
      "click",
      function(){

        openPaymentPage(
          profile,
          index
        );

      }
    );


  /* =====================================
     CARD CLICK
  ===================================== */

  card.addEventListener(
    "click",
    function(event){

      if(
        event.target.closest(
          ".action-btn"
        )
      ){

        return;

      }

      if(
        event.target.tagName === "IMG"
      ){

        return;

      }

      openPaymentPage(
        profile,
        index
      );

    }
  );


  /* =====================================
     ACTION BUTTONS
  ===================================== */

  card
    .querySelectorAll(".action-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          const action =
            button.dataset.action;

          if(action === "like"){

            const active =
              toggleProfileState(
                "liveProfileLikes",
                index
              );

            button.classList.toggle(
              "active",
              active
            );

            return;

          }


          if(action === "love"){

            const active =
              toggleProfileState(
                "liveProfileLoves",
                index
              );

            button.classList.toggle(
              "active",
              active
            );

            return;

          }


          if(action === "follow"){

            const active =
              toggleProfileState(
                "liveProfileFollows",
                index
              );

            button.classList.toggle(
              "active",
              active
            );

            button.textContent =
              active
                ? "Following"
                : "Follow";

            return;

          }


          if(action === "chat"){

            openChat(
              profile,
              index
            );

          }

        }
      );

    });


  return card;

}


/* =========================================
   LOAD PHOTOS
========================================= */

function loadPhotos(){

  livePhotos.innerHTML = "";

  const fragment =
    document.createDocumentFragment();

  PROFILES
    .slice(0,MAX_PHOTOS)
    .forEach(
      (profile,index) => {

        const card =
          createPhotoCard(
            profile,
            index
          );

        fragment.appendChild(card);

      }
    );

  livePhotos.appendChild(
    fragment
  );

  chooseOfflineProfiles();

  startCommentActivity();

}


/* =========================================
   PAYMENT PAGE
========================================= */

function openPaymentPage(
  profile,
  index
){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const referral =
    params.get("ref") ||
    params.get("employee") ||
    "";

  const url =
    new URL(
      PAYMENT_PAGE_URL,
      window.location.href
    );

  if(referral){

    url.searchParams.set(
      "ref",
      referral
    );

    url.searchParams.set(
      "employee",
      referral
    );

  }

  url.searchParams.set(
    "profile",
    profile.name
  );

  url.searchParams.set(
    "age",
    profile.age
  );

  url.searchParams.set(
    "country",
    profile.country
  );

  url.searchParams.set(
    "image",
    IMAGE_FILES[
      profile.image %
      IMAGE_FILES.length
    ]
  );

  window.location.href =
    url.toString();

          }
  /* =========================================
   CHAT
========================================= */

function openChat(
  profile,
  index
){

  currentChatProfile =
    index;

  chatTitle.textContent =
    profile.name +
    " — Live Chat";

  renderChat(index);

  chatModal.style.display =
    "flex";

}


function closeChatModal(){

  chatModal.style.display =
    "none";

  currentChatProfile =
    null;

}


function renderChat(index){

  const comments =
    getComments(index);

  chatList.innerHTML = "";

  comments
    .slice(-30)
    .forEach(
      (message,i) => {

        const bubble =
          document.createElement(
            "div"
          );

        bubble.className =
          "chat-message";

        bubble.textContent =
          message;

        chatList.appendChild(
          bubble
        );

      }
    );

  chatList.scrollTop =
    chatList.scrollHeight;

}


closeChat.addEventListener(
  "click",
  function(event){

    event.preventDefault();

    closeChatModal();

  }
);


chatModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      chatModal
    ){

      closeChatModal();

    }

  }
);


/* =========================================
   LOCAL COMMENT ACTIVITY
========================================= */

function startCommentActivity(){

  stopCommentActivity();

  PROFILES
    .slice(0,MAX_PHOTOS)
    .forEach(
      (profile,index) => {

        scheduleComment(
          index
        );

      }
    );

}


function stopCommentActivity(){

  commentTimers.forEach(
    timer => clearTimeout(timer)
  );

  commentTimers = [];

}


function scheduleComment(
  index
){

  const delay =
    randomNumber(
      7000,
      22000
    );

  const timer =
    setTimeout(
      function(){

        addLocalComment(index);

        scheduleComment(index);

      },
      delay
    );

  commentTimers.push(
    timer
  );

}


function addLocalComment(
  index
){

  const comments =
    getComments(index);

  const message =
    randomItem(
      COMMENTS
    );

  comments.push(message);

  if(comments.length > 30){

    comments.shift();

  }

  saveComments(
    index,
    comments
  );

  const card =
    document.querySelector(
      `.live-photo[data-profile-index="${index}"]`
    );

  if(card){

    const preview =
      card.querySelector(
        ".comment-preview"
      );

    if(preview){

      preview.textContent =
        "💬 " +
        message;

    }

  }

  if(
    currentChatProfile === index &&
    chatModal.style.display === "flex"
  ){

    renderChat(index);

  }

}


/* =========================================
   ONLINE NUMBER LOOP
========================================= */

function startOnlineLoop(){

  updateOnlineNumber();

  clearInterval(
    onlineTimer
  );

  onlineTimer =
    setInterval(
      updateOnlineNumber,
      20000
    );

}


/* =========================================
   OFFLINE LOOP
========================================= */

function startOfflineLoop(){

  chooseOfflineProfiles();

  clearInterval(
    offlineTimer
  );

  offlineTimer =
    setInterval(
      chooseOfflineProfiles,
      300000
    );

  }
  /* =========================================
   INCOMING CALL
========================================= */

function selectCallProfile(){

  const index =
    randomNumber(
      0,
      PROFILES.length - 1
    );

  currentCallProfile =
    PROFILES[index];

  callPhoto.src =
    imageURL(
      currentCallProfile.image
    );

  callName.textContent =
    currentCallProfile.name;

}


function startIncomingCall(){

  selectCallProfile();

  showIncomingCall();

}


/* =========================================
   REJECT CALL
========================================= */

rejectCall.addEventListener(
  "click",
  function(event){

    event.preventDefault();

    event.stopPropagation();

    incomingCall.style.display =
      "none";

    showPhotos();

  }
);


/* =========================================
   ANSWER CALL
========================================= */

answerCall.addEventListener(
  "click",
  function(event){

    event.preventDefault();

    event.stopPropagation();

    answerIncomingCall();

  }
);


function answerIncomingCall(){

  incomingCall.style.display =
    "none";

  /*
    Payment page remains separate.
    We do not open payment here.
  */

  showInsufficientAfterCall();

}


/* =========================================
   INSUFFICIENT AFTER CALL
========================================= */

function showInsufficientAfterCall(){

  /*
    Small temporary message.
    After 2 seconds user returns
    to the live photos.
  */

  const overlay =
    document.createElement(
      "div"
    );

  overlay.id =
    "temporaryInsufficient";

  overlay.style.position =
    "fixed";

  overlay.style.inset =
    "0";

  overlay.style.zIndex =
    "99998";

  overlay.style.background =
    "#000";

  overlay.style.display =
    "flex";

  overlay.style.alignItems =
    "center";

  overlay.style.justifyContent =
    "center";

  overlay.style.textAlign =
    "center";

  overlay.innerHTML = `

    <div style="
      width:90%;
      max-width:360px;
      padding:30px 20px;
      background:#111;
      border:1px solid #292929;
      border-radius:15px;
    ">

      <div style="
        color:#ff5252;
        font-size:24px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        Insufficient minutes
      </div>

      <div style="
        color:#aaa;
        font-size:14px;
      ">
        Buy more minutes!
      </div>

    </div>
  `;

  document.body.appendChild(
    overlay
  );

  setTimeout(
    function(){

      overlay.remove();

      showPhotos();

    },
    2000
  );

}


/* =========================================
   FIRST VISITOR VIDEO FLOW
========================================= */

function hasStartedFlow(){

  try{

    return Boolean(
      localStorage.getItem(
        FLOW_STORAGE_KEY
      )
    );

  }catch(error){

    return false;

  }

}


function markFlowStarted(){

  try{

    localStorage.setItem(
      FLOW_STORAGE_KEY,
      "sample-completed"
    );

  }catch(error){

  }

}


/* =========================================
   SAMPLE VIDEO OVERLAY
========================================= */

function playFirstVisitorSample(){

  /*
    This is intentionally separate from
    payment.html.
  */

  const sample =
    document.createElement(
      "div"
    );

  sample.id =
    "sampleOverlay";

  sample.style.position =
    "fixed";

  sample.style.inset =
    "0";

  sample.style.zIndex =
    "100001";

  sample.style.background =
    "#000";

  sample.style.display =
    "flex";

  sample.style.alignItems =
    "center";

  sample.style.justifyContent =
    "center";

  sample.style.padding =
    "15px";

  sample.innerHTML = `

    <div style="
      width:100%;
      max-width:450px;
      text-align:center;
    ">

      <div style="
        font-size:22px;
        font-weight:bold;
        margin-bottom:14px;
      ">
        Live Video ❤️
      </div>

      <video
        id="firstVisitorVideo"
        playsinline
        autoplay
        preload="auto"
        style="
          width:100%;
          max-height:72vh;
          background:#111;
          border-radius:14px;
          object-fit:contain;
        "
      >
        <source
          src="${SAMPLE_VIDEO}"
          type="video/mp4"
        >
      </video>

    </div>
  `;

  document.body.appendChild(
    sample
  );

  const video =
    document.getElementById(
      "firstVisitorVideo"
    );

  /*
    Important:
    We do NOT use the invalid
    HTML attribute "sound".
  */

  video.muted = false;

  video.volume = 1;

  let finished = false;

  function finish(){

    if(finished){

      return;

    }

    finished = true;

    markFlowStarted();

    sample.remove();

    showInsufficientAfterCall();

  }

  video.addEventListener(
    "ended",
    finish
  );

  video.addEventListener(
    "error",
    function(){

      /*
        If the local video is unavailable,
        don't leave the visitor stuck.
      */

      setTimeout(
        finish,
        500
      );

    }
  );

  /*
    Maximum fallback time so the page
    cannot remain stuck forever.
  */

  setTimeout(
    finish,
    22000
  );

  const playPromise =
    video.play();

  if(
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ){

    playPromise.catch(
      function(){

        /*
          Some mobile browsers block
          autoplay with sound.

          We keep the page usable.
        */

        video.muted = true;

        video.play().catch(
          function(){}
        );

      }
    );

  }

    }
  /* =========================================
   MAIN WEBSITE FLOW
========================================= */

function startWebsiteFlow(){

  /*
    IMPORTANT:
    This function is the ONLY main
    startup flow.

    Welcome
      ↓
    3 seconds
      ↓
    Photos
      ↓
    1.5 seconds
      ↓
    Incoming call
  */

  showWelcome();

  loadPhotos();

  startOnlineLoop();

  startOfflineLoop();


  clearTimeout(
    welcomeTimer
  );

  welcomeTimer =
    setTimeout(
      function(){

        showPhotos();

        clearTimeout(
          photoTimer
        );

        photoTimer =
          setTimeout(
            function(){

              /*
                Do not show the call
                before photos appear.
              */

              startIncomingCall();

            },
            1500
          );

      },
      3000
    );

}


/* =========================================
   SAFE INITIALIZATION
========================================= */

function initializeWebsite(){

  if(initialized){

    return;

  }

  initialized = true;

  /*
    Prevent old timers from
    interfering.
  */

  clearTimeout(
    welcomeTimer
  );

  clearTimeout(
    photoTimer
  );

  clearTimeout(
    callTimer
  );

  /*
    Start the one clean flow.
  */

  startWebsiteFlow();

}


/* =========================================
   DOM READY
========================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initializeWebsite,
    {
      once:true
    }
  );

}else{

  initializeWebsite();

}


/* =========================================
   GLOBAL ERROR PROTECTION
========================================= */

window.addEventListener(
  "error",
  function(event){

    /*
      Do not allow a non-critical
      image/script error to leave
      the visitor on a blank screen.
    */

    try{

      if(
        photosPage.style.display ===
        "none" &&
        welcomePage.style.display ===
        "none"
      ){

        showPhotos();

      }

    }catch(error){

    }

  }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    /*
      No navigation or payment action
      is triggered here.
    */

  }
);


/* =========================================
   IMAGE FALLBACK
========================================= */

document.addEventListener(
  "error",
  function(event){

    const element =
      event.target;

    if(
      element &&
      element.tagName ===
      "IMG"
    ){

      /*
        Keep broken image areas
        visually usable.
      */

      element.style.background =
        "#222";

    }

  },
  true
);
  /* =========================================
   EXTRA SAFETY
========================================= */

(function(){

  /*
    Make sure the page cannot remain
    hidden if the startup timer fails.
  */

  setTimeout(
    function(){

      try{

        const welcomeVisible =
          getComputedStyle(
            welcomePage
          ).display !== "none";

        const photosVisible =
          getComputedStyle(
            photosPage
          ).display !== "none";

        const callVisible =
          getComputedStyle(
            incomingCall
          ).display !== "none";

        if(
          !welcomeVisible &&
          !photosVisible &&
          !callVisible
        ){

          showPhotos();

        }

      }catch(error){

        try{

          photosPage.style.display =
            "block";

        }catch(e){}

      }

    },
    5000
  );

})();


/* =========================================
   KEEP PHOTO PAGE AVAILABLE
========================================= */

window.addEventListener(
  "pageshow",
  function(){

    if(
      !incomingCall ||
      !photosPage ||
      !welcomePage
    ){

      return;

    }

  }
);


/* =========================================
   ESC KEY CHAT CLOSE
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeChatModal();

    }

  }
);


/* =========================================
   PREVENT DOUBLE CALL ACTION
========================================= */

let callActionLocked = false;


function lockCallAction(){

  if(callActionLocked){

    return false;

  }

  callActionLocked = true;

  setTimeout(
    function(){

      callActionLocked = false;

    },
    1000
  );

  return true;

}


/* Replace button listeners with safe
   wrappers through capture phase. */

answerCall.addEventListener(
  "click",
  function(event){

    if(
      !lockCallAction()
    ){

      event.preventDefault();

      event.stopImmediatePropagation();

    }

  },
  true
);


rejectCall.addEventListener(
  "click",
  function(event){

    if(
      !lockCallAction()
    ){

      event.preventDefault();

      event.stopImmediatePropagation();

    }

  },
  true
);


/* =========================================
   FINAL PAGE CHECK
========================================= */

setTimeout(
  function(){

    try{

      if(
        livePhotos.children.length ===
        0
      ){

        loadPhotos();

      }

    }catch(error){

    }

  },
  3500
);
/* =========================================
   FINAL SAFETY CHECK
========================================= */

setTimeout(function(){

  try{

    if(
      livePhotos &&
      livePhotos.children.length === 0
    ){

      loadPhotos();

    }

  }catch(error){

    console.error(
      "Photo loading error:",
      error
    );

  }

}, 3500);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
  "beforeunload",
  function(){

    clearTimeout(welcomeTimer);

    clearTimeout(photoTimer);

    clearTimeout(callTimer);

    clearInterval(onlineTimer);

    clearInterval(offlineTimer);

    stopCommentActivity();

  }
);


/* =========================================
   END OF SCRIPT
========================================= */

</script>

</body>
</html>
