<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liparo STK Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 420px;
      margin: 40px auto;
      background: #222;
      padding: 25px;
      border-radius: 15px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 17px;
    }

    button {
      background: #00c853;
      color: white;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Liparo STK Test</h2>

  <p>Test amount: <strong>KSh 10</strong></p>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    placeholder="07XXXXXXXX"
  >

  <button onclick="sendTest()">
    SEND KSh 10 STK
  </button>

  <div id="result">
    Ready for test.
  </div>

</div>

<script>

async function sendTest() {

  const phone =
    document.getElementById("phone").value.trim();

  const result =
    document.getElementById("result");

  if (!phone) {
    result.textContent =
      "Please enter your M-PESA number.";
    return;
  }

  result.textContent =
    "Sending KSh 10 STK request...";

  try {

    const response = await fetch(
      "/api/liparo-stk",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          phone: phone,
          amount: 10,
          reference: "LIPARO-TEST-10"
        })
      }
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = {
        raw_response: text
      };
    }

    result.textContent =
      "HTTP STATUS: " +
      response.status +
      "\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {

    result.textContent =
      "CONNECTION ERROR\n\n" +
      error.message;

  }

}

</script>

</body>
</html>
