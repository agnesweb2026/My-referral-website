<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Employee Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:25px 20px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:25px;
  font-size:14px;
}

label{
  display:block;
  color:#bbb;
  font-size:14px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:17px;
  border:1px solid #444;
  border-radius:9px;
  background:#080808;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#16c784;
}

.login-button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#16c784;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:active{
  transform:scale(.98);
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  min-height:20px;
}

</style>

</head>

<body>


<div class="login-box">

<h1>
Employee Login
</h1>

<div class="subtitle">
Login to your employee account
</div>


<form id="loginForm">


<label for="username">
Username
</label>

<input
id="username"
type="text"
placeholder="Enter username"
autocomplete="username"
required
>


<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter password"
autocomplete="current-password"
required
>


<button
class="login-button"
type="submit">

LOGIN

</button>


</form>


<div
id="message"
class="message">
</div>


</div>


<script>

/*
  EMPLOYEE ACCOUNTS
*/

const employees = {

  Joshua1:{
    employeeId:"EMP001",
    password:"123456"
  },

  Joshua2:{
    employeeId:"EMP002",
    password:"123456"
  },

  Joshua3:{
    employeeId:"EMP003",
    password:"123456"
  },

  Joshua4:{
    employeeId:"EMP004",
    password:"123456"
  },

  Joshua5:{
    employeeId:"EMP005",
    password:"123456"
  },

  Joshua6:{
    employeeId:"EMP006",
    password:"123456"
  },

  Joshua7:{
    employeeId:"EMP007",
    password:"123456"
  },

  Joshua8:{
    employeeId:"EMP008",
    password:"123456"
  },

  Joshua9:{
    employeeId:"EMP009",
    password:"123456"
  },

  Joshua10:{
    employeeId:"EMP010",
    password:"123456"
  }

};


document.getElementById(
  "loginForm"
).addEventListener(
  "submit",
  function(event){

    event.preventDefault();


    const username =
      document.getElementById(
        "username"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    const message =
      document.getElementById(
        "message"
      );


    /*
      CHECK USERNAME
    */

    const employee =
      employees[username];


    if(
      !employee ||
      employee.password !== password
    ){

      message.textContent =
        "Incorrect username or password.";

      message.style.color =
        "#ff4d4d";

      return;

    }


    /*
      LOGIN SUCCESS
    */

    message.textContent =
      "Login successful...";

    message.style.color =
      "#16c784";


    /*
      SAVE EMPLOYEE
    */

    sessionStorage.setItem(
      "loggedInEmployee",
      employee.employeeId
    );


    /*
      OPEN CORRECT DASHBOARD
    */

    setTimeout(
      function(){

        window.location.href =
          "employee-dashboard.html?employee=" +
          encodeURIComponent(
            employee.employeeId
          );

      },
      700
    );

  }
);

</script>

</body>

</html>
