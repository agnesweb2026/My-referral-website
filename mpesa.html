<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Buy Minutes</title>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#09090f;
  color:#fff;
}

body{
  overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{

  min-height:100vh;

  padding:25px 18px 110px;

  background:
    radial-gradient(
      circle at top,
      #292342 0%,
      #100f18 45%,
      #050507 100%
    );
}

.backgroundContent{
  filter:blur(5px);
  opacity:.45;
}

.backgroundContent h1{
  font-size:32px;
}


/* =========================
   BOTTOM SHEET
========================= */

.sheet{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:1000;

  background:#f8f8fa;

  color:#111;

  border-radius:28px 28px 0 0;

  max-height:94vh;

  overflow-y:auto;

  padding:16px 18px 30px;

  box-shadow:
    0 -10px 40px rgba(0,0,0,.45);
}


/* =========================
   HANDLE
========================= */

.handle{

  width:68px;
  height:6px;

  border-radius:10px;

  background:#d0d0d0;

  margin:0 auto 18px;
}


/* =========================
   HEADER
========================= */

.header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 5px 15px;
}

.headerText h1{

  margin:0;

  font-size:30px;

  font-weight:800;
}

.headerText p{

  margin:7px 0 0;

  color:#888;

  font-size:16px;
}

.closeButton{

  width:48px;
  height:48px;

  border:0;

  border-radius:50%;

  background:#ededed;

  color:#666;

  font-size:27px;

  cursor:pointer;
}


/* =========================
   LINE
========================= */

.line{

  height:1px;

  background:#e4e4e4;

  margin:0 0 14px;
}


/* =========================
   PACKAGES
========================= */

.packages{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}


/* =========================
   PACKAGE CARD
========================= */

.package{

  position:relative;

  min-height:210px;

  border-radius:22px;

  overflow:hidden;

  background:#1a1a2e;

  border:2px solid #282842;

  cursor:pointer;

  transition:
    transform .15s,
    border-color .15s;

  display:flex;

  flex-direction:column;
}

.package:active{

  transform:scale(.97);
}

.package.selected{

  border-color:#ffae00;

  box-shadow:
    0 0 0 2px
    rgba(255,174,0,.25);
}


/* =========================
   HOT
========================= */

.hot{

  position:absolute;

  top:10px;

  right:8px;

  background:#ff3b68;

  color:#fff;

  padding:7px 11px;

  border-radius:18px;

  font-size:12px;

  font-weight:bold;

  z-index:3;
}


/* =========================
   ICON
========================= */

.iconArea{

  height:105px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.videoCircle{

  width:62px;
  height:62px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#302b36;

  border:2px solid #6b5123;

  color:#ffe000;

  font-size:27px;
}


/* =========================
   MINUTES
========================= */

.minutes{

  text-align:center;

  color:#fff;

  font-size:18px;

  font-weight:bold;

  padding:0 5px 14px;
}


/* =========================
   PRICE
========================= */

.priceArea{

  margin-top:auto;

  background:#ff9f0a;

  color:#151515;

  text-align:center;

  padding:16px 5px 13px;
}

.price{

  font-size:19px;

  font-weight:800;
}

.approx{

  margin-top:5px;

  font-size:12px;

  color:#744d00;
}


/* =========================
   SELECTED PACKAGE
========================= */

.selectedInfo{

  display:none;

  margin-top:16px;

  padding:18px;

  background:#fff;

  border-radius:16px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

  text-align:center;

  font-size:18px;
}

.selectedInfo strong{

  font-size:20px;
}


/* =========================
   PAYMENT SECTION
========================= */

.paymentSection{

  display:none;

  margin-top:16px;

  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);
}

.paymentTitle{

  font-size:27px;

  font-weight:bold;

  text-align:center;

  margin-bottom:18px;
}


/* =========================
   TILL
========================= */

.till{

  text-align:center;

  padding:15px;

  background:#f1f1f1;

  border-radius:12px;

  font-size:18px;
}

.till strong{

  font-size:22px;
}


/* =========================
   MPESA BUTTON
========================= */

.mpesaButton{

  width:100%;

  margin-top:15px;

  padding:17px;

  border:0;

  border-radius:14px;

  background:#20a943;

  color:#fff;

  font-size:20px;

  font-weight:bold;

  cursor:pointer;
}

.mpesaButton:active{

  transform:scale(.98);
}


/* =========================
   MESSAGE AREA
========================= */

.messageArea{

  display:none;

  margin-top:15px;
}


/* =========================
   TEXTAREA
========================= */

#mpesaMessage{

  width:100%;

  min-height:115px;

  resize:none;

  padding:15px;

  border:2px solid #ccc;

  border-radius:12px;

  font-size:16px;

  outline:none;

  background:#fff;

  color:#111;

  transition:
    border-color .2s,
    background .2s,
    color .2s,
    box-shadow .2s;
}


/* =========================
   RED / REJECTED
========================= */

#mpesaMessage.invalid{

  border-color:#e53935;

  background:#fff0f0;

  color:#c40000;

  box-shadow:
    0 0 0 2px
    rgba(229,57,53,.08);
}


/* =========================
   STATUS
========================= */

#messageStatus{

  min-height:24px;

  margin-top:8px;

  text-align:center;

  font-size:14px;

  font-weight:bold;
}

.statusRejected{

  color:#e53935;
}


/* =========================
   CONTINUE
========================= */

.continue{

  width:100%;

  margin-top:12px;

  padding:17px;

  border:0;

  border-radius:14px;

  background:#1976d2;

  color:#fff;

  font-size:20px;

  font-weight:bold;

  cursor:pointer;
}

.continue:disabled{

  background:#999;

  color:#ddd;

  cursor:not-allowed;

  opacity:.7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .sheet{

    padding-left:14px;

    padding-right:14px;
  }

  .packages{

    grid-template-columns:
      repeat(3,1fr);

    gap:8px;
  }

  .package{

    min-height:185px;

    border-radius:18px;
  }

  .iconArea{

    height:85px;
  }

  .videoCircle{

    width:50px;

    height:50px;

    font-size:22px;
  }

  .minutes{

    font-size:15px;
  }

  .priceArea{

    padding:13px 3px;
  }

  .price{

    font-size:16px;
  }

  .approx{

    font-size:10px;
  }

  .headerText h1{

    font-size:27px;
  }

  .paymentTitle{

    font-size:25px;
  }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

  <div class="backgroundContent">

    <h1>
      People
    </h1>

    <p>
      ● Live now
    </p>

  </div>

</div>


<!-- =========================
     BUY MINUTES
========================= -->

<div class="sheet">

  <div class="handle"></div>


  <!-- HEADER -->

  <div class="header">

    <div class="headerText">

      <h1>
        Buy Minutes
      </h1>

      <p>
        Choose a plan that works for you
      </p>

    </div>


    <button
      class="closeButton"
      onclick="goBack()">

      ×

    </button>

  </div>


  <div class="line"></div>


  <!-- =========================
       PACKAGES
  ========================= -->

  <div class="packages">


    <!-- 10 MINUTES -->

    <div
      class="package"
      onclick="selectPackage(80,10,this)">

      <div class="hot">
        🔥 HOT
      </div>

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        10 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 80
        </div>

        <div class="approx">
          ≈ $0.62
        </div>

      </div>

    </div>


    <!-- 25 MINUTES -->

    <div
      class="package"
      onclick="selectPackage(135,25,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        25 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 135
        </div>

        <div class="approx">
          ≈ $1.04
        </div>

      </div>

    </div>


    <!-- 40 MINUTES -->

    <div
      class="package"
      onclick="selectPackage(200,40,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        40 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 200
        </div>

        <div class="approx">
          ≈ $1.55
        </div>

      </div>

    </div>


    <!-- 55 MINUTES -->

    <div
      class="package"
      onclick="selectPackage(250,55,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        55 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 250
        </div>

        <div class="approx">
          ≈ $1.94
        </div>

      </div>

    </div>


    <!-- 65 MINUTES -->

    <div
      class="package"
      onclick="selectPackage(300,65,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        65 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 300
        </div>

        <div class="approx">
          ≈ $2.32
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       SELECTED
  ========================= -->

  <div
    id="selectedInfo"
    class="selectedInfo">

    Selected:

    <strong id="selectedText"></strong>

  </div>


  <!-- =========================
       PAYMENT
  ========================= -->

  <div
    id="paymentSection"
    class="paymentSection">

    <div class="paymentTitle">
      M-Pesa Payment
    </div>


    <div class="till">

      Pay with Till:

      <strong>
        1605854
      </strong>

    </div>


    <button
      class="mpesaButton"
      onclick="showMessageBox()">

      Pay with M-Pesa

    </button>


    <!-- =========================
         MESSAGE
    ========================= -->

    <div
      id="messageArea"
      class="messageArea">

      <textarea
        id="mpesaMessage"
        placeholder="Paste M-Pesa message here..."
        oninput="validateMpesaMessage()"></textarea>


      <div
        id="messageStatus">
      </div>


      <button
        id="continueButton"
        class="continue"
        onclick="continuePayment()"
        disabled>

        Continue

      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let selectedPrice = null;

let selectedMinutes = null;


/* =========================
   SELECT PACKAGE
========================= */

function selectPackage(
  price,
  minutes,
  element
){

  selectedPrice =
    price;

  selectedMinutes =
    minutes;


  document
    .querySelectorAll(".package")
    .forEach(function(card){

      card.classList.remove(
        "selected"
      );

    });


  element.classList.add(
    "selected"
  );


  document.getElementById(
    "selectedInfo"
  ).style.display =
    "block";


  document.getElementById(
    "selectedText"
  ).textContent =

    "KSh " +
    price +
    " — " +
    minutes +
    " Minutes";


  document.getElementById(
    "paymentSection"
  ).style.display =
    "block";


  setTimeout(function(){

    document.getElementById(
      "paymentSection"
    ).scrollIntoView({

      behavior:"smooth",

      block:"center"

    });

  },100);

}


/* =========================
   SHOW MESSAGE BOX
========================= */

function showMessageBox(){

  if(
    selectedPrice === null ||
    selectedMinutes === null
  ){

    alert(
      "Please select a package first."
    );

    return;

  }


  document.getElementById(
    "messageArea"
  ).style.display =
    "block";


  document.getElementById(
    "mpesaMessage"
  ).focus();

}


/* =========================
   MESSAGE INPUT
========================= */

function validateMpesaMessage(){

  const box =
    document.getElementById(
      "mpesaMessage"
    );

  const status =
    document.getElementById(
      "messageStatus"
    );

  const button =
    document.getElementById(
      "continueButton"
    );


  /*
    ANY message is allowed
    to be entered or pasted.
  */

  const message =
    box.value.trim();


  /*
    Nothing entered.
  */

  if(message === ""){

    box.classList.remove(
      "invalid"
    );

    status.textContent =
      "";

    status.className =
      "";

    button.disabled =
      true;

    return;
  }


  /*
    Message entered.
    Allow Continue.
  */

  box.classList.remove(
    "invalid"
  );

  status.textContent =
    "";

  status.className =
    "";

  button.disabled =
    false;

}


/* =========================
   CONTINUE
========================= */

function continuePayment(){

  const box =
    document.getElementById(
      "mpesaMessage"
    );

  const status =
    document.getElementById(
      "messageStatus"
    );

  const button =
    document.getElementById(
      "continueButton"
    );


  const message =
    box.value.trim();


  /*
    EMPTY MESSAGE
  */

  if(message === ""){

    box.classList.add(
      "invalid"
    );

    status.textContent =
      "✕ Please enter an M-Pesa message.";

    status.className =
      "statusRejected";

    return;
  }


  /*
    ==================================
    REJECT THE MESSAGE
    ==================================
  */

  box.value = "";


  /*
    Turn the box RED.
  */

  box.classList.remove(
    "valid"
  );

  box.classList.add(
    "invalid"
  );


  /*
    Show rejection.
  */

  status.textContent =
    "✕ REJECTED — invalid m-pesa message.";

  status.className =
    "statusRejected";


  /*
    Keep Continue available for
    another message.
  */

  button.disabled =
    true;


  /*
    IMPORTANT:
    Do not save the message.
    Do not open photos.html.
  */

  localStorage.removeItem(
    "mpesaMessage"
  );

}


/* =========================
   CLOSE
========================= */

function goBack(){

  history.back();

}

</script>


</body>

          </html>
