<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Buy Minutes</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#09090f;
  color:#fff;
}

body{
  overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{
  min-height:100vh;
  padding:25px 18px 110px;

  background:
    radial-gradient(
      circle at top,
      #292342 0%,
      #100f18 45%,
      #050507 100%
    );
}

.backgroundContent{
  filter:blur(4px);
  opacity:.55;
}

.backgroundContent h1{
  font-size:32px;
}


/* =========================
   BOTTOM SHEET
========================= */

.sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  z-index:1000;

  background:#f8f8fa;
  color:#111;

  border-radius:28px 28px 0 0;

  max-height:90vh;
  overflow-y:auto;

  padding:18px 18px 30px;

  box-shadow:
    0 -10px 40px rgba(0,0,0,.45);
}


/* HANDLE */

.handle{
  width:68px;
  height:6px;

  border-radius:10px;

  background:#d0d0d0;

  margin:0 auto 18px;
}


/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5px 15px;
}

.headerText h1{
  margin:0;

  font-size:30px;
  font-weight:800;
}

.headerText p{
  margin:7px 0 0;

  color:#888;
  font-size:16px;
}

.closeButton{
  width:48px;
  height:48px;

  border:0;
  border-radius:50%;

  background:#ededed;

  color:#666;

  font-size:25px;

  cursor:pointer;
}


/* =========================
   LINE
========================= */

.line{
  height:1px;
  background:#e4e4e4;

  margin:0 0 14px;
}


/* =========================
   PACKAGES
========================= */

.packages{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}


/* =========================
   PACKAGE CARD
========================= */

.package{
  position:relative;

  min-height:210px;

  border-radius:22px;

  overflow:hidden;

  background:#1a1a2e;

  border:2px solid #282842;

  cursor:pointer;

  transition:
    transform .15s,
    border-color .15s;

  display:flex;
  flex-direction:column;
}

.package:active{
  transform:scale(.97);
}

.package.selected{
  border-color:#ffae00;

  box-shadow:
    0 0 0 2px
    rgba(255,174,0,.2);
}


/* =========================
   HOT BADGE
========================= */

.hot{
  position:absolute;

  top:10px;
  right:8px;

  background:#ff3b68;

  color:#fff;

  padding:7px 11px;

  border-radius:18px;

  font-size:12px;
  font-weight:bold;

  z-index:3;
}


/* =========================
   VIDEO ICON
========================= */

.iconArea{
  height:105px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.videoCircle{
  width:62px;
  height:62px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#302b36;

  border:2px solid #6b5123;

  color:#ffe000;

  font-size:28px;
}


/* =========================
   MINUTES
========================= */

.minutes{
  text-align:center;

  color:#fff;

  font-size:18px;
  font-weight:bold;

  padding:0 5px 14px;
}


/* =========================
   PRICE
========================= */

.priceArea{
  margin-top:auto;

  background:#ff9f0a;

  color:#151515;

  text-align:center;

  padding:16px 5px 13px;
}

.price{
  font-size:19px;
  font-weight:800;
}

.approx{
  margin-top:5px;

  font-size:12px;

  color:#744d00;
}


/* =========================
   SELECTED PACKAGE
========================= */

.selectedInfo{
  display:none;

  margin-top:16px;

  padding:16px;

  background:#fff;

  border-radius:15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

  text-align:center;
}

.selectedInfo strong{
  font-size:20px;
}


/* =========================
   PAYMENT SECTION
========================= */

.paymentSection{
  display:none;

  margin-top:16px;

  background:#fff;

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);
}

.paymentTitle{
  font-size:20px;
  font-weight:bold;

  text-align:center;

  margin-bottom:12px;
}

.till{
  text-align:center;

  padding:12px;

  background:#f2f2f2;

  border-radius:10px;

  font-size:17px;
}

.till strong{
  font-size:21px;
}


/* =========================
   MPESA BUTTON
========================= */

.mpesaButton{
  width:100%;

  margin-top:14px;

  padding:16px;

  border:0;

  border-radius:13px;

  background:#20a943;

  color:#fff;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   MESSAGE
========================= */

.messageArea{
  display:none;

  margin-top:14px;
}

.messageArea textarea{
  width:100%;

  min-height:105px;

  resize:none;

  padding:13px;

  border:1px solid #ccc;

  border-radius:10px;

  font-size:15px;
}

.continue{
  width:100%;

  margin-top:12px;

  padding:16px;

  border:0;

  border-radius:13px;

  background:#1976d2;

  color:#fff;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .sheet{
    padding-left:14px;
    padding-right:14px;
  }

  .packages{
    grid-template-columns:
      repeat(3,1fr);

    gap:8px;
  }

  .package{
    min-height:185px;

    border-radius:18px;
  }

  .iconArea{
    height:85px;
  }

  .videoCircle{
    width:50px;
    height:50px;

    font-size:22px;
  }

  .minutes{
    font-size:15px;
  }

  .priceArea{
    padding:13px 3px;
  }

  .price{
    font-size:16px;
  }

  .approx{
    font-size:10px;
  }

  .headerText h1{
    font-size:27px;
  }

}

</style>

</head>

<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

  <div class="backgroundContent">

    <h1>
      People
    </h1>

    <p>
      Live now
    </p>

  </div>

</div>


<!-- =========================
     BUY MINUTES SHEET
========================= -->

<div class="sheet">

  <div class="handle"></div>


  <div class="header">

    <div class="headerText">

      <h1>
        Buy Minutes
      </h1>

      <p>
        Choose a plan that works for you
      </p>

    </div>


    <button
      class="closeButton"
      onclick="goBack()">

      ×

    </button>

  </div>


  <div class="line"></div>


  <!-- =========================
       PACKAGES
  ========================= -->

  <div class="packages">


    <!-- 10 MIN -->
    <div
      class="package"
      onclick="selectPackage(80,10,this)">

      <div class="hot">
        🔥 HOT
      </div>

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        10 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 80
        </div>

        <div class="approx">
          ≈ $0.62
        </div>

      </div>

    </div>


    <!-- 25 MIN -->
    <div
      class="package"
      onclick="selectPackage(135,25,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        25 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 135
        </div>

        <div class="approx">
          ≈ $1.04
        </div>

      </div>

    </div>


    <!-- 40 MIN -->
    <div
      class="package"
      onclick="selectPackage(200,40,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        40 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 200
        </div>

        <div class="approx">
          ≈ $1.55
        </div>

      </div>

    </div>


    <!-- 55 MIN -->
    <div
      class="package"
      onclick="selectPackage(250,55,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        55 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 250
        </div>

        <div class="approx">
          ≈ $1.94
        </div>

      </div>

    </div>


    <!-- 65 MIN -->
    <div
      class="package"
      onclick="selectPackage(300,65,this)">

      <div class="iconArea">

        <div class="videoCircle">
          ▮▶
        </div>

      </div>

      <div class="minutes">
        65 Mins
      </div>

      <div class="priceArea">

        <div class="price">
          KSh 300
        </div>

        <div class="approx">
          ≈ $2.32
        </div>

      </div>

    </div>


  </div>


  <!-- =========================
       SELECTED
  ========================= -->

  <div
    id="selectedInfo"
    class="selectedInfo">

    Selected:

    <strong id="selectedText">
    </strong>

  </div>


  <!-- =========================
       PAYMENT
  ========================= -->

  <div
    id="paymentSection"
    class="paymentSection">

    <div class="paymentTitle">
      M-Pesa Payment
    </div>


    <div class="till">

      Pay with Till:

      <strong>
        1605854
      </strong>

    </div>


    <button
      class="mpesaButton"
      onclick="showMessageBox()">

      Pay with M-Pesa

    </button>


    <div
      id="messageArea"
      class="messageArea">

      <textarea
        id="mpesaMessage"
        placeholder="Paste M-Pesa message here..."></textarea>


      <button
        class="continue"
        onclick="continuePayment()">

        Continue

      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let selectedPrice = null;

let selectedMinutes = null;


/* =========================
   SELECT PACKAGE
========================= */

function selectPackage(
  price,
  minutes,
  element
){

  selectedPrice =
    price;

  selectedMinutes =
    minutes;


  document
    .querySelectorAll(".package")
    .forEach(function(card){

      card.classList.remove(
        "selected"
      );

    });


  element.classList.add(
    "selected"
  );


  document.getElementById(
    "selectedInfo"
  ).style.display =
    "block";


  document.getElementById(
    "selectedText"
  ).textContent =

    "KSh " +
    price +
    " — " +
    minutes +
    " Minutes";


  document.getElementById(
    "paymentSection"
  ).style.display =
    "block";


  document.getElementById(
    "paymentSection"
  ).scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================
   SHOW MESSAGE
========================= */

function showMessageBox(){

  if(
    selectedPrice === null
  ){

    alert(
      "Please select a package first."
    );

    return;
  }


  document.getElementById(
    "messageArea"
  ).style.display =
    "block";

}


/* =========================
   CONTINUE
========================= */

function continuePayment(){

  const message =
    document.getElementById(
      "mpesaMessage"
    ).value.trim();


  if(message === ""){

    alert(
      "Please paste the M-Pesa confirmation message."
    );

    return;

  }


  localStorage.setItem(
    "selectedPrice",
    selectedPrice
  );


  localStorage.setItem(
    "selectedMinutes",
    selectedMinutes
  );


  localStorage.setItem(
    "mpesaMessage",
    message
  );


  /*
    Continue to your next page.
  */

  window.location.href =
    "photos.html";

}


/* =========================
   CLOSE
========================= */

function goBack(){

  history.back();

}

</script>

</body>
  </html>
