<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa Payment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 430px;
      margin: 40px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 15px;
      margin: 15px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 95%;
      padding: 15px;
      background: #20a83e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>M-Pesa Payment</h1>

  <p id="packageInfo">Loading package...</p>

  <div id="phoneNumber">Till: 1605854</div>

  <button id="payButton">
    Pay with M-Pesa
  </button>

  <p id="message"></p>

</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const amount = params.get("amount");
  const minutes = params.get("minutes");
  const ref = params.get("ref");

  document.getElementById("packageInfo").textContent =
    "KSh " + amount + " — " + minutes + " Minutes";

  document.getElementById("payButton").addEventListener("click", async () => {

    const phone = document.getElementById("phoneNumber").value.trim();
    const message = document.getElementById("message");

    if (!phone) {
      message.textContent = "Please enter your M-Pesa phone number.";
      return;
    }

    message.textContent = "Sending payment request...";

    try {
      const response = await fetch("/api/stkpush", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone: phone,
          amount: amount,
          minutes: minutes,
          ref: ref
        })
      });

      const result = await response.json();

      if (result.success) {
        message.textContent =
          "Check your phone and enter your M-Pesa PIN.";
      } else {
        message.textContent =
          result.message || "Payment request failed.";
      }

    } catch (error) {
      message.textContent =
        "Unable to connect to the payment service.";
    }
  });
</script>

</body>
</html>
