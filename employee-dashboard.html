<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh
}

button,input{font-family:inherit}

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#080808
}

.loginBox{
  width:100%;
  max-width:390px;
  background:#111;
  border:1px solid #292929;
  border-radius:22px;
  padding:30px 22px
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:8px
}

.logo span,.portalTitle span{color:#00ff88}

.loginSubtitle{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-bottom:28px
}

.loginLabel{
  display:block;
  color:#aaa;
  font-size:12px;
  margin:0 0 7px 3px
}

.loginInput{
  width:100%;
  height:52px;
  background:#080808;
  border:1px solid #303030;
  border-radius:12px;
  color:#fff;
  padding:0 15px;
  outline:none;
  margin-bottom:16px
}

.loginButton{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  background:#00ff88;
  color:#001b0d;
  font-weight:900;
  cursor:pointer
}

.loginError{
  min-height:20px;
  text-align:center;
  color:#ff4d5f;
  font-size:12px;
  margin-top:13px
}

#dashboardScreen{
  display:none;
  min-height:100vh;
  background:#080808
}

.topBar{
  height:65px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
  background:#080808
}

.portalTitle{
  font-size:19px;
  font-weight:900
}

.topRight{
  display:flex;
  align-items:center;
  gap:9px
}

.onlineDot{
  width:8px;
  height:8px;
  background:#00ff88;
  border-radius:50%
}

.onlineText{
  color:#888;
  font-size:10px
}

.logoutBtn{
  border:1px solid #333;
  background:#151515;
  color:#ddd;
  border-radius:8px;
  padding:8px 10px;
  font-size:10px;
  font-weight:bold
}

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:18px
}

.welcome{margin-bottom:18px}

.welcome h1{
  font-size:22px;
  margin-bottom:5px
}

.welcome p{
  color:#777;
  font-size:12px
}

.card{
  background:#111;
  border:1px solid #242424;
  border-radius:17px;
  padding:17px;
  margin-bottom:14px
}

.cardTitle{
  color:#888;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  margin-bottom:13px
}

.accountTop{
  display:flex;
  align-items:center;
  gap:13px
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#00ff88;
  color:#001b0d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:900
}

.profileName{
  font-size:17px;
  font-weight:900
}

.profileUsername{
  color:#777;
  font-size:11px;
  margin-top:3px
}

.badge{
  display:inline-block;
  margin-top:8px;
  background:rgba(0,255,136,.1);
  border:1px solid rgba(0,255,136,.25);
  color:#00ff88;
  border-radius:20px;
  padding:4px 8px;
  font-size:8px;
  font-weight:900
}

.infoRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid #222;
  padding-top:12px;
  margin-top:14px
}

.infoLabel{color:#777;font-size:10px}

.infoValue{
  color:#fff;
  font-size:11px;
  font-weight:bold;
  text-align:right;
  word-break:break-all
}

.referralBox{
  display:flex;
  gap:8px;
  margin-top:10px
}

.referralInput{
  flex:1;
  min-width:0;
  background:#080808;
  border:1px solid #292929;
  color:#aaa;
  border-radius:10px;
  padding:11px;
  font-size:10px
}

.copyBtn{
  border:0;
  border-radius:10px;
  background:#00ff88;
  color:#001b0d;
  padding:0 13px;
  font-size:10px;
  font-weight:900
}

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.stat{
  background:#090909;
  border:1px solid #222;
  border-radius:11px;
  padding:12px
}

.statLabel{
  color:#777;
  font-size:9px;
  margin-bottom:7px
}

.statValue{
  font-size:17px;
  font-weight:900
}

.green{color:#00ff88}
.red{color:#ff4d5f}
.orange{color:#ffb84d}

.section-note{
  color:#777;
  font-size:11px;
  margin-top:8px
}

.activity{
  border-top:1px solid #222;
  padding:11px 0;
  display:flex;
  justify-content:space-between;
  gap:10px
}

.activity:first-child{border-top:0}

.activityTitle{
  font-size:11px;
  font-weight:bold
}

.activityDate{
  color:#666;
  font-size:9px;
  margin-top:4px
}

.activityRight{text-align:right}

.activityAmount{
  font-size:11px;
  font-weight:bold
}

.activityStatus{
  font-size:8px;
  margin-top:4px
}

.withdrawBtn{
  width:100%;
  height:45px;
  margin-top:14px;
  border:0;
  border-radius:11px;
  background:#00ff88;
  color:#001b0d;
  font-weight:900
}

.empty{
  color:#666;
  text-align:center;
  <!-- PART 2/2 -->

        <div class="stat">
          <div class="statLabel">THIS WEEK</div>
          <div class="statValue green">
            KSh <span id="weekEarned">0.00</span>
          </div>
        </div>

        <div class="stat">
          <div class="statLabel">THIS MONTH</div>
          <div class="statValue green">
            KSh <span id="monthEarned">0.00</span>
          </div>
        </div>

        <div class="stat">
          <div class="statLabel">ALL TIME</div>
          <div class="statValue green">
            KSh <span id="allTimeEarned">0.00</span>
          </div>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Sales Activity</div>

      <div class="statGrid">

        <div class="stat">
          <div class="statLabel">SUCCESSFUL</div>
          <div class="statValue green" id="successfulSales">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">FAILED</div>
          <div class="statValue red" id="failedSales">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">PENDING</div>
          <div class="statValue orange" id="pendingSales">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">AVERAGE SALE</div>
          <div class="statValue">
            KSh <span id="averageSale">0.00</span>
          </div>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Payment Information</div>

      <div class="infoRow">
        <div class="infoLabel">Account</div>
        <div class="infoValue" id="paymentAccount">-</div>
      </div>

      <div class="infoRow">
        <div class="infoLabel">Commission</div>
        <div class="infoValue green">25%</div>
      </div>

      <div class="infoRow">
        <div class="infoLabel">Status</div>
        <div class="infoValue green">ACTIVE</div>
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Recent Activity</div>

      <div id="activityList">
        <div class="empty">No activity yet</div>
      </div>
    </div>

  </div>
</div>


<div id="withdrawModal" class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      Withdraw Money
    </div>

    <input
      id="withdrawPhone"
      class="modalInput"
      type="tel"
      placeholder="M-PESA phone number"
    >

    <input
      id="withdrawAmount"
      class="modalInput"
      type="number"
      placeholder="Amount"
    >

    <div class="modalActions">

      <button
        type="button"
        class="cancelBtn"
        onclick="closeWithdraw()"
      >
        CANCEL
      </button>

      <button
        type="button"
        class="confirmBtn"
        onclick="submitWithdraw()"
      >
        REQUEST
      </button>

    </div>

    <div
      id="withdrawMessage"
      class="modalMessage"
    ></div>

  </div>

</div>


<script>

const COMMISSION_RATE = 0.25;


/* =========================
   LOGIN
========================= */

function loginEmployee(){

  const username =
    document.getElementById("usernameInput")
    .value.trim();

  const password =
    document.getElementById("passwordInput")
    .value;

  const error =
    document.getElementById("loginError");

  const employee =
    EMPLOYEES[username];

  if(!employee || employee.password !== password){

    error.textContent =
      "Incorrect username or password.";

    return;
  }

  localStorage.setItem(
    "loggedInEmployee",
    username
  );

  error.textContent = "";

  showDashboard(username);

}


/* =========================
   LOGOUT
========================= */

function logoutEmployee(){

  localStorage.removeItem(
    "loggedInEmployee"
  );

  document.getElementById(
    "dashboardScreen"
  ).style.display = "none";

  document.getElementById(
    "loginScreen"
  ).style.display = "flex";

}


/* =========================
   DASHBOARD
========================= */

function showDashboard(username){

  const employee =
    EMPLOYEES[username];

  if(!employee){

    logoutEmployee();
    return;
  }

  document.getElementById(
    "loginScreen"
  ).style.display = "none";

  document.getElementById(
    "dashboardScreen"
  ).style.display = "block";

  document.getElementById(
    "welcomeName"
  ).textContent =
    "Hello " + employee.name;

  document.getElementById(
    "profileName"
  ).textContent =
    employee.name;

  document.getElementById(
    "profileUsername"
  ).textContent =
    username;

  document.getElementById(
    "referralCode"
  ).textContent =
    employee.ref;

  document.getElementById(
    "paymentAccount"
  ).textContent =
    employee.ref;

  document.getElementById(
    "avatar"
  ).textContent =
    employee.name.charAt(0);

  updateReferralLink(employee.ref);

  refreshDashboard(employee.ref);

}


/* =========================
   REFERRAL LINK
========================= */

function updateReferralLink(ref){

  const link =
    window.location.origin +
    "/?employee=" +
    encodeURIComponent(ref);

  document.getElementById(
    "referralLink"
  ).value = link;

}


/* =========================
   PAYMENT STORAGE
========================= */

function getPayments(){

  try{

    return JSON.parse(
      localStorage.getItem("payments") || "[]"
    );

  }catch(error){

    return [];

  }

}


function getWithdrawals(){

  try{

    return JSON.parse(
      localStorage.getItem("withdrawals") || "[]"
    );

  }catch(error){

    return [];

  }

}


/* =========================
   HELPERS
========================= */

function money(value){

  return Number(value || 0)
    .toFixed(2);

}


function paymentAmount(payment){

  return Number(
    payment.amount ??
    payment.price ??
    payment.total ??
    0
  );

}


function paymentDate(payment){

  return new Date(
    payment.date ||
    payment.createdAt ||
    payment.timestamp ||
    Date.now()
  );

}


function paymentStatus(payment){

  return String(
    payment.status || ""
  ).toLowerCase();

}


function paymentBelongsToRef(payment,ref){

  const refs = [

    payment.ref,
    payment.referral,
    payment.referralCode,
    payment.employeeRef,
    payment.employeeReferral,
    payment.referredBy,
    payment.employeeId

  ];

  return refs.some(
    value =>
      String(value || "")
      .toUpperCase()
      ===
      String(ref).toUpperCase()
  );

}


/* =========================
   REFRESH DASHBOARD
========================= */

function refreshDashboard(ref){

  const payments =
    getPayments().filter(
      payment =>
        paymentBelongsToRef(
          payment,
          ref
        )
    );

  let successful = [];
  let failed = [];
  let pending = [];

  payments.forEach(payment => {

    const status =
      paymentStatus(payment);

    if(
      status === "verified" ||
      status === "success" ||
      status === "successful" ||
      status === "paid" ||
      status === "completed"
    ){

      successful.push(payment);

    }else if(
      status === "failed" ||
      status === "rejected" ||
      status === "cancelled"
    ){

      failed.push(payment);

    }else{

      pending.push(payment);

    }

  });


  let totalEarned = 0;

  successful.forEach(payment => {

    totalEarned +=
      paymentAmount(payment)
      * COMMISSION_RATE;

  });


  let lostAmount = 0;

  failed.forEach(payment => {

    lostAmount +=
      paymentAmount(payment)
      * COMMISSION_RATE;

  });


  let pendingAmount = 0;

  pending.forEach(payment => {

    pendingAmount +=
      paymentAmount(payment)
      * COMMISSION_RATE;

  });


  const available =
    Math.max(0,totalEarned);


  document.getElementById(
    "availableBalance"
  ).textContent =
    money(available);


  document.getElementById(
    "totalEarned"
  ).textContent =
    money(totalEarned);


  document.getElementById(
    "inFlight"
  ).textContent =
    money(pendingAmount);


  document.getElementById(
    "lostAmount"
  ).textContent =
    money(lostAmount);


  /* DATE */

  const now = new Date();

  const todayStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const weekStart =
    new Date(todayStart);

  const day =
    now.getDay();

  weekStart.setDate(
    weekStart.getDate() -
    (day === 0 ? 6 : day - 1)
  );

  const monthStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );


  let today = 0;
  let week = 0;
  let month = 0;


  successful.forEach(payment => {

    const date =
      paymentDate(payment);

    const commission =
      paymentAmount(payment)
      * COMMISSION_RATE;

    if(date >= todayStart){
      today += commission;
    }

    if(date >= weekStart){
      week += commission;
    }

    if(date >= monthStart){
      month += commission;
    }

  });


  document.getElementById(
    "todayEarned"
  ).textContent =
    money(today);

  document.getElementById(
    "weekEarned"
  ).textContent =
    money(week);

  document.getElementById(
    "monthEarned"
  ).textContent =
    money(month);

  document.getElementById(
    "allTimeEarned"
  ).textContent =
    money(totalEarned);


  /* SALES */

  document.getElementById(
    "successfulSales"
  ).textContent =
    successful.length;

  document.getElementById(
    "failedSales"
  ).textContent =
    failed.length;

  document.getElementById(
    "pendingSales"
  ).textContent =
    pending.length;


  let totalSales = 0;

  successful.forEach(payment => {

    totalSales +=
      paymentAmount(payment);

  });


  const average =
    successful.length
      ? totalSales / successful.length
      : 0;


  document.getElementById(
    "averageSale"
  ).textContent =
    money(average);


  renderActivity(payments);

}


/* =========================
   ACTIVITY
========================= */

function renderActivity(payments){

  const list =
    document.getElementById(
      "activityList"
    );

  if(!payments.length){

    list.innerHTML =
      '<div class="empty">No activity yet</div>';

    return;
  }


  const recent =
    [...payments]
    .sort(
      (a,b) =>
        paymentDate(b) -
        paymentDate(a)
    )
    .slice(0,10);


  list.innerHTML = "";


  recent.forEach(payment => {

    const amount =
      paymentAmount(payment);

    const status =
      paymentStatus(payment);

    let text = "PENDING";
    let css = "orange";


    if(
      status === "verified" ||
      status === "success" ||
      status === "successful" ||
      status === "paid" ||
      status === "completed"
    ){

      text = "SUCCESSFUL";
      css = "green";

    }else if(
      status === "failed" ||
      status === "rejected" ||
      status === "cancelled"
    ){

      text = "FAILED";
      css = "red";

    }


    const item =
      document.createElement("div");

    item.className =
      "activity";


    item.innerHTML = `

      <div class="activityLeft">

        <div class="activityTitle">
          Customer Payment
        </div>

        <div class="activityDate">
          ${paymentDate(payment).toLocaleString()}
        </div>

      </div>

      <div class="activityRight">

        <div class="activityAmount">
          KSh ${money(amount)}
        </div>

        <div class="activityStatus ${css}">
          ${text}
        </div>

      </div>

    `;


    list.appendChild(item);

  });

}


/* =========================
   COPY LINK
========================= */

function copyReferral(){

  const input =
    document.getElementById(
      "referralLink"
    );

  if(navigator.clipboard){

    navigator.clipboard
      .writeText(input.value)
      .then(() => {

        const button =
          document.querySelector(".copyBtn");

        button.textContent =
          "COPIED";

        setTimeout(() => {

          button.textContent =
            "COPY";

        },1500);

      });

  }else{

    input.select();

    document.execCommand("copy");

  }

}


/* =========================
   WITHDRAW
========================= */

function openWithdraw(){

  document.getElementById(
    "withdrawModal"
  ).style.display =
    "flex";

}


function closeWithdraw(){

  document.getElementById(
    "withdrawModal"
  ).style.display =
    "none";

}


/* =========================
   WITHDRAW REQUEST
========================= */

function submitWithdraw(){

  const phone =
    document.getElementById(
      "withdrawPhone"
    ).value.trim();

  const amount =
    Number(
      document.getElementById(
        "withdrawAmount"
      ).value
    );

  const message =
    document.getElementById(
      "withdrawMessage"
    );

  const username =
    localStorage.getItem(
      "loggedInEmployee"
    );

  const employee =
    EMPLOYEES[username];


  if(!phone){

    message.textContent =
      "Enter your phone number.";

    return;

  }


  if(!amount || amount <= 0){

    message.textContent =
      "Enter a valid amount.";

    return;

  }


  if(!employee){

    message.textContent =
      "Please login again.";

    return;

  }


  const payments =
    getPayments().filter(
      payment =>
        paymentBelongsToRef(
          payment,
          employee.ref
        )
    );


  let earned = 0;

  payments.forEach(payment => {

    const status =
      paymentStatus(payment);

    if(
      status === "verified" ||
      status === "success" ||
      status === "successful" ||
      status === "paid" ||
      status === "completed"
    ){

      earned +=
        paymentAmount(payment)
        * COMMISSION_RATE;

    }

  });


  if(amount > earned){

    message.textContent =
      "Insufficient available balance.";

    return;

  }


  let withdrawals =
    getWithdrawals();


  withdrawals.push({

    id:
      "WD-" + Date.now(),

    username:
      username,

    ref:
      employee.ref,

    phone:
      phone,

    amount:
      amount,

    status:
      "pending",

    date:
      new Date().toISOString()

  });


  localStorage.setItem(
    "withdrawals",
    JSON.stringify(withdrawals)
  );


  message.textContent =
    "Withdrawal request submitted.";


  document.getElementById(
    "withdrawPhone"
  ).value = "";

  document.getElementById(
    "withdrawAmount"
  ).value = "";

}


/* =========================
   ENTER KEY
========================= */

document.getElementById(
  "usernameInput"
).addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      loginEmployee();
    }

  }
);


document.getElementById(
  "passwordInput"
).addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      loginEmployee();
    }

  }
);


/* =========================
   AUTO LOGIN
========================= */

const savedEmployee =
  localStorage.getItem(
    "loggedInEmployee"
  );


if(
  savedEmployee &&
  EMPLOYEES[savedEmployee]
){

  showDashboard(
    savedEmployee
  );

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  function(){

    const username =
      localStorage.getItem(
        "loggedInEmployee"
      );

    if(
      username &&
      EMPLOYEES[username]
    ){

      refreshDashboard(
        EMPLOYEES[username].ref
      );

    }

  },
  5000
);

</script>

</body>
</html>
