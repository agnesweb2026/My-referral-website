<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Employee Accounts</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

body{
padding:20px;
}

h1{
text-align:center;
margin:10px 0 8px;
font-size:28px;
}

.subtitle{
text-align:center;
color:#999;
margin-bottom:20px;
font-size:14px;
}

.topButton{
width:100%;
max-width:520px;
display:block;
margin:0 auto 20px;
padding:14px;
border:0;
border-radius:10px;
background:#16c784;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.employee{
max-width:520px;
margin:0 auto 15px;
background:#151515;
border:1px solid #333;
border-radius:14px;
padding:16px;
}

.employeeName{
font-size:20px;
font-weight:bold;
margin-bottom:6px;
}

.employeeId{
display:inline-block;
background:#102615;
color:#36df70;
padding:5px 8px;
border-radius:6px;
font-size:12px;
font-weight:bold;
margin-bottom:12px;
}

.username{
color:#aaa;
font-size:13px;
margin-bottom:10px;
}

.linkBox{
background:#222;
border:1px solid #444;
border-radius:8px;
padding:12px;
word-break:break-all;
font-size:13px;
line-height:1.5;
margin-bottom:10px;
cursor:pointer;
}

.linkBox:active{
transform:scale(.98);
}

.button{
width:100%;
padding:12px;
border:0;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.copyButton{
background:#16c784;
color:#fff;
}

.openButton{
margin-top:8px;
background:#292929;
color:#fff;
border:1px solid #444;
}

.dashboardButton{
margin-top:8px;
background:#2563eb;
color:#fff;
}

.withdrawButton{
margin-top:8px;
background:#7c3aed;
color:#fff;
}

.status{
min-height:18px;
text-align:center;
color:#20e070;
font-size:13px;
margin-top:9px;
}

@media(max-width:360px){

body{
padding:12px;
}

h1{
font-size:24px;
}

.employeeName{
font-size:18px;
}

}
</style>
</head>

<body>

<h1>Employee Accounts</h1>

<div class="subtitle">
10 Employee Referral Accounts
</div>

<button
class="topButton"
onclick="openEmployeeLogin()">
EMPLOYEE LOGIN
</button>

<div id="employees"></div>
<script>

/*
==================================================
WEBSITE PAGES
==================================================
*/

const WEBSITE_URL =
window.location.origin + "/";

const DASHBOARD_PAGE =
"employee-dashboard.html";

const LOGIN_PAGE =
"employee-login.html";

const WITHDRAWAL_PAGE =
"request-withdrawal.html";


/*
==================================================
EMPLOYEE ACCOUNTS
==================================================

These IDs MUST match employee-login.html
*/

const employees = [

{
id:"REF-A7K2",
name:"Employee 1",
username:"Joshua1"
},

{
id:"REF-B4M8",
name:"Employee 2",
username:"Joshua2"
},

{
id:"REF-C9P3",
name:"Employee 3",
username:"Joshua3"
},

{
id:"REF-D2X6",
name:"Employee 4",
username:"Joshua4"
},

{
id:"REF-E5Q1",
name:"Employee 5",
username:"Joshua5"
},

{
id:"REF-F8L4",
name:"Employee 6",
username:"Joshua6"
},

{
id:"REF-G3N7",
name:"Employee 7",
username:"Joshua7"
},

{
id:"REF-H6R2",
name:"Employee 8",
username:"Joshua8"
},

{
id:"REF-J9T5",
name:"Employee 9",
username:"Joshua9"
},

{
id:"REF-K4W8",
name:"Employee 10",
username:"Joshua10"
}];


/*
==================================================
MAKE REFERRAL LINK
==================================================
*/

function makeEmployeeLink(employeeId){

return WEBSITE_URL +
"?employee=" +
encodeURIComponent(employeeId);

}


/*
==================================================
OPEN LOGIN
==================================================
*/

function openEmployeeLogin(){

window.location.href =
LOGIN_PAGE;

}


/*
==================================================
PREPARE EMPLOYEE SESSION
==================================================

This connects employees.html
to employee-dashboard.html.

It also makes the employee identity
available to request-withdrawal.html.
*/

function prepareEmployeeSession(employee){

const employeeData = {

id:employee.id,

employeeId:employee.id,

referral:employee.id,

name:employee.name,

employeeName:employee.name,

username:employee.username,

earnings:0,

withdrawn:0

};


/*
Dashboard currently uses employeeSession.
*/

localStorage.setItem(
"employeeSession",
JSON.stringify(employeeData)
);


/*
Login/session connection.
*/

sessionStorage.setItem(
"loggedInEmployee",
employee.id
);


/*
Also remember selected employee.
*/

sessionStorage.setItem(
"selectedEmployee",
JSON.stringify(employeeData)
);

}


/*
==================================================
OPEN EMPLOYEE DASHBOARD
==================================================
*/

function openDashboard(employee){

prepareEmployeeSession(employee);

window.location.href =
DASHBOARD_PAGE +
"?employee=" +
encodeURIComponent(employee.id);

}


/*
==================================================
OPEN WITHDRAWAL PAGE
==================================================
*/

function openWithdrawal(employee){

prepareEmployeeSession(employee);

window.location.href =
WITHDRAWAL_PAGE +
"?employee=" +
encodeURIComponent(employee.id);

}
  /*
==================================================
COPY REFERRAL LINK
==================================================
*/

async function copyLink(
link,
button,
status
){

try{

await navigator.clipboard.writeText(link);

button.textContent =
"COPIED ✓";

status.textContent =
"Referral link copied!";

setTimeout(function(){

button.textContent =
"COPY LINK";

status.textContent =
"";

},1500);

}catch(error){

const textarea =
document.createElement("textarea");

textarea.value =
link;

document.body.appendChild(
textarea
);

textarea.select();

document.execCommand(
"copy"
);

document.body.removeChild(
textarea
);

status.textContent =
"Referral link copied!";

}

}


/*
==================================================
CREATE EMPLOYEE CARD
==================================================
*/

function createEmployeeCard(employee){

const box =
document.createElement("div");

box.className =
"employee";


/*
NAME
*/

const name =
document.createElement("div");

name.className =
"employeeName";

name.textContent =
employee.name;

box.appendChild(name);


/*
REFERRAL ID
*/

const id =
document.createElement("div");

id.className =
"employeeId";

id.textContent =
employee.id;

box.appendChild(id);


/*
USERNAME
*/

const username =
document.createElement("div");

username.className =
"username";

username.textContent =
"Username: " + employee.username;

box.appendChild(username);


/*
REFERRAL LINK
*/

const link =
makeEmployeeLink(
employee.id
);


const linkBox =
document.createElement("div");

linkBox.className =
"linkBox";

linkBox.textContent =
link;

linkBox.title =
"Tap to copy";

box.appendChild(linkBox);


/*
STATUS
*/

const status =
document.createElement("div");

status.className =
"status";


/*
COPY BUTTON
*/

const copyButton =
document.createElement("button");

copyButton.className =
"button copyButton";

copyButton.textContent =
"COPY LINK";

copyButton.onclick =
function(){

copyLink(
link,
copyButton,
status
);

};

box.appendChild(
copyButton
);


/*
LINK BOX ALSO COPIES
*/

linkBox.onclick =
function(){

copyLink(
link,
copyButton,
status
);

};


/*
OPEN REFERRAL LINK
*/

const openButton =
document.createElement("button");

openButton.className =
"button openButton";

openButton.textContent =
"OPEN REFERRAL LINK";

openButton.onclick =
function(){

window.location.href =
link;

};

box.appendChild(
openButton
);


/*
OPEN DASHBOARD
*/

const dashboardButton =
document.createElement("button");

dashboardButton.className =
"button dashboardButton";

dashboardButton.textContent =
"OPEN DASHBOARD";

dashboardButton.onclick =
function(){

openDashboard(employee);

};

box.appendChild(
dashboardButton
);


/*
OPEN WITHDRAWAL
*/

const withdrawButton =
document.createElement("button");

withdrawButton.className =
"button withdrawButton";

withdrawButton.textContent =
"REQUEST WITHDRAWAL";

withdrawButton.onclick =
function(){

openWithdrawal(employee);

};

box.appendChild(
withdrawButton
);


box.appendChild(
status
);


return box;

}
  /*
==================================================
LOAD EMPLOYEES
==================================================
*/

const container =
document.getElementById(
"employees"
);

employees.forEach(
function(employee){

container.appendChild(
createEmployeeCard(
employee
)
);

});


/*
==================================================
CHECK URL EMPLOYEE
==================================================

If this page is opened with:

?employee=REF-A7K2

the selected employee is prepared
for the dashboard.
*/

const params =
new URLSearchParams(
window.location.search
);

const employeeCode =
params.get("employee");

if(employeeCode){

const selected =
employees.find(
function(employee){

return employee.id === employeeCode;

});

if(selected){

prepareEmployeeSession(
selected
);

}

}


/*
==================================================
DONE
==================================================
*/

</script>

</body>
</html>
