<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080c12;
  color:#fff;
  min-height:100vh;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(
    circle at top,
    #172436 0%,
    #080c12 60%
  );
}

.login-box{
  width:100%;
  max-width:410px;
  background:#111820;
  border:1px solid #263342;
  border-radius:20px;
  padding:30px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.admin-icon{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:#16a34a;
  font-size:31px;
  font-weight:bold;
}

.login-box h1{
  text-align:center;
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#8995a3;
  font-size:14px;
  margin-bottom:26px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#aeb8c4;
  font-size:13px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:14px;
  background:#0a1017;
  color:#fff;
  border:1px solid #334150;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.field input:focus{
  border-color:#16a34a;
}

#loginError{
  min-height:20px;
  margin-bottom:8px;
  text-align:center;
  color:#ff6262;
  font-size:13px;
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

#adminPage{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#101720;
  border-bottom:1px solid #263341;
  padding:14px 15px;
}

.topbar-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.title-area h1{
  font-size:20px;
}

.title-area p{
  color:#8995a3;
  font-size:12px;
  margin-top:4px;
}

.logout-btn{
  border:1px solid #354250;
  background:#151d26;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px;
}

.stat-card{
  background:#111820;
  border:1px solid #263341;
  border-radius:15px;
  padding:18px;
}

.stat-label{
  color:#8c98a6;
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:25px;
  font-weight:bold;
}

#pendingCount{
  color:#f5b942;
}

#pendingAmount{
  color:#36d675;
}

.section{
  background:#111820;
  border:1px solid #263341;
  border-radius:15px;
  overflow:hidden;
}

.section-header{
  padding:16px;
  border-bottom:1px solid #263341;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-header h2{
  font-size:17px;
}

.refresh-btn{
  background:#17212c;
  border:1px solid #354250;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

#requestList{
  padding:12px;
}

.empty{
  padding:40px 15px;
  text-align:center;
  color:#7f8b98;
  font-size:14px;
}

.request-card{
  background:#0c131b;
  border:1px solid #263341;
  border-radius:13px;
  padding:15px;
  margin-bottom:12px;
}

.request-card:last-child{
  margin-bottom:0;
}

.request-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:13px;
}

.employee-name{
  font-size:16px;
  font-weight:bold;
}

.employee-id{
  color:#8995a3;
  font-size:12px;
  margin-top:4px;
}

.amount{
  color:#36d675;
  font-size:19px;
  font-weight:bold;
  white-space:nowrap;
}

.request-info{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-bottom:14px;
}

.info-box{
  background:#111a23;
  border-radius:9px;
  padding:10px;
}

.info-label{
  color:#778492;
  font-size:11px;
  margin-bottom:4px;
}

.info-value{
  color:#dce2e8;
  font-size:13px;
  word-break:break-word;
}

.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status.pending{
  background:rgba(245,185,66,.12);
  color:#f5b942;
}

.status.approved{
  background:rgba(54,214,117,.12);
  color:#36d675;
}

.status.rejected{
  background:rgba(255,91,91,.12);
  color:#ff6464;
}

.request-actions{
  display:flex;
  gap:9px;
  margin-top:13px;
}

.approve-btn,
.reject-btn{
  flex:1;
  padding:11px;
  border-radius:9px;
  border:none;
  color:#fff;
  font-weight:bold;
  font-size:13px;
}

.approve-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.processed-message{
  margin-top:12px;
  padding:10px;
  border-radius:9px;
  background:#111a23;
  color:#8995a3;
  text-align:center;
  font-size:12px;
}

@media(max-width:520px){

  .title-area h1{
    font-size:18px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-value{
    font-size:21px;
  }

  .request-top{
    flex-direction:column;
  }

}

@media(max-width:360px){

  .stats{
    grid-template-columns:1fr;
  }

  .request-info{
    grid-template-columns:1fr;
  }

  .request-actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<div id="loginPage">

  <div class="login-box">

    <div class="admin-icon">A</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Manage employee withdrawals
    </p>

    <div class="field">

      <label for="adminUsername">
        Username
      </label>

      <input
        id="adminUsername"
        type="text"
        placeholder="Enter username"
        autocomplete="username"
      >

    </div>

    <div class="field">

      <label for="adminPassword">
        Password
      </label>

      <input
        id="adminPassword"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

    </div>

    <div id="loginError"></div>

    <button
      class="login-btn"
      onclick="adminLogin()"
    >
      LOGIN
    </button>

  </div>

</div>


<div id="adminPage" class="hidden">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="title-area">

        <h1>
          Admin Dashboard
        </h1>

        <p>
          Employee withdrawal management
        </p>

      </div>

      <button
        class="logout-btn"
        onclick="adminLogout()"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="container">

    <div class="stats">

      <div class="stat-card">

        <div class="stat-label">
          Pending Requests
        </div>

        <div
          id="pendingCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Pending Amount
        </div>

        <div
          id="pendingAmount"
          class="stat-value"
        >
          KSh 0
        </div>

      </div>

    </div>


    <section class="section">

      <div class="section-header">

        <h2>
          Withdrawal Requests
        </h2>

        <button
          class="refresh-btn"
          onclick="loadRequests()"
        >
          Refresh
        </button>

      </div>


      <div id="requestList">

        <div class="empty">
          No withdrawal requests yet.
        </div>

      </div>

    </section>

  </main>

</div>


<script>
  const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Admin12345";

const ADMIN_LOGIN_KEY = "adminLoggedIn";


/* =========================
   LOGIN
========================= */

function adminLogin(){

  const username =
    document
      .getElementById("adminUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    localStorage.setItem(
      ADMIN_LOGIN_KEY,
      "true"
    );

    error.textContent = "";

    showAdmin();

  }else{

    error.textContent =
      "Incorrect username or password.";

  }

}


/* =========================
   LOGOUT
========================= */

function adminLogout(){

  localStorage.removeItem(
    ADMIN_LOGIN_KEY
  );

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("adminUsername")
    .value = "";

  document
    .getElementById("adminPassword")
    .value = "";

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");

  loadRequests();

}


/* =========================
   GET SHARED REQUESTS
========================= */

async function getRequests(){

  try{

    const response =
      await fetch(
        "/api/withdrawals",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data ||
      !Array.isArray(
        data.requests
      )
    ){

      return [];

    }


    return data.requests;


  }catch(error){

    console.error(
      "Could not load withdrawal requests:",
      error
    );

    return [];

  }

}


/* =========================
   UPDATE SHARED REQUEST
========================= */

async function updateRequestStatus(
  requestId,
  status
){

  try{

    const response =
      await fetch(
        "/api/withdrawals",
        {
          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            id:requestId,
            status:status
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      return {
        success:false,
        message:
          data.message ||
          "Request update failed."
      };

    }


    return {
      success:true,
      request:data.request
    };


  }catch(error){

    console.error(
      "Update withdrawal error:",
      error
    );

    return {
      success:false,
      message:
        "Connection error."
    };

  }

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

  const list =
    document.getElementById(
      "requestList"
    );


  list.innerHTML = `
    <div class="empty">
      Loading withdrawal requests...
    </div>
  `;


  const requests =
    await getRequests();


  const pending =
    requests.filter(
      function(request){

        return (
          String(
            request.status ||
            "PENDING"
          ).toUpperCase() ===
          "PENDING"
        );

      }
    );


  document
    .getElementById(
      "pendingCount"
    )
    .textContent =
      pending.length;


  const pendingAmount =
    pending.reduce(
      function(total,request){

        return (
          total +
          Number(
            request.amount || 0
          )
        );

      },
      0
    );


  document
    .getElementById(
      "pendingAmount"
    )
    .textContent =
      "KSh " +
      pendingAmount.toLocaleString();


  renderRequests(
    requests
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   RENDER REQUESTS
========================= */

function renderRequests(
  requests
){

  const list =
    document.getElementById(
      "requestList"
    );


  if(
    !requests ||
    requests.length === 0
  ){

    list.innerHTML = `
      <div class="empty">
        No withdrawal requests yet.
      </div>
    `;

    return;

  }


  const sorted =
    [...requests].sort(
      function(a,b){

        return (
          new Date(
            b.createdAt || 0
          ) -
          new Date(
            a.createdAt || 0
          )
        );

      }
    );


  list.innerHTML =
    sorted
      .map(
        function(request){

          const status =
            String(
              request.status ||
              "PENDING"
            ).toUpperCase();


          let statusClass =
            "pending";


          if(
            status === "APPROVED"
          ){

            statusClass =
              "approved";

          }


          if(
            status === "REJECTED"
          ){

            statusClass =
              "rejected";

          }


          const employeeName =
            request.employeeName ||
            "Employee";


          const employeeId =
            request.employeeId ||
            request.referral ||
            "-";


          const username =
            request.username ||
            "-";


          const referral =
            request.referral ||
            "-";


          const phone =
            request.phone ||
            "-";


          const amount =
            Number(
              request.amount || 0
            );


          const date =
            request.createdAt
              ? new Date(
                  request.createdAt
                ).toLocaleString()
              : "-";


          const requestId =
            request.id ||
            "-";


          let actions = "";


          if(
            status === "PENDING"
          ){

            actions = `

              <div class="request-actions">

                <button
                  class="approve-btn"
                  onclick="approveRequest('${escapeHTML(requestId)}')"
                >
                  APPROVE
                </button>

                <button
                  class="reject-btn"
                  onclick="rejectRequest('${escapeHTML(requestId)}')"
                >
                  REJECT
                </button>

              </div>

            `;

          }else{

            actions = `

              <div class="processed-message">

                This request has already been
                ${status.toLowerCase()}.

              </div>

            `;

          }


          return `

            <div class="request-card">

              <div class="request-top">

                <div>

                  <div class="employee-name">

                    ${escapeHTML(
                      employeeName
                    )}

                  </div>

                  <div class="employee-id">

                    ${escapeHTML(
                      employeeId
                    )}

                  </div>

                </div>


                <div class="amount">

                  KSh
                  ${amount.toLocaleString()}

                </div>

              </div>


              <div class="request-info">

                <div class="info-box">

                  <div class="info-label">
                    Request ID
                  </div>

                  <div class="info-value">

                    ${escapeHTML(
                      requestId
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Date
                  </div>

                  <div class="info-value">

                    ${escapeHTML(
                      date
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    M-PESA Number
                  </div>

                  <div class="info-value">

                    ${escapeHTML(
                      phone
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Username
                  </div>

                  <div class="info-value">

                    ${escapeHTML(
                      username
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Referral
                  </div>

                  <div class="info-value">

                    ${escapeHTML(
                      referral
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Status
                  </div>

                  <div>

                    <span
                      class="status ${statusClass}"
                    >
                      ${status}
                    </span>

                  </div>

                </div>

              </div>


              ${actions}

            </div>

          `;

        }
      )
      .join("");

  }
  /* =========================
   APPROVE REQUEST
========================= */

async function approveRequest(
  requestId
){

  const requests =
    await getRequests();


  const request =
    requests.find(
      function(item){

        return String(
          item.id
        ) === String(
          requestId
        );

      }
    );


  if(!request){

    alert(
      "Withdrawal request was not found."
    );

    await loadRequests();

    return;

  }


  const currentStatus =
    String(
      request.status ||
      "PENDING"
    ).toUpperCase();


  if(
    currentStatus !==
    "PENDING"
  ){

    alert(
      "This request has already been processed."
    );

    await loadRequests();

    return;

  }


  const amount =
    Number(
      request.amount || 0
    );


  if(
    !Number.isFinite(
      amount
    ) ||
    amount <= 0
  ){

    alert(
      "Invalid withdrawal amount."
    );

    return;

  }


  const confirmed =
    confirm(
      "Approve KSh " +
      amount.toLocaleString() +
      " withdrawal for " +
      (
        request.employeeName ||
        "Employee"
      ) +
      "?"
    );


  if(!confirmed){

    return;

  }


  /*
    Re-read immediately before
    changing status so we don't
    approve an old copy.
  */

  const latestRequests =
    await getRequests();


  const latestRequest =
    latestRequests.find(
      function(item){

        return String(
          item.id
        ) === String(
          requestId
        );

      }
    );


  if(!latestRequest){

    alert(
      "Request no longer exists."
    );

    await loadRequests();

    return;

  }


  const latestStatus =
    String(
      latestRequest.status ||
      "PENDING"
    ).toUpperCase();


  if(
    latestStatus !==
    "PENDING"
  ){

    alert(
      "This request has already been processed."
    );

    await loadRequests();

    return;

  }


  const result =
    await updateRequestStatus(
      requestId,
      "APPROVED"
    );


  if(!result.success){

    alert(
      result.message ||
      "Could not approve withdrawal."
    );

    await loadRequests();

    return;

  }


  await loadRequests();


  alert(
    "Withdrawal approved successfully."
  );

}


/* =========================
   REJECT REQUEST
========================= */

async function rejectRequest(
  requestId
){

  const requests =
    await getRequests();


  const request =
    requests.find(
      function(item){

        return String(
          item.id
        ) === String(
          requestId
        );

      }
    );


  if(!request){

    alert(
      "Withdrawal request was not found."
    );

    await loadRequests();

    return;

  }


  const currentStatus =
    String(
      request.status ||
      "PENDING"
    ).toUpperCase();


  if(
    currentStatus !==
    "PENDING"
  ){

    alert(
      "This request has already been processed."
    );

    await loadRequests();

    return;

  }


  const amount =
    Number(
      request.amount || 0
    );


  const confirmed =
    confirm(
      "Reject KSh " +
      amount.toLocaleString() +
      " withdrawal for " +
      (
        request.employeeName ||
        "Employee"
      ) +
      "?"
    );


  if(!confirmed){

    return;

  }


  const latestRequests =
    await getRequests();


  const latestRequest =
    latestRequests.find(
      function(item){

        return String(
          item.id
        ) === String(
          requestId
        );

      }
    );


  if(!latestRequest){

    alert(
      "Request no longer exists."
    );

    await loadRequests();

    return;

  }


  const latestStatus =
    String(
      latestRequest.status ||
      "PENDING"
    ).toUpperCase();


  if(
    latestStatus !==
    "PENDING"
  ){

    alert(
      "This request has already been processed."
    );

    await loadRequests();

    return;

  }


  const result =
    await updateRequestStatus(
      requestId,
      "REJECTED"
    );


  if(!result.success){

    alert(
      result.message ||
      "Could not reject withdrawal."
    );

    await loadRequests();

    return;

  }


  await loadRequests();


  alert(
    "Withdrawal rejected."
  );

}


/* =========================
   AUTO REFRESH
========================= */

let refreshTimer = null;


function startAutoRefresh(){

  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =
    setInterval(
      async function(){

        if(
          localStorage.getItem(
            ADMIN_LOGIN_KEY
          ) === "true"
        ){

          await loadRequests();

        }

      },
      5000
    );

}


/* =========================
   STOP AUTO REFRESH
========================= */

function stopAutoRefresh(){

  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

    refreshTimer = null;

  }

}


/* =========================
   ENTER KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !==
      "Enter"
    ){

      return;

    }


    const loginPage =
      document.getElementById(
        "loginPage"
      );


    if(
      !loginPage ||
      loginPage.classList.contains(
        "hidden"
      )
    ){

      return;

    }


    adminLogin();

  }
);


/* =========================
   VISIBILITY REFRESH
========================= */

document.addEventListener(
  "visibilitychange",
  async function(){

    if(
      document.visibilityState ===
      "visible"
    ){

      if(
        localStorage.getItem(
          ADMIN_LOGIN_KEY
        ) === "true"
      ){

        await loadRequests();

      }

    }

  }
);


/* =========================
   START PAGE
========================= */

function initializeAdmin(){

  const loggedIn =
    localStorage.getItem(
      ADMIN_LOGIN_KEY
    ) === "true";


  if(loggedIn){

    showAdmin();

    startAutoRefresh();

  }else{

    document
      .getElementById(
        "loginPage"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "adminPage"
      )
      .classList.add(
        "hidden"
      );

  }

}


/* =========================
   LOGOUT WRAPPER
========================= */

const originalAdminLogout =
  adminLogout;


adminLogout =
  function(){

    stopAutoRefresh();

    originalAdminLogout();

  };


/* =========================
   INITIALIZE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    initializeAdmin();

  }
);
  </script>
